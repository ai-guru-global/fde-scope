name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (core + dev + mysql)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mysql]"

      - name: Lint (ruff)
        run: |
          python -m pip install ruff
          ruff check .
          ruff format --check .

      - name: Type-check (mypy)
        run: |
          python -m pip install mypy
          mypy fde_scope

      - name: Check PawApp frontend syntax
        run: node --check pawapp/ui/index.js

      - name: Test (with coverage)
        run: |
          pytest --cov=fde_scope --cov=pawapp/backend --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip build

      - name: Build
        run: python -m build

      - name: Verify built artifacts
        run: |
          ls -la dist/
          python -m pip install --force-reinstall dist/*.whl
          python -c "import fde_scope; print(fde_scope.__version__)"
          fde-scope --help

  pawapp-host:
    name: PawApp vs real QwenPaw host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (fde-scope + QwenPaw host runtime)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" qwenpaw

      # Guards against upstream PawApp SDK contract drift (e.g. the 2.1.0
      # skill_provider gap found during real-host verification).
      - name: Load pawapp through the real PluginLoader + smoke routes
        run: python scripts/verify_pawapp_host.py
