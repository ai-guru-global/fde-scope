# Release packaging for the macOS app (appbuild/build_release.sh).
#
# Trigger: push a tag like `v0.1.0`. The job builds a universal2 .app + DMG
# on an Apple Silicon runner (x86_64 slice via Rosetta), signs it, and
# attaches the artifacts to a GitHub Release.
#
# Without secrets the build still succeeds but falls back to ad-hoc signing
# (no notarization) — first launch then needs right-click → Open.
# To produce notarized releases, configure repo secrets:
#   DEVELOPER_ID_P12_BASE64   Developer ID Application certificate (.p12, base64)
#   DEVELOPER_ID_P12_PASSWORD p12 passphrase
#   NOTARY_API_KEY_ID / NOTARY_API_KEY_ISSUER / NOTARY_API_KEY_CONTENT
#   APPLE_TEAM_ID
name: release-macos-app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    env:
      arch: universal
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Detect signing secrets
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
        run: |
          if [ -n "$DEVELOPER_ID_P12_BASE64" ]; then
            echo "HAS_CERT=1" >> "$GITHUB_ENV"
          fi

      - name: Import Developer ID certificate
        if: env.HAS_CERT == '1'
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          echo "$DEVELOPER_ID_P12_BASE64" | base64 -d > /tmp/developer-id.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import /tmp/developer-id.p12 -k build.keychain \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm /tmp/developer-id.p12

      - name: Configure notary credentials
        env:
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_KEY_ISSUER: ${{ secrets.NOTARY_API_KEY_ISSUER }}
          NOTARY_API_KEY_CONTENT: ${{ secrets.NOTARY_API_KEY_CONTENT }}
        run: |
          if [ -n "$NOTARY_API_KEY_ID" ]; then
            printf '%s' "$NOTARY_API_KEY_CONTENT" > /tmp/notary_api_key.p8
            echo "NOTARIZE_API_KEY_PATH=/tmp/notary_api_key.p8" >> "$GITHUB_ENV"
            echo "NOTARIZE_API_KEY_ID=$NOTARY_API_KEY_ID" >> "$GITHUB_ENV"
            echo "NOTARIZE_API_KEY_ISSUER=$NOTARY_API_KEY_ISSUER" >> "$GITHUB_ENV"
          fi

      - name: Build universal2 app + DMG
        run: |
          ./appbuild/build_release.sh --arch "$arch"
          echo "DMG=$(ls appbuild/dist/*.dmg)" >> "$GITHUB_ENV"

      - name: Verify bundle
        run: |
          lipo -archs "appbuild/dist/FDE Scope.app/Contents/MacOS/FDE Scope"
          codesign --verify --deep --strict --verbose=2 "appbuild/dist/FDE Scope.app"
          cat appbuild/dist/manifest.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fde-scope-macos
          path: |
            ${{ env.DMG }}
            appbuild/dist/manifest.json
            appbuild/dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.DMG }}
            appbuild/dist/manifest.json
            appbuild/dist/SHA256SUMS
          generate_release_notes: true
