[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fde-scope"
version = "0.1.0"
description = "FDE Scope — an AI Forward-Deployed Engineer toolkit: 72h from raw data to a deployed agent. Built on AgentScope 2.0."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FDE Scope" }]
keywords = ["fde", "forward-deployed-engineer", "agentscope", "agent", "corpus", "llm", "toolkit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Core data layer: zero agentscope dependency → zero-config runnable.
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Runtime layer unlocks deploy/flywheel real-type assembly.
# The window below is *measured*, not aspirational (each row = the 12 tests
# marked `agentscope` run against that version in an isolated env):
#   2.0.4          ImportError: agentscope.rag has no ExcelParser (app_service.py)
#   2.0.4.post1    green — unmatched tools follow the mode fallback (ASK/DENY)
#   2.0.5 - 2.0.7  green since B5: upstream added a read-only fast path (ALLOW
#                  before allow rules), so build_toolkit never flags a deployed
#                  tool read-only and rule grants stay the only permission
#                  channel. The mode fallback itself (non-read-only unmatched
#                  → ASK/DENY) is line-identical across the window (verified
#                  against 2.0.7 sources, 2026-08-28).
# Sub-extras are required, not cosmetic: on 2.0.7 `OllamaChatModel.__init__`
# (the placeholder tenant_manager builds) imports `ollama`, and the app scheduler
# tools create_app registers import `apscheduler`. `ollama` is the extra name on
# 2.0.4.post1 and stays a valid alias of `model-ollama` on newer releases.
agentscope = ["agentscope[ollama,service]>=2.0.4.post1,<3"]
mysql = ["mysql-connector-python>=8.3"]
opcua = ["asyncua>=1.0,<3"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]
# Meta-extra: the documented "everything" profile. Kept in sync with README,
# Makefile install-full and tests/test_architecture_guard.py.
full = [
    "fde-scope[dev]",
    "fde-scope[agentscope]",
    "fde-scope[mysql]",
    "fde-scope[opcua]",
    "fde-scope[web]",
]

[project.scripts]
fde-scope = "fde_scope.cli:app"

[project.urls]
Homepage = "https://github.com/ai-guru-global/fde-scope"

[tool.hatch.build.targets.wheel]
packages = ["fde_scope"]

[tool.hatch.build.targets.sdist]
include = ["fde_scope", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "agentscope: tests that import the optional agentscope extra (skipped if not installed)",
    "mysql: tests that require a real MySQL server (skipped unless FDE_SCOPE_MYSQL_DSN is set)",
    "opcua: tests that require a real OPC UA server (skipped unless FDE_SCOPE_OPCUA_URL is set)",
]

# ---------------------------------------------------------------------------
# ruff — fast linter + formatter (replaces flake8/isort/black)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"  # ruff suggestions floor; requires-python stays >=3.11 (agentscope)
line-length = 110
extend-exclude = [".venv", "build", "dist", ".pytest_cache"]

[tool.ruff.lint]
# A reasonable, opinionated baseline: pycodestyle (E/W), pyflakes (F),
# isort (I), comprehensions (C4), bugbear (B), simplify (SIM).
select = ["E", "W", "F", "I", "C4", "B", "SIM", "UP"]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function-call-in-default-arg is idiomatic for FastAPI/Pydantic
    "B905",  # zip() without strict=; we accept implicit truncating
    "SIM108", # ternary vs if/else is stylistic
    "SIM117", # combined with-statements hurt readability in CLI
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]  # asserts are fine in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# ruff >= 0.16 also discovers *.md and reformats the Python inside fenced code
# blocks (``ruff check`` still ignores them). Docs and plans hold illustrative
# snippets, not importable sources, so keep the formatter out of them.
exclude = ["**/*.md"]

# ---------------------------------------------------------------------------
# mypy — static type-checker (advisory, not blocking on missing imports)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"              # venv/runtime floor; numpy 2.5 stubs (agentscope extra) use py312 `type` syntax
ignore_missing_imports = true     # agentscope / fastapi / pydantic all have stubs but
                                  # third-party industrial libs (asyncua, paho) often don't
plugins = ["pydantic.mypy"]        # teach mypy how pydantic v2 Field defaults work
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false     # pragmatic: keep optional-deps modules importable
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
