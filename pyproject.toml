[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fde-scope"
version = "0.1.0"
description = "FDE Scope — an AI Forward-Deployed Engineer toolkit: 72h from raw data to a deployed agent. Built on AgentScope 2.0."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FDE Scope" }]
keywords = ["fde", "forward-deployed-engineer", "agentscope", "agent", "corpus", "llm", "toolkit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Core data layer: zero agentscope dependency → zero-config runnable.
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Runtime layer unlocks deploy/flywheel real-type assembly.
agentscope = ["agentscope>=2.0.5"]
mysql = ["mysql-connector-python>=8.3"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.scripts]
fde-scope = "fde_scope.cli:app"

[project.urls]
Homepage = "https://github.com/ai-guru-global/fde-scope"

[tool.hatch.build.targets.wheel]
packages = ["fde_scope"]

[tool.hatch.build.targets.sdist]
include = ["fde_scope", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "agentscope: tests that import the optional agentscope extra (skipped if not installed)",
]
