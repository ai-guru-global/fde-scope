e-c-operationalization", "status": "✅", "html": "<h1>troubleshooting<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（chrome-devtools-mcp 插件 v1.2.0）· 类型：工具排障 · FDE 位点：Zone C operate（浏览器自动化通道）<\/div>\n<h2>能做什么<\/h2>\n<p>专治 <strong>Chrome DevTools MCP 本身<\/strong>连不上/起不来的问题：<code>list_pages<\/code> / <code>new_page<\/code> / <code>navigate_page<\/code> 失败、server 初始化失败、target 丢失、连接超时。会用 MCP 文档 + 环境检查定位是浏览器、扩展、端口还是配置的问题。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>浏览器自动化突然不动了（agent 报 MCP 工具错误）<\/li><li>现场机器上 Chrome 版本/无头模式/代理设置导致 MCP 无法附加<\/li><li>需要在新环境（客户笔记本、内网机器）第一次打通浏览器调试通道<\/li><\/ul>\n<p><strong>不用于<\/strong>：网页业务逻辑 bug（→ <a href=\"#/zone-c-operationalization/chrome-devtools\">chrome-devtools<\/a>）；性能问题（→ <a href=\"#/zone-c-operationalization/web-perf\">web-perf<\/a>）；MCP server 的选型评估（→ <a href=\"#/cross-cutting/mcp-criticagent\">mcp-criticagent<\/a>）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>顺序：确认 Chrome 进程与远程调试端口 → 确认 MCP server 日志 → 再动配置；不要一上来就重装<\/li><li><code>--slim<\/code> 模式不支持该 skill 的能力，注意配置差异<\/li><li>内网/代理环境要检查 loopback 与证书拦截，这是最常见的静默失败原因<\/li><li>打通后把可用配置固化到项目（README 或本地脚本），避免每台现场机重排一次<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone B/C：Web 控制台与 PawApp 的 UI 自动化前置通道<\/li><li>交付现场的浏览器验证（客户只允许用他们自己的机器时）<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-c-operationalization/chrome-devtools\">chrome-devtools<\/a> · <a href=\"#/zone-c-operationalization/web-perf\">web-perf<\/a> · <a href=\"#/cross-cutting/mcp-criticagent\">mcp-criticagent<\/a><\/p>"}, {"route": "zone-c-operationalization/chrome-devtools", "zone": "Zone C · Operationalization", "zoneId": "zone-c-operationalization", "status": "✅", "html": "<h1>chrome-devtools<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（chrome-devtools-mcp 插件 v1.2.0；同插件含 <code>chrome-devtools-cli<\/code>、<code>a11y-debugging<\/code>）· 类型：调试/自动化 · FDE 位点：Zone B demo + Zone C operate<\/div>\n<h2>能做什么<\/h2>\n<p>通过 MCP 高效使用 Chrome DevTools：调试网页、自动化交互（点击/输入/滚动/截图）、审查 DOM 与样式、分析网络请求瀑布、跑性能 profile、检查可访问性。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>交付的 Web 控制台/PawApp 前端出现\"只在客户机器上才有\"的问题（真实浏览器证据）<\/li><li>需要验证前端改动确实生效（截图 + 网络请求，而不是\"代码看起来对\")<\/li><li>演示前自查：控制台无 error、请求无 4xx、首屏可达<\/li><\/ul>\n<p><strong>不用于<\/strong>：后端逻辑与数据问题（→ <a href=\"#/zone-c-operationalization/investigate\">investigate<\/a>）；连接失败本身（→ <a href=\"#/zone-c-operationalization/troubleshooting\">troubleshooting<\/a>）；只需要抓公开网页数据（→ <a href=\"#/zone-a-pre-engagement/firecrawl-scrape\">firecrawl-scrape<\/a>）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>验证 UI 改动时的最小闭环：navigate → 关键交互 → 截图 → 看 console/network 四步，缺一步结论就不算验证过<\/li><li>用无头/隔离 profile 跑自动化，避免污染自己的登录态；需要客户登录态时走人工授权而不是拷 cookie<\/li><li>性能类问题不要在这里手搓，走 <a href=\"#/zone-c-operationalization/web-perf\">web-perf<\/a> / <a href=\"#/zone-c-operationalization/debug-optimize-lcp\">debug-optimize-lcp<\/a>（同族 skill 已有流程）<\/li><li>可访问性检查用同插件 <code>a11y-debugging<\/code>，交付给国企/海外客户时经常是硬要求<\/li><li>截图留档到 <code>docs/<\/code> 或 engagement 记录，作为验收证据<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone B：<code>fde_scope/web/<\/code> 三视图与 PawApp 前端验证<\/li><li>Zone D：交付演示前的自查清单（控制台干净 + 首屏达标）<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-c-operationalization/web-perf\">web-perf<\/a> · <a href=\"#/zone-c-operationalization/debug-optimize-lcp\">debug-optimize-lcp<\/a> · <a href=\"#/zone-c-operationalization/troubleshooting\">troubleshooting<\/a><\/p>"}, {"route": "zone-c-operationalization/sentry-mcp", "zone": "Zone C · Operationalization", "zoneId": "zone-c-operationalization", "status": "✅", "html": "<h1>sentry-mcp<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（sentry 插件 v1.0.0 · 提供 MCP server + <code>sentry-mcp<\/code> 子 agent）· 类型：错误/性能观测 · FDE 位点：Zone C operate<\/div>\n<h2>能做什么<\/h2>\n<p>用自然语言操作 Sentry：搜索/分析/分诊 errors 与 exceptions、读 stack trace、性能 trace 分析、release 与版本关联、snapshot（含 preprod 视觉回归快照）、CI snapshot 失败定位。适合\"客户问今天线上报了什么错\"这类问题一句话回答。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>fde-scope Web 控制台/PawApp 上线后接入 Sentry，日常巡检 issue 与新版本回归<\/li><li>定位到具体 exception 需要完整堆栈 + 影响用户数 + 首次出现版本<\/li><li>用 release 关联\"哪次发布引入的问题\"<\/li><\/ul>\n<p><strong>不用于<\/strong>：没有 Sentry 的客户环境（阿里云栈 → <a href=\"#/zone-c-operationalization/starops\">starops<\/a>；自建 → Datadog 插件 / Prometheus）；业务指标下降但无报错（→ 评估类：<a href=\"#/zone-b-build/phoenix-evals\">phoenix-evals<\/a>）；需要复现的前端交互问题（→ <a href=\"#/zone-c-operationalization/chrome-devtools\">chrome-devtools<\/a>）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>接入时务必带 <code>release<\/code> + <code>environment<\/code> 标签，否则 issue 无法按版本区分（现场最常见的接入缺陷）<\/li><li>用子 agent 做\"分诊\"而不是让它改配置：读操作放心交给它，写操作（mute/assign/项目设置）人工确认<\/li><li>注意 DSN 与 org token 的权限范围，交付项目里客户数据会进 Sentry event——<strong>必须开 before_send 脱敏<\/strong>（工单原文、设备标识）<\/li><li>与本项目衔接：把 Sentry issue 计数作为 SLO gate 的证据之一，写入 engagement 记录而不是只留在 Sentry 面板<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone C <code>operationalize<\/code>：错误率与性能回归监控<\/li><li>Zone D handoff：交接时给客户的 issue 清单与分诊规则<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-c-operationalization/starops\">starops<\/a> · <a href=\"#/zone-c-operationalization/investigate\">investigate<\/a> · <a href=\"#/zone-c-operationalization/web-perf\">web-perf<\/a><\/p>"}, {"route": "zone-c-operationalization/datadog", "zone": "Zone C · Operationalization", "zoneId": "zone-c-operationalization", "status": "✅", "html": "<h1>datadog<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（Quest Marketplace 插件 datadog v0.7.13，官方 MCP 服务器）· 类型：可观测性 · FDE 位点：Zone C observe（客户监控栈是 Datadog 时）<\/div>\n<h2>能做什么<\/h2>\n<p>通过官方 Datadog MCP 服务器查询日志、分析指标、追踪 Trace，读仪表盘 / 监视器 / SLO / 事件。三个 skill 分工：<code>ddsetup<\/code>（首次初始化，一旦配置完成，优先用 MCP 工具而非其他方式）、<code>ddconfig<\/code>（站点域/组织切换与连不上故障排查）、<code>ddtoolsets<\/code>（按需启停工具集，控制 agent 可见的工具面）。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>客户监控栈是 Datadog：取 SLO 达成证据、查事故 trace、把 fde-scope 部署服务的指标接进去对照<\/li><li>Zone C 巡检与事件复盘：从现象（告警/事件）反查日志与 trace 链<\/li><li>给客户的\"接入现状盘点\"：有哪些 monitor/SLO 在管哪些服务<\/li><\/ul>\n<p><strong>不用于<\/strong>：客户用 GKE/Google 栈（→ <a href=\"#/zone-c-operationalization/gke-observability\">gke-observability<\/a>）；以错误聚合/性能剖析为主、Sentry 已覆盖的场景（→ <a href=\"#/zone-c-operationalization/sentry-mcp\">sentry-mcp<\/a>）；自建 Prometheus/Grafana（直接查，别绕）；没有客户授权的 Datadog 账号时（先要只读 key，别拿自己的 demo 账号凑合）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li><strong>ddsetup 先行<\/strong>：未初始化就调查询工具必然失败；配置完成后所有读取走 MCP 工具<\/li><li>toolsets 按需开：读类任务只开 logs/metrics 相关集，全开会撑爆上下文还稀释触发精度<\/li><li>查询时间窗收紧（先 1h 再扩），指标查询成本高、结果噪点多<\/li><li>site 域名对齐客户（datadoghq.com / datadoghq.eu / us5.datadoghq.com …），连不上先查 site 与 org 切换（ddconfig）<\/li><li>SLO 证据进 gate 材料时附查询语句 + 时间窗截图，别只贴结论<\/li><li>只读凭证最小化：API key + Application key 分开管，App key 权限面定期审<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone C SLO gate 的证据链来源之一（10 个 gate 中 SLO 类的第三方数据源）<\/li><li>飞轮重训（flywheel）效果对照：上线前后指标在 Datadog 里的 A/B 证据<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-c-operationalization/gke-observability\">gke-observability<\/a> · <a href=\"#/zone-c-operationalization/sentry-mcp\">sentry-mcp<\/a> · <a href=\"#/zone-c-operationalization/starops\">starops<\/a> · <a href=\"#/zone-c-operationalization/incident-response\">incident-response<\/a><\/p>"}, {"route": "zone-c-operationalization/sre-runbooks", "zone": "Zone C · Operationalization", "zoneId": "zone-c-operationalization", "status": "📦", "html": "<h1>sre-runbooks 📦<\/h1>\n<div class=\"page-meta\">状态：📦 可安装（未装）· 类型：运维文档模板 · FDE 位点：Zone C operationalize（runbook 交付物）<br>候选 A（推荐）：<code>anthropics/knowledge-work-plugins@runbook<\/code>（官方 org）· 热度：2.6K installs · https://skills.sh/anthropics/knowledge-work-plugins/runbook<br>候选 B：<code>alphaonedev/openclaw-graph@sre-runbooks<\/code> · 50 installs · https://skills.sh/alphaonedev/openclaw-graph/sre-runbooks<br>安装：<code>npx skills add anthropics/knowledge-work-plugins@runbook --directory ~/.qoder/skills -y<\/code><br>说明：早期建档名记作 <code>sre-runbooks<\/code>；registry 中该名存在但热度仅 50，官方 <code>runbook<\/code> 是更优来源，安装命令按候选 A 给出。<br>取证（2026-08-27）：源文件 <code>operations/skills/runbook/SKILL.md<\/code>（87 行，<strong>单文件<\/strong>，无 <code>scripts/<\/code>、无 <code>references/<\/code>、无网络调用）· https://github.com/anthropics/knowledge-work-plugins/blob/main/operations/skills/runbook/SKILL.md<br>安全：上游仓库对每个条目跑<strong>强制 Claude policy scan<\/strong>（<code>.github/workflows/scan-plugins.yml<\/code>，按 (plugin, sha) 缓存判定，不通过则被 <code>revert-failed-bumps.yml<\/code> 剔除）。风险面极小。<\/div>\n<h2>能做什么<\/h2>\n<p>产出结构化 runbook（已读源文件确认其固定模板）：Owner + Frequency + Last Updated/Last Run 头部 → Purpose → Prerequisites → <strong>Procedure（每一步都有“确切命令 + Expected result + If it fails”三件套）<\/strong> → Verification → Troubleshooting 表（症状/可能原因/处置）→ Rollback → Escalation 表（情形/联系人/方式）→ History 执行记录表。<br>上游提示词接得很死：“<code>Run the script<\/code> 不算一步，<code>从 ops 服务器跑 python sync.py --prod --dry-run<\/code> 才算”。<\/p>\n<p>⚠️ 模板<strong>不含<\/strong>告警/指标阈值与影响面判定字段（那是 incident-response 的地盘）——要与客户告警一一对应，得手工加一节。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>fde-scope 交付上线前，客户运维团队要求\"每类故障一页怎么办\"<\/li><li><code>engagement/phases.py<\/code> 的 operationalize 阶段交付物（SLO 之后必须有 runbook）<\/li><li>现场排障结束后立刻沉淀：把 <a href=\"#/zone-c-operationalization/investigate\">investigate<\/a> 的排查过程转成可复用步骤<\/li><\/ul>\n<p><strong>不用于<\/strong>：一次性问题的口头答复（不值得建档）；把 runbook 写成架构图（图走 <a href=\"#/zone-a-pre-engagement/architecture-communicator\">architecture-communicator<\/a>）；用 skill 生成的模板直接签字交付（必须客户会签）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>一页一故障：标题就是\"现象 + 服务名\"，不要写\"通用排障指南\"<\/li><li>每条命令必须<strong>现场验证过<\/strong>再写进去；未验证的标 <code>TODO-验证<\/code>，否则就是误导<\/li><li>写清\"不要做\"（重启会丢什么、什么时候必须停线）——工业客户最看重这条<\/li><li><strong>拿它的 History 表当审计手段<\/strong>：每次值班执行人签字 + 备注，一个季度就能看出哪份 runbook 在真实世界失效<\/li><li>它的 <code>If Connectors Available<\/code> 段默认接 knowledge base / ITSM：没接这些系统时该段就是死话，本地用直接忽略<\/li><li>补上模板缺的“告警对应”字段：没有告警对应的 runbook 段落等于不会有人读<\/li><li>版本与责任人：每页顶部写适用范围（版本/环境）+ owner + 最后验证日期<\/li><li>存放位置：进交付仓库 <code>docs/runbooks/<\/code>，不要只存在 wiki（交接时要有可打包物）<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone C <code>operationalize<\/code>：SLO gate 之后的必备交付物<\/li><li>Zone D handoff：培训与值班手册的原料<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-c-operationalization/incident-response\">incident-response<\/a> · <a href=\"#/zone-c-operationalization/investigate\">investigate<\/a> · <a href=\"#/zone-c-operationalization/starops\">starops<\/a><\/p>"}, {"route": "zone-c-operationalization/incident-response", "zone": "Zone C · Operationalization", "zoneId": "zone-c-operationalization", "status": "📦", "html": "<h1>incident-response 📦<\/h1>\n<div class=\"page-meta\">状态：📦 可安装（未装）· 类型：事件响应流程 · FDE 位点：Zone C operate（生产事件）<br>来源：<code>anthropics/knowledge-work-plugins@incident-response<\/code>（官方 org）· 热度：5.3K installs · https://skills.sh/anthropics/knowledge-work-plugins/incident-response<br>备选：<code>alirezarezvani/claude-skills@incident-commander<\/code>（602，指挥官视角）<br>安装：<code>npx skills add anthropics/knowledge-work-plugins@incident-response --directory ~/.qoder/skills -y<\/code><\/div>\n<h2>能做什么<\/h2>\n<p>结构化事件响应：严重度分级与角色分工（指挥/沟通/处置）、时间线记录、遏制优先于根因、对外沟通模板（客户/内部）、复盘（postmortem）产出与行动项跟踪。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>交付系统在生产上真的炸了：客户在线、管理层在问、工程师在改——需要一套秩序<\/li><li>需要给客户正式的事件说明与复盘（工业客户常把它写进合同 SLA 罚则）<\/li><li>值班机制建立前的过渡期（我方 FDE 兼值班）<\/li><\/ul>\n<p><strong>不用于<\/strong>：日常小 bug（→ <a href=\"#/zone-c-operationalization/systematic-debugging\">systematic-debugging<\/a>）；已知故障的按步处置（→ <a href=\"#/zone-c-operationalization/sre-runbooks\">sre-runbooks<\/a>，runbook 是\"平时写、事件时读\"）；根因分析工具链（→ <a href=\"#/zone-c-operationalization/starops\">starops<\/a> / <a href=\"#/zone-c-operationalization/sentry-mcp\">sentry-mcp<\/a>）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>事件期只做三件事：<strong>分级 → 遏制 → 通信<\/strong>。根因留到复盘阶段，别在群里边查边猜<\/li><li>时间线从事件第一分钟开始记（谁在何时做了什么、观察到什么），这是复盘与免责的唯一凭据<\/li><li>对外沟通用\"影响 + 现状 + 下次更新时间\"三段式，禁止承诺未经确认的恢复时间<\/li><li>工业现场红线：涉及停线/安全的事件，任何处置动作必须客户授权人在场，agent 只出建议不执行<\/li><li>复盘要产<strong>可跟踪行动项 + 负责人 + 截止日<\/strong>，并回流到 runbook（否则同类事件必然重演）<\/li><li>与 fde-scope 整合：事件与复盘记录可作为 engagement 状态机的输入（<code>shift_handover<\/code> gate 的交接材料）<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone C <code>operationalize<\/code>：值班与事件响应机制建设<\/li><li><code>engagement/gates/shift_handover.py<\/code>（<code>ShiftHandover<\/code>）：交接材料的事件部分<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-c-operationalization/sre-runbooks\">sre-runbooks<\/a> · <a href=\"#/zone-c-operationalization/starops\">starops<\/a> · <a href=\"#/zone-c-operationalization/investigate\">investigate<\/a><\/p>"}, {"route": "zone-c-operationalization/gke-observability", "zone": "Zone C · Operationalization", "zoneId": "zone-c-operationalization", "status": "📦", "html": "<h1>gke-observability 📦<\/h1>\n<div class=\"page-meta\">状态：📦 可安装（未装）· 类型：可观测性（K8s） · FDE 位点：Zone C operate<br>来源：<code>google/skills@gke-observability<\/code>（Google 官方 org）· 热度：3K installs · https://skills.sh/google/skills/gke-observability<br>同系列：<code>gke-upgrades<\/code>（3.2K）、<code>gke-cluster-creation<\/code>（2.9K）、<code>gke-cluster-autoscaler<\/code>（1.9K）、<code>gke-cost-optimization<\/code>（1.5K）<br>安装：<code>npx skills add google/skills@gke-observability --directory ~/.qoder/skills -y<\/code><\/div>\n<h2>能做什么<\/h2>\n<p>GKE/K8s 可观测性接入与查询：日志（Cloud Logging）、指标（Cloud Monitoring / Prometheus 栈）、trace 采集与关联，Workload Identity 采集权限、告警规则与 SLO 预算视图，以及\"看不到数据\"时的采集链路排查。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>客户在 GCP/GKE 上跑 fde-scope 服务，需要把日志指标接进平台监控<\/li><li>自建 Prometheus + Grafana 的 K8s 环境（思路与资源定义可迁移，具体产品名要替换）<\/li><li>上线时要同时交付告警规则与 SLO 视图（Zone C 的必备材料）<\/li><\/ul>\n<p><strong>不用于<\/strong>：阿里云客户（→ <a href=\"#/zone-c-operationalization/starops\">starops<\/a>）；单容器/ECS 部署（→ 直接 stdout 日志 + 平台监控，别为此上 K8s 观测栈）；应用内错误细节（→ <a href=\"#/zone-c-operationalization/sentry-mcp\">sentry-mcp<\/a>）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>先定义\"要回答什么问题\"再装采集器：只要 SLO（可用性/延迟）就先指标 + 告警，trace 等到有跨服务排障需求时再上<\/li><li>采集成本可控：K8s 默认全量采集在工业现场很容易爆盘/爆预算，明确采样率与保留期并写进交付文档<\/li><li>权限最小化：只读监控权限即可，绝不为排障给集群 admin<\/li><li>与 <a href=\"#/zone-b-build/kubernetes-specialist\">kubernetes-specialist<\/a> 配套使用：前者管拓扑与发布，本 skill 管可观测信号<\/li><li>交接视角：告警通知要接到客户既有值班通道（邮件/IM/PagerDuty），否则等于没有监控<\/li><li>官方 skill 可信度高，但因平台强绑定 GCP——非 GCP 客户装它收益有限，按客户平台决定是否安装<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone C：<code>slo<\/code> gate 的指标来源与告警落地<\/li><li>Zone B deploy：容器化交付（<a href=\"#/zone-b-build/docker-build-deploy\">docker-build-deploy<\/a> / K8s）之后的观测面<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-b-build/kubernetes-specialist\">kubernetes-specialist<\/a> · <a href=\"#/zone-c-operationalization/starops\">starops<\/a> · <a href=\"#/zone-c-operationalization/sre-runbooks\">sre-runbooks<\/a><\/p>"}, {"route": "zone-c-operationalization/firecrawl-monitor", "zone": "Zone C · Operationalization", "zoneId": "zone-c-operationalization", "status": "✅", "html": "<h1>firecrawl-monitor<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（firecrawl 插件 v0.1.0）· 类型：变更监测 · FDE 位点：Zone C watch<\/div>\n<h2>能做什么<\/h2>\n<p>监测网页内容变化并通过 <strong>webhook / 邮件<\/strong> 告警，无需自建 cron + 抓取 + diff。内置 AI judge 过滤排版、时间戳、跟踪参数等噪声，只在<strong>真实内容变化<\/strong>时通知。两类用法：① 盯已知 URL（定价页、文档、changelog、状态页、招聘页）；② 盯\"网页本身\"的新结果（新产品发布、融资、论文、动态），此时给搜索 query + 目标而不是 URL。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>客户竞品/供应商的定价与规格变更监测（售前素材保鲜）<\/li><li>依赖的第三方文档/API/固件版本页变更（现场设备 SDK 更新往往就这样发现）<\/li><li>同一 URL 需要重复检查第二次以上——就该用 monitor 而不是一次次 scrape<\/li><\/ul>\n<p><strong>不用于<\/strong>：一次性抓取（→ <a href=\"#/zone-a-pre-engagement/firecrawl-scrape\">firecrawl-scrape<\/a>）；站内多页首次建库（→ <a href=\"#/zone-a-pre-engagement/firecrawl-crawl\">firecrawl-crawl<\/a>）；内部代码/配置变更监测（用 git CI，不用外网工具）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>明确\"什么算变化\"：盯价格就锁 price 元素区域，整页监测会被推荐位噪声打爆<\/li><li>频率按业务定：定价类日/周一次足够，状态页类可高频；高频会快速消耗额度<\/li><li>告警落地要有责任人和动作（收到 → 谁评估 → 是否影响交付），否则会变成静音噪音<\/li><li>结果需二次确认：AI judge 过滤后仍要在工单/记录里留证据链接，别只凭通知转述<\/li><li>合规：监测对象 robots/条款允许，避免登录墙后内容与个人隐私数据<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone C watch：外部依赖变更发现（连接器涉及的设备固件/MES 版本页）<\/li><li>Zone A：客户所在行业新闻、竞对信息保鲜<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-a-pre-engagement/firecrawl-scrape\">firecrawl-scrape<\/a> · <a href=\"#/zone-a-pre-engagement/firecrawl-crawl\">firecrawl-crawl<\/a> · <a href=\"#/cross-cutting/schedule\">schedule<\/a><\/p>"}, {"route": "zone-c-operationalization/deploy-checklist", "zone": "Zone C · Operationalization", "zoneId": "zone-c-operationalization", "status": "📦", "html": "<h1>deploy-checklist 📦<\/h1>\n<div class=\"page-meta\">状态：📦 可安装（未装）· 类型：上线前核验清单 · FDE 位点：Zone B 收口 → Zone C operationalize 交界<br>真实条目：<code>anthropics/knowledge-work-plugins@deploy-checklist<\/code>（官方 org）· 热度：4.9K installs · https://skills.sh/anthropics/knowledge-work-plugins/deploy-checklist<br>源文件（已读，2026-08-27 取证）：<code>engineering/skills/deploy-checklist/SKILL.md<\/code>（78 行，无 scripts/、无 references/，纯模板 skill）· https://github.com/anthropics/knowledge-work-plugins/blob/main/engineering/skills/deploy-checklist/SKILL.md<br>安装：<code>npx skills add anthropics/knowledge-work-plugins@deploy-checklist --directory ~/.qoder/skills -y<\/code><\/div>\n<h2>能做什么<\/h2>\n<p>在<strong>部署前<\/strong>生成一份可勾选的 readiness 清单，输出结构固定为四段：Pre-Deploy（CI 全绿 / 已评审 / 无已知严重缺陷 / <strong>迁移已测<\/strong> / <strong>flag 已配<\/strong> / <strong>回滚方案已写<\/strong> / on-call 已通知）、Deploy（staging 验证 → smoke → 生产（有 canary 走 canary）→ 观察错误率与延迟 15 分钟 → 关键流程验证）、Post-Deploy（指标确认 / release notes / 通知干系人 / 关单）、以及 <strong>Rollback Triggers<\/strong>（错误率阈值、P50 延迟阈值、关键流程失败——<strong>上线前就定好，不是出事时再想<\/strong>）。<\/p>\n<p>支持按场景定制：说明\"有 feature flag / 含数据库迁移 / 是破坏性 API 变更\"，它会追加对应核验步骤。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>每一次向客户生产环境投递（包括\"例行的小版本\"——清单存在的意义正是防\"我忘了……\"）<\/li><li>变更含 DB migration、feature flag、或破坏性接口变更时（这三类是现场事故高发源）<\/li><li>需要一份<strong>能作为 gate 证据<\/strong>的上线核验记录（fde-scope 的 SLO / HandoffSignoff gate）<\/li><li>交接给客户团队时，把清单本身当交付物<\/li><\/ul>\n<p><strong>不用于<\/strong>：反复执行的操作步骤文档（→ <a href=\"#/zone-c-operationalization/sre-runbooks\">sre-runbooks<\/a>，runbook 是\"怎么做\"，本 skill 是\"能不能做\"）；事件发生时的处置（→ <a href=\"#/zone-c-operationalization/incident-response\">incident-response<\/a>）；架构层面的上线风险评估（→ 架构可视化插件 <code>risk-quality-reviewer<\/code>）；本地/演示环境的一次性部署（清单开销不划算）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li><strong>上游信源已核<\/strong>：该 skill 是纯模板（无可执行脚本、无外部依赖、无网络调用），风险面极小；且上游仓库对每个条目跑<strong>强制的 Claude policy scan 状态检查<\/strong>（<code>.github/workflows/scan-plugins.yml<\/code>，按 (plugin, sha) 缓存判定，未通过会由 <code>revert-failed-bumps.yml<\/code> 自动剔除），供应链治理在同类 skill 里属最强一档<\/li><li>与已装的 <a href=\"#/cross-cutting/gstack-suite\">gstack-suite<\/a> <code>land-and-deploy<\/code> / <code>setup-deploy<\/code> 有重叠：GStack 偏\"自动化执行发布动作\"，本 skill 偏\"人工核验清单\"。<strong>在客户现场优先用本 skill<\/strong>（核验留痕，不自动改远端）<\/li><li>阈值必须填<strong>真实基线<\/strong>：<code>P50 超过 X ms<\/code> 的空占位符等于没写；从 <a href=\"#/zone-c-operationalization/web-perf\">web-perf<\/a> / <a href=\"#/zone-c-operationalization/sentry-mcp\">sentry-mcp<\/a> / 现场历史指标取数<\/li><li>把\"回滚触发条件\"当作硬契约：与客户方书面确认后才算通过，口头共识不算（这是 gate 证据的关键一环）<\/li><li>制造业/具身场景要加自己的项：气隙环境离线包校验、固件/模型版本对照表、产线停机窗口确认、班次交接（ShiftHandover gate）<\/li><li>清单落地成文件（进交付包或 <code>.fde_scope/<\/code>），不要只留在会话里——否则无法追溯<\/li><li>装前门禁：按 <a href=\"../README.md\" target=\"_blank\" rel=\"noopener\">../README.md<\/a> 规约第 3 条，安装后跑一次 <a href=\"#/cross-cutting/skill-criticagent\">skill-criticagent<\/a> 记录本地行为判定，再把本页状态改为 ✅<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone B→C 交界：<code>fde-scope engage advance<\/code> 触达 SLO / HandoffSignoff gate 前的固定核验动作<\/li><li>与 <code>docs/code_review_checklist.md<\/code> 配对：一个管代码合入前，一个管投递生产前<\/li><li>候选用法：把本 skill 的四段模板直接改造成 fde-scope 的 gate 证据模板（<code>fde_scope/engagement/gates/<\/code> 的工业 gate 各缺一份\"上线核验\"附件）<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-c-operationalization/sre-runbooks\">sre-runbooks<\/a> · <a href=\"#/zone-c-operationalization/incident-response\">incident-response<\/a> · <a href=\"#/cross-cutting/gstack-suite\">gstack-suite<\/a> · <a href=\"#/cross-cutting/knowledge-work-suite\">knowledge-work-suite<\/a> · 架构可视化插件的 <code>architecture-health<\/code>（文档/图与代码一致性，见 <a href=\"#/cross-cutting/architecture-visualization-suite\">architecture-visualization-suite<\/a>）<\/p>"}, {"route": "zone-c-operationalization/huggingface-llm-trainer", "zone": "Zone C · Operationalization", "zoneId": "zone-c-operationalization", "status": "✅", "html": "<h1>huggingface-llm-trainer<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（hugging-face 插件 v1.0.0）· 类型：训练执行 · FDE 位点：Zone C flywheel（重训后端候选）<\/div>\n<h2>能做什么<\/h2>\n<p>在 <strong>Hugging Face Jobs 云 GPU<\/strong> 上做 SFT / DPO / GRPO / reward modeling，并支持 GGUF 转换用于本地部署。覆盖 TRL Jobs 包、PEP 723 头的 UV 脚本、数据集准备与校验、硬件选型、<strong>成本预估<\/strong>、Trackio 监控、Hub 认证与模型持久化。<\/p>\n<h2>何时使用<\/h2>\n<ul><li><code>fde_scope/flywheel/retrain_scheduler.py<\/code> 目前是 <strong>stub<\/strong>（\"actual fine-tune submission is a roadmap item\"）——本 skill 是把这个 stub 落成真实动作的候选后端之一<\/li><li>现场没有本地 GPU，但要跑微调实验<\/li><li>交付产物需要一个可直接调用的 Hub 模型，或需要 GGUF 让客户在内网笔记本上跑<\/li><\/ul>\n<p><strong>不用于<\/strong>：本地 GPU 训练（→ <a href=\"#/zone-c-operationalization/trl-training\">trl-training<\/a>）；百炼平台客户（→ <a href=\"#/zone-b-build/bailian-train-deploy\">bailian-train-deploy<\/a>，数据不出阿里云）；视觉模型（→ <a href=\"#/zone-c-operationalization/huggingface-vision-trainer\">huggingface-vision-trainer<\/a>）；<strong>含客户数据<\/strong>的训练（HF Jobs 会把数据传到 Hub——合规红线）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>⚠️ <strong>数据出境判断<\/strong>：HF Jobs 需要把数据集上传 Hub（即便 private repo）。工业客户/政企默认视为不可接受，须书面确认后才用；否则一律走本地/私有云训练<\/li><li>先成本预估再提交：明确 GPU 型号与时长，demo 用最小规格，跑通即停<\/li><li>数据集准备阶段就用 skill 的 validate 流程，训练失败往往源于格式与字段缺失<\/li><li>训练与评估闭环：Trackio 曲线留档 → 用 <a href=\"#/zone-b-build/huggingface-community-evals\">huggingface-community-evals<\/a> + <code>fde_scope.eval<\/code> 双证，再谈上线<\/li><li>版本可追溯：记录 base model revision + dataset hash + 训练配置，写进 engagement 记录（交接必需）<\/li><li>GGUF 转换只在\"客户要离线本地跑\"时用，别为省事牺牲精度<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone C <code>flywheel<\/code>：周度增量重训的执行后端候选（配合 <a href=\"#/cross-cutting/schedule\">schedule<\/a>）<\/li><li>Zone B <code>validate<\/code>：LoRA/SFT 实验的云端算力来源<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-c-operationalization/trl-training\">trl-training<\/a> · <a href=\"#/zone-c-operationalization/huggingface-vision-trainer\">huggingface-vision-trainer<\/a> · <a href=\"#/zone-b-build/bailian-train-deploy\">bailian-train-deploy<\/a><\/p>"}, {"route": "zone-c-operationalization/huggingface-vision-trainer", "zone": "Zone C · Operationalization", "zoneId": "zone-c-operationalization", "status": "✅", "html": "<h1>huggingface-vision-trainer<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（hugging-face 插件 v1.0.0）· 类型：视觉训练 · FDE 位点：Zone B/C 具身与制造业场景<\/div>\n<h2>能做什么<\/h2>\n<p>在 Transformers + HF Jobs 云 GPU 上训练/微调视觉模型：目标检测（D-FINE、RT-DETR v2、DETR、YOLOS）、图像分类（timm：MobileNetV3、MobileViT、ResNet、ViT/DINOv3 等）、SAM/SAM2 分割（bbox/point prompt、DiceCE loss）。含 COCO 格式数据准备、Albumentations 增强、mAP/mAR 与准确率评估、硬件选型、成本预估、Trackio 监控、Hub 持久化。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>制造业/具身机器人场景的视觉质检、部件定位、抓取前分割（fde-scope 的 manufacturing profile 延伸能力）<\/li><li>客户只有几百张标注图，需要小样本微调而不是从零训练<\/li><li>需要在边缘设备上跑分类 → 先用 MobileNetV3/MobileViT 这类小模型验证可行性<\/li><\/ul>\n<p><strong>不用于<\/strong>：LLM/文本微调（→ <a href=\"#/zone-c-operationalization/trl-training\">trl-training<\/a> / <a href=\"#/zone-c-operationalization/huggingface-llm-trainer\">huggingface-llm-trainer<\/a>）；ROS2 bag 的解析与数据集导出（→ <code>fde_scope/connectors/ros2_bag.py<\/code>）；数据不出厂客户（HF Jobs 需上传数据，先做合规判断）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>数据格式先对齐 COCO（bbox 归一化/类别映射最容易出错），再谈模型选择<\/li><li>模型选择从任务反推：实时性优先 RT-DETR/MobileViT；精度优先 D-FINE/DINOv3；标注少考虑 SAM 交互式分割补标<\/li><li>指标口径要提前和客户书面确认（mAP@0.5 还是 @0.5:0.95），验收扯皮多源于此<\/li><li>增强策略保守：工业图像不要乱用颜色抖动（会破坏缺陷判据）<\/li><li>算力成本：先 1 个 epoch 小样本验证收敛趋势，再放全量；Trackio 曲线存档进交付记录<\/li><li>与 fde-scope 衔接：训练产物的评估报告应接入 <code>EvalReport<\/code> 形式，保持交付材料同一口径<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone B <code>manufacturing<\/code>：视觉质检模型的小样本微调<\/li><li>Zone C：缺陷类型漂移后的再训练（flywheel 视觉分支）<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-c-operationalization/trl-training\">trl-training<\/a> · <a href=\"#/zone-c-operationalization/huggingface-llm-trainer\">huggingface-llm-trainer<\/a> · <a href=\"#/zone-b-build/huggingface-datasets\">huggingface-datasets<\/a><\/p>"}, {"route": "zone-c-operationalization/trl-training", "zone": "Zone C · Operationalization", "zoneId": "zone-c-operationalization", "status": "✅", "html": "<h1>trl-training<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（hugging-face 插件 v1.0.0）· 类型：本地训练执行 · FDE 位点：Zone C flywheel + Zone B validate<\/div>\n<h2>能做什么<\/h2>\n<p>用 <code>trl<\/code> CLI 在<strong>本地/自有 GPU<\/strong> 上跑 SFT、DPO、GRPO、KTO、RLOO 与 reward model 训练（<code>trl sft<\/code>、<code>trl dpo<\/code> 等），含数据集/参数与训练配置约束。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>客户现场有 GPU 机器（或自有训练机），数据不得出厂 → 这是唯一合规路线<\/li><li>做小规模对齐实验（偏好对 DPO）验证\"话术规范\"能否被训出来<\/li><li>需要完全掌控超参与日志复现时<\/li><\/ul>\n<p><strong>不用于<\/strong>：无本地算力（→ <a href=\"#/zone-c-operationalization/huggingface-llm-trainer\">huggingface-llm-trainer<\/a> 走 HF Jobs）；百炼生态客户（→ <a href=\"#/zone-b-build/bailian-train-deploy\">bailian-train-deploy<\/a>）；嵌入模型训练（→ <a href=\"#/zone-b-build/train-sentence-transformers\">train-sentence-transformers<\/a>）；只想调用不训练。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>环境锁死：<code>torch<\/code>/<code>transformers<\/code>/<code>trl<\/code> 三件套版本记录进交付文档（现场最常见的复现失败原因）<\/li><li>先 1 步 smoke run（小数据 + <code>--max_steps 1<\/code>）确认显存与数据管道，再跑全量<\/li><li>显存策略优先级：LoRA/QLoRA → 降 seq len → 梯度累积 → 才是加卡<\/li><li>训练数据必须来自 <code>fde_scope.corpus<\/code> 的导出格式，别手搓 jsonl（会绕过质量门禁与去重）<\/li><li>评估不能省：训练后用 <a href=\"#/zone-b-build/phoenix-evals\">phoenix-evals<\/a> / <code>fde_scope.eval<\/code> 对比新旧模型，没有对比结论就不上线<\/li><li>现场注意：TRL 会拉 HF 权重，气隙环境要先离线准备模型与数据集<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone B <code>validate<\/code>：私有化微调实验主路径<\/li><li>Zone C <code>flywheel<\/code>：把 <code>retrain_scheduler<\/code> stub 落到本地训练（数据不出厂场景的首选后端）<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-c-operationalization/huggingface-llm-trainer\">huggingface-llm-trainer<\/a> · <a href=\"#/zone-b-build/train-sentence-transformers\">train-sentence-transformers<\/a> · <a href=\"#/zone-b-build/bailian-train-deploy\">bailian-train-deploy<\/a><\/p>"}, {"route": "zone-c-operationalization/web-perf", "zone": "Zone C · Operationalization", "zoneId": "zone-c-operationalization", "status": "✅", "html": "<h1>web-perf<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（cloudflare 插件 v1.0.0；chrome-devtools-mcp 插件亦有同名能力）· 类型：性能分析 · FDE 位点：Zone C operate（交付面板性能）<\/div>\n<h2>能做什么<\/h2>\n<p>用 Chrome DevTools MCP 分析 Web 性能：Core Web Vitals（LCP / INP / CLS）+ 补充指标（FCP、TBT、Speed Index），定位阻塞渲染资源、网络依赖链、布局偏移、缓存问题与可访问性缺口。<strong>偏向实时检索最新文档<\/strong>而不是凭记忆给阈值。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>客户抱怨\"面板打开很慢\"\"车间平板上卡\"<\/li><li>交付前给出可量化的性能基线（数字比形容词有说服力）<\/li><li>上线后 CWV 漂移监测<\/li><\/ul>\n<p><strong>不用于<\/strong>：Python 后端接口慢（→ 看服务端 profile / <a href=\"#/zone-c-operationalization/starops\">starops<\/a>）；只要 LCP 单点深挖（→ <a href=\"#/zone-c-operationalization/debug-optimize-lcp\">debug-optimize-lcp<\/a>）；内存增长问题（→ <a href=\"#/zone-c-operationalization/memory-leak-debugging\">memory-leak-debugging<\/a>）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>测量环境要固定：同一设备/网络/是否登录态，否则数字不可比；现场最好用客户真实设备测一次<\/li><li>先测后改：任何优化前先取基线，优化后复测并在交付文档里留下前后对比<\/li><li>阈值按客户 SLA 谈，不要拿 Google 推荐值直接当合同指标<\/li><li>常见收益顺序：图片/字体与阻塞资源 → 缓存与 CDN → JS 体积与初始化 → 布局稳定<\/li><li>报告输出：截图 + 指标表 + 三条以内可执行建议（客户看不完长报告）<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone C：交付 Web 面板的持续性能门禁<\/li><li>Zone D：验收材料中的性能证据<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-c-operationalization/debug-optimize-lcp\">debug-optimize-lcp<\/a> · <a href=\"#/zone-c-operationalization/chrome-devtools\">chrome-devtools<\/a> · <a href=\"#/zone-c-operationalization/memory-leak-debugging\">memory-leak-debugging<\/a><\/p>"}, {"route": "zone-c-operationalization/debug-optimize-lcp", "zone": "Zone C · Operationalization", "zoneId": "zone-c-operationalization", "status": "✅", "html": "<h1>debug-optimize-lcp<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（chrome-devtools-mcp 插件 v1.2.0）· 类型：性能专项 · FDE 位点：Zone C operate<\/div>\n<h2>能做什么<\/h2>\n<p>LCP（最大内容绘制）专项：用 DevTools MCP 工具找出拖慢首屏主内容出现的原因——资源加载链、字体阻塞、图片尺寸与优先级、渲染阻塞 CSS/JS、服务端 TTFB，并给出针对性修复与复测路径。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>用户明确说\"首屏慢\"/\"表格第一屏要等好几秒\"<\/li><li>CWV 报告里 LCP 是唯一超标项<\/li><li>Hero 图 / 大表格首屏渲染优化<\/li><\/ul>\n<p><strong>不用于<\/strong>：全面性能体检（→ <a href=\"#/zone-c-operationalization/web-perf\">web-perf<\/a>）；交互延迟 INP 问题（→ web-perf）；后端接口本身慢（先看服务端）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>先确认 LCP 元素是谁（DevTools 里高亮），不同元素对应完全不同的修法，别猜<\/li><li>高频有效手段排序：预加载/优先级设置 LCP 资源 → 图片格式与尺寸 → 消除同步阻塞脚本 → 字体 <code>display: swap<\/code> + 预加载<\/li><li>现场带宽受限（车间 Wi-Fi/内网）时，收益最大的是<strong>减少资源数量与体积<\/strong>，而不是花哨的加载策略<\/li><li>每次只改一项并复测，LCP 波动 ±10% 属噪声，不要为了噪声改代码<\/li><li>把 LCP 数值与截图记入验收材料，避免上线后扯皮<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone C：交付面板首屏性能整改<\/li><li>Zone B：demo 阶段的加载体验（客户第一眼）<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-c-operationalization/web-perf\">web-perf<\/a> · <a href=\"#/zone-c-operationalization/chrome-devtools\">chrome-devtools<\/a> · <a href=\"#/zone-c-operationalization/memory-leak-debugging\">memory-leak-debugging<\/a><\/p>"}, {"route": "zone-c-operationalization/memory-leak-debugging", "zone": "Zone C · Operationalization", "zoneId": "zone-c-operationalization", "status": "✅", "html": "<h1>memory-leak-debugging<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（chrome-devtools-mcp 插件 v1.2.0）· 类型：内存专项 · FDE 位点：Zone C operate<\/div>\n<h2>能做什么<\/h2>\n<p>诊断并解决 <strong>JavaScript/Node.js<\/strong> 内存泄漏：高内存占用与 OOM 的定位、heapsnapshot 对比分析、<code>memlab<\/code> 等检测工具的使用，以及常见泄漏模式（事件监听未解绑、闭包持有、缓存无上限、DOM 引用）的修复。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>交付面板长时间开着就越来越卡/崩（车间大屏、值班终端常年不刷新）<\/li><li>Node 侧服务（pawapp 前端构建、脚本工具）RSS 持续上涨<\/li><li>客户运维抱怨\"每天要重启一次\"<\/li><\/ul>\n<p><strong>不用于<\/strong>：Python 侧内存问题（fde-scope 主体是 Python，用 <code>tracemalloc<\/code>/<code>objgraph<\/code>/<code>memray<\/code>，此 skill 不适用）；单纯页面慢（→ <a href=\"#/zone-c-operationalization/web-perf\">web-perf<\/a>）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>判定前先区分\"泄漏\"和\"高占用\"：增长后趋平不是泄漏，别急着改代码<\/li><li>采集两次 heapsnapshot（操作前/重复 N 次操作后）做 diff，看<strong> retained size 增长的对象类型<\/strong><\/li><li>用 memlab 的 repeatable flow 固化复现步骤，修完能回归<\/li><li>前端长驻场景的常见解法：列表虚拟化、事件/定时器随组件卸载清理、给缓存加 LRU 上限<\/li><li>与运维配合：设置内存告警阈值与自动 dump，现场问题才有证据<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone C：长驻 Web 控制台/值班终端稳定性<\/li><li>注意：<code>fde_scope<\/code> 是 Python，本 skill 只覆盖交付面（前端/Node 工具链）<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-c-operationalization/web-perf\">web-perf<\/a> · <a href=\"#/zone-c-operationalization/chrome-devtools\">chrome-devtools<\/a> · <a href=\"#/zone-c-operationalization/investigate\">investigate<\/a><\/p>"}, {"route": "zone-d-handoff/document-generate", "zone": "Zone D · Handoff", "zoneId": "zone-d-handoff", "status": "✅", "html": "<h1>document-generate<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（gstack 插件 v1.58.5）· 类型：文档生成 · FDE 位点：Zone D handoff<\/div>\n<h2>能做什么<\/h2>\n<p>从零补齐缺失文档：针对一个 feature、模块或整个项目，读取代码/测试/配置生成结构化文档（README、API、架构、使用指南），避免\"文档靠脑补\"。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>接手客户遗留系统后需要先补一份能读的现状文档（配合 <a href=\"#/zone-a-pre-engagement/zread\">zread<\/a>）<\/li><li>fde-scope 新模块落地但文档为空（例：<code>docs/<\/code> 里某些主题只有骨架）<\/li><li>交接前发现\"只有代码没有说明\"，需要一次性补齐<\/li><\/ul>\n<p><strong>不用于<\/strong>：发布后的增量文档同步（→ <a href=\"#/zone-d-handoff/document-release\">document-release<\/a>）；把文档排版成 PDF 交付物（→ <a href=\"#/zone-d-handoff/make-pdf\">make-pdf<\/a>）；面向高管的架构讲法（→ <a href=\"#/zone-a-pre-engagement/architecture-communicator\">architecture-communicator<\/a>）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>先定读者再定内容：客户运维手册 ≠ 开发者文档 ≠ 验收报告，一份文档只服务一类读者<\/li><li>生成后<strong>逐条核对代码引用<\/strong>：自动生成的 API 说明最容易留下已废弃签名（本仓库刚做过同类校验，见 <code>docs/architecture-model/architecture-health-report.md<\/code>）<\/li><li>数字与清单要来自可复跑的命令（路由数、gate 数、连接器数），不要写\"约 10 个\"<\/li><li>与本项目约定一致：文档落 <code>docs/<\/code>，图走 <code>docs/architecture-model/<\/code>，每个声明可回溯到文件<\/li><li>别一次生成整站文档——按模块分批，每批都人工过一遍再提交<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone D <code>handoff<\/code>：客户侧文档补齐的主力<\/li><li>现状缺口示例：<code>docs/runbooks/<\/code>、<code>deploy/README<\/code>（配合 <a href=\"#/zone-b-build/docker-build-deploy\">docker-build-deploy<\/a>）<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-d-handoff/document-release\">document-release<\/a> · <a href=\"#/zone-d-handoff/make-pdf\">make-pdf<\/a> · <a href=\"#/zone-a-pre-engagement/zread\">zread<\/a><\/p>"}, {"route": "zone-d-handoff/document-release", "zone": "Zone D · Handoff", "zoneId": "zone-d-handoff", "status": "✅", "html": "<h1>document-release<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（gstack 插件 v1.58.5）· 类型：文档同步 · FDE 位点：Zone D handoff + 每次发布<\/div>\n<h2>能做什么<\/h2>\n<p>\"Ship 之后\"的文档更新：把本次变更同步进 changelog、版本说明、受影响页面的文档，防止文档与实现漂移。与 <code>ship<\/code>（版本/CHANGELOG/PR 流程）配套。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>每次功能合并后，同步版本说明与受影响文档段落（本仓库当前<strong>没有<\/strong> <code>CHANGELOG.md<\/code>，属待建项）<\/li><li>交接前最后一个冲刺：把散在对话/PR 描述里的说明收敛成正式文档<\/li><li>修完 bug 后确认文档里的行为描述还成立（尤其 gate 与指标口径）<\/li><\/ul>\n<p><strong>不用于<\/strong>：从零补缺失文档（→ <a href=\"#/zone-d-handoff/document-generate\">document-generate<\/a>）；代码评审（→ gstack <code>review<\/code> 或 <a href=\"#/cross-cutting/code-review\">code-review<\/a>）；架构性变更的模型更新（→ <a href=\"#/cross-cutting/architecture-visualization-suite\">architecture-health<\/a>）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>把\"文档同步\"当作 Definition of Done 的一条，而不是\"有空再做\"——交付项目里文档滞后就是验收阻滞<\/li><li>与 <a href=\"#/cross-cutting/architecture-visualization-suite\">architecture-health<\/a> 协作：改了架构事实（模块/路由/连接器/gate）必须同时更新 <code>docs/architecture.md<\/code> 与 <code>docs/architecture-model/<\/code><\/li><li>CHANGELOG 按\"客户能感知的变化\"分组，内部重构单独一类或省略<\/li><li>版本号与发布物一致：若要新建 changelog，采用 Keep a Changelog 格式并全项目统一，不要混用多种格式<\/li><li>每次同步顺手做一次\"数字复跑\"（路由数、测试数），避免像 <code>26 vs 27 routes<\/code> 这类陈旧声明再次出现<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone D <code>handoff<\/code>：交付包文档一致性维护<\/li><li>与 fde-scope 的 <code>docs/architecture.md<\/code> 同步：架构事实变更必须同时更新 <code>docs/architecture.md<\/code> 与 <code>docs/architecture-model/<\/code>（注意：仓库当前无 AGENTS.md / <code>docs/evidence-templates.md<\/code>，文档落点靠本 catalog 与 README 约定）<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-d-handoff/document-generate\">document-generate<\/a> · <a href=\"#/zone-d-handoff/make-pdf\">make-pdf<\/a> · <a href=\"#/cross-cutting/architecture-visualization-suite\">architecture-health<\/a><\/p>"}, {"route": "zone-d-handoff/make-pdf", "zone": "Zone D · Handoff", "zoneId": "zone-d-handoff", "status": "✅", "html": "<h1>make-pdf<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（gstack 插件 v1.58.5）· 类型：交付排版 · FDE 位点：Zone D handoff<\/div>\n<h2>能做什么<\/h2>\n<p>把任意 Markdown 转成<strong>出版级 PDF<\/strong>（排版、目录、页眉页脚、代码块与表格样式），用于正式交付物与打印材料。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>客户验收要\"盖章的纸质/PDF 版\"：方案书、验收报告、运维手册<\/li><li>把 <code>docs/<\/code> 下的模型说明 + 架构图打包成一份可分发文档<\/li><li>会议材料需要 A4 固定版式（而不是让人自己打开 Markdown）<\/li><\/ul>\n<p><strong>不用于<\/strong>：需要复杂图文混排与精确页位的设计稿（用专业排版/设计工具）；PowerPoint 类演示（→ <a href=\"#/zone-d-handoff/pptx\">pptx<\/a> / <a href=\"#/zone-d-handoff/slidev\">slidev<\/a>）；只做 Markdown 解析（→ <a href=\"#/zone-a-pre-engagement/pdf\">pdf<\/a> 的读取能力）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>先内容后排版：Markdown 结构（标题层级/表格/图）干净，PDF 才不会到处断裂<\/li><li>图片必须本地路径且分辨率足够（现场打印机 300dpi 起）；Mermaid/DOT 图先导出 SVG/PNG 再嵌入<\/li><li>中文字体是最大坑：确认 PDF 引擎已装中文字体，否则中文变豆腐块——正式交付前打印一页实测<\/li><li>交付命名规范：<code><项目>_<文档类型>_v<版本>_<日期>.pdf<\/code>，并在扉页写版本与生成日期<\/li><li>与 <a href=\"#/zone-d-handoff/document-release\">document-release<\/a> 配合：源 Markdown 更新后重新生成 PDF，不要手改 PDF（会造成双版本）<\/li><li>体积：含大量截图的 PDF 要压缩，客户邮件常有大小限制<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone D：交付包 PDF 定稿（方案 / 验收 / 运维手册三件套）<\/li><li>与 <code>docs/architecture-model/<\/code> 的图配套输出<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-d-handoff/document-generate\">document-generate<\/a> · <a href=\"#/zone-d-handoff/pptx\">pptx<\/a> · <a href=\"#/zone-a-pre-engagement/pdf\">pdf<\/a><\/p>"}, {"route": "zone-d-handoff/anthropic-documentation", "zone": "Zone D · Handoff", "zoneId": "zone-d-handoff", "status": "📦", "html": "<h1>anthropic-documentation 📦<\/h1>\n<div class=\"page-meta\">状态：📦 可安装（未装）· 类型：写作规范 · FDE 位点：Zone D handoff<br>真实条目：<code>anthropics/knowledge-work-plugins@documentation<\/code>（官方 org）· 热度：8.8K installs · https://skills.sh/anthropics/knowledge-work-plugins/documentation<br>安装：<code>npx skills add anthropics/knowledge-work-plugins@documentation --directory ~/.qoder/skills -y<\/code><br>说明：早期建档记作 <code>anthropic-documentation<\/code>，registry 无该名；已更正为官方 <code>documentation<\/code>。<br>取证（2026-08-27）：源文件 <code>engineering/skills/documentation/SKILL.md<\/code>（49 行，<strong>单文件<\/strong>，无 <code>scripts/<\/code>、无 <code>references/<\/code>）· https://github.com/anthropics/knowledge-work-plugins/blob/main/engineering/skills/documentation/SKILL.md<br>安全：同仓库其他条目一样受上游<strong>强制 Claude policy scan<\/strong>（<code>scan-plugins.yml<\/code>）保护。风险面极小。<br>⚠️ 命名陷阱：它的触发词里包含 <code>\"write a runbook\"<\/code> —— 与 <a href=\"#/zone-c-operationalization/sre-runbooks\">runbook<\/a> <strong>抢触发<\/strong>。两个都装时必须先定分工（见最佳实践）。<br>同类备选：<code>sammcj/agentic-coding@writing-documentation-with-diataxis<\/code>（573，Diátaxis 四象限写作法）<\/div>\n<h2>能做什么<\/h2>\n<p>按官方写作规范产出工程文档（已读源文件确认其真实结构，<strong>不是<\/strong> Diátaxis 四象限）：五类文档模板 —— README（是什么/为什么 + <5 分钟 quick start + 配置与用法 + 贡献指南）、API Documentation（端点 + 请求/响应例 + 鉴权与错误码 + 限流与分页 + SDK 例）、Runbook（何时用 + 前置权限 + 逐步操作 + 回滚 + 升级路径）、Architecture Doc（背景与目标 + 高层设计与图 + 关键决策与 trade-off + 数据流与集成点）、Onboarding Guide（环境搭建 + 系统如何连接 + 常见任务走查 + 该问谁）；配五条原则：为读者写 / 最有用的信息放前面 / 用代码与截图而不是干说 / 保持新鲜（过期文档比没有更糟）/ 链接而非复制。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>交付文档要成体系（README + API 参考 + 架构说明 + runbook + onboarding）而不是散装 README<\/li><li>客户方要接手维护，需要他们能持续沿用同一写作标准<\/li><li>本仓库文档风格需要统一（现有 <code>docs/<\/code> 文件风格并不完全一致）<\/li><\/ul>\n<p><strong>不用于<\/strong>：文档内容的技术正确性校验（→ <a href=\"#/cross-cutting/architecture-visualization-suite\">architecture-health<\/a>）；PPT/演示（→ <a href=\"#/zone-d-handoff/visual-deck-builder\">visual-deck-builder<\/a>）；一次性内部备忘。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li><strong>它不是 Diátaxis<\/strong>：本 skill 是“按文档类型给骨架 + 五条原则”。真要四象限约束，用备选 <code>sammcj/agentic-coding@writing-documentation-with-diataxis<\/code>（573），<strong>两者只选一个<\/strong><\/li><li><strong>与 runbook 的抢触发如何共处<\/strong>：<code>documentation<\/code> 管“整套交付文档体系”，<a href=\"#/zone-c-operationalization/sre-runbooks\">runbook<\/a> 管“单份运维手册”；只装一个的话选 <code>runbook<\/code>（它的模板更深：逐步 Expected result / If it fails）<\/li><li>它的 Architecture Doc 模板与架构可视化插件的 <code>architecture-communicator<\/code> 重叠：后者带受众分层与证据链，<strong>架构部分优先用后者<\/strong><\/li><li>与客户确认术语表（工单/缺陷/告警/停机 等中文术语），避免同物不同名<\/li><li>规范落地为仓库内 checklist（<code>docs/writing-style.md<\/code>），比装第三个写作 skill 更有效<\/li><li>判断是否值得安装：若 <a href=\"#/zone-d-handoff/document-generate\">document-generate<\/a> + 项目自身规范已够用，<strong>可以长期不装<\/strong>——避免 skill 功能重叠导致路由抖动<\/li><li>装后回填本页：安装日期、实际用法、与 document-generate 的分工<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone D：交付文档体系标准<\/li><li>与本仓库既有文档骨架（<code>docs/fde_playbook.md<\/code>、<code>docs/skills.md<\/code>、<code>docs/code_review_checklist.md<\/code>）对齐风格，形成写作 + 落位双约束<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-d-handoff/document-generate\">document-generate<\/a> · <a href=\"#/zone-d-handoff/document-release\">document-release<\/a> · <a href=\"#/zone-d-handoff/make-pdf\">make-pdf<\/a><\/p>"}, {"route": "zone-d-handoff/shifu", "zone": "Zone D · Handoff", "zoneId": "zone-d-handoff", "status": "✅", "html": "<h1>shifu<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（<code>~/.qoder/skills/shifu<\/code>）· 类型：教学/培训 · FDE 位点：Zone D enable<\/div>\n<h2>能做什么<\/h2>\n<p>把 Markdown 知识库 / llm-wiki 语料库变成<strong>交互式教学<\/strong>：诊断已有水平 → 产出学习路径 → 逐课精讲 + 检查点测验 → 间隔重复复习题 → 结课检验，并把学习状态与掌握度写回记忆文件。触发词：教我/系统学习/复习/考我/学习计划。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>交接前需要让客户方工程师\"真的会\"而不只是拿到文档（培训环节）<\/li><li>自己要在两周内变成某行业领域（如汽车焊装、半导体厂务）的可用专家<\/li><li>有一堆客户文档/wiki 语料但没人能读完整套<\/li><\/ul>\n<p><strong>不用于<\/strong>：一次性事实查询；文档摘要（那是阅读任务）；排障（→ <a href=\"#/zone-c-operationalization/investigate\">investigate<\/a>）；需要记忆卡片时（→ <a href=\"#/zone-d-handoff/remember\">remember<\/a>）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>先给语料范围（指定目录），否则教学深度不稳定<\/li><li>让客户方也用同一套：培训效果可量化（掌握度记录就是验收证据）<\/li><li>学习状态文件纳入版本管理或至少归档到项目目录，交接后才有人能续上<\/li><li>与 <a href=\"#/zone-a-pre-engagement/qmind-knowledge\">qmind-knowledge<\/a> 组合：qmind 管知识沉淀，shifu 管知识传递<\/li><li>注意：课程质量上限 = 语料质量；语料缺口要在结课前作为风险列出，别当作已教会<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone D <code>enable<\/code>：客户培训与能力转移<\/li><li><code>.fde_scope/skills/<\/code> 现场经验沉淀后的对内/对外教学通道<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-d-handoff/remember\">remember<\/a> · <a href=\"#/zone-a-pre-engagement/qmind-knowledge\">qmind-knowledge<\/a> · <a href=\"#/zone-d-handoff/visual-deck-builder\">visual-deck-builder<\/a><\/p>"}, {"route": "zone-d-handoff/remember", "zone": "Zone D · Handoff", "zoneId": "zone-d-handoff", "status": "✅", "html": "<h1>remember<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（<code>~/.qoder/skills/remember<\/code>）· 类型：记忆/复习 · FDE 位点：Zone D enable<br>⚠️ 范围提醒：该 skill <strong>不是通用闪卡工具<\/strong>，其定位是 Kubernetes 网络概念（Service / Ingress / CNI / DNS / NetworkPolicy / Gateway API）的混淆对比记忆卡。README 索引里的一句话已按实际范围修正。<\/div>\n<h2>能做什么<\/h2>\n<p>生成/复习闪卡，用间隔重复对抗\"相似概念记混\"：Service 与 Ingress 的边界、CNI 与 NetworkPolicy 的关系、Gateway API 与 Ingress 的取舍等。触发词：记卡片/生成闪卡/复习/考我/混淆对比。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>现场 K8s 网络问题需要快速判断层次（客户集群排障最常见卡点）<\/li><li>面试/认证/上岗前的知识点固化<\/li><li>培训后巩固：与 <a href=\"#/zone-d-handoff/shifu\">shifu<\/a> 衔接（shifu 教、remember 记）<\/li><\/ul>\n<p><strong>不用于<\/strong>：端到端学习新领域（→ <a href=\"#/zone-d-handoff/shifu\">shifu<\/a>）；一次性事实查询；非 K8s 网络的自定义闪卡（当前 skill 语料聚焦 K8s 网络，其他领域要自行扩卡片或改副本）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>卡片要写成\"易混对比\"而不是\"名词解释\"——交付现场需要的是区分能力<\/li><li>复习节奏固定（如每天 5 分钟），间隔重复的价值来自频率而非单次时长<\/li><li>客户现场遇到的真实混淆点回写成新卡片，卡片库才会持续增值<\/li><li>若要推广到其他领域：复制该 skill 到 <code>~/.qoder/skills/<name>-domain/<\/code> 改语料，<strong>不要直接改上游安装版本<\/strong>（否则 <code>npx skills update<\/code> 会覆盖）<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone D <code>enable<\/code>：培训后巩固环节<\/li><li>K8s 客户环境排障前的知识准备（配合 <a href=\"#/zone-b-build/kubernetes-specialist\">kubernetes-specialist<\/a>）<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-d-handoff/shifu\">shifu<\/a> · <a href=\"#/zone-b-build/kubernetes-specialist\">kubernetes-specialist<\/a> · <a href=\"#/zone-d-handoff/podcast\">podcast<\/a><\/p>"}, {"route": "zone-d-handoff/visual-deck-builder", "zone": "Zone D · Handoff", "zoneId": "zone-d-handoff", "status": "✅", "html": "<h1>visual-deck-builder<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（research-copilot 插件 v1.0.0）· 类型：演示生成 · FDE 位点：Zone D present<\/div>\n<h2>能做什么<\/h2>\n<p><strong>图像模型驱动<\/strong>的 PPT 生产：从主题/材料/论文/报告/既有幻灯片出发，每页先由图像模型生成高质量整页幻灯片图，再打包成 PPTX，并产出 manifest、预览与证据化 QA 报告；需要时可选\"分层可编辑重建\"。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>给客户的汇报 deck 要<strong>视觉冲击力<\/strong>（方案汇报、成果展示、现场复盘会）<\/li><li>有大量素材（文档、数据、截图）需要在半天内变成一份成型的 deck<\/li><li>需要可追溯的 deck 质量检查（它自带 QA 与证据链，比手搓 PPT 更可审计）<\/li><\/ul>\n<p><strong>不用于<\/strong>：需要逐字精确可编辑的正式商务模板（客户有固定 PPT 模板时 → <a href=\"#/zone-d-handoff/pptx\">pptx<\/a>）；代码讲解型技术分享（→ <a href=\"#/zone-d-handoff/slidev\">slidev<\/a>）；学术答辩专用流程（research-copilot 内有更窄的学术 skill）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>输入材料质量决定上限：先给结构化大纲 + 关键数据表，再让它出图，否则页面会很\"好看但空洞\"<\/li><li>数字与结论必须回源核对：图像模型可能把图表画得\"看起来对\"，交付前逐个数字比对（这类错误在客户现场代价极高）<\/li><li>客户品牌模板场景不要用它硬套——改走 <a href=\"#/zone-d-handoff/pptx\">pptx<\/a> 在模板上填内容<\/li><li>QA 报告与预览留档，作为\"这版 deck 已经检查过\"的记录<\/li><li>生成成本高（图像模型逐页出图），先出 3 页样张确认风格再全量<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone D <code>handoff<\/code>：结项汇报 deck<\/li><li>Zone A：售前方案 deck（配合 <a href=\"#/zone-a-pre-engagement/firecrawl-search\">firecrawl-search<\/a> 的行业素材）<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-d-handoff/pptx\">pptx<\/a> · <a href=\"#/zone-d-handoff/slidev\">slidev<\/a> · <a href=\"#/zone-d-handoff/notion-infographic\">notion-infographic<\/a><\/p>"}, {"route": "zone-d-handoff/pptx", "zone": "Zone D · Handoff", "zoneId": "zone-d-handoff", "status": "✅", "html": "<h1>pptx<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（<code>~/.qoder/skills/pptx<\/code>，文档四件套之一）· 类型：文件操作 · FDE 位点：Zone D present<\/div>\n<h2>能做什么<\/h2>\n<p>PowerPoint 文件级操作：从零建 deck、改现有内容、管理版式与模板、插入备注与批注、解析既有演示文稿（提取文本/结构）。是\"精确可控可编辑\"的那条路。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>客户给定了 <strong>PPT 模板/VI 规范<\/strong>，必须在模板上填内容<\/li><li>需要修改别人给的 deck（补数据、改结论、加附录）<\/li><li>需要读取客户既有 PPT 做现状分析（培训材料、方案历史版本）<\/li><li>交付物要客户后续自己改（必须是真幻灯片，不是整页图片）<\/li><\/ul>\n<p><strong>不用于<\/strong>：追求视觉冲击且无模板约束（→ <a href=\"#/zone-d-handoff/visual-deck-builder\">visual-deck-builder<\/a>）；开发者技术分享（→ <a href=\"#/zone-d-handoff/slidev\">slidev<\/a>）；只需打印分发（→ <a href=\"#/zone-d-handoff/make-pdf\">make-pdf<\/a>）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>图表优先用<strong>数据驱动<\/strong>（从 xlsx/CSV 生成后插入），避免手工贴截图数字（无法随数据更新）<\/li><li>中文字体与客户机版本要检查；导出前用\"兼容性检查\"避免字体丢失<\/li><li>每页一个结论，标题写\"结论句\"而不是\"话题词\"——汇报效率差别极大<\/li><li>版本命名 + 附录页放数据来源，防止会后扯皮（\"这页的数字哪来的\"）<\/li><li>与 <a href=\"#/zone-a-pre-engagement/xlsx\">xlsx<\/a> 组合：指标数据出表 → 图表进 deck，保持同一份来源<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone D：结项/验收/培训 deck（客户模板场景）<\/li><li>Zone A：售前提案（复用既有 deck 改造）<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-d-handoff/visual-deck-builder\">visual-deck-builder<\/a> · <a href=\"#/zone-d-handoff/slidev\">slidev<\/a> · <a href=\"#/zone-a-pre-engagement/xlsx\">xlsx<\/a><\/p>"}, {"route": "zone-d-handoff/slidev", "zone": "Zone D · Handoff", "zoneId": "zone-d-handoff", "status": "✅", "html": "<h1>slidev<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（slidev 插件 v1.0.0）· 类型：演示/开发者工具 · FDE 位点：Zone D present + 对内分享<\/div>\n<h2>能做什么<\/h2>\n<p>用 Markdown + Vue 组件写<strong>面向开发者的 web 幻灯<\/strong>：代码高亮与可运行代码块、动画、演讲者模式、组件嵌入、导出 PDF/PPTX/图片、可托管为站点。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>技术型分享：架构讲解、代码走查、培训 workshop（内容以代码/命令为主）<\/li><li>希望 deck 进版本库、和文档同源（Markdown 可 diff、可 review）<\/li><li>需要把同一份材料既当演示又当文档站点<\/li><\/ul>\n<p><strong>不用于<\/strong>：客户方用 PowerPoint 流程且要交 .pptx 源件（→ <a href=\"#/zone-d-handoff/pptx\">pptx<\/a>，Slidev 导出的 pptx 可编辑性有限）；视觉冲击型汇报（→ <a href=\"#/zone-d-handoff/visual-deck-builder\">visual-deck-builder<\/a>）；无技术背景的听众为主的场合（交互与代码块反而是干扰）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>代码块只放<strong>关键几行<\/strong>（<code>line-numbers<\/code>、<code>highlight<\/code> 配合），整屏代码在投影上不可读<\/li><li>现场投影前验证字体与终端渲染（Slidev 依赖浏览器，客户机上可能缺字体/不能联网取资源）<\/li><li>离线/内网：提前 <code>npm i<\/code> 与资源本地化，别在现场装包<\/li><li>导出留双份：演示用网页版 + 归档用 PDF（<code>export<\/code>）<\/li><li>与 <a href=\"#/zone-d-handoff/document-release\">document-release<\/a> 协作：deck 里的架构数字要与文档同源，改一处就要同步<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone D：技术交接与培训 deck（客户工程师受众）<\/li><li>对内：架构评审材料（配合 <code>docs/architecture-model/<\/code> 的图）<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-d-handoff/pptx\">pptx<\/a> · <a href=\"#/zone-d-handoff/visual-deck-builder\">visual-deck-builder<\/a> · <a href=\"#/zone-d-handoff/make-pdf\">make-pdf<\/a><\/p>"}, {"route": "zone-d-handoff/notion-infographic", "zone": "Zone D · Handoff", "zoneId": "zone-d-handoff", "status": "✅", "html": "<h1>notion-infographic<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（<code>~/.qoder/skills/notion-infographic<\/code>）· 类型：视觉化 · FDE 位点：Zone D present / 传播<\/div>\n<h2>能做什么<\/h2>\n<p>读参考文稿，批量生成 <strong>Notion 风格松弛感手绘信息图组图<\/strong>，适合社交媒体/内部传播的分发单元（一张一个要点）。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>把方案/成果/流程变成一组易传播的图（内部宣导、客户高层\"看图 30 秒\"场景）<\/li><li>公众号/内网帖子需要统一视觉的系列配图<\/li><li>长文档需要\"图解摘要\"降低阅读门槛<\/li><\/ul>\n<p><strong>不用于<\/strong>：需要精确数据与坐标的正式图表（用 <a href=\"#/zone-b-build/frontend-design\">data-visualization 类工具<\/a> 或 matplotlib）；工程图纸/架构图（→ <a href=\"#/zone-a-pre-engagement/drawio\">drawio<\/a> / <a href=\"#/zone-a-pre-engagement/architecture-communicator\">architecture-communicator<\/a>）；正式验收材料（风格过于随意）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>输入文稿先分点（每点一张图），否则组图信息密度失衡<\/li><li>风格一次定锚：先出 2~3 张确认风格，再批量，避免整批返工<\/li><li>严格禁止\"编造数据\"：图上所有数字必须来自源文稿，逐张核对<\/li><li>中英混排的手绘字体容易失真，专有名词保留原文并检查字形<\/li><li>版权与品牌：客户 logo/受版权字体不要进传播素材<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone D：交付成果的可视化传播（内部知识库/客户宣导）<\/li><li>与 <a href=\"#/zone-d-handoff/podcast\">podcast<\/a> 组成\"同一份文档 → 多种传播形态\"<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-d-handoff/shifu\">shifu<\/a> · <a href=\"#/zone-d-handoff/visual-deck-builder\">visual-deck-builder<\/a> · <a href=\"#/zone-a-pre-engagement/drawio\">drawio<\/a><\/p>"}, {"route": "zone-d-handoff/podcast", "zone": "Zone D · Handoff", "zoneId": "zone-d-handoff", "status": "✅", "html": "<h1>podcast<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（<code>~/.qoder/skills/podcast<\/code>）· 类型：音频生成 · FDE 位点：Zone D enable / 传播<\/div>\n<h2>能做什么<\/h2>\n<p>把知识库目录下的 Markdown 文档提炼成<strong>双人对话播客稿<\/strong>并合成 MP3：指定知识域目录（如 <code>05-网络/<\/code>）即可产出一期节目，适合碎片时间吸收。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>交接后让客户工程师在通勤路上把系统背景\"听会\"<\/li><li>长文档（SOP、行业背景、故障复盘）转化为可口头传播的形态<\/li><li>团队内部知识广播（每周一条 10 分钟）<\/li><\/ul>\n<p><strong>不用于<\/strong>：需要精确数字与图形材料的学习（听觉不擅长，走 <a href=\"#/zone-d-handoff/shifu\">shifu<\/a> 或图表）；对外正式发布（未审校的口播稿有风险）；把 PPT 变音频（先转成文稿）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>生成前确认文稿的\"可朗读性\"：表格、代码、URL 要在稿子里改写为口语，否则听感灾难<\/li><li><strong>术语与数字必须人工审校<\/strong>：TTS 读错专有名词/单位（如 \"k8s\"、\"ms\"、\"OPC UA\"）会直接误导学习者<\/li><li>敏感信息过滤：客户名、实例 ID、内网地址一律不得进音频（音频容易被转发，泄漏面比文档大）<\/li><li>存档管理：MP3 体积大，不要提交进 git；放对象存储/网盘，仓库里只留播客稿 Markdown<\/li><li>组合用法：同一份文档 → <a href=\"#/zone-d-handoff/podcast\">podcast<\/a>（听）+ <a href=\"#/zone-d-handoff/notion-infographic\">notion-infographic<\/a>（看）+ <a href=\"#/zone-d-handoff/remember\">remember<\/a>（记），三种通道覆盖不同学习习惯<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone D <code>enable<\/code>：培训材料的多形态输出<\/li><li><code>.fde_scope/skills/<\/code> 沉淀经验的对内广播<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-d-handoff/shifu\">shifu<\/a> · <a href=\"#/zone-d-handoff/notion-infographic\">notion-infographic<\/a> · <a href=\"#/zone-a-pre-engagement/qmind-knowledge\">qmind-knowledge<\/a><\/p>"}, {"route": "cross-cutting/skill-discovery", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "✅", "html": "<h1>find-skills<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（<code>~/.qoder/skills/find-skills<\/code>）· 类型：元能力/skill 发现 · FDE 位点：横切<br>本 catalog 的 📦 条目全部经由它检索（<code>npx skills find<\/code>），registry 站点：https://skills.sh/<\/div>\n<h2>能做什么<\/h2>\n<p>把\"我需要一个能力\"变成\"找到并安装对的 skill\"：<code>npx skills find <query><\/code> 检索开放 skill 生态、<code>npx skills add <owner/repo@skill> --directory ~/.qoder/skills -y<\/code> 安装、<code>npx skills check<\/code> / <code>update<\/code> 做版本巡检；无结果时提示用 <code>npx skills init<\/code> 自建。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>遇到\"这件事我该怎么做\"且明显属于通用重复任务（测试、部署、评审、文档、设计）<\/li><li>每次季度巡检：确认已装项是否有更新、是否有更优替代<\/li><li>建/维护本手册库时：核实 registry 真实条目名与热度（本 catalog 已用它更正过 4 处失真条目名）<\/li><\/ul>\n<p><strong>不用于<\/strong>：已经知道要装什么（直接 <code>add<\/code>）；评估质量与安全（→ <a href=\"#/cross-cutting/skill-criticagent\">skill-criticagent<\/a> / <a href=\"#/cross-cutting/mcp-criticagent\">mcp-criticagent<\/a>）；生态内没有时（→ <a href=\"#/cross-cutting/create-skill\">create-skill<\/a> 自建）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>检索词要具体：\"docker deploy\" 优于 \"deploy\"；同义词多试几组（evaluation / evals / benchmark）<\/li><li><strong>以热度 + 官方 org + 安全审计三项做初筛<\/strong>，再进 critic 门禁：热度高不代表适合本项目<\/li><li>安装目录固定在 <code>~/.qoder/skills<\/code>，避免多处安装导致同名 skill 路由冲突<\/li><li>装完立刻在本 catalog 建档（五段模板）+ 更新 README 索引——否则一个月后没人记得为什么装它<\/li><li>同名条目要甄别来源（例：<code>evaluating-llms-harness<\/code> 有 firecrawl 与第三方两个同名版本）<\/li><li>巡检节奏：季度一次 <code>npx skills check<\/code>，只处理真正在用的 skill，不追求\"全部最新\"<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>横切：本手册库的维护入口；Zone B/C/D 每个阶段的能力补齐都从它开始<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/cross-cutting/skill-criticagent\">skill-criticagent<\/a> · <a href=\"#/cross-cutting/create-skill\">create-skill<\/a> · <a href=\"#/cross-cutting/create-plugin\">create-plugin<\/a><\/p>"}, {"route": "cross-cutting/create-skill", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "✅", "html": "<h1>create-skill<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（Qoder 内置 skill）· 类型：元能力/skill 工程 · FDE 位点：横切<\/div>\n<h2>能做什么<\/h2>\n<p>在当前工作区创建新的 Agent Skill：生成标准 <code>SKILL.md<\/code> 骨架（name/description/触发词/工作流/质量门），并放到正确的 skills 目录，使新流程能被后续会话自动检索与复用。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>同一类现场任务做了三次以上，值得固化成 skill（例：客户环境体检、OPC UA 连通性检查、交付验收 checklist）<\/li><li>想把个人经验从\"对话记忆\"升级为\"仓库资产\"<\/li><li>团队要统一某个流程的执行方式<\/li><\/ul>\n<p><strong>不用于<\/strong>：写一次性脚本（直接写代码）；知识性内容整理（走 <code>.fde_scope/skills/<\/code> 文件库或 <a href=\"#/zone-a-pre-engagement/qmind-knowledge\">qmind-knowledge<\/a>）；把 skill 打包分发（→ <a href=\"#/cross-cutting/create-plugin\">create-plugin<\/a>）；写作规范与部署校验（→ <a href=\"#/cross-cutting/writing-skills\">writing-skills<\/a>）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li><strong>description 决定生死<\/strong>：写清\"做什么 + 何时用 + 触发词\"，agent 只靠它路由；模糊描述等于没装<\/li><li>一个 skill 只解决一类问题；宽泛的\"万能交付 skill\"不会被触发也不可维护<\/li><li>正文控制在几百行内，细节放 <code>references/<\/code> 按需加载（ progressive disclosure）<\/li><li>写完必须真跑一次同类任务验证触发与产出，再提交（未验证的 skill 是负资产）<\/li><li>装自己的 skill 前先过 <a href=\"#/cross-cutting/skill-criticagent\">skill-criticagent<\/a>——用同一把尺子量自己<\/li><li>归属规则：通用工程流程 → <code>~/.qoder/skills/<\/code>；项目专属 → 仓库内项目级 skills，避免污染其他项目路由<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>横切：把 FDE 现场 SOP 片段沉淀为可复用 skill<\/li><li>与 <a href=\"#/cross-cutting/skill-discovery\">find-skills<\/a> 形成\"找 → 评 → 装 → 造\"闭环<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/cross-cutting/writing-skills\">writing-skills<\/a> · <a href=\"#/cross-cutting/create-plugin\">create-plugin<\/a> · <a href=\"#/cross-cutting/skill-criticagent\">skill-criticagent<\/a><\/p>"}, {"route": "cross-cutting/writing-skills", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "✅", "html": "<h1>writing-skills<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（superpowers 插件 v5.1.0）· 类型：元能力/skill 质量 · FDE 位点：横切<\/div>\n<h2>能做什么<\/h2>\n<p>按 skill 工程规范<strong>编写与改进 skill 并验证部署<\/strong>：结构（frontmatter 触发描述、渐进披露、反模式清单）、写作纪律（先写失败案例再写指令）、部署后校验（新装的 skill 是否真的被路由到）。与 <a href=\"#/cross-cutting/create-skill\">create-skill<\/a> 的区别：create-skill 负责\"建骨架\"，writing-skills 负责\"写得好且真的生效\"。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>自己写/改 skill，特别是发现\"装了却没被触发\"<\/li><li>把现场 SOP 转成 agent 可执行指令时，需要写作方法约束<\/li><li>评审别人（含 AI）生成的 skill 是否只是漂亮废话<\/li><\/ul>\n<p><strong>不用于<\/strong>：评估<strong>外部<\/strong>待装 skill 的质量与安全（→ <a href=\"#/cross-cutting/skill-criticagent\">skill-criticagent<\/a>）；创建插件包（→ <a href=\"#/cross-cutting/create-plugin\">create-plugin<\/a>）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>description 要包含\"不使用边界\"——本 catalog 每页的 <strong>不用于<\/strong> 段就是这个思路的来源<\/li><li>指令写成可验证的动作（\"跑 X 命令并检查输出含 Y\"），不写成愿望（\"确保质量\"）<\/li><li>用真实任务回归：写完后拿一个历史任务重跑，对比有无 skill 的产出差异<\/li><li>一个 skill 内的引用文件按需加载，别把所有参考塞进主文件（上下文成本）<\/li><li>与 <a href=\"#/cross-cutting/skill-criticagent\">skill-criticagent<\/a> 配合：先自评（writing）→ 再外评（critic）→ 才安装/分发<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>横切：fde-scope 现场沉淀 skill 的写作标准<\/li><li><code>.fde_scope/skills/<\/code> 文件库与外部 skill 的格式对齐参考<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/cross-cutting/create-skill\">create-skill<\/a> · <a href=\"#/cross-cutting/skill-criticagent\">skill-criticagent<\/a> · <a href=\"#/cross-cutting/create-plugin\">create-plugin<\/a><\/p>"}, {"route": "cross-cutting/create-plugin", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "✅", "html": "<h1>create-plugin<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（qoder-create-plugin，Qoder 内置插件包）· 类型：元能力/分发 · FDE 位点：横切<\/div>\n<h2>能做什么<\/h2>\n<p>把外部或本地来源转成<strong>可分发的 Qoder 原生插件<\/strong>：GitHub 上的 SKILL.md、本地 skill 目录、Qoder Marketplace URL、skills.sh 条目、粘贴的 skill 内容、已有类插件目录 → 生成规范的插件结构（skills/ + 元数据），供团队安装。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>团队要统一使用某套流程：把自建 skills 打包成一个插件，一条命令装齐<\/li><li>想把生态里的单个 skill 整理成受控版本分发（而不是各自 <code>npx skills add<\/code>）<\/li><li>交付结束时把现场沉淀（连接器配置、SOP checklist）打包给客户复用<\/li><\/ul>\n<p><strong>不用于<\/strong>：只给自己用（放 <code>~/.qoder/skills/<\/code> 就够）；写 skill 内容本身（→ <a href=\"#/cross-cutting/writing-skills\">writing-skills<\/a>）；评估外部插件（→ <a href=\"#/cross-cutting/skill-criticagent\">skill-criticagent<\/a>）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>打包前先逐个确认来源 skill 的 LICENSE 与再分发条款（生态里既有 MIT 也有 proprietary，例：本地 <code>pptx<\/code> skill 标的是 Proprietary）；不确定就不要打进插件<\/li><li>一个插件一个主题（如 \"fde-delivery-toolkit\"），不要把无关 skill 塞一起，否则触发互相污染<\/li><li>版本与变更说明要写：插件一旦发给团队，升级成本远高于新建<\/li><li>打包后必须做<strong>安装冒烟<\/strong>：新机器安装 → 触发一次代表性任务 → 确认路由正确（架构可视化插件的 <code>architecture-health<\/code> 里也有同类 skill 激活冒烟要求）<\/li><li>客户交付物里的插件要脱敏：清掉客户名、内网地址、真实凭据样例<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>横切：把 FDE 交付工具箱沉淀为团队插件<\/li><li>Zone D：客户交接时可交付\"能力包\"而不只是文档<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/cross-cutting/create-skill\">create-skill<\/a> · <a href=\"#/cross-cutting/writing-skills\">writing-skills<\/a> · <a href=\"#/cross-cutting/skill-criticagent\">skill-criticagent<\/a><\/p>"}, {"route": "cross-cutting/skill-criticagent", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "✅", "html": "<h1>skill-criticagent<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（research-copilot 插件 v1.0.0）· 类型：元能力/门禁 · FDE 位点：横切（所有 📦 安装前置）<\/div>\n<h2>能做什么<\/h2>\n<p>评估一个 Agent Skill（SKILL.md 目录）到底\"好不好、能不能装\"：<strong>规范合规 + 安全扫描<\/strong>、带/不带该 skill 的行为对比、description 触发测试，最后给出 <strong>安装 / 先修 / 拒绝<\/strong> 的明确结论。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>本 catalog 的强制门禁：任何 📦 项安装前跑一次，结论回填该页\"最佳实践\"段<\/li><li>收到别人推荐的 skill（GitHub 链接、marketplace URL）想快速判断值不值得装<\/li><li>自查自写 skill 的触发质量（和 <a href=\"#/cross-cutting/writing-skills\">writing-skills<\/a> 互补：writing 管写作，critic 管判定）<\/li><li>判断 skill 是否真的带来增益（with/without 对比是唯一可信证据）<\/li><\/ul>\n<p><strong>不用于<\/strong>：评估 MCP server（→ <a href=\"#/cross-cutting/mcp-criticagent\">mcp-criticagent<\/a>）；代码评审（→ <a href=\"#/cross-cutting/code-review\">code-review<\/a>）；架构评估（→ <a href=\"#/cross-cutting/architecture-visualization-suite\">risk-quality-reviewer<\/a>）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>评估三件套留档：verdict + 触发测试结果 + with/without 差异，写在对应 catalog 页面里，不要只留在对话<\/li><li>安全扫描不通过直接拒（不要\"先用着看\"）；注意 skills.sh 页面的三项审计（Agent Trust Hub / Socket / Snyk）与本 skill 的结论互相印证<\/li><li>触发测试要覆盖<strong>误触发<\/strong>：用一个语义相近但不应触发的任务验证边界<\/li><li>with/without 对比要用真实交付任务（本仓库场景：连接器接入、评估报告），玩具任务测不出价值<\/li><li>同一功能的多个候选（如 runbook 类）要横向比一次，选一个装，避免重叠路由<\/li><li>社区个人源 + 低热度 + 审计缺失 = 默认拒绝，除非有明确不可替代收益<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>横切：catalog 维护规约第 3 条的执行工具<\/li><li>当前待评估清单：所有 📦 项（<code>mqtt-development<\/code>、<code>kubernetes-specialist<\/code>、<code>docker-build-deploy<\/code>、<code>vllm-ascend<\/code>、<code>sre-runbooks<\/code>、<code>rag-agent-builder<\/code> 等）<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/cross-cutting/mcp-criticagent\">mcp-criticagent<\/a> · <a href=\"#/cross-cutting/skill-discovery\">find-skills<\/a> · <a href=\"#/cross-cutting/writing-skills\">writing-skills<\/a><\/p>"}, {"route": "cross-cutting/mcp-criticagent", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "✅", "html": "<h1>mcp-criticagent<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（research-copilot 插件 v1.0.0）· 类型：元能力/门禁 · FDE 位点：横切（MCP 安装前置）<\/div>\n<h2>能做什么<\/h2>\n<p>端到端评估 <strong>MCP server / tool<\/strong>：从 GitHub URL 或 npm 包部署、测协议通信与工具调用、跑 AI 生成的智能测试、并给出仓库可持续性与热度评分。回答\"这个 MCP 到底能不能用、值不值得接\"。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>客户/团队要接一个新 MCP server（数据库、监控、内部平台）前的验收<\/li><li>MCP 在本地起不来、工具调用失败，需要区分是 server 问题还是客户端配置<\/li><li>对比同类 MCP（例如两种 Sentry/两种数据库接入）选一个长期依赖<\/li><li>本项目相关：评估 QwenPaw 宿主可选 MCP 扩展（见 <a href=\"#/zone-a-pre-engagement/qmind-knowledge\">qmind-mcp<\/a> 的 MCP Server 模式）<\/li><\/ul>\n<p><strong>不用于<\/strong>：评估 skill（→ <a href=\"#/cross-cutting/skill-criticagent\">skill-criticagent<\/a>）；MCP 的线上故障排障（→ <a href=\"#/zone-c-operationalization/troubleshooting\">troubleshooting<\/a>）；写 MCP server（用 SDK 直接开发）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>先在<strong>隔离环境<\/strong>部署评估，再进个人/团队配置：MCP server 会拿到工具调用权限，等于给 agent 手<\/li><li>重点看三件事：凭据处理方式（是否明文/env）、工具副作用（有没有写操作）、错误语义是否可诊断<\/li><li>智能测试要人工补一轮\"危险用例\"：让它删/改数据的工具必须在评估阶段就发现<\/li><li>评估结论进 catalog：为将来要用的 MCP 建页（本手册库目前以 skill 为主，MCP 只在 architecture-visualization 等插件里出现过）<\/li><li>版本锁定：MCP 协议与 server 版本演进快，评估通过的版本要记进页面头部<\/li><li>与交付场景对齐：现场气隙环境通常禁止外连 MCP，评估通过也要确认网络策略可行性<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>横切：MCP 接入的唯一入口评估<\/li><li>Zone B deploy：客户平台 MCP（数据库/监控）接入前的把关<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/cross-cutting/skill-criticagent\">skill-criticagent<\/a> · <a href=\"#/zone-c-operationalization/troubleshooting\">troubleshooting<\/a> · <a href=\"#/zone-a-pre-engagement/qmind-knowledge\">qmind-knowledge<\/a><\/p>"}, {"route": "cross-cutting/architecture-visualization-suite", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "✅", "html": "<h1>architecture-visualization 套件（架构可视化 13 件套）<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（Quest Marketplace 插件 v0.1.0，无 MCP / 无 commands / 无 agents）· 类型：套件档案 · FDE 位点：横切（Zone A~D 全用）<br>本地路径：<code>~/.qoder/plugins/cache/qoder-marketplace/architecture-visualization/0.1.0<\/code><\/div>\n<h2>能做什么<\/h2>\n<p>证据优先的架构理解/建模/评审/演进工具箱。<strong>三层 MECE 结构<\/strong>：<\/p>\n<table><thead><tr><th>层<\/th><th>Skill<\/th><th>回答的问题<\/th><\/tr><\/thead><tbody><tr><td>路由<\/td><td><code>explore<\/code><\/td><td>宽泛架构请求 → 选最小技能集<\/td><\/tr><tr><td>场景<\/td><td><code>system-modeler<\/code><\/td><td>系统现在长什么样（结构/边界）<\/td><\/tr><tr><td>场景<\/td><td><code>flow-visualizer<\/code><\/td><td>业务/调用/数据/事件怎么流动<\/td><\/tr><tr><td>场景<\/td><td><code>dependency-impact-analyzer<\/code><\/td><td>谁依赖谁、改动影响什么（blast radius）<\/td><\/tr><tr><td>场景<\/td><td><code>deployment-topology-analyzer<\/code><\/td><td>在哪运行、如何发布运维<\/td><\/tr><tr><td>场景<\/td><td><code>evolution-planner<\/code><\/td><td>该怎么演进、为什么（ADR + 迁移切片）<\/td><\/tr><tr><td>场景<\/td><td><code>risk-quality-reviewer<\/code><\/td><td>风险够不够低、质量够不够（含业务适配度）<\/td><\/tr><tr><td>场景<\/td><td><code>legacy-system-visualizer<\/code><\/td><td>低证据老系统如何理解与安全迁移切片<\/td><\/tr><tr><td>场景<\/td><td><code>architecture-communicator<\/code><\/td><td>向这个受众怎么讲（客户高管 vs 车间）<\/td><\/tr><tr><td>场景<\/td><td><code>architecture-health<\/code><\/td><td>图/文档是否新鲜、可追溯（含 skill 激活冒烟）<\/td><\/tr><tr><td>基础<\/td><td><code>c4model<\/code><\/td><td>Structurizr DSL / C4 视图<\/td><\/tr><tr><td>基础<\/td><td><code>graphviz<\/code><\/td><td>密集关系 DOT（依赖/血缘/风险/影响）<\/td><\/tr><tr><td>基础<\/td><td><code>drawio<\/code><\/td><td>可编辑交付格式（仅显式请求时）<\/td><\/tr><\/tbody><\/table>\n<h2>何时使用（按 FDE 阶段）<\/h2>\n<ul><li>Zone A 现场调研 → <code>system-modeler<\/code>（客户系统摸底）+ <code>architecture-communicator<\/code>（对客户讲）<\/li><li>Zone B 实施 → <code>dependency-impact-analyzer<\/code>（改动前评估）+ <code>flow-visualizer<\/code>（数据链路）<\/li><li>Zone C 运维 → <code>deployment-topology-analyzer<\/code>（拓扑/发布）+ <code>risk-quality-reviewer<\/code>（上线风险）<\/li><li>Zone D 交接 → <code>architecture-health<\/code>（文档与代码一致性）+ <code>drawio<\/code>（客户可编辑交付图）<\/li><li>遗留系统接手 → <code>legacy-system-visualizer<\/code> + <code>evolution-planner<\/code><\/li><\/ul>\n<h2>最佳实践<\/h2>\n<ul><li>**先 <code>explore<\/code> 再选场景**：直接点某个场景 skill 容易产出不匹配问题的视图<\/li><li>视图分级不要越界：L1 上下文 / L2 容器 / L3 代码 / L4 运行时 / L5 演进；问错层就是噪声<\/li><li>每个节点/边要有 <code>sourceRefs<\/code>，低置信度必须显式标注（该插件的硬门禁，也是它最有价值的纪律）<\/li><li>按需加载 references（<code>architecture-contract.md<\/code>、<code>architecture-evidence-model.md<\/code>、<code>diagram-output-formats.md<\/code>、<code>structurizr-canvas-pipeline.md<\/code>），别一次读全部<\/li><li>边界纪律：本套件的 skill 会互相路由——风险发现交 <code>risk-quality-reviewer<\/code>，修复方案交 <code>evolution-planner<\/code>，新鲜度交 <code>architecture-health<\/code>，不要指望一张图解决所有问题<\/li><li>格式选择：C4 用 DSL、密集关系用 DOT、轻量内联用 Mermaid（适合直接写在 Markdown 里的小图）<\/li><\/ul>\n<h2>项目应用位点（已发生）<\/h2>\n<ul><li><code>docs/architecture-model/<\/code>：<code>fde-scope.structurizr.dsl<\/code>（L1/L2）、<code>module-dependency.dot<\/code>（L3 模块依赖）、<code>system-model.evidence.md<\/code>、<code>system-model.summary.md<\/code><\/li><li><code>docs/architecture-model/architecture-health-report.md<\/code>：校验 <code>docs/architecture.md<\/code>，发现 1 处陈旧声明（flywheel 不导入 agentscope）+ 1 处拼写错误，已修正<\/li><li>待办：<code>docs/architecture.md<\/code> 只描述到 <code>web/app.py<\/code>，未包含 <code>pawapp/<\/code>（文档缺口）<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-a-pre-engagement/zread\">system-modeler 用法示例<\/a> · <a href=\"#/zone-a-pre-engagement/drawio\">drawio<\/a> · <a href=\"#/zone-d-handoff/document-release\">document-release<\/a><\/p>"}, {"route": "cross-cutting/code-review", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "✅", "html": "<h1>code-review<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（coderabbit 插件 v1.1.1，含 <code>code-review<\/code> + <code>autofix<\/code>；另有 superpowers 的 <code>requesting-code-review<\/code> / <code>receiving-code-review<\/code>）· 类型：质量门禁 · FDE 位点：横切（每次合并前）<\/div>\n<h2>能做什么<\/h2>\n<p>用 CodeRabbit 做 AI 代码评审（显式请求或 agent 自主触发均可），覆盖正确性、安全、质量与规范；<code>autofix<\/code> 可把评审意见落成修改。本项目另有 <code>docs/code_review_checklist.md<\/code> 作为人工清单。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>每次 PR / 合并前，尤其涉及连接器、gate 逻辑、凭据处理、部署配置<\/li><li>交付前最后一道质量门（客户会看代码的项目尤其重要）<\/li><li>agent 自主认为需要评审时（该 skill 是默认评审入口）<\/li><\/ul>\n<p><strong>不用于<\/strong>：架构层面的取舍判断（→ <a href=\"#/cross-cutting/architecture-visualization-suite\">risk-quality-reviewer<\/a>）；文档一致性（→ <a href=\"#/cross-cutting/architecture-visualization-suite\">architecture-health<\/a>）；纯格式化（用 ruff/black，别浪费评审额度）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>三层不重复：lint/typecheck 机械层 → AI 评审模型推理层 → 人工业务与安全判断（<code>docs/code_review_checklist.md<\/code> 就是人工层）<\/li><li>小 diff 才有好评审：大改动先拆 PR，评审质量与 diff 大小反比<\/li><li>提供上下文：让评审知道业务约束（工业场景的安全边界、气隙限制），否则会收到大量不适用建议<\/li><li><code>autofix<\/code> 只用于低风险项（命名、类型、简单修复）；涉及 gate 语义、凭据、连接器的建议必须人工确认<\/li><li>反馈要具体可操作，禁止\"建议优化\"式空话；不认可的规则要在配置里关掉而不是每次忽略<\/li><li>与 superpowers 的 <code>receiving-code-review<\/code> 配合：收到意见先验证再改，避免\"评审说啥改啥\"<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>横切：AGENTS 级流程（本仓库为 <code>docs/code_review_checklist.md<\/code>）<\/li><li>每次交付前：Zone B → Zone C 的门禁之一<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/cross-cutting/security-scan\">security-scan<\/a> · <a href=\"#/cross-cutting/gstack-suite\">gstack-suite<\/a> · <a href=\"#/cross-cutting/using-superpowers-family\">using-superpowers-family<\/a><\/p>"}, {"route": "cross-cutting/security-scan", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "✅", "html": "<h1>security-scan<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（Qoder 内置插件包 qoder-bundler/security-scan）· 类型：安全门禁 · FDE 位点：横切（推送/发布前）<\/div>\n<h2>能做什么<\/h2>\n<p>Qoder 安全扫描：全仓库或指定路径的云端扫描，分 <strong>L2 轻量<\/strong> 与 <strong>L3 深度<\/strong> 两档；在 push / 开 PR / 发布 / 部署等\"把手提交给外部\"的节点上会被要求先提供 L3 深度评审。修复批准需单独确认（不会因上次扫描通过而默认授权）。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>任何 <code>git push<\/code>、开 PR/MR、release、deploy 之前<\/li><li>交付包出件前的最后一道安全体检（客户安全部门常要求）<\/li><li>新增连接器/凭据处理/子进程执行（<code>fde_scope/integrations/subprocess_runner.py<\/code>）之后<\/li><\/ul>\n<p><strong>不用于<\/strong>：替代 <a href=\"#/cross-cutting/code-review\">code-review<\/a> 的逻辑评审；渗透测试与红队（那是人工/专业服务）；依赖许可证合规审查（另有工具链）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>档位选择：日常小改动 L2；涉及认证、凭据、外部输入、子进程、部署配置一律 L3<\/li><li>扫描结果是<strong>候选<\/strong>，不是事实：逐条判定真/误报，误报要在项目里记录理由并做规则抑制<\/li><li>交付敏感项优先级：硬编码凭据 > 越权/路径穿越 > 反序列化/子进程注入 > 依赖漏洞（本仓库靠环境变量注入密钥，扫描最该确认的是\"没有绕过 env 的地方\"）<\/li><li>不把扫描报告原文交给客户前先看是否含内部路径/凭据样例，必要时脱敏<\/li><li>与 fde-scope gate 结合：安全类发现应写入对应阶段的 gate 证据，而不是散在对话里<\/li><li>一次修复只做一类改动，便于回归与审计追溯<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>横切：Zone B→C 发布门禁、Zone D 交付前体检<\/li><li>制造业客户的功能安全/合规语境（配合 <code>engagement/gates/functional_safety.py<\/code>、<code>conformity.py<\/code>）<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/cross-cutting/code-review\">code-review<\/a> · <a href=\"#/cross-cutting/architecture-visualization-suite\">risk-quality-reviewer<\/a> · <a href=\"#/zone-b-build/kubernetes-specialist\">kubernetes-specialist<\/a><\/p>"}, {"route": "cross-cutting/writing-plans", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "✅", "html": "<h1>writing-plans<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（superpowers 插件 v5.1.0）· 类型：流程纪律 · FDE 位点：横切（多步任务开始前）<\/div>\n<h2>能做什么<\/h2>\n<p>在动手写代码之前产出<strong>可执行计划<\/strong>：任务分解、步骤粒度（2~5 分钟一步）、文件路径、验证点、回滚位点，并保存为文档供后续评审与执行（默认存 <code>docs/superpowers/plans/<\/code>）。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>任何 3 步以上的任务：新连接器、迁移、批量文档重构、现场部署脚本<\/li><li>需要客户/同事评审\"你打算怎么做\"的时候（交付场景里这是信任来源）<\/li><li>上下文即将切换或多轮会话推进同一任务（计划就是持久化的意图）<\/li><\/ul>\n<p><strong>不用于<\/strong>：单步小改动（直接做）；探索性原型（先 <a href=\"#/zone-a-pre-engagement/brainstorming\">brainstorming<\/a> 再回来）；已有计划要执行（→ <a href=\"#/cross-cutting/executing-plans\">executing-plans<\/a>）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>步骤要含<strong>验证方式<\/strong>（跑什么命令、期望什么输出），否则计划无法判定完成<\/li><li>计划里显式标注\"需要人工确认\"的节点（生产变更、客户环境写操作、删数据）<\/li><li>粒度宁细勿粗：粗计划在执行时会被迫即兴决策，即兴决策就是风险<\/li><li>与本项目工作流对齐：复杂任务用 Plan 模式产出 plan 文件，Agent 模式执行；跨会话续做时先读 plan<\/li><li>计划不是合同：发现假设错了要改计划并留痕，不要悄悄偏离<\/li><li>大计划要拆分：一次会话只推进一个可验证的子计划<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>横切：本 catalog 自身的建设就是按\"计划 → 分批执行 → 校验\"跑完的<\/li><li>Zone B：连接器/评估改造的实施计划载体<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/cross-cutting/executing-plans\">executing-plans<\/a> · <a href=\"#/zone-a-pre-engagement/brainstorming\">brainstorming<\/a> · <a href=\"#/cross-cutting/using-superpowers-family\">using-superpowers-family<\/a><\/p>"}, {"route": "cross-cutting/executing-plans", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "✅", "html": "<h1>executing-plans<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（superpowers 插件 v5.1.0）· 类型：流程纪律 · FDE 位点：横切<\/div>\n<h2>能做什么<\/h2>\n<p>按已评审的计划执行：<strong>分阶段推进 + 评审检查点<\/strong>（每完成一段就停下来核对，而不是闷头跑完），配合 todo 跟踪与验证门（完成前必须有证据）。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>有 <a href=\"#/cross-cutting/writing-plans\">writing-plans<\/a> 产出的计划文件要落地<\/li><li>任务跨越多个会话/多天（防止上下文丢失后重复或漏做）<\/li><li>需要在客户/团队面前展示进度与可验证性<\/li><\/ul>\n<p><strong>不用于<\/strong>：没有计划的小改动；探索性试验（会破坏\"按计划执行\"的前提）；纯调研（→ <a href=\"#/zone-a-pre-engagement/firecrawl-search\">research-*<\/a> 系列）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>执行前先把计划读进来再动手，别凭上一轮的记忆<\/li><li>每个检查点做三件事：跑验证命令 → 对照计划验收标准 → 更新状态（不要\"看起来做完了\"）<\/li><li>偏离计划要显式记录偏离原因和后续动作，不能悄悄改路线<\/li><li>遇到阻塞：先诊断再决定（换方案 / 问用户 / 停下），不要靠猜继续推进<\/li><li>与 <a href=\"#/cross-cutting/using-superpowers-family\">verification-before-completion<\/a> 绑定：没有验证证据不宣称完成——这条纪律在交付场景能救命<\/li><li>现场适用性：客户环境里的写操作阶段，检查点必须包含\"客户确认\"这一步<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>横切：多阶段交付任务（如连接器扩展 + 评估改造 + 文档同步）的执行框架<\/li><li>Zone C/D：分批推进交接清单时的进度控制器<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/cross-cutting/writing-plans\">writing-plans<\/a> · <a href=\"#/cross-cutting/using-superpowers-family\">using-superpowers-family<\/a> · <a href=\"#/cross-cutting/dispatching-parallel-agents\">dispatching-parallel-agents<\/a><\/p>"}, {"route": "cross-cutting/dispatching-parallel-agents", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "✅", "html": "<h1>dispatching-parallel-agents<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（superpowers 插件 v5.1.0）· 类型：并行调度 · FDE 位点：横切<\/div>\n<h2>能做什么<\/h2>\n<p>面对 2 个以上<strong>互相独立<\/strong>的任务，派发多个并行 agent 各管一个（各自完整上下文、互不污染），再汇总结果；也可用于探索/验证并行的场景。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>多个模块互不相关的改造（例：给 3 个 connector 分别补测试）<\/li><li>同时需要\"调研 A + 验证 B + 起草 C\"且三者无依赖<\/li><li>大范围代码库分析：分区并行比单线扫更快<\/li><\/ul>\n<p><strong>不用于<\/strong>：有共享状态/会改同一文件的任务（会冲突）；顺序依赖强的流程（→ <a href=\"#/cross-cutting/executing-plans\">executing-plans<\/a>）；需要保持推理链连续的单任务（拆分会丢上下文）；任何生产写操作（并行执行事故面更大）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>派发前三问：有重叠改动吗？有顺序依赖吗？结果能独立验收吗？任一为\"否\"就别并行<\/li><li>每个子任务给<strong>明确边界<\/strong>：只碰哪些文件、成功判据是什么、不要越界改别的<\/li><li>用 <a href=\"#/cross-cutting/using-git-worktrees\">using-git-worktrees<\/a> 做物理隔离，避免多 agent 抢同一工作树<\/li><li>汇总阶段人工过一遍：并行的产出风格/假设可能不一致，合并就是统一的机会<\/li><li>并行数控制在能审得过来的量（一般 2~3），并行不是越多越好<\/li><li>成本注意：每个并行 agent 都吃一份上下文，重复的检索会放大 token 消耗<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>横切：多场景（ticket / manufacturing）并行推进时的调度方式<\/li><li>本 catalog 建设即属可并行类型（按 Zone 分批、彼此无文件冲突）<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/cross-cutting/using-git-worktrees\">using-git-worktrees<\/a> · <a href=\"#/cross-cutting/executing-plans\">executing-plans<\/a> · <a href=\"#/cross-cutting/using-superpowers-family\">using-superpowers-family<\/a><\/p>"}, {"route": "cross-cutting/using-git-worktrees", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "✅", "html": "<h1>using-git-worktrees<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（<code>~/.qoder/skills/using-git-worktrees<\/code>，亦随 superpowers 插件 v5.1.0 分发）· 类型：工作区隔离 · FDE 位点：横切（Zone B 实施 / 横切调度）<\/div>\n<h2>能做什么<\/h2>\n<p>在动手改代码前，确保工作发生在一个<strong>隔离工作区<\/strong>：优先用平台原生 worktree 工具，没有才回退到 <code>git worktree add<\/code>。流程固定为「检测已有隔离 → 征求同意 → 建区 → 装依赖 → 跑基线测试」，核心原则是 <strong>先检测、再原生、最后 git 兜底，绝不跟 harness 抢管理<\/strong>。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>开始一项 feature 改造，而当前分支上有未收口的东西（客户现场分支尤其危险）<\/li><li>执行实现计划前（→ <a href=\"#/cross-cutting/executing-plans\">executing-plans<\/a>），需要一条干净的对照基线<\/li><li>并行派发多个 agent 改同一仓库（→ <a href=\"#/cross-cutting/dispatching-parallel-agents\">dispatching-parallel-agents<\/a>），必须有物理隔离<\/li><li>想在客户 repo 上做实验性修复，但不能污染交付分支<\/li><\/ul>\n<p><strong>不用于<\/strong>：只读分析、答疑、生成文档（不写代码就别开销）；已经在 linked worktree 里（先检测，别套娃再建一层）；submodule 内部——<code>GIT_DIR != GIT_COMMON<\/code> 在 submodule 里同样成立，要用 <code>git rev-parse --show-superproject-working-tree<\/code> 排除误判。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li><strong>同意优先<\/strong>：用户没表达过 worktree 偏好时，先问一句\"要不要建隔离工作区\"；已经声明过偏好就直接执行，不重复问<\/li><li>有原生工具（如 <code>EnterWorktree<\/code> / <code>/worktree<\/code> 命令 / <code>--worktree<\/code> 标志）就必须用它——手动 <code>git worktree add<\/code> 会造出 harness 看不见的\"幽灵状态\"，清理时踩坑<\/li><li>project-local 目录默认 <code>.worktrees/<\/code>；<strong>建之前强制验证被 gitignore<\/strong>（<code>git check-ignore -q .worktrees<\/code>），没忽略就先加 ignore 再提交——否则 worktree 内容会被误提交进仓库<\/li><li>建区后两件事不能省：装依赖（按 <code>package.json<\/code>/<code>pyproject.toml<\/code> 自动识别）+ 跑基线测试。<strong>基线红了就先报告，别带着失败继续改<\/strong>，否则无法区分\"我改坏的\"和\"本来就坏的\"<\/li><li>沙箱拒绝 <code>git worktree add<\/code> 时如实说明并就地工作，不要静默降级<\/li><li>收尾走 superpowers 的 <code>finishing-a-development-branch<\/code>（合并/PR/丢弃三选一，见 <a href=\"#/cross-cutting/using-superpowers-family\">using-superpowers-family<\/a>），别留一堆游离 worktree<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>fde-scope 分支纪律：<code>connectors/<\/code> 大改与 <code>pawapp/<\/code> 适配属于互不影响的两条线，适合各占一个 worktree，避免 <code>git status<\/code> 混污<\/li><li>客户现场：在客户 repo 上验证\"猜测型修复\"时先建 worktree，保证随时能整块丢弃——比 <code>git stash<\/code> 可靠，也不会因为 IDE 自动恢复而串味<\/li><li>本 catalog 的批量建档（按 Zone 分批写文件、互不冲突）就是典型的\"可并行 + 宜隔离\"任务<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/cross-cutting/executing-plans\">executing-plans<\/a> · <a href=\"#/cross-cutting/dispatching-parallel-agents\">dispatching-parallel-agents<\/a> · <a href=\"#/cross-cutting/writing-plans\">writing-plans<\/a> · <a href=\"#/cross-cutting/using-superpowers-family\">using-superpowers-family<\/a> · <a href=\"#/cross-cutting/gstack-suite\">gstack-suite<\/a>（<code>freeze<\/code>/<code>guard<\/code> 是另一类\"防误改\"机制）<\/p>"}, {"route": "cross-cutting/schedule", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "✅", "html": "<h1>schedule<\/h1>\n<div class=\"page-meta\">状态：✅ 平台内置（随 Qoder 客户端注入，<strong>不在<\/strong> <code>~/.qoder/skills/<\/code> 下，无本地文件可改）· 类型：定时/周期任务 · FDE 位点：横切（Zone C 运维节奏）<\/div>\n<h2>能做什么<\/h2>\n<p>用<strong>唯一一套调度引擎<\/strong>创建、更新、列出、推进、取消计划任务。四类语义：<\/p>\n<ul><li><code>at<\/code> —— 一次性，未来某具体时刻（必须给具体 datetime + 时区）<\/li><li><code>every<\/code> —— 固定间隔重复<\/li><li><code>cron<\/code> —— cron 表达式周期<\/li><li><code>until<\/code> —— 有明确终止条件的每日唤醒（\"直到 X 完成为止，每天看一次\"）<\/li><\/ul>\n<p>时间戳由模型自己换算，不接受\"明天下午吧\"这种模糊表达直接落库。<strong>关键纪律：任何\"稍后 / 定时 / 周期 / 到点做 X\"的需求都走这里，不要自己写 cron、不要造 in-agent 轮询循环。<\/strong><\/p>\n<h2>何时使用<\/h2>\n<ul><li>每日/每周交付节奏物：日报、周度指标巡检、gate 状态提醒<\/li><li>有终点的持续观察：客户系统上线后\"连续 7 天每天检查错误率，达标即停\"<\/li><li>把一次性任务变成周期巡检：季度 catalog 巡检（本手册库维护规约第 2 条）就该挂 <code>cron<\/code><\/li><li>长任务托管的本地触发端：到点后由 agent 去做，而不是人守着<\/li><\/ul>\n<p><strong>不用于<\/strong>：<strong>网页内容变更监测<\/strong> → <a href=\"#/zone-c-operationalization/firecrawl-monitor\">firecrawl-monitor<\/a>（它自带 diff + AI judge + webhook 告警，比\"定时抓一遍再人看\"省得多）；<strong>需要合上笔记本仍然继续跑<\/strong>的任务 → <a href=\"#/cross-cutting/cloud-agents\">cloud-agents<\/a>（本地调度依赖客户端在线，云端 agent 才与本机解耦）；单纯记录一个提醒（用日历，别占用 agent 额度）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li><strong>先问终止条件<\/strong>：周期任务默认要有退出标准和复查日期，否则就是永动的 token 黑洞<\/li><li>时区写死在任务里（客户在 UTC+8 还是 UTC+1 车间班表，直接影响告警是否有意义）<\/li><li>一个任务只做一件事、只发一份产出；把\"检查 + 判断 + 通知\"三段都写清，避免每次自由发挥<\/li><li>与 goal 的配合：创建成功后可以把当前目标置为 paused，唤醒时再恢复——不要同时挂多个语义重叠的周期任务<\/li><li>成本护栏：<code>every<\/code> 间隔小于 10 分钟要质疑必要性；巡检类宁可 cron 定时点，不要高频轮询<\/li><li>失败可见：任务产出要落到能被看见的地方（文档/表格/工单），而不是只在会话里说过一次<\/li><li>变更走 <code>update<\/code>，不要\"取消 + 新建\"，否则丢失历史执行记录<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone C：SLO 达成周期复查、飞轮数据回流（<code>fde_scope/flywheel/<\/code>）的定期 reflow<\/li><li>Zone A/B：gate 临期提醒（10 个 gate 中若干需要客户方书面回复，需要盯时限）<\/li><li>本 catalog 维护：季度 <code>npx skills check<\/code> 巡检、📦 项审计复核，都应成为带终止条件的周期任务而不是\"想起来再做\"<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/cross-cutting/cloud-agents\">cloud-agents<\/a> · <a href=\"#/zone-c-operationalization/firecrawl-monitor\">firecrawl-monitor<\/a> · <a href=\"#/zone-c-operationalization/sre-runbooks\">sre-runbooks<\/a> · <a href=\"#/cross-cutting/dispatching-parallel-agents\">dispatching-parallel-agents<\/a><\/p>"}, {"route": "cross-cutting/cloud-agents", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "✅", "html": "<h1>cloud-agents<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（<strong>两个<\/strong>插件并存，用途不同）· 类型：云端常驻 agent · FDE 位点：横切（Zone B 长任务 / Zone C 无人值守）<br>- <code>cloud-agents<\/code> v1.1.0（作者 Qoder）→ **REST / <code>bl<\/code>-style curl 直连** CAS API，PAT 鉴权 · <code>~/.qoder/plugins/cache/qoder-marketplace/cloud-agents/1.1.0<\/code><br>- <code>qoder-cloud-agents<\/code> v0.1.0（作者 Qoder）→ <strong>官方 MCP 连接器<\/strong>驱动（本机会话实测 82 个工具，覆盖 agents/environments/sessions/files/vaults/memories/deployments/skills），身份由 Gateway 注入 · <code>~/.qoder/plugins/cache/qoder-marketplace/qoder-cloud-agents/0.1.0<\/code>（含 <code>mcp.json<\/code>）<\/div>\n<h2>能做什么<\/h2>\n<p>在 Cloud Agents 平台的容器里创建并运行 agent，<strong>与本地机器解耦<\/strong>：合上笔记本它继续跑、可按计划跑、可被脚本与 CI 调起、可封装成团队共享的一个 API。核心资源模型：<code>agent_<\/code> / <code>sess_<\/code> / <code>env_<\/code> / <code>evt_<\/code> / <code>file_<\/code> / <code>mem_store_<\/code> / <code>skill_<\/code>，支持会话消息、SSE 事件流、文件/记忆/技能上传。<\/p>\n<p>本地装 skill 只服务装在谁电脑上；云端 agent 是<strong>一个共享服务，全团队用同一个 API 调<\/strong>——这是它相对本地 skill 的本质差异。<\/p>\n<h2>何时使用<\/h2>\n<ul><li><strong>长任务托管<\/strong>：大代码库分析、批量语料处理（本地不必一直在线）<\/li><li><strong>定时/常驻自动化<\/strong>：日报、周期巡检（与 <a href=\"#/cross-cutting/schedule\">schedule<\/a> 的分工：本地调度靠客户端醒着，云端调度靠平台）<\/li><li><strong>高风险代码沙箱执行<\/strong>：客户现场脚本/未知数据解析放 disposable 容器，炸了也碰不到真机<\/li><li><strong>接入系统/CI<\/strong>：PAT + curl/SDK 就是一个可调用的 AI 后端<\/li><li><strong>团队共享工具<\/strong>：给客户 IT 或同事一个入口，而不是挨个装插件<\/li><\/ul>\n<p>选哪个入口：**明确要 MCP 工具（<code>list_models<\/code>/<code>create_agent<\/code>/<code>create_session<\/code>/<code>send_session_events<\/code>/<code>run_deployment<\/code>）、或宿主环境要求托管身份 → <code>qoder-cloud-agents<\/code>**；要写脚本、进 CI、自己管 PAT、直连 REST → <code>cloud-agents<\/code>。<\/p>\n<p><strong>不用于<\/strong>：用户明确说要本地 Qoder CLI 或自托管 agent；一次性小任务（开云端会话的固定开销不划算）；需要读客户内网资源的任务（云端容器不在客户网络里，除非走 <a href=\"#/zone-b-build/alibabacloud-workbench-cli\">alibabacloud-workbench-cli<\/a> 那类跳板）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li><strong>新账号没有默认 environment<\/strong>：起会话前必须先 <code>POST /environments<\/code>，否则直接失败——这是最常见的入门坑<\/li><li>REST 侧鉴权：<code>Authorization: Bearer <PAT><\/code>，PAT 在 https://qoder.com/cloud/pat-keys 创建；Base URL <code>https://api.qoder.com/api/v1/cloud<\/code><\/li><li><strong>MCP 侧绝不要自己拼 HTTP<\/strong>：用发现到的逻辑工具名，输入是扁平 JSON（不要包 <code>path<\/code>/<code>query<\/code>/<code>body<\/code>），并先读该工具的 live <code>inputSchema<\/code><\/li><li>MCP 侧<strong>不要<\/strong>送 PAT/SAT/Authorization/user ID/Gateway header——由 Gateway 供给；缺能力时如实说明并问用户，<strong>不要静默回落到 REST 或 curl<\/strong><\/li><li>分页三选一：<code>page<\/code> / <code>after_id<\/code> / <code>before_id<\/code> 只用一个；<code>next_page<\/code> 只能再当 <code>page<\/code> 用，别当数字<\/li><li>大数据集走 Files API 挂成 session 资源让容器内读盘，别把内容塞进消息<\/li><li><strong>破坏性操作清单<\/strong>（MCP 契约明示）：<code>delete_session<\/code> 连事件一起删；<code>delete_vault<\/code> 连带删所有凭据；被引用过的 environment 常删不掉 → 用 archive；agent/deployment 只有 archive 无 delete<\/li><li>不自动批准 <code>agent.tool_use<\/code>：先展示动作，确认覆盖到它才发 <code>user.tool_confirmation<\/code><\/li><li>成本与凭据：常驻 agent 每次唤醒都算 token；PAT 只放环境变量/密钥管理，<strong>绝不写进仓库或 catalog 文档<\/strong><\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone B：批量语料的长时处理、<a href=\"#/zone-b-build/bailian-train-deploy\">bailian-train-deploy<\/a> 训练等待期的异步盯守<\/li><li>Zone C：客户侧定时报表与巡检的\"不依赖我笔记本\"执行端；配合 <a href=\"#/zone-c-operationalization/sentry-mcp\">sentry-mcp<\/a> 做每日错误汇总<\/li><li>fde-scope 的 <code>deploy/<\/code> 已经有 AgentScope <code>DockerWorkspace<\/code> 的容器化路径——云端 agent 是\"托管容器\"，二者是不同层的选项（一个管 agent 跑在哪，一个管客户交付物跑在哪）<\/li><li>与 PawApp 的关系：PawApp 复用 QwenPaw 宿主能力（本地桌面），云端 agent 用于团队共享与无人值守，不要混用场景<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/cross-cutting/schedule\">schedule<\/a> · <a href=\"#/cross-cutting/dispatching-parallel-agents\">dispatching-parallel-agents<\/a> · <a href=\"#/cross-cutting/mcp-criticagent\">mcp-criticagent<\/a> · <a href=\"#/zone-b-build/bailian-train-deploy\">bailian-train-deploy<\/a><\/p>"}, {"route":
