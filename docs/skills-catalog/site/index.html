多视口截图就是用本 server 的 \u003ccode>resize_page\u003c/code> + \u003ccode>take_screenshot\u003c/code> 完成的\u003c/li>\u003cli>Zone C runbook：浏览器类故障的第一取证步骤固定为 snapshot → console → network\u003c/li>\u003cli>客户现场 Demo：\u003ccode>emulate\u003c/code> 弱网演示降级表现，是讲弹性的好素材\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/mcp/overview\">总览\u003c/a> · \u003ca href=\"#/mcp/browser-use\">browser-use\u003c/a> · \u003ca href=\"#/mcp/computer-use\">computer-use\u003c/a> · \u003ca href=\"#/zone-c-operationalization/chrome-devtools\">chrome-devtools skill 页\u003c/a> · \u003ca href=\"#/zone-c-operationalization/web-perf\">web-perf\u003c/a> · \u003ca href=\"#/zone-c-operationalization/troubleshooting\">troubleshooting\u003c/a>\u003c/p>"}, {"route": "mcp/firecrawl-mcp", "zone": "MCP · 服务器", "zoneId": "mcp", "status": "✅", "html": "\u003ch1>firecrawl（MCP server）\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已连接（插件 firecrawl v0.1.0）· 类型：MCP 服务器 · \u003cstrong>27 个工具\u003c/strong> · FDE 位点：Zone A 调研 / Zone C 监测\u003cbr>日常入口是 skill 页族：\u003ca href=\"#/zone-a-pre-engagement/firecrawl-search\">firecrawl-search\u003c/a> / \u003ca href=\"#/zone-a-pre-engagement/firecrawl-scrape\">scrape\u003c/a> / \u003ca href=\"#/zone-a-pre-engagement/firecrawl-crawl\">crawl\u003c/a> / \u003ca href=\"#/zone-a-pre-engagement/firecrawl-parse\">parse\u003c/a> / \u003ca href=\"#/zone-c-operationalization/firecrawl-monitor\">monitor\u003c/a>——本页是工具面底账与组合场景参考\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>网页数据获取的完整 API 面，27 个工具分五族：\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>工具族\u003c/th>\u003cth>工具\u003c/th>\u003cth>用途\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>搜索与抽取\u003c/td>\u003ctd>\u003ccode>firecrawl_search\u003c/code> / \u003ccode>firecrawl_scrape\u003c/code> / \u003ccode>firecrawl_map\u003c/code> / \u003ccode>firecrawl_crawl\u003c/code> / \u003ccode>firecrawl_extract\u003c/code> / \u003ccode>firecrawl_parse\u003c/code> / \u003ccode>firecrawl_developer_search\u003c/code>\u003c/td>\u003ctd>联网搜索、单页/整站转 Markdown、URL 空间摸底、结构化抽取、本地文件（PDF/DOCX/HTML）解析、开发者文档检索\u003c/td>\u003c/tr>\u003ctr>\u003ctd>浏览器交互\u003c/td>\u003ctd>\u003ccode>firecrawl_interact\u003c/code> / \u003ccode>firecrawl_interact_stop\u003c/code>\u003c/td>\u003ctd>在抓取到的页面上继续点击/填表/翻页（自然语言驱动）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>自主 agent\u003c/td>\u003ctd>\u003ccode>firecrawl_agent\u003c/code> / \u003ccode>firecrawl_agent_status\u003c/code>\u003c/td>\u003ctd>复杂站点自主导航抓取，异步提交后轮询状态\u003c/td>\u003c/tr>\u003ctr>\u003ctd>变更监测\u003c/td>\u003ctd>\u003ccode>firecrawl_monitor_create\u003c/code> / \u003ccode>_get\u003c/code> / \u003ccode>_list\u003c/code> / \u003ccode>_run\u003c/code> / \u003ccode>_check\u003c/code> / \u003ccode>_checks\u003c/code> / \u003ccode>_update\u003c/code> / \u003ccode>_delete\u003c/code>\u003c/td>\u003ctd>页面变化 → webhook/邮件告警（竞品价格、招聘、文档更新）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>学术研究\u003c/td>\u003ctd>\u003ccode>firecrawl_research_search_papers\u003c/code> / \u003ccode>search_github\u003c/code> / \u003ccode>read_paper\u003c/code> / \u003ccode>inspect_paper\u003c/code> / \u003ccode>related_papers\u003c/code>\u003c/td>\u003ctd>论文/GitHub 检索、原文阅读、相关论文扩展\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>另有 \u003ccode>firecrawl_feedback\u003c/code> / \u003ccode>firecrawl_search_feedback\u003c/code> 结果质量反馈通道。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>直接调工具\u003c/strong>：skill 页没覆盖的组合场景——research 族论文链、monitor 批量管理、agent 异步抓取、\u003ccode>map\u003c/code> + \u003ccode>crawl\u003c/code> 的定点组合\u003c/li>\u003cli>\u003cstrong>日常单步任务走 skill\u003c/strong>：搜索、抓单页、解析本地文件都有现成 skill 入口（见头部链接），skill 里已带参数与预算建议\u003c/li>\u003cli>\u003cstrong>批量语料\u003c/strong>：\u003ccode>map\u003c/code> 摸清站点 → \u003ccode>crawl\u003c/code> 限范围 → \u003ccode>parse\u003c/code> 收尾本地文件\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：需要登录/内网的站点（用 \u003ca href=\"#/mcp/chrome-devtools-mcp\">chrome-devtools\u003c/a> 本地会话取证）；已有结构化 API 的系统（直接 HTTP 更省额度）；对实时性要求极高且目标稳定的数据（写专用 connector 更可靠）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说&quot;搜一下 X / 抓这个网页 / 把这份 PDF 转 Markdown / 盯着这个页面有变化就告诉我&quot;\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：日常不用记工具名——搜、抓、解析都有 skill 入口（见页头链接），agent 自动走；想看工具面就 \u003ccode>mcp_list({keyword: &quot;firecrawl&quot;})\u003c/code>\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：\u003ccode>firecrawl_crawl\u003c/code> 按页计费，大站不先 \u003ccode>firecrawl_map\u003c/code> 摸 URL 空间就 crawl，范围失控等于账单失控；\u003ccode>firecrawl_extract\u003c/code> 不给 schema 输出就不是稳定 JSON\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>\u003ccode>firecrawl_scrape\u003c/code> 直接产 Markdown，不要抓 HTML 回来自己洗；JS 渲染页确认拿到的是渲染后内容，必要时用 \u003ccode>firecrawl_interact\u003c/code> 补交互\u003c/li>\u003cli>大站点先 \u003ccode>firecrawl_map\u003c/code> 摸 URL 空间，再对 \u003ccode>firecrawl_crawl\u003c/code> 设定精确范围——crawl 按页计费，范围失控就是账单失控\u003c/li>\u003cli>\u003ccode>firecrawl_extract\u003c/code> 必须给清晰 schema，输出才是稳定 JSON；没 schema 就用 scrape + 自行解析\u003c/li>\u003cli>monitor 是唯一的\u003cstrong>常驻产物\u003c/strong>：建了要 \u003ccode>firecrawl_monitor_list\u003c/code> 定期巡检，不用的 \u003ccode>firecrawl_monitor_delete\u003c/code>，避免告警噪音\u003c/li>\u003cli>research 族查论文/GitHub 快，但\u003cstrong>引用必须回原文核验\u003c/strong>后才允许进交付物（与 \u003ca href=\"#/zone-a-pre-engagement/firecrawl-search\">firecrawl-search\u003c/a> 的真实性门一致）\u003c/li>\u003cli>先 \u003ccode>mcp_get\u003c/code> 读 schema 再调：各工具的分页/过滤参数名不统一，凭记忆传参会静默返回空结果\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone A 客户调研：search → scrape → parse → 入 QMind（\u003ca href=\"#/zone-a-pre-engagement/qmind-knowledge\">qmind-knowledge\u003c/a>），是调研摸底的标准管线\u003c/li>\u003cli>Zone C firecrawl-monitor 已单独立页：竞品/客户系统网页监控告警\u003c/li>\u003cli>客户交付：把&quot;目标站点 → 结构化数据&quot;封装成 monitor + extract 的组合，就是轻量级数据订阅服务\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/mcp/overview\">总览\u003c/a> · \u003ca href=\"#/mcp/chrome-devtools-mcp\">chrome-devtools\u003c/a> · \u003ca href=\"#/zone-a-pre-engagement/firecrawl-search\">firecrawl-search\u003c/a> · \u003ca href=\"#/zone-c-operationalization/firecrawl-monitor\">firecrawl-monitor\u003c/a> · \u003ca href=\"#/zone-a-pre-engagement/qmind-knowledge\">qmind-knowledge\u003c/a>\u003c/p>"}, {"route": "mcp/browser-use", "zone": "MCP · 服务器", "zoneId": "mcp", "status": "✅", "html": "\u003ch1>browser-use（MCP server）\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已连接（客户端内置，磁盘无安装文件）· 类型：MCP 服务器 · \u003cstrong>16 个工具\u003c/strong> · FDE 位点：Zone B 验证 / Zone C 排障（轻量侧）\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>面向\u003cstrong>已开页面\u003c/strong>的轻量浏览器自动化，16 个工具：\u003ccode>list_pages\u003c/code> / \u003ccode>select_page\u003c/code> / \u003ccode>navigate_page\u003c/code>、交互 \u003ccode>click\u003c/code> / \u003ccode>fill\u003c/code> / \u003ccode>hover\u003c/code> / \u003ccode>drag\u003c/code> / \u003ccode>press_key\u003c/code>、取证 \u003ccode>take_snapshot\u003c/code> / \u003ccode>take_screenshot\u003c/code> / \u003ccode>evaluate_script\u003c/code> / \u003ccode>upload_file\u003c/code> / \u003ccode>handle_dialog\u003c/code> / \u003ccode>wait_for\u003c/code>、诊断 \u003ccode>list_console_messages\u003c/code> / \u003ccode>list_network_requests\u003c/code>。\u003c/p>\n\u003cp>与 \u003ca href=\"#/mcp/chrome-devtools-mcp\">chrome-devtools\u003c/a>（29 工具）的关系：\u003cstrong>browser-use 少而轻\u003c/strong>——没有 \u003ccode>new_page\u003c/code>/\u003ccode>resize_page\u003c/code>/\u003ccode>emulate\u003c/code>，没有性能追踪、堆快照、单请求详情。它是&quot;把页面点一遍&quot;的工具，不是&quot;把页面查透&quot;的工具。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>快速的页面操作验证：登录、点按钮、填表单、确认跳转\u003c/li>\u003cli>简单取证：页面截图、控制台报错扫一眼、请求列表扫一眼\u003c/li>\u003cli>已有标签页里的连续小步骤操作（无需新建/调整视口）\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：性能/内存分析、设备仿真、响应式检查（→ \u003ca href=\"#/mcp/chrome-devtools-mcp\">chrome-devtools\u003c/a>）；桌面原生应用（→ \u003ca href=\"#/mcp/computer-use\">computer-use\u003c/a>）；批量抓取（→ \u003ca href=\"#/mcp/firecrawl-mcp\">firecrawl\u003c/a>）。注意另有一个 agent-browser 插件/skill 与本 server 场景重叠，能力调研时不要混淆三者。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说&quot;帮我点一下这个页面 / 登录一下 / 截个图看看&quot;\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：已有标签页里的轻量操作直接说需求即可；需要新建标签页/调视口/性能分析时明确让 agent 换 chrome-devtools\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：它没有 \u003ccode>new_page\u003c/code>/\u003ccode>resize_page\u003c/code>/\u003ccode>emulate\u003c/code>——在 browser-use 里绕新标签页是死路；\u003ccode>handle_dialog\u003c/code> 会代答原生确认框，调用前想清楚业务上该确认还是取消\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>同样遵循**先 \u003ccode>take_snapshot\u003c/code> 再交互**：AX 树是元素定位的依据\u003c/li>\u003cli>没有 \u003ccode>new_page\u003c/code>——需要新标签页/新视口时直接换 chrome-devtools，别在 browser-use 里绕\u003c/li>\u003cli>\u003ccode>handle_dialog\u003c/code> 会代答浏览器原生确认框：调用前想清楚业务上该确认还是取消\u003c/li>\u003cli>\u003ccode>wait_for\u003c/code> 等待条件而非固定延时；页面慢时配合 \u003ccode>list_network_requests\u003c/code> 看卡在哪个请求\u003c/li>\u003cli>与 chrome-devtools 操作的是同一个 Chrome：并行会话下的页面抢占问题同样存在\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone B：交付 demo 的冒烟路径（打开 → 登录 → 核心动作 → 截图）用 browser-use 走最快\u003c/li>\u003cli>Zone C：客户报障时快速复现&quot;我这里也点不出来&quot;的轻量取证\u003c/li>\u003cli>与 fde-scope 门户 \u003ccode>site/index.html\u003c/code> 的验收互补：重验收用 chrome-devtools，日常检查用 browser-use\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/mcp/overview\">总览\u003c/a> · \u003ca href=\"#/mcp/chrome-devtools-mcp\">chrome-devtools\u003c/a> · \u003ca href=\"#/mcp/computer-use\">computer-use\u003c/a> · \u003ca href=\"#/mcp/firecrawl-mcp\">firecrawl\u003c/a>\u003c/p>"}, {"route": "mcp/computer-use", "zone": "MCP · 服务器", "zoneId": "mcp", "status": "✅", "html": "\u003ch1>computer-use（MCP server）\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已连接（插件 computer-use，bundler 分发，磁盘无版本层）· 类型：MCP 服务器 · \u003cstrong>10 个工具\u003c/strong> · FDE 位点：横切（客户桌面环境操作）\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>\u003cstrong>macOS 原生应用\u003c/strong>的自动化：不进浏览器，直接驱动桌面应用的辅助功能（Accessibility）树。10 个工具：\u003ccode>list_apps\u003c/code>（枚举运行中应用）、\u003ccode>get_app_state\u003c/code>（读某应用的 AX 树）、\u003ccode>click\u003c/code> / \u003ccode>perform_secondary_action\u003c/code>（右键/长按）、\u003ccode>drag\u003c/code>、\u003ccode>scroll\u003c/code>、\u003ccode>type_text\u003c/code> / \u003ccode>press_key\u003c/code> / \u003ccode>set_value\u003c/code>（直接给控件赋值）、\u003ccode>select_text\u003c/code>（选中文本）。\u003c/p>\n\u003cp>与浏览器类工具的分工：网页用 \u003ca href=\"#/mcp/chrome-devtools-mcp\">chrome-devtools\u003c/a> / \u003ca href=\"#/mcp/browser-use\">browser-use\u003c/a>；Finder、系统设置、Native.app、不带网页界面的客户端软件用本 server。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>客户给的交付物是\u003cstrong>桌面应用\u003c/strong>（如 PyInstaller 打包的 .app），需要演示或验证 GUI 行为\u003c/li>\u003cli>浏览器覆盖不到的环节：系统偏好设置、证书信任、Finder 拖拽、菜单栏操作\u003c/li>\u003cli>无法脚本化又必须人工点的现场流程，需要 agent 代做并留痕\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：网页操作（浏览器工具更精准）；纯后台任务（直接 Bash 更快）；需要像素级游戏/图形操作的场景（AX 树覆盖不到自绘界面）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说&quot;打开系统设置把 X 勾上 / 在这个 .app 里走一遍登录 / 帮我操作 Finder&quot;\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：agent 先 \u003ccode>list_apps\u003c/code> 确认目标应用在运行，再 \u003ccode>get_app_state\u003c/code> 读 AX 树，然后才 \u003ccode>click\u003c/code>/\u003ccode>set_value\u003c/code>——顺序不能反\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：应用刚启动 AX 树可能未就绪，重取一次 state 再动手；盲点坐标在 Retina 屏极不可靠；动系统设置/权限前必须向用户确认——影响的是客户机器本身\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>**先 \u003ccode>get_app_state\u003c/code> 再操作**：AX 树给出控件标识，\u003ccode>click\u003c/code>/\u003ccode>set_value\u003c/code> 基于它定位；盲点坐标在 Retina 屏上极不可靠\u003c/li>\u003cli>\u003ccode>set_value\u003c/code> 优先于模拟键盘输入：直接赋值绕过输入法/焦点问题，且更快\u003c/li>\u003cli>操作前 \u003ccode>list_apps\u003c/code> 确认目标应用在运行；应用刚启动时 AX 树可能未就绪，重取一次 state 再动手\u003c/li>\u003cli>涉及系统设置/权限的操作先向用户确认——这类动作影响的是客户机器本身，不只是页面\u003c/li>\u003cli>客户机器上运行前说明将要执行的点击序列，尤其是会打开网络面板、修改配置的操作\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>fde-scope 打包交付（PyInstaller → macOS .app / PawApp 插件）：安装后的 GUI 冒烟验证\u003c/li>\u003cli>客户现场：把&quot;按文档点一遍&quot;的验收流程交给 agent 执行并输出逐步截图\u003c/li>\u003cli>与 \u003ca href=\"#/mcp/record-and-replay\">record-and-replay\u003c/a> 组合：真人演示一遍桌面流程，录制流再加工成可复用 skill\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/mcp/overview\">总览\u003c/a> · \u003ca href=\"#/mcp/chrome-devtools-mcp\">chrome-devtools\u003c/a> · \u003ca href=\"#/mcp/browser-use\">browser-use\u003c/a> · \u003ca href=\"#/mcp/record-and-replay\">record-and-replay\u003c/a> · \u003ca href=\"#/zone-b-build/huggingface-local-models\">huggingface-local-models\u003c/a>（本地 .app 交付场景）\u003c/p>"}, {"route": "mcp/qmind-mcp", "zone": "MCP · 服务器", "zoneId": "mcp", "status": "✅", "html": "\u003ch1>qoder-qmind（MCP server）\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已连接（客户端内置，磁盘无安装文件）· 类型：MCP 服务器 · \u003cstrong>7 个工具\u003c/strong> · FDE 位点：Zone A 调研 / Zone D 知识沉淀\u003cbr>skill 页：\u003ca href=\"#/zone-a-pre-engagement/qmind-knowledge\">qmind-knowledge\u003c/a>\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>QMind 知识库的会话内工具面，7 个工具分三组：\u003c/p>\n\u003cul>\u003cli>\u003cstrong>检索\u003c/strong>：\u003ccode>search\u003c/code>（知识库关键词/语义检索）、\u003ccode>retrieve\u003c/code>（按查询取证据片段，带 source 定位）——回答&quot;资料库里有没有、说了什么&quot;\u003c/li>\u003cli>\u003cstrong>Notebook\u003c/strong>：\u003ccode>list_notebooks\u003c/code>——浏览知识库的 Notebook 结构\u003c/li>\u003cli>\u003cstrong>Source 管理\u003c/strong>：\u003ccode>list_sources\u003c/code> / \u003ccode>get_source\u003c/code> / \u003ccode>read_source\u003c/code> / \u003ccode>add_source\u003c/code>——列出、查看、读取知识源；把\u003cstrong>文本、HTTPS 链接、本地文件\u003c/strong>加入知识库\u003c/li>\u003c/ul>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>调研产出要\u003cstrong>沉淀成可检索资产\u003c/strong>：抓回来的网页/报告/会议纪要 \u003ccode>add_source\u003c/code> 入库，之后任何会话都能 \u003ccode>retrieve\u003c/code>\u003c/li>\u003cli>回答&quot;我们之前是不是研究过 X&quot;：先 \u003ccode>search\u003c/code>/\u003ccode>retrieve\u003c/code> 知识库，再决定要不要重新联网查\u003c/li>\u003cli>交付前引用审计：\u003ccode>retrieve\u003c/code> 返回的 source 定位可直接引用到方案书\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：实时信息（知识库是快照，新动态用 \u003ca href=\"#/zone-a-pre-engagement/firecrawl-search\">firecrawl-search\u003c/a>）；还没入库的本地大文件分析（先读文件，有沉淀价值再 \u003ccode>add_source\u003c/code>）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说&quot;资料库里有没有 X / 把这份报告入库 / 查一下我们之前研究过什么&quot;\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：动手联网前先让 agent \u003ccode>search\u003c/code>/\u003ccode>retrieve\u003c/code> 一次知识库——命中就省一次重复调研；入库用 \u003ccode>add_source\u003c/code>（文本 / HTTPS 链接 / 本地文件均可）\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：知识库是快照不是实时源，新动态要用 firecrawl-search；本地文件入库前确认无客户密钥/凭证——\u003ccode>add_source\u003c/code> 是持久化写入，半年后的检索命中率取决于入库质量\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>检索先行\u003c/strong>：动手联网/重新分析前先 \u003ccode>search\u003c/code> 一次，避免重复劳动——这是 QMind 存在的意义\u003c/li>\u003cli>\u003ccode>add_source\u003c/code> 时给清晰的标题/元信息，半年后 \u003ccode>search\u003c/code> 命中率取决于当初的入库质量\u003c/li>\u003cli>本地文件入库前确认无敏感信息（客户密钥、凭证）——知识库是持久化存储\u003c/li>\u003cli>\u003ccode>retrieve\u003c/code> 的证据要\u003cstrong>带 source 出处\u003c/strong>引用，不要只复述结论\u003c/li>\u003cli>与 \u003ca href=\"#/zone-a-pre-engagement/qmind-knowledge\">qmind-knowledge\u003c/a> skill 的分工：skill 提供批量上传/编译等 CLI 流程，MCP 工具覆盖会话内的即时读写\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone A：调研摸底管线（firecrawl 抓取 → \u003ccode>add_source\u003c/code> 入库 → 方案书里 \u003ccode>retrieve\u003c/code> 引用）\u003c/li>\u003cli>Zone D：项目结束时的经验沉淀——把交付过程文档入库，成为下一个项目的先验\u003c/li>\u003cli>客户知识库场景：给客户演示&quot;企业资料 + AI 检索&quot;时，QMind 就是现成的参考实现\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/mcp/overview\">总览\u003c/a> · \u003ca href=\"#/zone-a-pre-engagement/qmind-knowledge\">qmind-knowledge\u003c/a> · \u003ca href=\"#/zone-a-pre-engagement/firecrawl-search\">firecrawl-search\u003c/a> · \u003ca href=\"#/zone-a-pre-engagement/zread\">zread\u003c/a>\u003c/p>"}, {"route": "mcp/record-and-replay", "zone": "MCP · 服务器", "zoneId": "mcp", "status": "✅", "html": "\u003ch1>record-and-replay（MCP server）\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已连接（客户端内置，磁盘无安装文件）· 类型：MCP 服务器 · \u003cstrong>3 个工具\u003c/strong> · FDE 位点：横切（经验 → skill 的转化器）\u003cbr>skill 入口：record-and-replay（录制工作流 → 生成可复用 skill）\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>把\u003cstrong>真人演示的 macOS 操作流\u003c/strong>录制成事件流，再加工成可复用 skill 的管道，3 个工具：\u003c/p>\n\u003cul>\u003cli>\u003ccode>event_stream_start\u003c/code>：开始录制（键盘/鼠标/应用事件流）\u003c/li>\u003cli>\u003ccode>event_stream_status\u003c/code>：查询录制状态\u003c/li>\u003cli>\u003ccode>event_stream_stop\u003c/code>：结束录制，产出事件流供 skill 生成\u003c/li>\u003c/ul>\n\u003cp>配合 record-and-replay skill：用户在屏幕上把流程做一遍 → 事件流被捕获 → agent 从中提炼步骤、参数与分支 → 产出一份 SKILL.md。是&quot;会做&quot;到&quot;可复用&quot;的转化器。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>客户或同事演示了一套\u003cstrong>没有文档的操作流程\u003c/strong>（内部系统、遗留软件）：录下来直接变成 skill，移交价值极高\u003c/li>\u003cli>自己反复做某套 GUI 流程（每周一次的数据导出、固定的配置检查）：第一次录制，之后交给 agent\u003c/li>\u003cli>新人 FDE 想快速把&quot;老师傅的手感&quot;固化成团队资产\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：纯终端/代码流程（直接写 skill 更精确）；有官方 API 的系统（API 优先于 UI 回放）；含密码/敏感输入的流程（录制会捕获输入内容）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说&quot;把我接下来这遍操作录下来做成 skill / 记录这个流程&quot;\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：\u003ccode>event_stream_start\u003c/code> 开始录制 → 用户在屏幕上完整做一遍 → \u003ccode>event_stream_stop\u003c/code> 结束并产出事件流 → agent 提炼成 SKILL.md\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：回放质量上限就是演示质量——录制前想清楚剧本一次做对；密码/敏感输入会被捕获，需要凭证的步骤在生成的 skill 里改成环境变量\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>录制前想清楚剧本\u003c/strong>：一次做对，少走死路——回放技能的质量上限就是演示质量\u003c/li>\u003cli>敏感信息（密码、客户数据）不进录制流；需要凭证的步骤在生成的 skill 里改为环境变量\u003c/li>\u003cli>录制产出的事件流只是原料：\u003cstrong>生成 skill 后必须人工审阅\u003c/strong>步骤描述与边界条件，再进 \u003ca href=\"#/cross-cutting/writing-skills\">writing-skills\u003c/a> 的校验流程\u003c/li>\u003cli>命名与建档：生成的 skill 按手册库六段模板补一页，登记进 README\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>客户移交（Zone D）：把客户专家的操作经验录制成 skill，作为移交物的一部分\u003c/li>\u003cli>\u003ca href=\"#/mcp/computer-use\">computer-use\u003c/a> 的黄金搭档：录制真人桌面流 → skill 化 → 以后由 computer-use/agent 代做\u003c/li>\u003cli>fde-scope 团队内部：重复性 GUI 巡检流程的固化\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/mcp/overview\">总览\u003c/a> · \u003ca href=\"#/mcp/computer-use\">computer-use\u003c/a> · \u003ca href=\"#/cross-cutting/writing-skills\">writing-skills\u003c/a> · \u003ca href=\"#/cross-cutting/create-skill\">create-skill\u003c/a>\u003c/p>"}, {"route": "mcp/extension-market", "zone": "MCP · 服务器", "zoneId": "mcp", "status": "✅", "html": "\u003ch1>extension-market（MCP server）\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已连接（客户端内置，磁盘无安装文件）· 类型：MCP 服务器 · \u003cstrong>2 个工具\u003c/strong> · FDE 位点：横切（能力获取）\u003cbr>skill 入口：\u003ca href=\"#/cross-cutting/skill-discovery\">skill-discovery\u003c/a>（skills.sh 生态检索）\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>插件市场的会话内工具面，2 个工具：\u003c/p>\n\u003cul>\u003cli>\u003ccode>search_extensions\u003c/code>：按关键词检索可安装的插件/skill/MCP 连接器\u003c/li>\u003cli>\u003ccode>install_extension\u003c/code>：把选中的插件安装到本机（写入 \u003ccode>~/.qoder/plugins/\u003c/code>）\u003c/li>\u003c/ul>\n\u003cp>与 skill-discovery 的分工：\u003ccode>find-skills\u003c/code> 面向 skills.sh 社区源（\u003ccode>npx skills add\u003c/code>），本 server 面向 Qoder 官方市场——两边都查再决定装哪个。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>用户问&quot;有没有能做 X 的插件/skill&quot;：先 \u003ccode>search_extensions\u003c/code> 查官方市场，再用 \u003ca href=\"#/cross-cutting/skill-discovery\">skill-discovery\u003c/a> 查社区源，对比后推荐\u003c/li>\u003cli>本手册库 📦 项的安装执行端：建档时标记可安装，用户点头后从这里装\u003c/li>\u003cli>新客户环境初始化：按手册库清单快速补齐能力\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：未经用户同意的主动安装/升级——改的是用户环境，必须先展示候选与来源再装；装前评估走 \u003ca href=\"#/cross-cutting/skill-criticagent\">skill-criticagent\u003c/a> / \u003ca href=\"#/cross-cutting/mcp-criticagent\">mcp-criticagent\u003c/a>（见维护规约的装前门禁）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说&quot;有没有能做 X 的插件 / 帮我装个 Y skill&quot;\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：先 \u003ccode>search_extensions\u003c/code> 查官方市场，再用 \u003ca href=\"#/cross-cutting/skill-discovery\">skill-discovery\u003c/a> 查社区源——两边对比后给用户候选清单，不直接装\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：未经用户同意的主动安装是红线（改的是用户环境）；装完必须跑 \u003ccode>make check-local\u003c/code> 对账并回填手册库状态（📦 → ✅ + 安装日期）\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>先搜后装、先评估后装\u003c/strong>：搜索结果给出候选 → 用户确认 → criticagent 评估 → 安装 → 回填手册库状态（📦 → ✅ + 安装日期）\u003c/li>\u003cli>安装后跑 \u003ccode>make check-local\u003c/code> 对账：手册库与真实安装保持一致是本库的生命线\u003c/li>\u003cli>记录版本号：页内声明的版本与实装版本不一致会被 \u003ccode>check-local\u003c/code> 提醒\u003c/li>\u003cli>推荐时给用户对比信息（功能、来源、维护活跃度），而不是只给一个名字\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>手册库维护流：本库 89+ 页的 📦 项巡检与回填（\u003ca href=\"../README.md\" target=\"_blank\" rel=\"noopener\">维护规约\u003c/a>）\u003c/li>\u003cli>新人上手：环境缺什么能力，从这里和 skill-discovery 两个入口补齐\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/mcp/overview\">总览\u003c/a> · \u003ca href=\"#/cross-cutting/skill-discovery\">skill-discovery\u003c/a> · \u003ca href=\"#/cross-cutting/skill-criticagent\">skill-criticagent\u003c/a> · \u003ca href=\"#/cross-cutting/mcp-criticagent\">mcp-criticagent\u003c/a>\u003c/p>"}, {"route": "mcp/cloudflare-docs-mcp", "zone": "MCP · 服务器", "zoneId": "mcp", "status": "✅", "html": "\u003ch1>cloudflare-docs（MCP server）\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已连接（插件 cloudflare v1.0.0，文档检索子 server）· 类型：MCP 服务器 · \u003cstrong>2 个工具\u003c/strong> · FDE 位点：Zone B 部署\u003cbr>平台技能族：\u003ca href=\"#/zone-b-build/cloudflare\">cloudflare\u003c/a>（Workers/Pages/KV 等全部 skill）\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>Cloudflare \u003cstrong>官方文档\u003c/strong>的检索工具面，只有 2 个工具但定位关键：\u003c/p>\n\u003cul>\u003cli>\u003ccode>search_cloudflare_documentation\u003c/code>：按自然语言检索 CF 官方文档，返回相关页面与要点——文档是持续更新的，检索结果比任何模型记忆都新\u003c/li>\u003cli>\u003ccode>migrate_pages_to_workers_guide\u003c/code>：给出 Pages 项目迁移到 Workers 的结构化指引（CF 官方正在主推的路线）\u003c/li>\u003c/ul>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>写 wrangler 命令/配置 \u003ccode>wrangler.jsonc\u003c/code> 前核对\u003cstrong>当前版本\u003c/strong>的语法与限制（\u003ca href=\"#/zone-b-build/cloudflare\">wrangler\u003c/a> skill 会要求先查文档）\u003c/li>\u003cli>客户问&quot;CF 现在支不支持 X / 限额是多少&quot;——直接检索官方文档回答，不凭记忆\u003c/li>\u003cli>Pages → Workers 迁移评估：用 \u003ccode>migrate_pages_to_workers_guide\u003c/code> 起步\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：非 Cloudflare 的问题；平台通用概念学习（先读 skill 页，有上下文再查文档）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说&quot;CF 现在支不支持 X / Durable Objects 限额是多少 / Pages 怎么迁 Workers&quot;\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：让 agent 用 \u003ccode>search_cloudflare_documentation\u003c/code> 检索\u003cstrong>英文功能名\u003c/strong>（如 \u003ccode>durable objects alarms\u003c/code>）——中文命中率低\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：检索结果给的是文档页面，限额/定价/破坏性变更要点进原文确认版本与日期；&quot;我记得是……&quot;不算答案，retrieval-first 就是本 server 存在的理由\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>retrieval-first\u003c/strong>：CF 平台迭代快（限额、beta 产品、定价都常变），任何&quot;我记得是……&quot;的答案都先用本 server 验证\u003c/li>\u003cli>检索词用英文功能名（如 \u003ccode>durable objects alarms\u003c/code>）比中文命中率高\u003c/li>\u003cli>检索结果给的是文档页面：关键结论（限额/定价/破坏性变更）点进原文确认版本与日期\u003c/li>\u003cli>与 cloudflare 插件的 skill 族配合：skill 给方法论，本 server 给事实源\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone B 部署：fde-scope 交付物上 Cloudflare（Workers/Pages/KV）时的配置与限额核对\u003c/li>\u003cli>客户方案书：CF 相关章节的引用来源（官方文档 &gt; 博客 &gt; 记忆）\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/mcp/overview\">总览\u003c/a> · \u003ca href=\"#/zone-b-build/cloudflare\">cloudflare skill 页\u003c/a> · \u003ca href=\"#/zone-b-build/vercel-deploy\">vercel-deploy\u003c/a>（同为部署平台的对照）\u003c/p>"}, {"route": "tools/overview", "zone": "工具 · 内置", "zoneId": "tools", "status": "✅", "html": "\u003ch1>内置工具总览\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 随客户端自带（零安装，永远可用）· 类型：能力底座总览 · FDE 位点：横切（所有 Zone 的执行层）\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>内置工具是 agent 的&quot;手和脚&quot;：不需要安装、不需要配置，会话开始就可用。新人先记住三层分工（详见 \u003ca href=\"#/mcp/overview\">MCP 服务器总览\u003c/a>）：\u003cstrong>内置工具管本地执行，MCP 管外部系统，skill 管方法论\u003c/strong>。\u003c/p>\n\u003cp>按用途分组的全景清单：\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>分组\u003c/th>\u003cth>工具\u003c/th>\u003cth>一句话\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>文件读写\u003c/td>\u003ctd>\u003ccode>Read\u003c/code> / \u003ccode>Write\u003c/code> / \u003ccode>Edit\u003c/code>\u003c/td>\u003ctd>读文件/图片/PDF/notebook、新建文件、精确字符串替换编辑\u003c/td>\u003c/tr>\u003ctr>\u003ctd>搜索定位\u003c/td>\u003ctd>\u003ccode>Glob\u003c/code> / \u003ccode>Grep\u003c/code>\u003c/td>\u003ctd>按文件名模式找文件、按正则搜内容（ripgrep）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>执行\u003c/td>\u003ctd>\u003ccode>Bash\u003c/code>\u003c/td>\u003ctd>跑 shell 命令，支持后台运行（\u003ccode>run_in_background\u003c/code>）与超时控制\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Web\u003c/td>\u003ctd>\u003ccode>WebFetch\u003c/code> / \u003ccode>WebSearch\u003c/code>\u003c/td>\u003ctd>抓取单个 URL 并按提示提取、联网搜索\u003c/td>\u003c/tr>\u003ctr>\u003ctd>规划与确认\u003c/td>\u003ctd>\u003ccode>EnterPlanMode\u003c/code> / \u003ccode>ExitPlanMode\u003c/code> / \u003ccode>AskUserQuestion\u003c/code>\u003c/td>\u003ctd>进入规划模式出方案、提交计划待批、向用户提问选择题\u003c/td>\u003c/tr>\u003ctr>\u003ctd>任务与目标\u003c/td>\u003ctd>\u003ccode>TaskCreate\u003c/code> / \u003ccode>TaskGet\u003c/code> / \u003ccode>TaskList\u003c/code> / \u003ccode>TaskUpdate\u003c/code> / \u003ccode>TaskStop\u003c/code> + \u003ccode>CreateGoal\u003c/code> / \u003ccode>GetGoal\u003c/code> / \u003ccode>UpdateGoal\u003c/code>\u003c/td>\u003ctd>多步任务的建/查/改/停；会话级目标管理\u003c/td>\u003c/tr>\u003ctr>\u003ctd>委派与并行\u003c/td>\u003ctd>\u003ccode>Agent\u003c/code>\u003c/td>\u003ctd>派发子 agent（Explore/Plan/general-purpose 等类型）跑独立任务\u003c/td>\u003c/tr>\u003ctr>\u003ctd>技能\u003c/td>\u003ctd>\u003ccode>Skill\u003c/code>\u003c/td>\u003ctd>调用已安装的 skill（本手册库的主角）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Notebook\u003c/td>\u003ctd>\u003ccode>NotebookEdit\u003c/code>\u003c/td>\u003ctd>Jupyter notebook 单元格替换/插入/删除\u003c/td>\u003c/tr>\u003ctr>\u003ctd>图像生成\u003c/td>\u003ctd>\u003ccode>ImageGen\u003c/code>\u003c/td>\u003ctd>按提示生成图片到指定路径\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MCP 元工具\u003c/td>\u003ctd>\u003ccode>mcp_list\u003c/code> / \u003ccode>mcp_get\u003c/code> / \u003ccode>mcp_call\u003c/code>\u003c/td>\u003ctd>发现/读 schema/调用 MCP 工具（lazy-loading 三步）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>多会话\u003c/td>\u003ctd>\u003ccode>create_chat_session\u003c/code> / \u003ccode>fork_chat_session\u003c/code> / \u003ccode>list_chat_sessions\u003c/code> / \u003ccode>read_chat_session\u003c/code> / \u003ccode>send_message_to_chat_session\u003c/code> / \u003ccode>wait_chat_sessions\u003c/code>\u003c/td>\u003ctd>开独立会话、从已有 Turn 分叉、跨会话读写与等待\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>任何任务都从这里起步\u003c/strong>：先确认&quot;这件事是内置工具的组合就能做，还是要 MCP/skill&quot;——能用 \u003ccode>Read\u003c/code>/\u003ccode>Grep\u003c/code>/\u003ccode>Bash\u003c/code> 直接完成的不要绕道\u003c/li>\u003cli>\u003cstrong>接手陌生环境\u003c/strong>：\u003ccode>Glob\u003c/code> + \u003ccode>Grep\u003c/code> + \u003ccode>Read\u003c/code> 三件套是摸底基本功；大范围探索派 \u003ccode>Agent(Explore)\u003c/code> 省自己的上下文\u003c/li>\u003cli>\u003cstrong>多步任务\u003c/strong>：3 步以上先 \u003ccode>TaskCreate\u003c/code> 列清单，边做边更新状态——既是进度条也是防遗漏\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：本页是地图不是手册，工具参数以工具自身 schema 为准；&quot;哪些能力需要安装&quot;的问题看 \u003ca href=\"#/mcp/overview\">MCP 服务器总览\u003c/a> 与 \u003ca href=\"#/cross-cutting/skill-discovery\">skill-discovery\u003c/a>。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：零安装、随会话可用——任何任务都从本页 12 组工具的组合里起步，新人入职先通读一遍分组表\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：拿一个陌生目录练 \u003ccode>Glob\u003c/code> + \u003ccode>Grep\u003c/code> + \u003ccode>Read\u003c/code> 三件套摸底，再用 \u003ccode>TaskCreate\u003c/code> 把手头多步任务列成清单体验进度跟踪\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：专用工具优先于 Bash——\u003ccode>cat\u003c/code>/\u003ccode>sed\u003c/code>/裸 \u003ccode>grep\u003c/code> 能干但不如 \u003ccode>Read\u003c/code>/\u003ccode>Edit\u003c/code>/\u003ccode>Grep\u003c/code> 结构化且权限清晰；\u003ccode>Edit\u003c/code>/\u003ccode>Write\u003c/code> 前没 \u003ccode>Read\u003c/code> 会直接报错\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>专用工具优先于 Bash\u003c/strong>：读文件用 \u003ccode>Read\u003c/code> 不用 \u003ccode>cat\u003c/code>，改文件用 \u003ccode>Edit\u003c/code> 不用 \u003ccode>sed\u003c/code>，搜索用 \u003ccode>Grep\u003c/code>/\u003ccode>Glob\u003c/code> 不用裸 \u003ccode>grep\u003c/code>/\u003ccode>find\u003c/code>——专用工具权限更清晰、输出更结构化\u003c/li>\u003cli>\u003cstrong>改之前先读\u003c/strong>：\u003ccode>Edit\u003c/code>/\u003ccode>Write\u003c/code> 要求本会话先 \u003ccode>Read\u003c/code> 过目标文件；文件被外部改动后读状态会失效，需重读再改\u003c/li>\u003cli>\u003cstrong>独立调用并行发\u003c/strong>：多个互不依赖的调用（如同时读三个文件）放在同一条消息里并行；有依赖的必须等前一个结果\u003c/li>\u003cli>\u003cstrong>长任务进后台\u003c/strong>：构建/测试用 \u003ccode>Bash\u003c/code> 的 \u003ccode>run_in_background\u003c/code>，完成会收到通知——不要 \u003ccode>sleep\u003c/code> 轮询\u003c/li>\u003cli>\u003cstrong>委派的选择\u003c/strong>：只找位置用 \u003ccode>Explore\u003c/code>（快、只读）；要方案用 \u003ccode>Plan\u003c/code>；开放性多步调研用 \u003ccode>general-purpose\u003c/code>——但&quot;理解&quot;不能委派，结论要自己核对\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>fde-scope 的开发流：\u003ccode>make test\u003c/code> / \u003ccode>make check-catalog\u003c/code> / \u003ccode>make lint\u003c/code> 就是 \u003ccode>Bash\u003c/code> 跑的验证命令；改代码前 \u003ccode>Read\u003c/code> 目标文件是硬约束\u003c/li>\u003cli>本手册库的批量维护：页面改动 → \u003ccode>Bash\u003c/code> 跑门禁 → 确认输出后再报告完成（见 \u003ca href=\"#/tools/discipline\">使用纪律\u003c/a>）\u003c/li>\u003cli>客户现场：\u003ccode>Glob\u003c/code>/\u003ccode>Grep\u003c/code> 是在陌生仓库里找证据的第一选择\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/tools/discipline\">使用纪律\u003c/a> · \u003ca href=\"#/mcp/overview\">MCP 服务器总览\u003c/a> · \u003ca href=\"#/cross-cutting/using-superpowers-family\">using-superpowers-family\u003c/a> · \u003ca href=\"#/cross-cutting/dispatching-parallel-agents\">dispatching-parallel-agents\u003c/a>\u003c/p>"}, {"route": "tools/discipline", "zone": "工具 · 内置", "zoneId": "tools", "status": "✅", "html": "\u003ch1>内置工具使用纪律\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 随客户端自带 · 类型：使用规约 · FDE 位点：横切（新人第一周必读）\u003cbr>配套：\u003ca href=\"#/tools/overview\">内置工具总览\u003c/a>（清单）· fde-scope 硬约束见仓库 \u003ccode>AGENTS.md\u003c/code>\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>把内置工具\u003cstrong>用对\u003c/strong>的规约清单：每条都对应一个真实的踩坑模式。新人把本页过一遍，能避开 80% 的低级失误。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>每次会话里动手干活前——这些不是可选建议，是行为默认值\u003c/li>\u003cli>code review 自查时：对照逐条检查 agent 产出的操作序列\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：项目级不变量（如 fde-scope 的原子写、门禁再评估）——那些在仓库 \u003ccode>AGENTS.md\u003c/code>，优先级更高。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：新人第一周必读；动手前本页就是行为默认值，code review 自查时逐条对照\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：先记牢三条最高频——\u003ccode>Read\u003c/code> 之后再 \u003ccode>Edit\u003c/code>、声称完成前必须跑验证、破坏性操作先问用户；其余四节每周回看一遍\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：把本页当&quot;可选建议&quot;——每条规约背后都是真实踩坑模式（外部改动后读状态失效、sleep 轮询、误读后台任务全量日志）；被拒绝的调用原样重试只会再被拒，先想为什么\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cp>\u003cstrong>文件操作\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003ccode>Edit\u003c/code>/\u003ccode>Write\u003c/code> 前必须先 \u003ccode>Read\u003c/code> 目标文件的当前状态；文件在会话外被改动后，读状态失效，重读再改\u003c/li>\u003cli>精确字符串替换用 \u003ccode>Edit\u003c/code>；整文件新建或彻底重写才用 \u003ccode>Write\u003c/code>；别用 Bash 的 \u003ccode>echo &gt;\u003c/code> / \u003ccode>sed -i\u003c/code> 干编辑的活\u003c/li>\u003cli>改完自查 diff，别声称改了没改的东西\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>执行与验证\u003c/strong>\u003c/p>\n\u003cul>\u003cli>读用 \u003ccode>Read\u003c/code>、搜用 \u003ccode>Grep\u003c/code>/\u003ccode>Glob\u003c/code>、编辑用 \u003ccode>Edit\u003c/code>——\u003ccode>Bash\u003c/code> 留给真正需要 shell 的场景（跑测试、装依赖、git）\u003c/li>\u003cli>长命令（构建、测试套件）用 \u003ccode>run_in_background\u003c/code>，完成自动通知；禁止 \u003ccode>sleep\u003c/code> 轮询等待\u003c/li>\u003cli>\u003cstrong>声称完成之前必须跑验证\u003c/strong>：改了代码跑测试、改了文档跑 \u003ccode>make check-catalog\u003c/code>——证据先于结论（见 \u003ca href=\"#/cross-cutting/using-superpowers-family\">verification-before-completion\u003c/a> 的超能力族）\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>并行与委派\u003c/strong>\u003c/p>\n\u003cul>\u003cli>互不依赖的调用并行发（读多个文件、跑多个独立检查）；有依赖的串行等结果\u003c/li>\u003cli>派 \u003ccode>Agent\u003c/code> 前想清楚任务边界：搜索/调研可委派，\u003cstrong>理解与决策不委派\u003c/strong>；子 agent 的结论要抽查核对\u003c/li>\u003cli>后台任务的产物不要直接 \u003ccode>Read\u003c/code> 它的完整日志文件（可能是全量 transcript），等完成通知里的摘要\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>权限与风险\u003c/strong>\u003c/p>\n\u003cul>\u003cli>被拒绝的调用不要原样重试：先想为什么被拒，换思路\u003c/li>\u003cli>破坏性/不可逆操作（\u003ccode>rm -rf\u003c/code>、\u003ccode>git push --force\u003c/code>、删分支、动共享资源）默认先问用户；用户批准过一次不代表处处批准\u003c/li>\u003cli>遇到陌生的文件/分支/锁，先调查是什么再决定动不动——那可能是别人的进行中工作\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>沟通\u003c/strong>\u003c/p>\n\u003cul>\u003cli>动手前一句话说明要做什么；长任务在关键节点给简短进展\u003c/li>\u003cli>结论里区分&quot;实测到的&quot;与&quot;推测的&quot;；跳过的检查要点名说明原因\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>fde-scope 的门禁文化与本页同构：\u003ccode>make test\u003c/code> / \u003ccode>make check-catalog\u003c/code> / \u003ccode>make check-local\u003c/code> 是每批改动的固定收尾，不改&quot;绿&quot;不收工\u003c/li>\u003cli>客户现场高危环境：本页&quot;权限与风险&quot;一节 + \u003ca href=\"#/cross-cutting/gstack-suite\">gstack-suite\u003c/a> 的 \u003ccode>guard\u003c/code>/\u003ccode>freeze\u003c/code> 是双重保险\u003c/li>\u003cli>新人第一周路径：本页 → \u003ca href=\"#/tools/overview\">内置工具总览\u003c/a> → \u003ca href=\"#/mcp/overview\">MCP 服务器总览\u003c/a> → 手册库按 Zone 补场景\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/tools/overview\">内置工具总览\u003c/a> · \u003ca href=\"#/mcp/overview\">MCP 服务器总览\u003c/a> · \u003ca href=\"#/cross-cutting/using-superpowers-family\">using-superpowers-family\u003c/a> · \u003ca href=\"#/cross-cutting/writing-plans\">writing-plans\u003c/a>\u003c/p>"}], "stats": {"total": 101, "installed": 87, "installable": 14, "zoneCount": 7, "scenarioCount": 10}}</script>
<script>
const DATA = JSON.parse(document.getElementById('catalog-data').textContent);
const PAGES = {}; DATA.pages.forEach((p,i)=>{PAGES[p.route]=i;});
const app = document.getElementById('app');

function badge(st){
  const cls = st==='✅' ? 'ok' : (st==='📦' ? 'pkg' : 'dead');
  const txt = st==='✅' ? '已安装' : (st==='📦' ? '可安装' : '已移除');
  return `<span class="badge ${cls}">${st} ${txt}</span>`;
}
function nav(){
  return `<nav class="nav">
    <div class="brand" onclick="location.hash='#/'">FDE Skills <span>手册库</span></div>
    <div class="zlinks">${DATA.zones.map(z=>`<a href="#/" onclick="goZone('${z.id}')">${z.label.split('·')[0].trim()}</a>`).join('')}</div>
    <input id="q" type="search" placeholder="搜索 ${DATA.stats.total} 页 skills / tools / MCP…" oninput="onSearch(this.value)">
  </nav>`;
}
function goZone(id){ location.hash='#/'; setTimeout(()=>{const el=document.getElementById('zone-'+id); if(el) el.scrollIntoView({behavior:'smooth'});},30); }

function home(){
  const s = DATA.stats;
  return `${nav()}
  <header class="hero">
    <h1>FDE Skills 手册库</h1>
    <p>每个能力一页档案：能做什么 · 何时用（含反向边界）· 最佳实践 · 在 fde-scope 项目中的应用位点。覆盖三层——skills（按 FDE 四 Zone + 横切）、MCP 服务器工具面、内置工具——先选场景，再进页面。</p>
    <div class="stats">
      <span class="stat"><b>${s.total}</b>页能力档案</span>
      <span class="stat"><b>${s.installed}</b>已安装</span>
      <span class="stat"><b>${s.installable}</b>可安装</span>
      <span class="stat"><b>${s.zoneCount}</b>大区</span>
      <span class="stat"><b>${s.scenarioCount}</b>场景入口</span>
    </div>
  </header>
  <div class="wrap">
    <div id="scen-sec">
      <div class="section-h"><h2>按任务开始</h2><p>GTM 场景速查：从任务进入，而不是从目录进入</p></div>
      <div class="scen-grid">
        ${DATA.scenarios.map(sc=>`<div class="scen"><h3>${sc.title}</h3><div class="d">${sc.desc}</div>
          <div class="links">${sc.items.map(i=>`<a href="#/${i.route}">${i.name}</a>`).join('')}</div></div>`).join('')}
      </div>
    </div>
    <div id="zones-sec" style="margin-top:40px">
      <div class="section-h"><h2>按阶段浏览</h2><p>FDE 四 Zone + 横切元能力 + MCP 服务器 + 内置工具</p></div>
      <div class="zone-grid">
        ${DATA.zones.map(z=>`<div class="zone" id="zone-${z.id}">
          <div class="zh" style="--accent:${z.accent}"><h3>${z.label}</h3><p>${z.tag} · ${z.skills.length} 项</p></div>
          <div class="zs">${z.skills.map(k=>`<a href="#/${k.route}"><span class="st">${k.status}</span>${k.name}</a>`).join('')}</div>
        </div>`).join('')}
      </div>
    </div>
    <div id="all-sec" style="margin-top:40px">
      <div class="section-h"><h2>全部能力档案</h2><p>支持搜索与状态筛选</p></div>
      <div class="toolbar">
        <button class="chip on" data-f="all" onclick="setFilter(this)">全部</button>
        <button class="chip" data-f="✅" onclick="setFilter(this)">✅ 已安装</button>
        <button class="chip" data-f="📦" onclick="setFilter(this)">📦 可安装</button>
        <span id="hit" style="color:var(--muted);font-size:12.5px"></span>
      </div>
      <div class="all-grid" id="all-grid"></div>
      <div class="empty" id="nohit">没有匹配的 skill</div>
    </div>
  </div>
  ${footer()}`;
}

let statusFilter='all';
function setFilter(btn){
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  btn.classList.add('on'); statusFilter=btn.dataset.f; renderAll();
}
function renderAll(){
  const q=(document.getElementById('q')?.value||'').toLowerCase();
  const grid=document.getElementById('all-grid'); if(!grid) return;
  const items=[];
  DATA.zones.forEach(z=>z.skills.forEach(k=>{
    if(statusFilter!=='all' && k.status!==statusFilter) return;
    if(q && !(k.name+' '+k.blurb+' '+z.label).toLowerCase().includes(q)) return;
    items.push({k,z});
  }));
  grid.innerHTML=items.map(({k,z})=>`<a class="sk" href="#/${k.route}">
    <div class="t">${k.name} ${badge(k.status)}</div><div class="b">${k.blurb}</div>
    <div class="z">${z.label}</div></a>`).join('');
  document.getElementById('nohit').style.display=items.length?'none':'block';
  const hit=document.getElementById('hit'); if(hit) hit.textContent=`${items.length} 项`;
}
function onSearch(v){
  const hasQ=!!v;
  ['scen-sec','zones-sec','hero'].forEach(id=>{const el=document.getElementById(id)||document.querySelector('.hero'); if(el) el.style.display=(hasQ&&id!=='all-sec')?'none':'';});
  const allSec=document.getElementById('all-sec');
  if(hasQ && allSec) allSec.scrollIntoView({behavior:'smooth'});
  renderAll();
}

function page(route){
  const i=PAGES[route]; if(i===undefined){location.hash='#/';return '';}
  const p=DATA.pages[i];
  const prev=DATA.pages[i-1], next=DATA.pages[i+1];
  return `${nav()}
  <div class="wrap">
    <div class="crumb"><a href="#/">主页</a> › ${p.zone} › <b style="color:var(--ink)">${route.split('/').pop()}</b></div>
    <article class="article">${p.html}</article>
    <div class="pager">
      ${prev?`<a href="#/${prev.route}">← ${prev.route.split('/').pop()}</a>`:'<span></span>'}
      ${next?`<a href="#/${next.route}">${next.route.split('/').pop()} →</a>`:'<span></span>'}
    </div>
  </div>
  ${footer()}`;
}

function footer(){
  const s=DATA.stats;
  return `<footer>
    <div>FDE Skills 手册库 · ${s.total} 页（✅ ${s.installed} · 📦 ${s.installable}）· 建档 2026-08-27 · 数据源 README + 各页 Markdown</div>
    <div style="margin-top:6px">一致性门禁 <code>make check-catalog</code> · 本地对账 <code>make check-local</code> · 改目录后 <code>make build-site</code> 重新生成本页</div>
  </footer>`;
}

function render(){
  const h=location.hash.replace(/^#\/?/,'');
  app.innerHTML = h ? page(h) : home();
  renderAll();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
