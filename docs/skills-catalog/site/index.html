 "cross-cutting/bailian-cli", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "✅", "html": "<h1>bailian-cli（百炼 <code>bl<\/code> 家族入口）<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（<code>~/.qoder/skills/bailian-cli<\/code> v1.17.1，requires bin <code>bl<\/code>）· 类型：平台 CLI hub · FDE 位点：横切（Zone B 训练/部署 / Zone C 用量治理）<br>官方安装方式是<strong>整包<\/strong>：<code>bl skill init<\/code>（hub + protocol + 各业务 skill 同装），不要只装 hub 一个<\/div>\n<h2>能做什么<\/h2>\n<p>阿里云百炼 / DashScope 的<strong>资源管理与命令入口总机<\/strong>：应用调用（<code>bl app<\/code>）、应用记忆、知识库检索、模型目录/列表、用量与额度配额（含免费额度）、工作空间、MCP 市场、pipeline、文件上传、console API、登录鉴权与配置、以及 agent skill 的安装/列出/更新/卸载（<code>bl skill add|list|update|remove<\/code>）。<\/p>\n<p>它是<strong>家族 hub<\/strong>——本地已装共 <strong>9 个<\/strong> <code>bailian-*<\/code>：本 hub + 6 个业务 skill + 1 个文档知识库 + 1 个共享协议：<\/p>\n<table><thead><tr><th>成员<\/th><th>管什么<\/th><th>关键命令<\/th><\/tr><\/thead><tbody><tr><td><code>bailian-protocol<\/code><\/td><td>共享执行协议：consent、版本预检、鉴权/安装、错误上报、文件与输出约定（<strong>非业务入口<\/strong>）<\/td><td>—<\/td><\/tr><tr><td><code>bailian-gen<\/code><\/td><td>生图/生视频/配音/TTS/ASR/图文与视频理解（默认生成类都走它）<\/td><td>`bl image\\<\/td><td>video\\<\/td><td>speech\\<\/td><td>omni\\<\/td><td>vision`<\/td><\/tr><tr><td><code>bailian-finetune<\/code><\/td><td>精调训练全链：校验数据 → 上传 → 建任务 → watch → export → deploy<\/td><td>`bl dataset\\<\/td><td>finetune\\<\/td><td>deploy`<\/td><\/tr><tr><td><code>bailian-managed-agent<\/code><\/td><td><code>agents.yaml<\/code> 声明式托管 Agent（IaC：init/validate/plan/apply/destroy）<\/td><td><code>bl managed-agent<\/code><\/td><\/tr><tr><td><code>bailian-web-search<\/code><\/td><td>联网搜索的<strong>路径分发<\/strong>（Token Plan 自带搜索 vs MCP 搜索 + 一次兜底）<\/td><td><code>bl search web<\/code><\/td><\/tr><tr><td><code>bailian-model-recommend<\/code><\/td><td>场景 → 模型选型决策（不是查资料，是帮做决定）<\/td><td>—<\/td><\/tr><tr><td><code>bailian-docs-llm-wiki<\/code><\/td><td>百炼官方文档知识库（模型市场结构化数据 + wiki 合成层 + raw 层）<\/td><td>—<\/td><\/tr><tr><td><code>bailian-train-deploy<\/code><\/td><td>\"数据→训练→部署→调用\"闭环剧本（本库另有一页）<\/td><td>见 <a href=\"#/zone-b-build/bailian-train-deploy\">该页<\/a><\/td><\/tr><\/tbody><\/table>\n<h2>何时使用<\/h2>\n<ul><li>用户<strong>点名<\/strong>百炼 / DashScope / <code>bl<\/code>，或续跑既有 <code>bl<\/code> 工作流<\/li><li>用量、额度、配额、工作空间、知识库、MCP 市场等资源侧问题<\/li><li>不知道哪条 <code>bl<\/code> 命令做这件事 → hub 的 <code>reference/<group>.md<\/code> 是权威清单（不要凭记忆拼命令）<\/li><li>首次环境搭建 / 鉴权失败 / <code>bl<\/code> 报错要上报<\/li><\/ul>\n<p><strong>不用于<\/strong>：普通问答、编程、写作、翻译、摘要、泛搜索、图片理解——<strong>宿主自己能做的任务不触发本 skill<\/strong>（skill 描述里写明了反触发边界）；用户点名火山方舟/ark 的训练不走 <code>bailian-finetune<\/code>；调已上线的百炼应用走 <code>bl app<\/code>，不是 <code>managed-agent<\/code>。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>**执行前必读 <code>bailian-protocol/SKILL.md<\/code>**（provider 选择与 consent、版本与更新预检、setup/auth、错误上报）。协议文件缺失就停下先跑 <code>bl skill init<\/code>，<strong>不要猜鉴权和 consent<\/strong><\/li><li>版本预检是硬步骤：<code>bl<\/code> 是快速迭代的 CLI，旧版本上的\"正确命令\"可能已改名；先看 <code>bl --version<\/code> 与 <code>bl <cmd> --help<\/code><\/li><li>**写操作先 <code>--dry-run<\/code> 预览**；<code>managed-agent apply/destroy<\/code> 必须带 <code>--yes<\/code>，且**必须先 <code>plan<\/code> 把 diff 给用户看**再要确认<\/li><li>凭据只走环境变量/密钥管理，不进仓库、不进日志、不进文档<\/li><li>未指明产品就问清楚用哪个产品，再跑 <code>bl usage<\/code> / <code>bl quota<\/code>（否则查出来的额度是错的对象）<\/li><li>家族 skill 之间是<strong>软交接<\/strong>：按名字 Read 对应 skill，装了就参考，没装就回落到 <code>bl … --help<\/code>，不要因为缺文件就中断任务<\/li><li>与 MiMo/AgentScope 的关系：fde-scope 的 LLM 抽象层可指向百炼 compatible-mode 端点；<code>bl<\/code> 管的是<strong>平台资源生命周期<\/strong>，不是运行时调用库——别把两者混为一层<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone B：把语料（<code>fde_scope/corpus/<\/code>）产出物送进百炼做精调、把专属模型部署成 endpoint 供 <a href=\"#/zone-b-build/rag-agent-builder\">rag-agent-builder<\/a> 或 web 控制台调用<\/li><li>Zone C：额度/用量巡检（交付期成本可控性是客户关心项）；知识库检索用于交付后客户自助<\/li><li>Zone D：<code>bl managed-agent<\/code> 的 <code>agents.yaml<\/code> 是<strong>可交付的声明式基建<\/strong>，比口头描述部署方式更适合进交接包<\/li><li>反例提醒：fde-scope 内置的是 MiMo（OpenAI 兼容）路径，凭据只走 <code>FDE_SCOPE_MIMO_API_KEY<\/code>；用百炼时同样坚持\"凭据只走环境变量\"<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-b-build/bailian-train-deploy\">bailian-train-deploy<\/a> · <a href=\"#/zone-b-build/vllm-deploy-docker\">vllm-deploy-docker<\/a> · <a href=\"#/zone-b-build/rag-agent-builder\">rag-agent-builder<\/a> · <a href=\"#/cross-cutting/create-skill\">create-skill<\/a>（<code>bl skill<\/code> 与本地 skill 是两套 registry，别混淆）<\/p>"}, {"route": "cross-cutting/using-superpowers-family", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "✅", "html": "<h1>superpowers 套件（方法论族 14 件套）<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（Quest Marketplace 插件 <code>superpowers<\/code> v5.1.0，作者 Jesse Vincent）· 类型：套件档案 · FDE 位点：横切（约束 Zone B~D 的执行纪律）<br>本地路径：<code>~/.qoder/plugins/cache/qoder-marketplace/superpowers/5.1.0<\/code>（skill 同时镜像到 <code>~/.qoder/skills/<\/code>）<br>特点：<strong>带 hooks<\/strong>（<code>hooks/session-start<\/code>）——会话启动即注入 <code>using-superpowers<\/code> 的强制规则，是本目录里唯一会主动改变 agent 默认行为的套件<\/div>\n<h2>能做什么<\/h2>\n<p>把\"随手改代码\"强行拉回一条固定流水线：<strong>explore → brainstorm → plan → TDD → review → verify → finish<\/strong>。14 个 skill 全是流程纪律，没有一个业务能力，因此它们必须与领域 skill（数据/训练/部署/文档）搭配使用。<\/p>\n<table><thead><tr><th>Skill<\/th><th>触发时机<\/th><th>已有单页<\/th><\/tr><\/thead><tbody><tr><td><code>using-superpowers<\/code><\/td><td>每次会话开始：先查有无适用 skill，再动手（连澄清问题之前都要查）<\/td><td>—<\/td><\/tr><tr><td><code>brainstorming<\/code><\/td><td>任何创造性工作之前（做新功能/组件/改行为）<\/td><td>✅ <a href=\"#/zone-a-pre-engagement/brainstorming\">Zone A<\/a><\/td><\/tr><tr><td><code>writing-plans<\/code><\/td><td>有多步需求的 spec，<strong>动代码之前<\/strong><\/td><td>✅ <a href=\"#/cross-cutting/writing-plans\">本页同层<\/a><\/td><\/tr><tr><td><code>executing-plans<\/code><\/td><td>执行已写好的计划，带评审检查点<\/td><td>✅ <a href=\"#/cross-cutting/executing-plans\">本页同层<\/a><\/td><\/tr><tr><td><code>subagent-driven-development<\/code><\/td><td>在当前会话内用子 agent 跑计划里的独立任务<\/td><td>—<\/td><\/tr><tr><td><code>dispatching-parallel-agents<\/code><\/td><td>2 个以上无共享状态的任务并行派发<\/td><td>✅ <a href=\"#/cross-cutting/dispatching-parallel-agents\">本页同层<\/a><\/td><\/tr><tr><td><code>test-driven-development<\/code><\/td><td>写实现代码之前先写测试<\/td><td>—<\/td><\/tr><tr><td><code>systematic-debugging<\/code><\/td><td>遇到任何 bug / 测试失败 / 意外行为，<strong>在给修复方案之前<\/strong><\/td><td>✅ <a href=\"#/zone-c-operationalization/systematic-debugging\">Zone C<\/a><\/td><\/tr><tr><td><code>verification-before-completion<\/code><\/td><td>声称\"完成/修好了/通过了\"之前，必须真跑验证命令并贴输出<\/td><td>—<\/td><\/tr><tr><td><code>requesting-code-review<\/code><\/td><td>完成任务、上大 feature、合并前<\/td><td>—<\/td><\/tr><tr><td><code>receiving-code-review<\/code><\/td><td>收到评审意见后、动手改之前（尤其意见可疑时）<\/td><td>—<\/td><\/tr><tr><td><code>using-git-worktrees<\/code><\/td><td>需要隔离工作区时<\/td><td>✅ <a href=\"#/cross-cutting/using-git-worktrees\">本页同层<\/a><\/td><\/tr><tr><td><code>finishing-a-development-branch<\/code><\/td><td>实现完成、测试全绿后决定如何合流<\/td><td>—<\/td><\/tr><tr><td><code>writing-skills<\/code><\/td><td>新建/编辑 skill、部署前校验<\/td><td>✅ <a href=\"#/cross-cutting/writing-skills\">本页同层<\/a><\/td><\/tr><\/tbody><\/table>\n<h2>何时使用（按 FDE 阶段）<\/h2>\n<ul><li>Zone B 实施：<code>writing-plans<\/code> → <code>executing-plans<\/code> / <code>subagent-driven-development<\/code> → <code>test-driven-development<\/code>，这是把 fde-scope 的模块改动落地的正链<\/li><li>Zone C 排障：<code>systematic-debugging<\/code> 必须在任何\"看起来是这个问题\"的修复之前（客户现场的复现成本极高，猜一次亏一天）<\/li><li>收口阶段：<code>verification-before-completion<\/code> + <code>requesting-code-review<\/code> + <code>finishing-a-development-branch<\/code>，对应 gate 需要证据的纪律<\/li><li>横切：本 catalog 的建档本身就是 <code>writing-plans<\/code> + 分批执行 + 完成前逐项校验的产物<\/li><\/ul>\n<p><strong>不用于<\/strong>：纯只读问答与检索（族内 skill 会说\"先检查 skill\"，但不代表每个都要跑）；<code>using-superpowers<\/code> 明确写了 <strong>SUBAGENT-STOP<\/strong>——被派发去执行特定任务的子 agent 应忽略它，不要在工作子进程里再套一层方法论；紧急生产事故止血阶段先恢复再补流程（但事后仍要走 <code>systematic-debugging<\/code> 复盘）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li><strong>冲突时以本仓约定为准<\/strong>：superpowers 的规则很强硬（\"哪怕 1% 可能适用也必须调用\"）。在 fde-scope 里，文档/小改动场景按 <a href=\"../README.md\" target=\"_blank\" rel=\"noopener\">../README.md<\/a> 的维护规约裁剪，别为改一行 README 走完整 TDD<\/li><li>计划文件要落盘可评审（<code>writing-plans<\/code> 的产物），别只在会话里说过——<code>executing-plans<\/code> 依赖它做检查点<\/li><li><code>verification-before-completion<\/code> 是本族<strong>性价比最高<\/strong>的一条：要求贴真实命令输出。把它当交付前的固定门禁<\/li><li><code>receiving-code-review<\/code> 与 <code>requesting-code-review<\/code> 要搭配本库的 <a href=\"#/cross-cutting/code-review\">code-review<\/a>（CodeRabbit）与 <a href=\"#/cross-cutting/security-scan\">security-scan<\/a> 使用——机器评审出意见，人按 <code>receiving-code-review<\/code> 的判断流程处置，不盲从也不硬抗<\/li><li>hooks 会带来会话开销与额外上下文占用：若某会话不需要这套纪律，可临时禁用该插件而不是逐个 skill 绕<\/li><li>版本注意：<code>~/.qoder/skills/<\/code> 下有同名镜像（早期散装安装），插件升级后以插件版本为准，<strong>不要两边各改各的<\/strong><\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li><code>docs/code_review_checklist.md<\/code> 与本族的 review 类 skill 是同一层规范，可互相引用<\/li><li>fde-scope 的 10 个 gate 本质是\"人工版 verification-before-completion\"——把 skill 纪律映射进 gate 证据要求，是本套件在该项目最落地的用法<\/li><li>测试基线（<code>tests/<\/code>，含 <code>test_app_service.py<\/code>/<code>test_roles.py<\/code>/<code>test_documents_connector.py<\/code>）遵循 <code>test-driven-development<\/code> 的\"先测后码\"<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/cross-cutting/gstack-suite\">gstack-suite<\/a>（同类流程套件，偏 startup 交付视角） · <a href=\"#/cross-cutting/architecture-visualization-suite\">architecture-visualization-suite<\/a> · <a href=\"#/cross-cutting/knowledge-work-suite\">knowledge-work-suite<\/a> · <a href=\"#/cross-cutting/create-skill\">create-skill<\/a> · <a href=\"#/cross-cutting/skill-discovery\">skill-discovery<\/a><\/p>"}, {"route": "cross-cutting/gstack-suite", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "✅", "html": "<h1>GStack 套件（53 件套 · YC CEO 的开发全流程工厂）<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（Quest Marketplace 插件 <code>gstack<\/code> v1.58.5，作者 Garry Tan / Y Combinator，MIT）· 类型：套件档案 · FDE 位点：横切（Zone B 实施 ~ Zone D 交付）<br>本地路径：<code>~/.qoder/plugins/cache/qoder-marketplace/gstack/1.58.5<\/code> · 上游：https://github.com/garrytan/gstack<br>定位：\"我的开源软件工厂\"——把 agent 变成一支虚拟工程团队（CEO/工程经理/设计师/评审/QA/安全官/发布工程师）<br>⚠️ 计数事实：<strong>打包 53 个 skill，当前会话实际注册可调用 43 个<\/strong>；未注册的 10 个（<code>spec<\/code>、<code>retro<\/code>、<code>qa-only<\/code>、<code>devex-review<\/code>、<code>design-shotgun<\/code>、<code>benchmark-models<\/code>、<code>ios-sync<\/code>、<code>open-gstack-browser<\/code>、<code>sync-gbrain<\/code>、<code>skillify<\/code>）需要时直接 Read 其 <code>SKILL.md<\/code> 按其流程执行。插件元数据里\"23 个 skill\"的说法是旧版本描述，已过时。<\/div>\n<h2>能做什么<\/h2>\n<p>全部以 slash-command 风格组织的 skill + 一个<strong>快速 headless 浏览器<\/strong>（自带 <code>bin/<\/code>，<code>/browse<\/code> 用它，不用其他浏览器 MCP）。按用途分八组：<\/p>\n<table><thead><tr><th>组<\/th><th>Skill<\/th><th>干什么<\/th><\/tr><\/thead><tbody><tr><td>意图→规格<\/td><td><code>spec<\/code> <code>office-hours<\/code> <code>autoplan<\/code> <code>plan-tune<\/code><\/td><td>模糊需求→可执行 spec；五阶段收敛；自动串行跑四类评审<\/td><\/tr><tr><td>多角色评审<\/td><td><code>plan-ceo-review<\/code> <code>plan-eng-review<\/code> <code>plan-design-review<\/code> <code>plan-devex-review<\/code> <code>review<\/code> <code>cso<\/code><\/td><td>产品/架构/设计/开发者体验四视角 + 代码评审 + 安全官（OWASP + STRIDE）<\/td><\/tr><tr><td>设计与前端<\/td><td><code>design-consultation<\/code> <code>design-html<\/code> <code>design-review<\/code> <code>ios-design-review<\/code> <code>diagram<\/code><\/td><td>设计咨询、HTML 出稿、设计找 AI slop、图<\/td><\/tr><tr><td>浏览器与 QA<\/td><td><code>browse<\/code> <code>qa<\/code> <code>qa-only<\/code> <code>scrape<\/code> <code>setup-browser-cookies<\/code> <code>open-gstack-browser<\/code><\/td><td>真浏览器打开预发/线上做 QA、抓取、cookie 复用<\/td><\/tr><tr><td>排障与稳定性<\/td><td><code>investigate<\/code> <code>health<\/code> <code>canary<\/code> <code>benchmark<\/code> <code>benchmark-models<\/code><\/td><td>根因排查、健康度、发布后金丝雀观察、性能与跨模型基准<\/td><\/tr><tr><td>安全护栏<\/td><td><code>careful<\/code> <code>guard<\/code> <code>freeze<\/code> <code>unfreeze<\/code><\/td><td>破坏性命令告警、目录级只读锁定（改代码前后夹住）<\/td><\/tr><tr><td>发布与运维<\/td><td><code>ship<\/code> <code>land-and-deploy<\/code> <code>setup-deploy<\/code> <code>retro<\/code> <code>learn<\/code><\/td><td>检测 base 分支→跑测试→审 diff→bump VERSION→CHANGELOG→commit→push→PR；周复盘；项目学习记录管理<\/td><\/tr><tr><td>交付文档<\/td><td><code>document-generate<\/code> <code>document-release<\/code> <code>make-pdf<\/code> <code>landing-report<\/code><\/td><td>补文档、发布后同步文档、Markdown→出版级 PDF、落地页报告<\/td><\/tr><tr><td>上下文与协作<\/td><td><code>context-save<\/code> <code>context-restore<\/code> <code>pair-agent<\/code> <code>codex<\/code> <code>gstack-upgrade<\/code><\/td><td>跨会话上下文存取、结对、调用 Codex、自升级<\/td><\/tr><tr><td>iOS/移动端<\/td><td><code>ios-qa<\/code> <code>ios-fix<\/code> <code>ios-clean<\/code> <code>ios-sync<\/code><\/td><td>真机 SwiftUI QA、自治修 bug、清理 DebugBridge 接线<\/td><\/tr><tr><td>代码检索基建<\/td><td><code>setup-gbrain<\/code> <code>sync-gbrain<\/code> <code>skillify<\/code><\/td><td>gbrain 索引安装/同步；把成功的一次 <code>/scrape<\/code> 固化成常驻 browser-skill<\/td><\/tr><\/tbody><\/table>\n<h2>何时使用（按 FDE 阶段）<\/h2>\n<ul><li>Zone B：<code>spec<\/code> 收敛客户需求 → <code>plan-eng-review<\/code> 锁架构 → <code>careful<\/code>/<code>guard<\/code> 夹住改动范围 → <code>investigate<\/code> 排障<\/li><li>Zone C：<code>health<\/code> + <code>canary<\/code> 做上线后观察；<code>cso<\/code> 做交付前 OWASP/STRIDE 审计（<strong>给客户安全部门看的东西<\/strong>）<\/li><li>Zone D：<code>document-generate<\/code> / <code>document-release<\/code> / <code>make-pdf<\/code> 出交付物（本库已有三张单页：<a href=\"#/zone-d-handoff/document-generate\">document-generate<\/a> · <a href=\"#/zone-d-handoff/document-release\">document-release<\/a> · <a href=\"#/zone-d-handoff/make-pdf\">make-pdf<\/a>）<\/li><li>需要真浏览器验证时：<code>browse<\/code> / <code>qa<\/code>（本地另有 <a href=\"#/zone-c-operationalization/chrome-devtools\">chrome-devtools<\/a>，两者只需保留一个以免行为不一致）<\/li><\/ul>\n<p><strong>不用于<\/strong>：<\/p>\n<ul><li>**客户仓库上的 <code>ship<\/code> / <code>land-and-deploy<\/code>** —— 它们会自动 commit、push、开 PR、改 VERSION/CHANGELOG。这是给\"自己产品高速迭代\"设计的，在客户现场必须换成本地约定：先问、再提交，绝不自动 push<\/li><li><code>ios-*<\/code> 组：目标是 <strong>SwiftUI iOS 真机<\/strong>，不是 macOS 桌面打包（<code>docs/macos_app_packaging.md<\/code> / <code>appbuild/<\/code> 那条线用不上，别误触发）<\/li><li>纯数据/工业接入任务（Zone B 的 connector/corpus 工作没有对应 gstack skill，用 DuckDB/Firecrawl/HF 那一族）<\/li><li>需要严格证据链的架构建模 → <a href=\"#/cross-cutting/architecture-visualization-suite\">architecture-visualization-suite<\/a>（GStack 的图偏沟通，不带 sourceRefs 门禁）<\/li><\/ul>\n<h2>最佳实践<\/h2>\n<ul><li><strong>与 superpowers 族二选一做主线<\/strong>：两套都主张强流程，同开会互相抢触发。本项目建议：<strong>主线用 superpowers（纪律+TDD），需要某个 GStack 强项时定点调用<\/strong>（<code>cso<\/code>、<code>canary<\/code>、<code>make-pdf<\/code>、<code>document-*<\/code>、<code>benchmark<\/code>）<\/li><li><code>guard<\/code>/<code>freeze<\/code> 在客户现场是很好用的\"防手滑\"开关：进入只读分析阶段前 <code>freeze<\/code>，改动阶段 <code>guard<\/code> 限定目录<\/li><li><code>autoplan<\/code> 会<strong>自动替你做决策<\/strong>（按 6 条决策原则串行跑四类评审）——产出要逐条复核，不能当\"已通过评审\"直接进交付<\/li><li><code>review<\/code> 与已装的 <a href=\"#/cross-cutting/code-review\">code-review<\/a>（CodeRabbit）功能重叠：一个走 PR 机器人、一个走本地流程。选一个作门禁，另一个作补充，<strong>不要两边同时要求修同一处风格问题<\/strong><\/li><li><code>skillify<\/code> 是这套里最被低估的一个：把一次成功的抓取/验证流程固化成常驻 skill，等于自制 fde-scope 的 <code>skills/<\/code> 沉淀<\/li><li>版本与污染：<code>gstack-upgrade<\/code> 会拉上游；本仓库不要提交 <code>~/.claude/skills/gstack<\/code> 生成的项目内文件（确认 <code>.gitignore<\/code> 覆盖 <code>CLAUDE.md<\/code> 之类的写入）<\/li><li>未注册的 10 个 skill 用前先 <code>Read .../gstack/1.58.5/<name>/SKILL.md<\/code>，按其步骤手工执行并说明来源<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone D 交付物三件套的<strong>实际来源<\/strong>就是本套件（已在三张单页头部标注）<\/li><li><code>cso<\/code> 可补 fde-scope 目前缺的\"交付前安全审计\"证据：与 <a href=\"#/cross-cutting/security-scan\">security-scan<\/a> 一起构成 LLM 应用 + 传统 Web 双视角<\/li><li><code>canary<\/code> + <code>benchmark<\/code> 对应 Zone C 的 SLO gate：把\"上线后观察\"变成有脚本支撑的动作<\/li><li><code>learn<\/code> 的项目学习记录机制与 fde-scope 的 flywheel（经验回流）思路一致，可作为其外部参考实现<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/cross-cutting/using-superpowers-family\">using-superpowers-family<\/a> · <a href=\"#/cross-cutting/knowledge-work-suite\">knowledge-work-suite<\/a> · <a href=\"#/cross-cutting/code-review\">code-review<\/a> · <a href=\"#/cross-cutting/security-scan\">security-scan<\/a> · <a href=\"#/zone-d-handoff/document-generate\">document-generate<\/a> · <a href=\"#/zone-c-operationalization/investigate\">investigate<\/a><\/p>"}, {"route": "cross-cutting/knowledge-work-suite", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "📦", "html": "<h1>knowledge-work 套件（anthropics/knowledge-work-plugins）<\/h1>\n<div class=\"page-meta\">状态：📦 可安装（<strong>未装<\/strong>，且建议<strong>按需单装、不要整包装<\/strong>）· 类型：套件档案 · FDE 位点：横切（Zone A 调研 ~ Zone D 交付）<br>来源：<code>anthropics/knowledge-work-plugins<\/code>（Anthropic 官方 org）· 上游：https://github.com/anthropics/knowledge-work-plugins<br>规模事实（skills.sh，2026-08-27 抓取）：<strong>230 个 skill / 497.5K 总安装量<\/strong> —— 不是\"40+ 件套\"，早期建档的估计严重偏低，已在本页与 README 更正<br>单装：<code>npx skills add anthropics/knowledge-work-plugins@<skill> --directory ~/.qoder/skills -y<\/code><br>本 catalog 已有 4 个 📦 条目的<strong>真实来源就是本仓库<\/strong>：<a href=\"#/zone-c-operationalization/deploy-checklist\">deploy-checklist<\/a> · <a href=\"#/zone-c-operationalization/sre-runbooks\">sre-runbooks<\/a>（真名 <code>runbook<\/code>）· <a href=\"#/zone-c-operationalization/incident-response\">incident-response<\/a> · <a href=\"#/zone-d-handoff/anthropic-documentation\">anthropic-documentation<\/a>（真名 <code>documentation<\/code>）<br>仓库结构（2026-08-27 用 GitHub API 核对）：<strong>18 个子插件包<\/strong>——<code>bio-research<\/code> <code>cowork-plugin-management<\/code> <code>customer-support<\/code> <code>data<\/code> <code>design<\/code> <code>engineering<\/code> <code>enterprise-search<\/code> <code>finance<\/code> <code>human-resources<\/code> <code>legal<\/code> <code>marketing<\/code> <code>operations<\/code> <code>partner-built<\/code> <code>pdf-viewer<\/code> <code>product-management<\/code> <code>productivity<\/code> <code>sales<\/code> <code>small-business<\/code>；路径统一为 <code><plugin>/skills/<name>/SKILL.md<\/code>。<br>安全事实：上游对每个条目跑<strong>强制 Claude policy scan<\/strong>（<code>.github/workflows/scan-plugins.yml<\/code>，按 (plugin, sha) 缓存判定，不通过则被 <code>revert-failed-bumps.yml<\/code> 自动剔除）——这是选它而不选个人作者的实质理由。<\/div>\n<h2>能做什么<\/h2>\n<p>把\"知识工作\"按岗位拆成 skill：工程（<code>system-design<\/code> <code>architecture<\/code> <code>tech-debt<\/code> <code>testing-strategy<\/code> <code>debug<\/code> <code>code-review<\/code> <code>deploy-checklist<\/code>）、数据（<code>explore-data<\/code> <code>analyze<\/code> <code>sql-queries<\/code> <code>write-query<\/code> <code>validate-data<\/code> <code>statistical-analysis<\/code> <code>create-viz<\/code> <code>data-visualization<\/code> <code>data-context-extractor<\/code>）、文档与研究（<code>documentation<\/code> <code>knowledge-synthesis<\/code> <code>research-synthesis<\/code> <code>synthesize-research<\/code> <code>search-strategy<\/code> <code>search<\/code> <code>source-management<\/code> <code>view-pdf<\/code> <code>write-spec<\/code>）、运维（<code>incident-response<\/code> <code>runbook<\/code> <code>ticket-triage<\/code> <code>status-report<\/code> <code>daily-briefing<\/code> <code>standup<\/code>）、产品与设计（<code>product-brainstorming<\/code> <code>design-critique<\/code> <code>design-system<\/code> <code>design-handoff<\/code> <code>ux-copy<\/code> <code>accessibility-review<\/code> <code>user-research<\/code>）、以及大量非技术岗位（法务 <code>review-contract<\/code> <code>legal-risk-assessment<\/code>、财务 <code>financial-statements<\/code> <code>variance-analysis<\/code> <code>reconciliation<\/code>、HR <code>interview-prep<\/code> <code>performance-review<\/code>、市场 <code>brand-*<\/code> <code>campaign-plan<\/code> <code>seo-audit<\/code>）。<\/p>\n<p>与 GStack/superpowers 的差别：那两个管<strong>工程流程纪律<\/strong>，这一个管<strong>岗位化产出物<\/strong>——它的 skill 输出往往是文档、看板、分析报告，而不是代码路径。<\/p>\n<h2>何时使用（FDE 视角的高价值子集）<\/h2>\n<table><thead><tr><th>需求<\/th><th>装这个<\/th><th>热度<\/th><th>对应 FDE 位点<\/th><\/tr><\/thead><tbody><tr><td>客户看板/指标可视化<\/td><td><code>data-visualization<\/code> / <code>build-dashboard<\/code> / <code>create-viz<\/code><\/td><td>11.5K / 7.8K / 4.7K<\/td><td>Zone B 演示、Zone C 运维大屏<\/td><\/tr><tr><td>交付文档写作规范<\/td><td><a href=\"#/zone-d-handoff/anthropic-documentation\">documentation<\/a><\/td><td>8.8K<\/td><td>Zone D（已有页，见上）<\/td><\/tr><tr><td>现场数据探查<\/td><td><code>explore-data<\/code> / <code>analyze<\/code> / <code>sql-queries<\/code><\/td><td>5.2K / 5.1K / 3.8K<\/td><td>Zone B，配合 <a href=\"#/zone-b-build/query\">query<\/a><\/td><\/tr><tr><td>架构与技术债评估<\/td><td><code>architecture<\/code> / <code>system-design<\/code> / <code>tech-debt<\/code><\/td><td>5.7K / 6.6K / 5.7K<\/td><td>Zone A 摸底遗留系统<\/td><\/tr><tr><td>事件响应与 runbook<\/td><td><a href=\"#/zone-c-operationalization/incident-response\">incident-response<\/a> / <a href=\"#/zone-c-operationalization/sre-runbooks\">runbook<\/a> / <code>ticket-triage<\/code><\/td><td>5.3K / 2.6K / 2.6K<\/td><td>Zone C（前两页已建）<\/td><\/tr><tr><td>上线清单<\/td><td><a href=\"#/zone-c-operationalization/deploy-checklist\">deploy-checklist<\/a><\/td><td>4.9K<\/td><td>Zone B→C 交界，正好补 gate 证据模板<\/td><\/tr><tr><td>客户资料综合<\/td><td><code>knowledge-synthesis<\/code> / <code>research-synthesis<\/code><\/td><td>5.9K / 3.3K<\/td><td>Zone A，配合 <a href=\"#/zone-a-pre-engagement/firecrawl-crawl\">firecrawl-crawl<\/a><\/td><\/tr><tr><td>PDF 读取<\/td><td><code>view-pdf<\/code><\/td><td>5.8K<\/td><td>Zone A 客户文档（与本地 <a href=\"#/zone-a-pre-engagement/pdf\">pdf<\/a> 重叠）<\/td><\/tr><\/tbody><\/table>\n<p><strong>不用于<\/strong>：<\/p>\n<ul><li><strong>整包安装 230 个 skill<\/strong> —— 会严重污染 skill 触发空间（描述互相抢、上下文膨胀、定位变慢），并且其中大半是法务/财务/HR/市场岗，与 FDE 交付无关<\/li><li>写代码的流程纪律 → <a href=\"#/cross-cutting/using-superpowers-family\">using-superpowers-family<\/a>；发布/QA/安全审计流水线 → <a href=\"#/cross-cutting/gstack-suite\">gstack-suite<\/a><\/li><li>已有本地等价物时：<code>documentation<\/code> vs <a href=\"#/zone-d-handoff/document-generate\">document-generate<\/a>、<code>view-pdf<\/code> vs <a href=\"#/zone-a-pre-engagement/pdf\">pdf<\/a>、<code>code-review<\/code> vs <a href=\"#/cross-cutting/code-review\">code-review<\/a>、<code>search<\/code> vs <a href=\"#/zone-a-pre-engagement/firecrawl-search\">firecrawl-search<\/a><\/li><\/ul>\n<h2>最佳实践<\/h2>\n<ul><li><strong>一次只装一个，并写清\"它替代了谁的哪部分职责\"<\/strong>——这是本 catalog 维护规约第 3 条（装前门禁）的落地点：先跑 <a href=\"#/cross-cutting/skill-criticagent\">skill-criticagent<\/a> 评估，通过才装<\/li><li>装完把该页从 📦 改 ✅、补安装日期，并在本页表格对应行标注\"已装\"<\/li><li>官方 skill 的产出偏\"通用企业知识工作\"，用于制造业/具身客户时要<strong>换术语<\/strong>：把它的模板里的 SaaS 指标替换成现场指标（OEE、停机时长、缺陷率、节拍）<\/li><li>平台适配：这些 skill 源自 Claude 生态，安装时务必指定 <code>--directory ~/.qoder/skills<\/code>（否则只会活在 <code>.claude/skills/<\/code>，Qoder 看不到）<\/li><li>版本巡检用 <code>npx skills check<\/code> / <code>update<\/code>（见 <a href=\"#/cross-cutting/skill-discovery\">skill-discovery<\/a>），季度一次，只处理真在用的<\/li><li><strong>同仓库条目之间也会抢触发<\/strong>：已实测 <code>documentation<\/code> 的 description 含 <code>\"write a runbook\"<\/code>，与 <code>runbook<\/code> 直接重叠——同时装就必须按页内约定切开职责（前者管文档体系，后者管单份手册）<\/li><li>取证方式：不要只看 skills.sh（页面 JS 渲染，常常抓不到正文），直接读 GitHub 上的原始 <code>SKILL.md<\/code>。本仓库四个候选均已按此核实为**单文件、无 <code>scripts/<\/code>、无网络调用**的纯模板 skill<\/li><li>注意命名冲突：本仓库里 <code>architecture<\/code>、<code>debug<\/code>、<code>analyze<\/code>、<code>search<\/code>、<code>update<\/code>、<code>start<\/code>、<code>standup<\/code> 这类<strong>极通用名<\/strong>与其他来源的 skill 高概率撞车——装前确认目录与触发描述是否已被占用<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>若只装 3 个的推荐顺序：<a href=\"#/zone-c-operationalization/deploy-checklist\">deploy-checklist<\/a>（直接补 gate 证据模板）→ <a href=\"#/zone-c-operationalization/sre-runbooks\">runbook<\/a>（Zone C 交付物）→ <a href=\"#/zone-d-handoff/anthropic-documentation\">documentation<\/a>（Zone D 写作规范）——三者均已完成源码取证，风险面同为“纯模板”，可按此顺序直接安装<\/li><li>fde-scope 的 <code>docs/fde_playbook.md<\/code> / <code>fde_sop_full.md<\/code> 结构与 <code>runbook<\/code>、<code>deploy-checklist<\/code> 的输出模板可互相校准<\/li><li>与 <code>fde_scope/skills/<\/code> 的关系：这里是外部生态手册；现场沉淀的自制 skill 走 <code>.fde_scope/skills/<\/code> 文件库，二者不覆盖（维护规约第 5 条）<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/cross-cutting/skill-discovery\">skill-discovery<\/a> · <a href=\"#/cross-cutting/skill-criticagent\">skill-criticagent<\/a> · <a href=\"#/zone-c-operationalization/sre-runbooks\">sre-runbooks<\/a> · <a href=\"#/zone-c-operationalization/incident-response\">incident-response<\/a> · <a href=\"#/zone-d-handoff/anthropic-documentation\">anthropic-documentation<\/a><\/p>"}], "stats": {"total": 89, "installed": 75, "installable": 14, "zoneCount": 5, "scenarioCount": 9}}</script>
<script>
const DATA = JSON.parse(document.getElementById('catalog-data').textContent);
const PAGES = {}; DATA.pages.forEach((p,i)=>{PAGES[p.route]=i;});
const app = document.getElementById('app');

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function badge(st){
  const cls = st==='✅' ? 'ok' : (st==='📦' ? 'pkg' : 'dead');
  const txt = st==='✅' ? '已安装' : (st==='📦' ? '可安装' : '已移除');
  return `<span class="badge ${cls}">${st} ${txt}</span>`;
}
function nav(){
  return `<nav class="nav">
    <div class="brand" onclick="location.hash='#/'">FDE Skills <span>手册库</span></div>
    <div class="zlinks">${DATA.zones.map(z=>`<a href="#/" onclick="goZone('${z.id}')">${z.label.split('·')[0].trim()}</a>`).join('')}</div>
    <input id="q" type="search" placeholder="搜索 89+ skills…" oninput="onSearch(this.value)">
  </nav>`;
}
function goZone(id){ location.hash='#/'; setTimeout(()=>{const el=document.getElementById('zone-'+id); if(el) el.scrollIntoView({behavior:'smooth'});},30); }

function home(){
  const s = DATA.stats;
  return `${nav()}
  <header class="hero">
    <h1>FDE Skills 手册库</h1>
    <p>每个 skill 一页档案：能做什么 · 何时用（含反向边界）· 最佳实践 · 在 fde-scope 项目中的应用位点。按 FDE 四阶段 + 横切元能力组织，先选场景，再进页面。</p>
    <div class="stats">
      <span class="stat"><b>${s.total}</b>个 skill 档案</span>
      <span class="stat"><b>${s.installed}</b>已安装</span>
      <span class="stat"><b>${s.installable}</b>可安装</span>
      <span class="stat"><b>${s.zoneCount}</b>大区</span>
      <span class="stat"><b>${s.scenarioCount}</b>场景入口</span>
    </div>
  </header>
  <div class="wrap">
    <div id="scen-sec">
      <div class="section-h"><h2>按任务开始</h2><p>GTM 场景速查：从任务进入，而不是从目录进入</p></div>
      <div class="scen-grid">
        ${DATA.scenarios.map(sc=>`<div class="scen"><h3>${sc.title}</h3><div class="d">${sc.desc}</div>
          <div class="links">${sc.items.map(i=>`<a href="#/${i.route}">${i.name}</a>`).join('')}</div></div>`).join('')}
      </div>
    </div>
    <div id="zones-sec" style="margin-top:40px">
      <div class="section-h"><h2>按阶段浏览</h2><p>FDE 四 Zone + 横切元能力</p></div>
      <div class="zone-grid">
        ${DATA.zones.map(z=>`<div class="zone" id="zone-${z.id}">
          <div class="zh" style="--accent:${z.accent}"><h3>${z.label}</h3><p>${z.tag} · ${z.skills.length} 项</p></div>
          <div class="zs">${z.skills.map(k=>`<a href="#/${k.route}"><span class="st">${k.status}</span>${k.name}</a>`).join('')}</div>
        </div>`).join('')}
      </div>
    </div>
    <div id="all-sec" style="margin-top:40px">
      <div class="section-h"><h2>全部 skills</h2><p>支持搜索与状态筛选</p></div>
      <div class="toolbar">
        <button class="chip on" data-f="all" onclick="setFilter(this)">全部</button>
        <button class="chip" data-f="✅" onclick="setFilter(this)">✅ 已安装</button>
        <button class="chip" data-f="📦" onclick="setFilter(this)">📦 可安装</button>
        <span id="hit" style="color:var(--muted);font-size:12.5px"></span>
      </div>
      <div class="all-grid" id="all-grid"></div>
      <div class="empty" id="nohit">没有匹配的 skill</div>
    </div>
  </div>
  ${footer()}`;
}

let statusFilter='all';
function setFilter(btn){
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  btn.classList.add('on'); statusFilter=btn.dataset.f; renderAll();
}
function renderAll(){
  const q=(document.getElementById('q')?.value||'').toLowerCase();
  const grid=document.getElementById('all-grid'); if(!grid) return;
  const items=[];
  DATA.zones.forEach(z=>z.skills.forEach(k=>{
    if(statusFilter!=='all' && k.status!==statusFilter) return;
    if(q && !(k.name+' '+k.blurb+' '+z.label).toLowerCase().includes(q)) return;
    items.push({k,z});
  }));
  grid.innerHTML=items.map(({k,z})=>`<a class="sk" href="#/${k.route}">
    <div class="t">${k.name} ${badge(k.status)}</div><div class="b">${esc(k.blurb)}</div>
    <div class="z">${z.label}</div></a>`).join('');
  document.getElementById('nohit').style.display=items.length?'none':'block';
  const hit=document.getElementById('hit'); if(hit) hit.textContent=`${items.length} 项`;
}
function onSearch(v){
  const hasQ=!!v;
  ['scen-sec','zones-sec','hero'].forEach(id=>{const el=document.getElementById(id)||document.querySelector('.hero'); if(el) el.style.display=(hasQ&&id!=='all-sec')?'none':'';});
  const allSec=document.getElementById('all-sec');
  if(hasQ && allSec) allSec.scrollIntoView({behavior:'smooth'});
  renderAll();
}

function page(route){
  const i=PAGES[route]; if(i===undefined){location.hash='#/';return '';}
  const p=DATA.pages[i];
  const prev=DATA.pages[i-1], next=DATA.pages[i+1];
  return `${nav()}
  <div class="wrap">
    <div class="crumb"><a href="#/">主页</a> › ${p.zone} › <b style="color:var(--ink)">${route.split('/').pop()}</b></div>
    <article class="article">${p.html}</article>
    <div class="pager">
      ${prev?`<a href="#/${prev.route}">← ${prev.route.split('/').pop()}</a>`:'<span></span>'}
      ${next?`<a href="#/${next.route}">${next.route.split('/').pop()} →</a>`:'<span></span>'}
    </div>
  </div>
  ${footer()}`;
}

function footer(){
  const s=DATA.stats;
  return `<footer>
    <div>FDE Skills 手册库 · ${s.total} 页（✅ ${s.installed} · 📦 ${s.installable}）· 建档 2026-08-27 · 数据源 README + 各页 Markdown</div>
    <div style="margin-top:6px">一致性门禁 <code>make check-catalog</code> · 本地对账 <code>make check-local</code> · 改目录后 <code>make build-site</code> 重新生成本页</div>
  </footer>`;
}

function render(){
  const h=location.hash.replace(/^#\/?/,'');
  app.innerHTML = h ? page(h) : home();
  renderAll();
  window.scrollTo(0,0);
}
