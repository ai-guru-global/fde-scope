>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>本仓库当前缺口\u003c/strong>：\u003ccode>fde-scope\u003c/code> 仓库里没有任何项目级 Dockerfile / compose（仅 \u003ccode>.venv\u003c/code> 内 agentscope 自带的模板），要把 \u003ccode>fde_scope.web\u003c/code> 或 \u003ccode>pawapp/backend\u003c/code> 容器化交付时正好需要它\u003c/li>\u003cli>客户只接受&quot;给一个镜像 + 一条 docker run&quot;的交付形式\u003c/li>\u003cli>现场镜像体积/拉取时间成为阻塞（工业内网带宽有限）\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：sandbox 运行时隔离——那是 \u003ccode>fde_scope/deploy/sandbox_config.py\u003c/code> 通过 agentscope \u003ccode>DockerWorkspace\u003c/code> 做的事，已有自研实现，不要被外部 skill 改写语义；K8s 编排（→ \u003ca href=\"#/zone-b-build/kubernetes-specialist\">kubernetes-specialist\u003c/a>）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：要把 Python 服务容器化交付时直接说&quot;给 fde-scope 写一个多阶段 Dockerfile&quot;或&quot;现场镜像太大帮我瘦身&quot;\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：先安装 \u003ccode>npx skills add wu529778790/shenzjd-skills@docker-build-deploy --directory ~/.qoder/skills -y\u003c/code>（装前过一次 \u003ca href=\"#/cross-cutting/skill-criticagent\">skill-criticagent\u003c/a> 门禁），再让 agent 按该技能产出 \u003ccode>deploy/Dockerfile\u003c/code> + \u003ccode>deploy/docker-compose.yml\u003c/code>（本仓库当前正好缺失这两件）\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：把 \u003ccode>FDE_SCOPE_MIMO_API_KEY\u003c/code> 等凭据写进镜像层——现场审计会跑 \u003ccode>docker history\u003c/code>，密钥只能运行时 \u003ccode>-e\u003c/code>/secret 注入；\u003ccode>pip install\u003c/code> 层和源码拷贝层不分离——改一行代码就重装全部依赖，层缓存全部失效\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>装前门禁：社区个人源、热度中等 → 先用 \u003ca href=\"#/cross-cutting/skill-criticagent\">skill-criticagent\u003c/a> 评估；不通过就直接用官方 docker docs + 自建 \u003ccode>deploy/Dockerfile\u003c/code>\u003c/li>\u003cli>Python 服务必做：\u003ccode>pip install\u003c/code> 层与源码拷贝层分离（缓存命中）、\u003ccode>--no-cache-dir\u003c/code>、锁定 \u003ccode>python3.12\u003c/code> 与 pyproject 一致、非 root \u003ccode>USER\u003c/code>\u003c/li>\u003cli>敏感信息：\u003ccode>FDE_SCOPE_MIMO_API_KEY\u003c/code> 等只能运行时注入（\u003ccode>-e\u003c/code>/secret），\u003cstrong>不得进入镜像层\u003c/strong>（现场审计会 \u003ccode>docker history\u003c/code>）\u003c/li>\u003cli>复现性：镜像 tag 绑定 git sha；交付文档里写清 \u003ccode>docker inspect\u003c/code> 取版本的方法\u003c/li>\u003cli>离线交付：内网客户要 \u003ccode>docker save/load\u003c/code> 的 tar 流程与校验和\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone B deploy：补齐 \u003ccode>deploy/Dockerfile\u003c/code> + \u003ccode>deploy/docker-compose.yml\u003c/code>（当前缺失，属于可执行的改进项）\u003c/li>\u003cli>Zone D handoff：镜像启动命令与回滚方式是交接文档必答项\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-b-build/kubernetes-specialist\">kubernetes-specialist\u003c/a> · \u003ca href=\"#/zone-b-build/vllm-deploy-docker\">vllm-deploy-docker\u003c/a> · \u003ca href=\"#/zone-b-build/alibabacloud-workbench-cli\">alibabacloud-workbench-cli\u003c/a>\u003c/p>"}, {"route": "zone-b-build/alibabacloud-workbench-cli", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "\u003ch1>alibabacloud-workbench-cli\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（alibabacloud-workbench 插件 v1.1.0）· 类型：运维通道/CLI · FDE 位点：Zone B deploy + Zone C operate\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>面向 \u003cstrong>无公网 IP 的 ECS 实例\u003c/strong> 的 agent 原生 CLI：毫秒级远程命令执行（\u003ccode>workbench exec\u003c/code>）、最大 1GB 文件传输（\u003ccode>upload\u003c/code>/\u003ccode>download\u003c/code>）、会话管理、实例查询过滤、5 种鉴权模式（AK / StsToken / RamRoleArn / CredentialsCmd / CredentialsURI）。插件自带 \u003ccode>scripts/install-cli.sh\u003c/code> 与 \u003ccode>scripts/wb-config.sh\u003c/code>，并有 \u003ccode>/alibabacloud-workbench:setup\u003c/code>、\u003ccode>/alibabacloud-workbench:doctor\u003c/code> 两个 command。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>客户的产线/测试机在 VPC 内、没有跳板机权限，需要&quot;打进去跑一条命令、拿一份日志&quot;\u003c/li>\u003cli>部署 fde-scope 容器或替换配置后需要即时验证（看进程、看端口、看日志）\u003c/li>\u003cli>大文件（数据集/模型权重）进出内网机器\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：有 SSH 直连的环境（直接 ssh 更简单）；非阿里云的机器（→ \u003ca href=\"#/zone-b-build/docker-build-deploy\">docker-build-deploy\u003c/a> / \u003ca href=\"#/zone-b-build/kubernetes-specialist\">kubernetes-specialist\u003c/a>）；批量生产变更（要走 IaC，不要用 exec 手搓）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：客户机器没公网 IP 时直接说&quot;在 i-bp1xxxxx 上跑条命令看看日志&quot;或&quot;把这个日志文件从内网机器拿下来&quot;\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：先跑 \u003ccode>/alibabacloud-workbench:setup\u003c/code>（装 CLI + 配凭据；出问题用 \u003ccode>/alibabacloud-workbench:doctor\u003c/code> 诊断），然后 \u003ccode>workbench list ecs --region cn-hangzhou\u003c/code> 确认能列出目标实例，再 \u003ccode>workbench exec --instance-id &lt;id&gt; --command &quot;df -h&quot;\u003c/code> 打通第一条远程命令\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：在会话里裸跑 \u003ccode>workbench config\u003c/code>——它是交互式的、会挂起等 TTY，配置一律走 \u003ccode>wb-config.sh set\u003c/code>（secret 走 stdin）；每次 \u003ccode>exec\u003c/code> 都是独立 shell、\u003ccode>cd\u003c/code>/\u003ccode>export\u003c/code> 状态不保留——需要共享状态的命令用 \u003ccode>&amp;&amp;\u003c/code> 连成一条，且 \u003ccode>list ecs\u003c/code> 必须带 \u003ccode>--region\u003c/code>\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>首次用先跑 \u003ccode>/alibabacloud-workbench:setup\u003c/code>（装 CLI + 配凭据），出问题用 \u003ccode>:doctor\u003c/code> 诊断，不要手工排查环境变量\u003c/li>\u003cli>凭据优先 \u003ccode>RamRoleArn\u003c/code> / \u003ccode>CredentialsCmd\u003c/code>，\u003cstrong>不要把 AK 写进仓库或 shell 历史\u003c/strong>；用 \u003ccode>wb-config.sh verify\u003c/code> 确认生效\u003c/li>\u003cli>命令幂等：exec 的脚本要能在重跑时不出副作用（现场网络抖动会重试）\u003c/li>\u003cli>需要出网到 \u003ccode>*.aliyuncs.com\u003c/code> 与 Workbench WebSocket，客户防火墙策略要提前申请——这是常见的交付前置条件\u003c/li>\u003cli>大文件传输走 \u003ccode>upload/download\u003c/code>（1GB 上限），不要 base64 塞进 exec\u003c/li>\u003cli>安全边界：现场机器上的任何写操作都要先向客户确认窗口期，日志里不留客户数据\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone B deploy：把 fde-scope 服务落到客户 ECS（内网机）并自检\u003c/li>\u003cli>Zone C operate：现场取日志/看进程/改配置的主通道\u003c/li>\u003cli>docs/architecture.md 的部署侧运维入口\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-b-build/docker-build-deploy\">docker-build-deploy\u003c/a> · \u003ca href=\"#/zone-b-build/kubernetes-specialist\">kubernetes-specialist\u003c/a> · \u003ca href=\"#/zone-c-operationalization/starops\">starops\u003c/a>\u003c/p>"}, {"route": "zone-b-build/alibabacloud-core-suite", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "\u003ch1>alibabacloud-core 套件（阿里云 OpenAPI/CLI 9 件套）\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（Quest Marketplace 插件 alibabacloud-core v1.0.20）· 类型：套件档案 · FDE 位点：Zone B deploy（客户资源在阿里云）\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>通过受约束的 MCP 服务器操作阿里云 OpenAPI：CLI 命令生成与语法指引（\u003ccode>alibabacloud-cli-guidance\u003c/code> / \u003ccode>suggest-cli\u003c/code>）、\u003cstrong>跨账号资源查询\u003c/strong>（\u003ccode>multi-account-query\u003c/code>，RD ListAccounts 拿 UID → \u003ccode>x_assume_account_id\u003c/code> 代入）、SDK 代码生成（\u003ccode>sdk-usage\u003c/code> / \u003ccode>terraform-code-generation\u003c/code>）、存量资源 Terraform 导入（\u003ccode>terraform-import\u003c/code>）、沙箱 RunScript 脚本生成（\u003ccode>mcp-core-script-generate\u003c/code>）、阿里云生态技能发现（\u003ccode>alibabacloud-find-skills\u003c/code>）、MCP 用法总纲（\u003ccode>mcp-core-best-practices\u003c/code>）。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>客户资源在阿里云：资源盘点、多账号/多 Member 环境查询、组网与产品配置确认\u003c/li>\u003cli>要生成调用阿里云 OpenAPI 的 SDK/CLI 代码（fde-scope 集成代码或一次性脚本）\u003c/li>\u003cli>存量资源要转 Terraform 管理的起步（import）\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：百炼/DashScope（→ \u003ca href=\"#/cross-cutting/bailian-cli\">bailian-cli 家族\u003c/a>）；无公网 IP 的单机 ECS 运维（→ \u003ca href=\"#/zone-b-build/alibabacloud-workbench-cli\">alibabacloud-workbench-cli\u003c/a>）；带评审与执行门禁的 IaC 全流程交付（→ \u003ca href=\"#/zone-b-build/alibabacloud-spec-ops-suite\">alibabacloud-spec-ops 套件\u003c/a>）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：客户资源在阿里云时直接提需求，如&quot;列出 cn-hangzhou 区域所有 ECS 实例&quot;、&quot;有没有管理 ECS/RDS/OSS 的 skill&quot;；跨账号场景说&quot;把这两个账号（RD Member）的资源盘一遍&quot;\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：对 agent 说清目标产品与操作即可，套件经 MCP Core 的 \u003ccode>AlibabaCloud___SearchApis\u003c/code> 找到目标 API，再由 \u003ccode>GenerateCLICommand\u003c/code>/\u003ccode>CallCLI\u003c/code> 生成并执行命令；不确定入口就先让 agent 读 \u003ccode>mcp-core-best-practices\u003c/code> 总纲，技能发现走 \u003ccode>alibabacloud-find-skills\u003c/code>\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：多账号直接查只会看到主账号——先 \u003ccode>ListAccounts\u003c/code> 把 alias 解析成 UID，再用 \u003ccode>x_assume_account_id\u003c/code> 代入目标账号；让 agent 手拼 OpenAPI URL/签名——签名、版本、region 应由 MCP server 保证，写操作先 dry-run、输出用 JMESPath 过滤只取需要的字段\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>只读查询直连；\u003cstrong>写操作先 dry-run/plan 思维\u003c/strong>，确认 diff 再发，AccessKey/Secret 永不进命令行与日志\u003c/li>\u003cli>多账号先 \u003ccode>ListAccounts\u003c/code> 解析 alias → UID，再用 \u003ccode>x_assume_account_id\u003c/code> 切换，别手工翻控制台\u003c/li>\u003cli>CLI 输出用 JMESPath 过滤（\u003ccode>--output\u003c/code> / query 参数）只取需要的字段——省 token 也省得误读\u003c/li>\u003cli>走 MCP 工具而不是手拼 OpenAPI URL：签名/版本/.region 由 server 保证\u003c/li>\u003cli>生成的 SDK 代码过一遍 mypy/ruff 再进仓库，别把生成器风格直接合入\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone B 制造业客户的云资源前置检查（网络/白名单/账号权限），对接 connectors 的数据源可达性\u003c/li>\u003cli>deploy/tenant_manager 的租户云资源初始化脚本来源\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-b-build/alibabacloud-spec-ops-suite\">alibabacloud-spec-ops-suite\u003c/a> · \u003ca href=\"#/zone-b-build/alibabacloud-workbench-cli\">alibabacloud-workbench-cli\u003c/a> · \u003ca href=\"#/cross-cutting/bailian-cli\">bailian-cli\u003c/a>\u003c/p>"}, {"route": "zone-b-build/alibabacloud-spec-ops-suite", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "\u003ch1>alibabacloud-spec-ops 套件（阿里云 IaC 工作流 6 件套）\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（Quest Marketplace 插件 alibabacloud-spec-ops v0.1.4，含 2 个评审 agent）· 类型：套件档案 · FDE 位点：Zone B deploy（IaC 交付流水线）\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>把&quot;基础设施需求&quot;变成&quot;可校验、可重放的 Terraform 落地&quot;的完整流水线：\u003ccode>alibabacloud-planning\u003c/code>（需求 → 设计文档）→ \u003ccode>alibabacloud-writing-plans\u003c/code>（设计 → HCL/CLI 计划）→ \u003ccode>alibabacloud-terraform-codegen\u003c/code>（生成 Terraform 代码）→ \u003ccode>alibabacloud-validate\u003c/code>（并行派发 spec-reviewer + code-quality-reviewer 两个 agent 审规格符合性与代码质量）→ \u003ccode>alibabacloud-executing-plans\u003c/code>（执行 apply，\u003cstrong>强制人工确认\u003c/strong>）→ \u003ccode>alibabacloud-ram-permission-diagnose\u003c/code>（403/NoPermission 类权限诊断与修复建议）。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>客户要&quot;资源开通 / 组网 / 上云&quot;的 IaC 交付，需要可评审、可重放的过程资产（design.md → plan → code → apply 记录）\u003c/li>\u003cli>多环境（dev/staging/prod）一致开通，人工点控制台已经要出错的时候\u003c/li>\u003cli>RAM 权限报错排查：先跑诊断，别盲改策略\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：单机 ECS 运维（→ \u003ca href=\"#/zone-b-build/alibabacloud-workbench-cli\">alibabacloud-workbench-cli\u003c/a>）；K8s 应用层部署（→ \u003ca href=\"#/zone-b-build/kubernetes-specialist\">kubernetes-specialist\u003c/a>）；非阿里云的 Terraform（本套件绑定 alicloud provider，通用流程自己写 plan）；只想查资源（→ \u003ca href=\"#/zone-b-build/alibabacloud-core-suite\">alibabacloud-core 套件\u003c/a>）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：客户要&quot;资源开通 / 组网 / 上云&quot;的 IaC 交付时直接描述需求，如&quot;在阿里云上给这套系统开 ECS、RDS 和安全组&quot;——套件以 \u003ccode>alibabacloud-planning\u003c/code> 为唯一入口（其 SKILL.md 自称官方 entry point）\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：对 agent 说&quot;我要在阿里云创建 xxx，先做规划&quot;——planning 澄清需求后把设计产物写进 \u003ccode>.aliyun-ai-ops-spec/&lt;name&gt;/\u003c/code>，之后按 \u003ccode>alibabacloud-writing-plans\u003c/code> → \u003ccode>alibabacloud-terraform-codegen\u003c/code> → \u003ccode>alibabacloud-validate\u003c/code> → \u003ccode>alibabacloud-executing-plans\u003c/code> 顺序推进，不要跳步\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：validate 没过就 apply——流水线顺序不可跳，跳步省下的时间会在回滚时加倍还；遇到 403/NoPermission 就盲改 RAM 策略——先跑 \u003ccode>alibabacloud-ram-permission-diagnose\u003c/code> 拿最小授权建议，别一上来给 \u003ccode>AdministratorAccess\u003c/code>\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>流程顺序不可跳\u003c/strong>：先 planning 再 codegen，validate 不过不 apply——跳步省下的时间都会在回滚时加倍还\u003c/li>\u003cli>apply 前把 plan diff 展示给用户确认（工具强制 \u003ccode>--yes\u003c/code> 是底线不是充分条件）\u003c/li>\u003cli>权限报错先 \u003ccode>ram-permission-diagnose\u003c/code>，输出最小授权建议，别一上来给 \u003ccode>AdministratorAccess\u003c/code>\u003c/li>\u003cli>过程资产（design.md / plan 文件 / 生成代码）归档进交付物目录，Zone D 移交时就是&quot;环境是怎么来的&quot;的答案\u003c/li>\u003cli>存量资源先用 core 套件的 \u003ccode>terraform-import\u003c/code> 收编，再进本流水线管理增量\u003c/li>\u003cli>state 文件是敏感资产：远端远端存储 + 锁，绝不进 git\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>fde-scope 制造业场景的云资源编排章节（数据源所在 VPC/白名单/对象存储开通）\u003c/li>\u003cli>与 connectors 的部署前置条件检查单互补：环境开通以 IaC 记录为准\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-b-build/alibabacloud-core-suite\">alibabacloud-core-suite\u003c/a> · \u003ca href=\"#/zone-b-build/kubernetes-specialist\">kubernetes-specialist\u003c/a> · \u003ca href=\"#/zone-b-build/docker-build-deploy\">docker-build-deploy\u003c/a>\u003c/p>"}, {"route": "zone-b-build/vllm-deploy-docker", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "📦", "html": "\u003ch1>vllm-deploy-docker 📦\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：📦 可安装（未装）· 类型：推理栈部署 · FDE 位点：Zone B deploy（私有化 LLM）\u003cbr>来源：\u003ccode>vllm-project/vllm-skills@vllm-deploy-docker\u003c/code>（官方 org）· 热度：174 installs · 详情：https://skills.sh/vllm-project/vllm-skills/vllm-deploy-docker\u003cbr>同系列：\u003ccode>vllm-deploy-simple\u003c/code>（148）、\u003ccode>vllm-deploy-k8s\u003c/code>（112）\u003cbr>安装：\u003ccode>npx skills add vllm-project/vllm-skills@vllm-deploy-docker --directory ~/.qoder/skills -y\u003c/code>\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>vLLM 官方容器部署指导：镜像选择（CUDA 版本/driver 匹配）、\u003ccode>--gpu-memory-utilization\u003c/code>/\u003ccode>--max-model-len\u003c/code>/tensor-parallel 参数、OpenAI 兼容 server 启动、量化与显存预算、健康检查与常见启动失败定位。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>客户要求\u003cstrong>私有化 LLM\u003c/strong>（数据不出厂），fde-scope 的 \u003ccode>llm\u003c/code> 层要指向内网 OpenAI 兼容端点\u003c/li>\u003cli>现场 GPU 机器（A10/A100/4090/昇腾）上把开源模型起成服务\u003c/li>\u003cli>评估&quot;这个模型在这张卡上能不能跑、能撑多少并发&quot;\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：只用 MiMo Token Plan 的公有云路径（→ \u003ca href=\"#/zone-b-build/bailian-train-deploy\">bailian-train-deploy\u003c/a>）；边缘小设备（→ \u003ccode>nvidia/skills@jetson-llm-serve\u003c/code>，1.1K）；昇腾 NPU（→ \u003ca href=\"#/zone-b-build/vllm-ascend\">vllm-ascend\u003c/a>）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：客户要私有化 LLM 时直接说&quot;在这台 A100 上把 Qwen 起成 OpenAI 兼容服务&quot;或&quot;评估这个模型在这张卡上能撑多少并发&quot;\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：先安装 \u003ccode>npx skills add vllm-project/vllm-skills@vllm-deploy-docker --directory ~/.qoder/skills -y\u003c/code>（官方 org 出品，装前仍过一次 \u003ca href=\"#/cross-cutting/skill-criticagent\">skill-criticagent\u003c/a> 门禁），再让 agent 按现场 GPU 卡型给出镜像选择与启动参数（\u003ccode>--gpu-memory-utilization\u003c/code>/\u003ccode>--max-model-len\u003c/code>/tensor-parallel）\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：不算显存预算直接起服务——\u003ccode>模型权重 + KV cache\u003c/code> 超了就 OOM，\u003ccode>--gpu-memory-utilization\u003c/code> 从 0.9 起、OOM 时先降 \u003ccode>--max-model-len\u003c/code>；交付时不锁版本——vLLM/CUDA/driver/模型 revision 四元组不记录就无法复现，现场网络受限时镜像与权重还要提前 \u003ccode>docker save\u003c/code> + 镜像源离线搬运\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>官方 org 出品，可信度高于社区同类，可直接作为主选；仍建议装前用 \u003ca href=\"#/cross-cutting/skill-criticagent\">skill-criticagent\u003c/a> 过一次门禁（版本迭代快，看是否与当前 vLLM 版本相符）\u003c/li>\u003cli>与 fde-scope 的契约：vLLM 起来后以 \u003cstrong>OpenAI 兼容 base_url + key\u003c/strong> 接入，凭据仍走 \u003ccode>FDE_SCOPE_MIMO_API_KEY\u003c/code> 风格的环境变量注入，不落配置文件\u003c/li>\u003cli>显存预算先算再跑：\u003ccode>模型权重 + KV cache\u003c/code>，\u003ccode>--gpu-memory-utilization\u003c/code> 从 0.9 起，OOM 时先降 \u003ccode>--max-model-len\u003c/code>\u003c/li>\u003cli>现场网络受限：镜像与权重都要走离线搬运（\u003ccode>docker save\u003c/code> + modelscope/HF 镜像源），提前列清单\u003c/li>\u003cli>版本锁定：交付时记录 vLLM / CUDA / driver / 模型 revision 四元组，否则无法复现\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone B deploy：\u003ccode>fde_scope.llm\u003c/code> 的私有化后端落地\u003c/li>\u003cli>Zone A air-gap gate：气隙环境下的模型服务可行性证据（[air_gap.py \u003ccode>AirGapGate\u003c/code>](../../../fde_scope/engagement/gates/air_gap.py)）\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-b-build/vllm-ascend\">vllm-ascend\u003c/a> · \u003ca href=\"#/zone-b-build/bailian-train-deploy\">bailian-train-deploy\u003c/a> · \u003ca href=\"#/zone-b-build/docker-build-deploy\">docker-build-deploy\u003c/a>\u003c/p>"}, {"route": "zone-b-build/vllm-ascend", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "📦", "html": "\u003ch1>vllm-ascend 📦\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：📦 可安装（未装）· 类型：推理栈部署（昇腾 NPU） · FDE 位点：Zone B deploy\u003cbr>候选 A（知识型）：\u003ccode>ascend-ai-coding/awesome-ascend-skills@vllm-ascend\u003c/code> · 63 installs · repo 164★ · https://skills.sh/ascend-ai-coding/awesome-ascend-skills/vllm-ascend\u003cbr>候选 B（官方 org · 工作流型）：\u003ccode>ascend/agent-skills@vllm-ascend-deploy\u003c/code> · 91 installs · repo 37★ · https://skills.sh/ascend/agent-skills/vllm-ascend-deploy\u003cbr>安装（择一）：\u003ccode>npx skills add ascend/agent-skills@vllm-ascend-deploy --directory ~/.qoder/skills -y\u003c/code>\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>在\u003cstrong>华为昇腾 NPU\u003c/strong> 上跑 vLLM 推理服务：\u003ccode>vllm-ascend\u003c/code> 插件安装与版本匹配、必需环境变量（\u003ccode>VLLM_WORKER_MULTIPROC_METHOD=spawn\u003c/code>）、Ascend 优化 kernel、量化（W8A8 等）、多卡分布式推理。候选 B 额外提供一键部署工作流：SSH 检查 → 解析模型 → NPU 检查 → 配置发现 → 用户确认 → 执行部署 → 监控启动 → 验证服务。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>客户是国产算力环境（Atlas 800/300I、昇腾 910B），CUDA 路径不可用——国内工业/政企项目高频\u003c/li>\u003cli>现场已经在昇腾上起了服务但报 kernel/版本不匹配，需要按插件矩阵定位\u003c/li>\u003cli>写&quot;私有化 LLM 可行性&quot;方案时评估 NPU 侧的支持面\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：NVIDIA 卡（→ \u003ca href=\"#/zone-b-build/vllm-deploy-docker\">vllm-deploy-docker\u003c/a>）；昇腾\u003cstrong>算子开发\u003c/strong>（属另一类需求，registry 有 \u003ccode>ascend/agent-skills@ascendc-operator-*\u003c/code> 系列，超出 FDE 交付范围）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：客户是昇腾环境（Atlas 800/300I、910B）时说&quot;在昇腾上把模型起成 vLLM 服务&quot;，或现场服务报 kernel/版本不匹配需要按插件矩阵定位\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：先过 \u003ca href=\"#/cross-cutting/skill-criticagent\">skill-criticagent\u003c/a> 门禁人工审 SKILL.md（重点看候选 B 是否自动执行远程命令），再安装 \u003ccode>npx skills add ascend/agent-skills@vllm-ascend-deploy --directory ~/.qoder/skills -y\u003c/code>（工作流型候选 B；只要知识参考就选候选 A \u003ccode>ascend-ai-coding/awesome-ascend-skills@vllm-ascend\u003c/code>，不改环境、风险更低）\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：版本矩阵错配即失效——\u003ccode>vllm\u003c/code>/\u003ccode>vllm-ascend\u003c/code>/CANN/NPU driver 四元组强绑定，任一升级都可能起不来；候选 B 会自动执行 SSH 远程命令且安全审计三项均 Warn——绝不把 SSH key/密码明文交给 skill，凭据走 \u003ca href=\"#/zone-b-build/alibabacloud-workbench-cli\">alibabacloud-workbench-cli\u003c/a> 或客户跳板机审批流程\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>⚠️ \u003cstrong>安全审计现状\u003c/strong>（skills.sh 页面可见，建档日 2026-08-27 复核）：候选 A = Agent Trust Hub \u003cstrong>Fail\u003c/strong> / Socket Pass / Snyk Warn；候选 B = 三项均 \u003cstrong>Warn\u003c/strong>。两者都\u003cstrong>未通过干净审计\u003c/strong>，属于必须先过门禁的类型\u003c/li>\u003cli>强制门禁：装前用 \u003ca href=\"#/cross-cutting/skill-criticagent\">skill-criticagent\u003c/a> 人工审 SKILL.md 全文，重点看候选 B 是否会\u003cstrong>自动执行远程命令\u003c/strong>（SSH + 部署脚本）——这类 skill 相当于给 agent 一把现场钥匙\u003c/li>\u003cli>若只用候选 A（纯知识、不改环境），风险显著更低，优先作为默认选择；需要执行部署时更宁愿手写 runbook\u003c/li>\u003cli>版本矩阵必须查官方文档：\u003ccode>vllm\u003c/code> / \u003ccode>vllm-ascend\u003c/code> / \u003ccode>CANN\u003c/code> / NPU driver 四元组强绑定，任一升级都可能失效\u003c/li>\u003cli>现场凭据：绝不把 SSH key/密码交给 skill 明文使用；走 \u003ca href=\"#/zone-b-build/alibabacloud-workbench-cli\">alibabacloud-workbench-cli\u003c/a> 或客户跳板机审批流程\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone B deploy：国产化算力客户的模型服务落地路径\u003c/li>\u003cli>Zone A：\u003ccode>fat_sat\u003c/code> gate 前评估“NPU + 目标模型”在客户设备上是否跑得动\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-b-build/vllm-deploy-docker\">vllm-deploy-docker\u003c/a> · \u003ca href=\"#/cross-cutting/skill-criticagent\">skill-criticagent\u003c/a> · \u003ca href=\"#/zone-b-build/alibabacloud-workbench-cli\">alibabacloud-workbench-cli\u003c/a>\u003c/p>"}, {"route": "zone-b-build/huggingface-local-models", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "\u003ch1>huggingface-local-models\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（hugging-face 插件 v1.0.0）· 类型：本地推理 · FDE 位点：Zone B build/deploy（客户内网 &amp; air-gap）\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>用 llama.cpp + GGUF 把开源模型跑在 CPU / Mac Metal / CUDA / ROCm 上：GGUF 检索与精确文件定位、量化档位选择、本地起服务、格式转换、OpenAI 兼容 serving。配套 \u003ccode>hf-mem\u003c/code> 可先估算权重加载内存再决定下哪个档。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>客户数据不能出域 / 无公网（air-gap 工厂、政务、金融内网）——LLM 能力只能本地化\u003c/li>\u003cli>现场用 MacBook 演示 Agent 能力，不依赖任何云端 API\u003c/li>\u003cli>低成本 PoC：单机跑通&quot;LLM 参与的链路&quot;，再决定是否上 GPU\u003c/li>\u003cli>给 fde-scope 这类&quot;LLM 可选回退&quot;系统准备本地端点做联调\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：有 GPU 集群且要并发吞吐（→ \u003ca href=\"#/zone-b-build/vllm-deploy-docker\">vllm-deploy-docker\u003c/a>）；昇腾 NPU（→ \u003ca href=\"#/zone-b-build/vllm-ascend\">vllm-ascend\u003c/a>）；模型训练/微调（→ \u003ca href=\"#/zone-c-operationalization/huggingface-llm-trainer\">huggingface-llm-trainer\u003c/a>）；客户已采购商用 API（直接接，别自建）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：&quot;我想在本机（Mac/CPU）上跑个开源模型试试&quot;、&quot;客户内网没有外网，LLM 只能本地化怎么办&quot;\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：让 agent 按技能流程走：先跑 \u003ccode>hf-mem\u003c/code> 估内存选量化档，再从 Hub 用 \u003ccode>apps=llama.cpp\u003c/code> 过滤检索 GGUF，最后 \u003ccode>llama-server -hf &lt;repo&gt;:&lt;QUANT&gt;\u003c/code> 起 OpenAI 兼容本地服务\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：下载前不估内存——现场机器爆内存是最难看的演示事故，长上下文还要把 KV cache 算进预算，别只看权重；猜 \u003ccode>.gguf\u003c/code> 文件名——必须用 \u003ccode>https://huggingface.co/api/models/&lt;repo&gt;/tree/main\u003c/code> 确认精确文件名，自定义命名要用 \u003ccode>--hf-repo\u003c/code> + \u003ccode>--hf-file\u003c/code>，gated 仓库先 \u003ccode>hf auth login\u003c/code>\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>量化选档：Q4_K_M 是吞吐/质量默认起点；给客户演示优先 Q5/Q6 起步，&quot;答得慢但对&quot;好过&quot;快但胡说&quot;\u003c/li>\u003cli>下载前先跑 \u003ccode>hf-mem\u003c/code> 估内存，现场机器爆内存是最难看的演示事故\u003c/li>\u003cli>用 OpenAI 兼容端点接系统：本仓库 \u003ccode>fde_scope/config.py\u003c/code> 的 LLM 接入即 OpenAI 兼容——本地服务 URL 指过去、\u003ccode>FDE_SCOPE_MIMO_API_KEY\u003c/code> 给任意占位值即可全链路验证回退逻辑\u003c/li>\u003cli>上下文长度吃内存：长上下文需求（语料摘要、工单全文）要把 KV cache 算进预算，别只看权重\u003c/li>\u003cli>许可证三查：GGUF 的发布许可、基座模型许可（部分禁商用/需申请）、客户合规红线\u003c/li>\u003cli>版本固化：把 GGUF 文件名 + llama.cpp commit 写进交付记录，别用&quot;latest&quot;复现不了\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone B manufacturing 场景的 air-gap 部署形态（fde_scope/deploy 无网部署分支）\u003c/li>\u003cli>LLM 回退链路测试：本地端点 → 断电 → 规则兜底，三态验证\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-b-build/vllm-deploy-docker\">vllm-deploy-docker\u003c/a> · \u003ca href=\"#/zone-b-build/vllm-ascend\">vllm-ascend\u003c/a> · \u003ca href=\"#/zone-b-build/huggingface-best\">huggingface-best\u003c/a> · \u003ca href=\"#/cross-cutting/bailian-cli\">bailian-cli\u003c/a>\u003c/p>"}, {"route": "zone-b-build/huggingface-best", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "\u003ch1>huggingface-best\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（hugging-face 插件 v1.0.0）· 类型：模型选型 · FDE 位点：Zone A 方案设计 / Zone B build\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>回答&quot;这个任务用什么模型最好&quot;：按任务类型、榜单成绩、生态成熟度对比候选模型并给出推荐。核心是\u003cstrong>帮客户做决策\u003c/strong>，不是罗列资料。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>客户/方案书里的模型选型章节：&quot;我们要做缺陷分类，选哪个模型？&quot;\u003c/li>\u003cli>现有模型不达标时的替代候选调研\u003c/li>\u003cli>与 \u003ca href=\"#/cross-cutting/bailian-cli\">bailian-model-recommend\u003c/a> 互补：本 skill 覆盖\u003cstrong>开源/HF 生态\u003c/strong>，bailian 覆盖\u003cstrong>百炼商用 API\u003c/strong>——客户问&quot;开源自部署还是直接买 API&quot;时两边都要出数\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：合同已锁定模型的场景（别推翻商业决定）；百炼在售模型选型（→ bailian-model-recommend）；榜单之外需要实测的最终决策（推荐只是假设，→ \u003ca href=\"#/zone-b-build/huggingface-community-evals\">huggingface-community-evals\u003c/a> 实测）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：直接问选型问题，如&quot;缺陷分类用什么模型最好&quot;、&quot;哪个模型能跑在我的 MacBook 上&quot;（skill 的触发词就是 &quot;best model for X&quot;、&quot;what model should I use for&quot; 这类问句）\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：一句话给出任务 + 硬件约束，如&quot;我要做工单文本分类，只有 16GB 内存的 Mac，推荐几个模型&quot;——skill 会查 HF 官方 benchmark 榜单、按设备内存过滤并输出带分数的候选对比表\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：不说硬件约束——skill 会跳过设备过滤直接返回最强模型，推荐出一堆现场跑不动的（内存换算：fp16≈内存GB÷2、Q4≈内存GB×2）；把推荐当结论——推荐只是&quot;待验证假设&quot;，上下文窗口/许可证/硬件三查之后还要在客户数据上实测（→ \u003ca href=\"#/zone-b-build/huggingface-community-evals\">huggingface-community-evals\u003c/a>）才能写进方案\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>推荐 ≠ 测评：把推荐当&quot;待验证假设&quot;，在\u003cstrong>客户自己的数据\u003c/strong>上跑 eval 后才写进方案\u003c/li>\u003cli>三查必做：上下文窗口（对得上客户工单/图纸文本长度吗）、许可证（商用/air-gap 是否允许）、硬件需求（客户机房有什么卡）\u003c/li>\u003cli>榜单分数与客户任务分布未必对齐：写清&quot;推荐依据 + 未覆盖的假设&quot;，别把 Leaderboard 当真理\u003c/li>\u003cli>输出物固定为对比表：候选 × 上下文/许可/硬件/预估成本，留档进方案书，未来换模型有基线\u003c/li>\u003cli>小模型优先：边缘/内网场景，3B~8B 能过验收就不用 70B（→ \u003ca href=\"#/zone-b-build/huggingface-local-models\">huggingface-local-models\u003c/a>）\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone A 成功标准定义时的&quot;模型假设&quot;一行（谁、哪个尺寸、什么许可）\u003c/li>\u003cli>fde-scope 语料管线的嵌入模型选型（对接 train-sentence-transformers 前的候选筛选）\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-b-build/huggingface-community-evals\">huggingface-community-evals\u003c/a> · \u003ca href=\"#/zone-b-build/huggingface-local-models\">huggingface-local-models\u003c/a> · \u003ca href=\"#/cross-cutting/bailian-cli\">bailian-cli 家族（含 model-recommend）\u003c/a>\u003c/p>"}, {"route": "zone-b-build/huggingface-community-evals", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "\u003ch1>huggingface-community-evals\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（hugging-face 插件 v1.0.0）· 类型：评估执行 · FDE 位点：Zone B validate\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>在\u003cstrong>本地硬件\u003c/strong>上对 HF Hub 模型跑评估：\u003ccode>inspect-ai\u003c/code> 与 \u003ccode>lighteval\u003c/code> 两条路线、backend 选型（vLLM / Transformers / accelerate）、GPU 显存适配、任务选择、smoke test 与 backend 回退策略。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>需要拿\u003cstrong>公开 benchmark\u003c/strong>（MMLU/GSM8K/HumanEval/…）给客户证明&quot;这个模型比那个强&quot;\u003c/li>\u003cli>现场机器只有消费级 GPU，要选能跑动的 backend 与并发\u003c/li>\u003cli>与 \u003ccode>fde_scope.eval\u003c/code> 的自研业务指标做交叉验证：公开分 + 业务分双证\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：HF Jobs 云端编排（→ \u003ca href=\"#/zone-c-operationalization/huggingface-llm-trainer\">huggingface-llm-trainer\u003c/a>）、model-card PR / \u003ccode>.eval_results\u003c/code> 发布自动化（skill 自身声明的边界）、客户私有数据评估（→ 用 \u003ccode>fde_scope.eval\u003c/code>，数据不出机）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：&quot;帮我在本地 GPU 上跑 MMLU/GSM8K，证明这个模型比那个强&quot;、&quot;现场只有消费级显卡，eval 用哪个 backend&quot;\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：先做环境预检：\u003ccode>uv --version\u003c/code>、\u003ccode>printenv HF_TOKEN\u003c/code>、\u003ccode>nvidia-smi\u003c/code>，然后让 agent 选框架（inspect-ai 或 lighteval）与 backend（vLLM/Transformers/accelerate），加 \u003ccode>--limit 10\u003c/code>（lighteval 为 \u003ccode>--max-samples 10\u003c/code>）跑 smoke test，通过后再全量\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：跳过 smoke test 直接全量——显存/依赖问题会浪费半天，固定顺序是先 5~10 题小样本打通 backend；对比两个模型时 chat template / \u003ccode>max_gen_toks\u003c/code> / few-shot 数不一致——结论直接作废，这是现场最常见的坑\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>顺序固定：先 smoke test（小样本 5~10 题）打通 backend，再全量——直接全量最容易在显存/依赖上浪费半天\u003c/li>\u003cli>backend 优先级：本地 GPU 大模型用 vLLM，小模型/需要 logits 的用 Transformers，多卡分片用 accelerate\u003c/li>\u003cli>公平比较：不同模型的 chat template / max_gen_toks / few-shot 数必须一致，否则结论无效（现场最常见的坑）\u003c/li>\u003cli>与本项目契约：把外部 benchmark 结果当&quot;参考量&quot;，\u003ccode>EvalReport\u003c/code> 的 \u003ccode>metrics\u003c/code> 仍以 \u003ccode>fde_scope/eval/metrics.py\u003c/code> 的业务指标（intent_accuracy / first_contact / adoption / escalation / handle_time_ratio）为准\u003c/li>\u003cli>许可证：商用评估要记录 benchmark 与模型的 license 限制（部分 benchmark 禁止用于商业宣称）\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone B \u003ccode>validate\u003c/code>：模型选型证据链的公开分部分\u003c/li>\u003cli>\u003ccode>fde_scope/eval/benchmark.py\u003c/code> 的外部对照；docs/evaluation.md 补强\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-b-build/evaluating-llms-harness\">evaluating-llms-harness\u003c/a> · \u003ca href=\"#/zone-b-build/phoenix-evals\">phoenix-evals\u003c/a> · \u003ca href=\"#/zone-b-build/vllm-deploy-docker\">vllm-deploy-docker\u003c/a>\u003c/p>"}, {"route": "zone-b-build/phoenix-evals", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "📦", "html": "\u003ch1>phoenix-evals 📦\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：📦 可安装（未装）· 类型：评估指标开发 · FDE 位点：Zone B validate + Zone C 观测\u003cbr>来源：\u003ccode>arize-ai/phoenix@phoenix-evals\u003c/code>（官方 org，repo 11.2K★）· 热度：1.3K installs · https://skills.sh/arize-ai/phoenix/phoenix-evals\u003cbr>安全审计：Agent Trust Hub \u003cstrong>Pass\u003c/strong> · Socket \u003cstrong>Pass\u003c/strong> · Snyk \u003cstrong>Pass\u003c/strong>（三项全绿，2026-08-27 复核）\u003cbr>安装：\u003ccode>npx skills add arize-ai/phoenix@phoenix-evals --directory ~/.qoder/skills -y\u003c/code>\u003cbr>说明：早期建档时记为 \u003ccode>phoenix-evals-new-metric\u003c/code>，registry 中不存在该名，已更正为官方真实条目 \u003ccode>phoenix-evals\u003c/code>\u003cbr>同系列：\u003ccode>phoenix-tracing\u003c/code>（1.4K，观测接入）、\u003ccode>phoenix-cli\u003c/code>（1.4K）\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>为 AI/LLM 应用\u003cstrong>构建评估器\u003c/strong>（evaluator）：code-first 规则打分 + LLM-as-judge 处理语义细节，并用人工标注做校验闭环。含 Phoenix 的 evals API 用法、指标编写范式、experiments 对比。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>\u003ccode>fde_scope/eval/metrics.py\u003c/code> 只有规则型指标，需要新增\u003cstrong>语义类\u003c/strong>指标（回答是否解决了工单诉求、是否符合客户话术规范）\u003c/li>\u003cli>bad case 规模化挖掘：\u003ccode>BadCaseMiner\u003c/code> 之外想要可复用的 judge 指标库\u003c/li>\u003cli>交付时要给客户一个可持续跑的评估框架，而不是一次性脚本\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：公开 benchmark 跑分（→ \u003ca href=\"#/zone-b-build/huggingface-community-evals\">huggingface-community-evals\u003c/a> / \u003ca href=\"#/zone-b-build/evaluating-llms-harness\">evaluating-llms-harness\u003c/a>）；纯 APM/链路追踪（→ \u003ca href=\"#/zone-c-operationalization/sentry-mcp\">sentry-mcp\u003c/a>）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：&quot;给回答是否解决工单写一个语义评估指标&quot;、&quot;bad case 想用 LLM-as-judge 规模化挖掘&quot;\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：先安装 \u003ccode>npx skills add arize-ai/phoenix@phoenix-evals --directory ~/.qoder/skills -y\u003c/code>（官方 org、三项审计全绿可直接装；按规约补一次 \u003ca href=\"#/cross-cutting/skill-criticagent\">skill-criticagent\u003c/a> 结论回填本页），再让 agent 按 code-first 规则 + LLM-as-judge 范式实现指标，落地为 \u003ccode>fde_scope/eval/\u003c/code> 里的函数并注册进 \u003ccode>METRICS\u003c/code>\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：judge 分数直接对客户讲话——skill 的核心主张是 &quot;validate against humans&quot;，先在同一批样本上做 human-judge 一致性抽检，一致率不足别用；judge 走外部 LLM 时客户原文会出境——气隙/合规客户必须换本地 judge（→ \u003ca href=\"#/zone-b-build/vllm-deploy-docker\">vllm-deploy-docker\u003c/a>），且每条样本至少一次 LLM 调用，1k 数据集成本要预估\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>该 skill 三项安全审计全绿且来自官方 org，是本 catalog 里\u003cstrong>风险最低的 📦 项之一\u003c/strong>，可直接安装；仍按规约走一次 \u003ca href=\"#/cross-cutting/skill-criticagent\">skill-criticagent\u003c/a> 并把结论回填本页\u003c/li>\u003cli>Judge 也是模型：先在同一批样本上做 \u003cstrong>human-judge 一致性抽检\u003c/strong>（skill 的核心主张：&quot;validate against humans&quot;），一致率不足就别拿分数对客户讲话\u003c/li>\u003cli>成本：LLM-as-judge 每条样本一次以上调用，1k 数据集评估成本要预估；规则指标能覆盖的不要上 judge\u003c/li>\u003cli>数据边界：judge 用的是外部 LLM 时，客户原文会出境——气隙/合规客户必须换本地 judge（→ \u003ca href=\"#/zone-b-build/vllm-deploy-docker\">vllm-deploy-docker\u003c/a>）\u003c/li>\u003cli>与本项目整合姿势：把新指标实现为 \u003ccode>fde_scope/eval/\u003c/code> 里的函数并注册进 \u003ccode>METRICS\u003c/code>，不要另起一套评估栈\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone B \u003ccode>validate\u003c/code>：语义指标补齐（intent/话术合规/引用正确性）\u003c/li>\u003cli>Zone C：上线后持续评估与漂移监测的指标来源\u003c/li>\u003cli>\u003ccode>fde_scope/eval/manufacturing_metrics.py\u003c/code> 的工业场景语义扩展\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-b-build/huggingface-community-evals\">huggingface-community-evals\u003c/a> · \u003ca href=\"#/zone-b-build/evaluating-llms-harness\">evaluating-llms-harness\u003c/a> · \u003ca href=\"#/zone-b-build/rag-agent-builder\">rag-agent-builder\u003c/a>\u003c/p>"}, {"route": "zone-b-build/evaluating-llms-harness", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "📦", "html": "\u003ch1>evaluating-llms-harness 📦\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：📦 可安装（未装）· 类型：评估基准知识 · FDE 位点：Zone B validate\u003cbr>来源：\u003ccode>firecrawl/ai-research-skills@evaluating-llms-harness\u003c/code> · 热度：22 installs · repo 17★ · https://skills.sh/firecrawl/ai-research-skills/evaluating-llms-harness\u003cbr>安全审计：Agent Trust Hub \u003cstrong>Pass\u003c/strong> · Socket \u003cstrong>Pass\u003c/strong> · Snyk \u003cstrong>Warn\u003c/strong>（2026-08-27 复核）\u003cbr>备选：\u003ccode>ovachiever/droid-tings@evaluating-llms-harness\u003c/code>（53 installs，第三方同名）\u003cbr>安装：\u003ccode>npx skills add firecrawl/ai-research-skills@evaluating-llms-harness --directory ~/.qoder/skills -y\u003c/code>\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>EleutherAI \u003cstrong>lm-evaluation-harness\u003c/strong>（\u003ccode>lm-eval\u003c/code>）的用法手册：一条命令在 60+ 学术基准（MMLU / GSM8K / HellaSwag / …）上评估 HF 模型，涵盖 \u003ccode>--model hf|vllm\u003c/code>、task 组合、batch/device 配置、结果解读与自定义 task。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>需要\u003cstrong>标准化、可引用\u003c/strong>的公开分数（客户/评审会拿论文数字对比）\u003c/li>\u003cli>已装 \u003ccode>huggingface-community-evals\u003c/code> 但想在 inspect-ai/lighteval 之外再用 \u003ccode>lm-eval\u003c/code> 交叉核对\u003c/li>\u003cli>需要给自定义评估写新 task（本地化业务基准）时的参考范式\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：客户工单/产线数据评估（→ \u003ccode>fde_scope.eval\u003c/code> + \u003ca href=\"#/zone-b-build/phoenix-evals\">phoenix-evals\u003c/a>）；生产回归测试（学术基准不是回归门禁）；只要一个 quick score 时用已装的 \u003ca href=\"#/zone-b-build/huggingface-community-evals\">huggingface-community-evals\u003c/a> 即可，不必双栈并存。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：&quot;用 lm-eval 在 MMLU/GSM8K 上跑一个可引用的标准分&quot;、&quot;怎么给本地业务基准写一个自定义 task&quot;\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：先过 \u003ca href=\"#/cross-cutting/skill-criticagent\">skill-criticagent\u003c/a> 门禁，再安装 \u003ccode>npx skills add firecrawl/ai-research-skills@evaluating-llms-harness --directory ~/.qoder/skills -y\u003c/code>；然后另建独立 venv 跑 \u003ccode>pip install lm-eval\u003c/code>，让 agent 按 \u003ccode>--model hf|vllm\u003c/code> 选 backend 跑目标 task\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：把 \u003ccode>lm-eval\u003c/code> 装进项目主环境——它的 transformers 版本约束常与主环境冲突，必须独立 venv；报告分数不注明 harness 版本 + task 配置 + few-shot 数——不同来源的数字混在一起会得出错误结论，气隙环境还要提前备好离线数据集与 \u003ccode>--include_path\u003c/code>\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>⚠️ 定位判断：这是\u003cstrong>知识型\u003c/strong> skill（教 \u003ccode>lm-eval\u003c/code> 用法），不是执行器。装的唯一理由是&quot;经常要用 lm-eval 且记不住参数矩阵&quot;。若已覆盖在 huggingface-community-evals 里，\u003cstrong>可以不装\u003c/strong>，避免评估栈碎片化\u003c/li>\u003cli>热度只有 22、repo 17★、Snyk Warn：属于&quot;内容看着没问题但社区验证薄&quot;，按规约先过 \u003ca href=\"#/cross-cutting/skill-criticagent\">skill-criticagent\u003c/a>\u003c/li>\u003cli>环境隔离：\u003ccode>pip install lm-eval\u003c/code> 装到独立 venv，它的 transformers 版本约束常与项目主环境冲突\u003c/li>\u003cli>结果可比性：报告分数必须注明 harness 版本 + task 配置 + few-shot 数，否则不同来源的数字混在一起会得出错误结论\u003c/li>\u003cli>离线现场：\u003ccode>lm-eval\u003c/code> 会下载数据集，气隙环境需提前准备离线数据集与 \u003ccode>--include_path\u003c/code>\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone B \u003ccode>validate\u003c/code>：模型选型公开分第二来源\u003c/li>\u003cli>docs/evaluation.md 的 benchmark 章节参考\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-b-build/huggingface-community-evals\">huggingface-community-evals\u003c/a> · \u003ca href=\"#/zone-b-build/phoenix-evals\">phoenix-evals\u003c/a> · \u003ca href=\"#/zone-b-build/vllm-deploy-docker\">vllm-deploy-docker\u003c/a>\u003c/p>"}, {"route": "zone-b-build/huggingface-spaces", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "\u003ch1>huggingface-spaces\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（hugging-face 插件 v1.0.0）· 类型：Demo 托管 · FDE 位点：Zone B prototype / Zone D handoff 演示\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>在 Hugging Face Spaces 上构建、部署、维护应用：Gradio / Docker / Static 三种 SDK，ZeroGPU 与专用硬件、模型加载、调试、buckets、inference providers、社区 grants 申请。产物是一个\u003cstrong>可分享的公网链接\u003c/strong>。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>给干系人一个&quot;点开就能玩&quot;的 POC 链接（售前比截图有说服力一个量级）\u003c/li>\u003cli>模型/数据集的配套 demo：训练完直接挂 Gradio 演示（配合 lora-space-builder 发 LoRA demo）\u003c/li>\u003cli>团队内轻量工具页：语料抽检、评测结果浏览器\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：客户真实数据上云（出境/合规不过就别想，→ 本地部署）；生产负载（Spaces 会休眠、无 SLA）；客户内网访问不到外网的演示（准备离线版）；包含客户敏感配置的镜像（公开 Space = 公开代码）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：&quot;给干系人做一个点开就能玩的 demo 页&quot;、&quot;把这个模型/LoRA 发成 HF Space&quot;\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：先确认 \u003ccode>which hf\u003c/code> 有 CLI 且 \u003ccode>hf auth whoami\u003c/code> 已登录（未登录跑 \u003ccode>hf auth login\u003c/code>，需要 write token），再让 agent 用 \u003ccode>hf spaces search &quot;&lt;模型或任务&gt;&quot; --sdk gradio --limit 10\u003c/code> 找同类先例，参考其 \u003ccode>app.py\u003c/code> 的工作模式再动手\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：密钥写进代码或 requirements——公开 Space 默认一切可见，密钥只能走 Space secrets；ZeroGPU 忘加 \u003ccode>@spaces.GPU\u003c/code> 装饰、免费 \u003ccode>cpu-basic\u003c/code> Space 演示当天没提前唤醒预热——冷启动 30s+ 足以让干系人失去兴趣\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>密钥走 Space secrets，永远不进代码和 requirements；公开 Space 默认一切可见\u003c/li>\u003cli>ZeroGPU 记得 \u003ccode>@spaces.GPU\u003c/code> 装饰，注意配额余量；演示前先自己跑一遍热身\u003c/li>\u003cli>免费 CPU Space 会休眠：\u003cstrong>演示当天提前唤醒 + 预热\u003c/strong>，冷启动 30s+ 足够让干系人失去兴趣\u003c/li>\u003cli>Gradio 热更新迭代快，适合现场按干系人反馈当场改当场看\u003c/li>\u003cli>演示数据一律合成/脱敏；Space 描述里写清&quot;数据仅用于演示&quot;\u003c/li>\u003cli>移交阶段把 Space 链接 + 截图 + 归档说明写进交付文档，上游 repo 断更也有据可查\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone D 移交演示：fde-scope 语料管线/评测结果的浏览器 demo\u003c/li>\u003cli>Zone B 验证：让客户方工程师自己在浏览器里复现结论，比口头汇报可信\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-c-operationalization/huggingface-llm-trainer\">huggingface-gradio 相关训练页\u003c/a> · \u003ca href=\"#/zone-b-build/frontend-design\">frontend-design\u003c/a> · \u003ca href=\"#/zone-b-build/vercel-deploy\">vercel-deploy\u003c/a>（另一条 demo 托管路径，适合纯 Web 应用）\u003c/p>"}, {"route": "zone-b-build/postman", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "\u003ch1>postman\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（Quest Marketplace 插件 postman v1.0.1，MCP 连接器）· 类型：API 生命周期 · FDE 位点：Zone B validate（客户 API 联调）\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>Qoder 内的完整 API 生命周期：同步 Collection、生成类型化客户端代码、发现 API、运行测试、创建 Mock、改进文档、安全审计，并分析 API 对 AI Agent 的就绪度。三个 skill 分工：\u003ccode>postman-knowledge\u003c/code>（MCP 工具用法与取舍）、\u003ccode>postman-routing\u003c/code>（把 API 请求路由到正确命令）、\u003ccode>agent-ready-apis\u003c/code>（8 支柱 48 检查的 agent 就绪度评分与整改建议）。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>对接客户 MES/Historian/Zammad/Salesforce 等 REST API \u003cstrong>之前\u003c/strong>：先 Collection + Mock 验证契约，别拿生产环境试错\u003c/li>\u003cli>给 fde-scope 连接器写集成测试：请求/断言沉淀在 Collection 里随回归跑\u003c/li>\u003cli>评估客户 API 对 agent 调用的就绪度（agent-ready-apis 报告可直接当&quot;给客户的 API 改进清单&quot;交付物）\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：工业协议（OPC UA / MQTT / ROS2 不是 HTTP，→ \u003ca href=\"#/zone-b-build/mqtt-development\">mqtt-development\u003c/a> 与连接器代码）；一次性验证（为一次 curl 建 Collection 是负资产）；客户 API 无 OpenAPI/无文档时先做发现，别凭空猜端点。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：提 API 需求即可由 \u003ccode>postman-routing\u003c/code> 自动路由到正确命令，如&quot;把这个 OpenAPI 同步成 Collection&quot;、&quot;给这个接口起个 mock&quot;、&quot;我的 API 对 agent 友好吗&quot;\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：首次先跑 \u003ccode>/postman:setup\u003c/code> 连接 Postman（配 API key），然后 \u003ccode>/postman:sync\u003c/code> 从客户的 OpenAPI/抓包生成 Collection——不要手写请求，断言写进请求的 Tests 标签\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：手写请求替代导入——两周后就没人信了，契约必须沉淀在 Collection 里随 Collection Runner 回归；与客户共享前不清历史与变量快照——Postman 同步会把敏感值带上去，生产密钥只放按 dev/staging/prod 隔离的 environment\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>先导入 OpenAPI/抓包生成 Collection，\u003cstrong>不要手写请求\u003c/strong>——手写版本两周后就没人信了\u003c/li>\u003cli>Mock 先行：前端/agent 开发不必等客户排期联调，契约先冻结\u003c/li>\u003cli>environment 变量隔离客户环境（dev/staging/prod），生产密钥绝不进 Collection 文件\u003c/li>\u003cli>断言写进请求的 Tests 标签，Collection Runner 就是免费回归套件\u003c/li>\u003cli>agent-ready-apis 的评分维度（鉴权/分页/幂等/错误语义等）也是我们自己写 API 的检查单\u003c/li>\u003cli>与客户共享前清 Collection 的历史与变量快照，Postman 同步会把敏感值带上去\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>fde_scope/connectors 的 HTTP 类连接器（Zammad / Salesforce / MES REST）联调与契约回归\u003c/li>\u003cli>integrations 模块对外暴露 API 的自检（发布前跑一遍 agent-ready-apis）\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-b-build/mqtt-development\">mqtt-development\u003c/a> · \u003ca href=\"#/zone-b-build/query\">query\u003c/a>（数据侧验证） · \u003ca href=\"#/cross-cutting/code-review\">code-review\u003c/a>\u003c/p>"}, {"route": "zone-c-operationalization/starops", "zone": "Zone C · Operationalization", "zoneId": "zone-c-operationalization", "status": "✅", "html": "\u003ch1>starops\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（starops 插件 v0.1.3）· 类型：AIOps/诊断 · FDE 位点：Zone C operate（有云监控的客户）\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>阿里云 STAROps（Agentic Ops）：查指标/APM/trace/日志、服务拓扑与依赖、告警分析与降噪、调用链追踪、影响面分析、k8s/主机诊断、变更守护、故障复盘与恢复建议——通过 STAROps Agent 以自然语言驱动。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>客户已经用阿里云 ARMS/SLS/云监控，上线后出现接口报错、慢请求、告警风暴\u003c/li>\u003cli>需要&quot;影响面有多大&quot;这类结论来做客户沟通（不只是&quot;哪里坏了&quot;）\u003c/li>\u003cli>变更后守护：判断这次发布是否引入了指标异常\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：客户自建 Prometheus/Grafana 栈（→ \u003ca href=\"#/zone-c-operationalization/gke-observability\">gke-observability\u003c/a> 或直接读 Prometheus）；无云监控的离线现场（→ \u003ca href=\"#/zone-c-operationalization/investigate\">investigate\u003c/a> + 手工日志）；代码级 bug 复现（→ \u003ca href=\"#/zone-c-operationalization/systematic-debugging\">systematic-debugging\u003c/a>）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说「排查根因」「接口超时」「告警分析」「链路追踪」这类词（SKILL.md 内置触发词还包括「影响面分析」「故障复盘」「k8s诊断」等）\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：先确认 \u003ccode>~/.starops/config.json\u003c/code> 里有 \u003ccode>employeeId\u003c/code>、\u003ccode>workspace\u003c/code>、\u003ccode>uid\u003c/code> 三项，再跑 \u003ccode>python3 scripts/check_starops_setup.py\u003c/code> 做本地自检，通过后用 \u003ccode>python3 scripts/call_starops_agent.py --question &quot;&lt;时间窗+服务名+现象&gt;&quot; --pipe\u003c/code> 发起首次诊断\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：调用必须带 \u003ccode>--pipe\u003c/code>（SKILL.md 标注 MANDATORY），否则输出没有 \u003ccode>THREAD\u003c/code>/\u003ccode>=== STAROPS ANSWER ===\u003c/code> 分隔符，后续无法解析续问；追问必须复用 \u003ccode>--thread &lt;id&gt;\u003c/code>，另起新线程会丢弃整次排查上下文\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：配置键名必须精确写 \u003ccode>employeeId\u003c/code>/\u003ccode>workspace\u003c/code>/\u003ccode>uid\u003c/code>，写 \u003ccode>employee\u003c/code>、\u003ccode>workspaceName\u003c/code> 这类别名会直接报 ConfigError；HTTP 401 说明凭证缺 \u003ccode>starops:CreateThread\u003c/code>/\u003ccode>starops:CreateChat\u003c/code> 权限，404 多半是 Digital Employee ID 或 workspace 与 UID 不匹配\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>提问题时带上\u003cstrong>时间窗 + 服务名 + 现象\u003c/strong>三要素，否则 agent 会给出泛化结论\u003c/li>\u003cli>把它的根因结论当&quot;假设&quot;：要求给出支撑的 trace/指标证据，再落到 runbook\u003c/li>\u003cli>恢复建议要走客户审批，不允许 agent 直接在生产执行写操作\u003c/li>\u003cli>与本项目衔接：SLO 类 gate（\u003ccode>slo\u003c/code> gate）所需的指标取数可以用它，但结论要写进交付文档而不是留在对话里\u003c/li>\u003cli>权限：只读 AK 即可满足大部分诊断，别为排障申请写权限\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone C \u003ccode>operationalize\u003c/code>：SLO 验证与线上异常定位\u003c/li>\u003cli>阿里云客户的交接运维手册（配合 \u003ca href=\"#/zone-b-build/alibabacloud-workbench-cli\">alibabacloud-workbench-cli\u003c/a>）\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-c-operationalization/investigate\">investigate\u003c/a> · \u003ca href=\"#/zone-c-operationalization/sentry-mcp\">sentry-mcp\u003c/a> · \u003ca href=\"#/zone-c-operationalization/sre-runbooks\">sre-runbooks\u003c/a>\u003c/p>"}, {"route": "zone-c-operationalization/investigate", "zone": "Zone C · Operationalization", "zoneId": "zone-c-operationalization", "status": "✅", "html": "\u003ch1>investigate\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（gstack 插件 v1.58.5 · 该插件共 53 个 skill）· 类型：调试方法论 · FDE 位点：Zone C operate\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>GStack（YC CEO Garry Tan 的技能包）里的\u003cstrong>根因导向系统排查\u003c/strong>流程：从现象出发建立可复现证据链，逐步二分/缩小范围，反对&quot;猜了就改&quot;。附带同类项：\u003ccode>debug\u003c/code>、\u003ccode>qa\u003c/code>、\u003ccode>review\u003c/code>、\u003ccode>health\u003c/code>、\u003ccode>retro\u003c/code>。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>现场交付环境出现异常但原因不明（数据没进来、指标突然掉了、模型输出变差）\u003c/li>\u003cli>需要一个可写进交接文档的排查过程记录，而不是一次性口头解释\u003c/li>\u003cli>团队/客户方工程师接手前，示范&quot;怎么查&quot;\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：已知原因的小修改（直接改）；纯前端性能问题（→ \u003ca href=\"#/zone-c-operationalization/debug-optimize-lcp\">debug-optimize-lcp\u003c/a> / \u003ca href=\"#/zone-c-operationalization/web-perf\">web-perf\u003c/a>）；需要方法论约束的测试失败（→ \u003ca href=\"#/zone-c-operationalization/systematic-debugging\">systematic-debugging\u003c/a>，superpowers 版更严格）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说 \u003ccode>/investigate\u003c/code>，或直接说「debug this」「why is this broken」「root cause analysis」（SKILL.md 声明的触发短语）\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：把现象原样丢给 agent：\u003ccode>/investigate 接口 500，但昨天还是好的\u003c/code>——它会按&quot;investigate → analyze → hypothesize → implement&quot;四阶段先建可复现证据链，而不是直接改代码\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：它有 Iron Law「NO FIXES WITHOUT ROOT CAUSE」——没定位到根因前别指望它动手修；3 个假设都验证失败时它会强制停下问你，而不是继续猜\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：形成假设后它会把编辑范围锁定到受影响目录（freeze），想恢复全量编辑要跑 \u003ccode>/unfreeze\u003c/code>；gstack 是 53 个 skill 的大插件，与 superpowers 的 \u003ccode>systematic-debugging\u003c/code> 同时存在时要在指令里写明用哪个\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>先固定&quot;复现三件套&quot;：环境、输入、期望 vs 实际，再动代码\u003c/li>\u003cli>排查日志与结论落盘（\u003ccode>docs/incidents/\u003c/code> 或 engagement 记录），这是 Zone C→D 的交接资产\u003c/li>\u003cli>gstack 是\u003cstrong>大插件\u003c/strong>（53 skill、含 browser/headless 工具链），只启用你实际用的几个，避免 skill 路由互相抢触发\u003c/li>\u003cli>与 \u003ccode>systematic-debugging\u003c/code> 二选一拍板：日常代码 bug 用 superpowers 版；现场跨系统排障用 gstack 版。两者都装时要在指令里写明优先级\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone C operate：现场故障与数据异常定位\u003c/li>\u003cli>\u003ccode>fde_scope/connectors/\u003c/code> 排障（连接器拿到空数据/超时）\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-c-operationalization/systematic-debugging\">systematic-debugging\u003c/a> · \u003ca href=\"#/zone-c-operationalization/starops\">starops\u003c/a> · \u003ca href=\"#/zone-c-operationalization/chrome-devtools\">chrome-devtools\u003c/a>\u003c/p>"}, {"route": "zone-c-operationalization/systematic-debugging", "zone": "Zone C · Operationalization", "zoneId": "zone-c-operationalization", "status": "✅", "html": "\u003ch1>systematic-debugging\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（superpowers 插件 v5.1.0）· 类型：方法论/流程约束 · FDE 位点：Zone B test + Zone C operate\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>遇到任何 bug、测试失败、非预期行为时，\u003cstrong>在提出修复之前\u003c/strong>强制走完整流程：复现 → 定位（读代码/加日志/二分）→ 假设 → 最小验证 → 修复 → 回归。是 superpowers 全家桶里对交付质量最有杠杆的一个。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>任何&quot;看起来是 X 问题所以改一下 X&quot;的冲动出现时——这就是它的触发点\u003c/li>\u003cli>测试失败但你不确信是测试错还是实现错\u003c/li>\u003cli>现场环境只有只读权限、不能试错时（先推理再动）\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：纯需求变更（不是 bug）；性能调优（→ \u003ca href=\"#/zone-c-operationalization/web-perf\">web-perf\u003c/a> / \u003ca href=\"#/zone-c-operationalization/debug-optimize-lcp\">debug-optimize-lcp\u003c/a>）；跨系统监控类排障（→ \u003ca href=\"#/zone-c-operationalization/investigate\">investigate\u003c/a>）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：遇到任何 bug、测试失败、非预期行为时说「用 systematic-debugging 流程排查」——SKILL.md 的 description 就是&quot;before proposing fixes&quot;，即你想&quot;直接改一下试试&quot;的那一刻就该触发\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：把报错原文完整贴给 agent（别截断 stack trace），让它先走 Phase 1：读错误信息、确认可稳定复现步骤、\u003ccode>git log\u003c/code>/\u003ccode>git diff\u003c/code> 查最近改动\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：Iron Law「NO FIXES WITHOUT ROOT CAUSE INVESTIGATION FIRST」——Phase 1 没走完它不会（也不该）提修复，别催它&quot;先改了再说&quot;；3 次修复都失败时必须停下质疑架构，禁止第 4 次盲改\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：Phase 3 假设验证一次只改一个变量，失败要\u003cstrong>回滚\u003c/strong>再换假设——叠加改动会让你无法定位是哪个改动&quot;看起来修好了&quot;\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>与 \u003ca href=\"#/cross-cutting/using-superpowers-family\">test-driven-development\u003c/a> 配套：先用失败测试固化 bug，再修\u003c/li>\u003cli>写下&quot;当前假设 + 证伪方式&quot;再继续，避免无限层猜测\u003c/li>\u003cli>一次只改一个变量；改完没解决要\u003cstrong>回滚\u003c/strong>再换假设，不要叠加改动（最容易造成&quot;看起来修好了&quot;）\u003c/li>\u003cli>修复后补一条能防止复现的测试，交付项目里这是客户信任的基础\u003c/li>\u003cli>Don&#x27;t：不要在该 skill 的流程里顺手重构——把重构和修 bug 分成两个提交\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone B \u003ccode>build/test\u003c/code>：\u003ccode>tests/\u003c/code> 下任何失败的处理规范\u003c/li>\u003cli>Zone C：连接器/评估指标异常的定位流程（配合 \u003ca href=\"#/zone-c-operationalization/investigate\">investigate\u003c/a>）\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-c-operationalization/investigate\">investigate\u003c/a> · \u003ca href=\"#/zone-c-operationalization/troubleshooting\">troubleshooting\u003c/a> · \u003ca href=\"#/cross-cutting/using-superpowers-family\">using-superpowers-family\u003c/a>\u003c/p>"}, {"route": "zone-c-operationalization/troubleshooting", "zone": "Zone C · Operationalization", "zoneId": "zone-c-operationalization", "status": "✅", "html": "\u003ch1>troubleshooting\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（chrome-devtools-mcp 插件 v1.2.0）· 类型：工具排障 · FDE 位点：Zone C operate（浏览器自动化通道）\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>专治 \u003cstrong>Chrome DevTools MCP 本身\u003c/strong>连不上/起不来的问题：\u003ccode>list_pages\u003c/code> / \u003ccode>new_page\u003c/code> / \u003ccode>navigate_page\u003c/code> 失败、server 初始化失败、target 丢失、连接超时。会用 MCP 文档 + 环境检查定位是浏览器、扩展、端口还是配置的问题。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>浏览器自动化突然不动了（agent 报 MCP 工具错误）\u003c/li>\u003cli>现场机器上 Chrome 版本/无头模式/代理设置导致 MCP 无法附加\u003c/li>\u003cli>需要在新环境（客户笔记本、内网机器）第一次打通浏览器调试通道\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：网页业务逻辑 bug（→ \u003ca href=\"#/zone-c-operationalization/chrome-devtools\">chrome-devtools\u003c/a>）；性能问题（→ \u003ca href=\"#/zone-c-operationalization/web-perf\">web-perf\u003c/a>）；MCP server 的选型评估（→ \u003ca href=\"#/cross-cutting/mcp-criticagent\">mcp-criticagent\u003c/a>）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：当 \u003ccode>list_pages\u003c/code>、\u003ccode>new_page\u003c/code>、\u003ccode>navigate_page\u003c/code> 报错或 MCP server 初始化失败时说「排查一下 chrome-devtools-mcp 连不上」\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：它会先找工作区里的 MCP 配置文件（\u003ccode>.mcp.json\u003c/code>、\u003ccode>.vscode/launch.json\u003c/code> 等）读配置；自己动手可先跑 \u003ccode>npx chrome-devtools-mcp@latest --help\u003c/code> 验证安装与 Node 环境，再按报错对照它的分诊流程\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：报 \u003ccode>Could not find DevToolsActivePort\u003c/code> 是 \u003ccode>--autoConnect\u003c/code> 专属错误——先确认 Chrome 在运行、并到 \u003ccode>chrome://inspect/#remote-debugging\u003c/code> 勾选 &quot;Enable remote debugging&quot;，别一上来就改 \u003ccode>--browserUrl\u003c/code>\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：server 起来了但只有 9 个左右工具，是 MCP client 处于只读模式，\u003ccode>click\u003c/code>/\u003ccode>navigate_page\u003c/code> 这类 \u003ccode>readOnlyHint: false\u003c/code> 的工具被禁用了；\u003ccode>Tool not found\u003c/code> 则常见于 \u003ccode>--slim\u003c/code> 模式（只保留导航与截图）\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>顺序：确认 Chrome 进程与远程调试端口 → 确认 MCP server 日志 → 再动配置；不要一上来就重装\u003c/li>\u003cli>\u003ccode>--slim\u003c/code> 模式不支持该 skill 的能力，注意配置差异\u003c/li>\u003cli>内网/代理环境要检查 loopback 与证书拦截，这是最常见的静默失败原因\u003c/li>\u003cli>打通后把可用配置固化到项目（README 或本地脚本），避免每台现场机重排一次\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone B/C：Web 控制台与 PawApp 的 UI 自动化前置通道\u003c/li>\u003cli>交付现场的浏览器验证（客户只允许用他们自己的机器时）\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-c-operationalization/chrome-devtools\">chrome-devtools\u003c/a> · \u003ca href=\"#/zone-c-operationalization/web-perf\">web-perf\u003c/a> · \u003ca href=\"#/cross-cutting/mcp-criticagent\">mcp-criticagent\u003c/a>\u003c/p>"}, {"route": "zone-c-operationalization/chrome-devtools", "zone": "Zone C · Operationalization", "zoneId": "zone-c-operationalization", "status": "✅", "html": "\u003ch1>chrome-devtools\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（chrome-devtools-mcp 插件 v1.2.0；同插件含 \u003ccode>chrome-devtools-cli\u003c/code>、\u003ccode>a11y-debugging\u003c/code>）· 类型：调试/自动化 · FDE 位点：Zone B demo + Zone C operate\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>通过 MCP 高效使用 Chrome DevTools：调试网页、自动化交互（点击/输入/滚动/截图）、审查 DOM 与样式、分析网络请求瀑布、跑性能 profile、检查可访问性。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>交付的 Web 控制台/PawApp 前端出现&quot;只在客户机器上才有&quot;的问题（真实浏览器证据）\u003c/li>\u003cli>需要验证前端改动确实生效（截图 + 网络请求，而不是&quot;代码看起来对&quot;)\u003c/li>\u003cli>演示前自查：控制台无 error、请求无 4xx、首屏可达\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：后端逻辑与数据问题（→ \u003ca href=\"#/zone-c-operationalization/investigate\">investigate\u003c/a>）；连接失败本身（→ \u003ca href=\"#/zone-c-operationalization/troubleshooting\">troubleshooting\u003c/a>）；只需要抓公开网页数据（→ \u003ca href=\"#/zone-a-pre-engagement/firecrawl-scrape\">firecrawl-scrape\u003c/a>）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：说「打开 &lt;URL&gt; 看看 console 有没有报错」「截图验证一下这个页面」「分析下这个页面的网络请求」——凡是调试网页、浏览器自动化、看网络请求都算\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：标准四步闭环：\u003ccode>navigate_page\u003c/code>（或 \u003ccode>new_page\u003c/code>）→ \u003ccode>wait_for\u003c/code> 等内容加载 → \u003ccode>take_snapshot\u003c/code> 拿页面结构与元素 \u003ccode>uid\u003c/code> → 用 \u003ccode>uid\u003c/code> 做 \u003ccode>click\u003c/code>/\u003ccode>fill\u003c/code>，最后 \u003ccode>take_screenshot\u003c/code> 留证\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：交互前必须先 \u003ccode>take_snapshot\u003c/code> 拿元素 \u003ccode>uid\u003c/code>；元素找不到说明页面已变化，要重新 snapshot 而不是复用旧 \u003ccode>uid\u003c/code>\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：扩展类工具（\u003ccode>install_extension\u003c/code> 等）要在 MCP server 配置加 \u003ccode>--categoryExtensions\u003c/code> flag 并重启才出现；\u003ccode>--slim\u003c/code> 模式不适用本 skill，内存分析要加 \u003ccode>--memoryDebugging\u003c/code>\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>验证 UI 改动时的最小闭环：navigate → 关键交互 → 截图 → 看 console/network 四步，缺一步结论就不算验证过\u003c/li>\u003cli>用无头/隔离 profile 跑自动化，避免污染自己的登录态；需要客户登录态时走人工授权而不是拷 cookie\u003c/li>\u003cli>性能类问题不要在这里手搓，走 \u003ca href=\"#/zone-c-operationalization/web-perf\">web-perf\u003c/a> / \u003ca href=\"#/zone-c-operationalization/debug-optimize-lcp\">debug-optimize-lcp\u003c/a>（同族 skill 已有流程）\u003c/li>\u003cli>可访问性检查用同插件 \u003ccode>a11y-debugging\u003c/code>，交付给国企/海外客户时经常是硬要求\u003c/li>\u003cli>截图留档到 \u003ccode>docs/\u003c/code> 或 engagement 记录，作为验收证据\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone B：\u003ccode>fde_scope/web/\u003c/code> 三视图与 PawApp 前端验证\u003c/li>\u003cli>Zone D：交付演示前的自查清单（控制台干净 + 首屏达标）\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-c-operationalization/web-perf\">web-perf\u003c/a> · \u003ca href=\"#/zone-c-operationalization/debug-optimize-lcp\">debug-optimize-lcp\u003c/a> · \u003ca href=\"#/zone-c-operationalization/troubleshooting\">troubleshooting\u003c/a>\u003c/p>"}, {"route": "zone-c-operationalization/sentry-mcp", "zone": "Zone C · Operationalization", "zoneId": "zone-c-operationalization", "status": "✅", "html": "\u003ch1>sentry-mcp\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（sentry 插件 v1.0.0 · 提供 MCP server + \u003ccode>sentry-mcp\u003c/code> 子 agent）· 类型：错误/性能观测 · FDE 位点：Zone C operate\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>用自然语言操作 Sentry：搜索/分析/分诊 errors 与 exceptions、读 stack trace、性能 trace 分析、release 与版本关联、snapshot（含 preprod 视觉回归快照）、CI snapshot 失败定位。适合&quot;客户问今天线上报了什么错&quot;这类问题一句话回答。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>fde-scope Web 控制台/PawApp 上线后接入 Sentry，日常巡检 issue 与新版本回归\u003c/li>\u003cli>定位到具体 exception 需要完整堆栈 + 影响用户数 + 首次出现版本\u003c/li>\u003cli>用 release 关联&quot;哪次发布引入的问题&quot;\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：没有 Sentry 的客户环境（阿里云栈 → \u003ca href=\"#/zone-c-operationalization/starops\">starops\u003c/a>；自建 → Datadog 插件 / Prometheus）；业务指标下降但无报错（→ 评估类：\u003ca href=\"#/zone-b-build/phoenix-evals\">phoenix-evals\u003c/a>）；需要复现的前端交互问题（→ \u003ca href=\"#/zone-c-operationalization/chrome-devtools\">chrome-devtools\u003c/a>）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：贴一个 Sentry issue URL 给 agent，或直接问「今天线上报了什么错」「这个 exception 影响了哪些用户」（SKILL.md 触发词覆盖 errors/stack traces/releases/snapshots/CI snapshot 失败）\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：先用配置/授权流程打通 MCP server \u003ccode>sentry\u003c/code>：让 agent 调 \u003ccode>find_organizations\u003c/code>、\u003ccode>find_projects\u003c/code> 列出可访问的组织与项目，确认目标 \u003ccode>organizationSlug/projectSlug\u003c/code> 在列，再开始 \u003ccode>search_issues\u003c/code> 分诊\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：Sentry URL 必须原样传给 \u003ccode>issueUrl\u003c/code>/\u003ccode>url\u003c/code> 参数——SKILL.md 明确 NEVER 直接用 HTTP fetch Sentry 链接，那样会因缺认证拿到空结果或 401\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：\u003ccode>search_issues\u003c/code> 返回分组后的 issue 列表，\u003ccode>search_events\u003c/code> 才返回计数/聚合/单条事件——要&quot;影响用户数、按版本聚合&quot;这类数字用后者；另外接入时没带 \u003ccode>release\u003c/code>+\u003ccode>environment\u003c/code> 标签的话，issue 无法按发布版本区分\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>接入时务必带 \u003ccode>release\u003c/code> + \u003ccode>environment\u003c/code> 标签，否则 issue 无法按版本区分（现场最常见的接入缺陷）\u003c/li>\u003cli>用子 agent 做&quot;分诊&quot;而不是让它改配置：读操作放心交给它，写操作（mute/assign/项目设置）人工确认\u003c/li>\u003cli>注意 DSN 与 org token 的权限范围，交付项目里客户数据会进 Sentry event——\u003cstrong>必须开 before_send 脱敏\u003c/strong>（工单原文、设备标识）\u003c/li>\u003cli>与本项目衔接：把 Sentry issue 计数作为 SLO gate 的证据之一，写入 engagement 记录而不是只留在 Sentry 面板\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone C \u003ccode>operationalize\u003c/code>：错误率与性能回归监控\u003c/li>\u003cli>Zone D handoff：交接时给客户的 issue 清单与分诊规则\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-c-operationalization/starops\">starops\u003c/a> · \u003ca href=\"#/zone-c-operationalization/investigate\">investigate\u003c/a> · \u003ca href=\"#/zone-c-operationalization/web-perf\">web-perf\u003c/a>\u003c/p>"}, {"route": "zone-c-operationalization/datadog", "zone": "Zone C · Operationalization", "zoneId": "zone-c-operationalization", "status": "✅", "html": "\u003ch1>datadog\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（Quest Marketplace 插件 datadog v0.7.13，官方 MCP 服务器）· 类型：可观测性 · FDE 位点：Zone C observe（客户监控栈是 Datadog 时）\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>通过官方 Datadog MCP 服务器查询日志、分析指标、追踪 Trace，读仪表盘 / 监视器 / SLO / 事件。三个 skill 分工：\u003ccode>ddsetup\u003c/code>（首次初始化，一旦配置完成，优先用 MCP 工具而非其他方式）、\u003ccode>ddconfig\u003c/code>（站点域/组织切换与连不上故障排查）、\u003ccode>ddtoolsets\u003c/code>（按需启停工具集，控制 agent 可见的工具面）。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>客户监控栈是 Datadog：取 SLO 达成证据、查事故 trace、把 fde-scope 部署服务的指标接进去对照\u003c/li>\u003cli>Zone C 巡检与事件复盘：从现象（告警/事件）反查日志与 trace 链\u003c/li>\u003cli>给客户的&quot;接入现状盘点&quot;：有哪些 monitor/SLO 在管哪些服务\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：客户用 GKE/Google 栈（→ \u003ca href=\"#/zone-c-operationalization/gke-observability\">gke-observability\u003c/a>）；以错误聚合/性能剖析为主、Sentry 已覆盖的场景（→ \u003ca href=\"#/zone-c-operationalization/sentry-mcp\">sentry-mcp\u003c/a>）；自建 Prometheus/Grafana（直接查，别绕）；没有客户授权的 Datadog 账号时（先要只读 key，别拿自己的 demo 账号凑合）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说「查一下 Datadog 里这个服务的报错日志」「看下 SLO 达成情况」「列出客户的 monitor 告警」——任何要取 Datadog 数据的请求都会先走 \u003ccode>ddsetup\u003c/code> 的状态检查\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：先跑 \u003ccode>ddsetup\u003c/code> 初始化：它检查 \u003ccode>datadog-server-state\u003c/code>，未配置时让你选客户站点域（如 us1 → \u003ccode>mcp.datadoghq.com\u003c/code>）写入注册文件，之后重启客户端并重新认证 \u003ccode>datadog\u003c/code> MCP server，工具才会出现在列表里\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：工具列表里看不到 Datadog 工具 ≠ Datadog 不可用——ddsetup 明确要求继续跑 setup 而不是绕道开网页；setup 完成前任何 MCP 调用都会失败\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：site 域名必须对齐客户（\u003ccode>datadoghq.com\u003c/code> / \u003ccode>datadoghq.eu\u003c/code> / \u003ccode>us5.datadoghq.com\u003c/code>…），连不上先跑 \u003ccode>/ddconfig\u003c/code> 查域与 org 切换；toolsets 全开会撑爆上下文，读类任务只开 logs/metrics 相关集\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>ddsetup 先行\u003c/strong>：未初始化就调查询工具必然失败；配置完成后所有读取走 MCP 工具\u003c/li>\u003cli>toolsets 按需开：读类任务只开 logs/metrics 相关集，全开会撑爆上下文还稀释触发精度\u003c/li>\u003cli>查询时间窗收紧（先 1h 再扩），指标查询成本高、结果噪点多\u003c/li>\u003cli>site 域名对齐客户（datadoghq.com / datadoghq.eu / us5.datadoghq.com …），连不上先查 site 与 org 切换（ddconfig）\u003c/li>\u003cli>SLO 证据进 gate 材料时附查询语句 + 时间窗截图，别只贴结论\u003c/li>\u003cli>只读凭证最小化：API key + Application key 分开管，App key 权限面定期审\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone C SLO gate 的证据链来源之一（10 个 gate 中 SLO 类的第三方数据源）\u003c/li>\u003cli>飞轮重训（flywheel）效果对照：上线前后指标在 Datadog 里的 A/B 证据\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-c-operationalization/gke-observability\">gke-observability\u003c/a> · \u003ca href=\"#/zone-c-operationalization/sentry-mcp\">sentry-mcp\u003c/a> · \u003ca href=\"#/zone-c-operationalization/starops\">starops\u003c/a> · \u003ca href=\"#/zone-c-operationalization/incident-response\">incident-response\u003c/a>\u003c/p>"}, {"route": "zone-c-operationalization/sre-runbooks", "zone": "Zone C · Operationalization", "zoneId": "zone-c-operationalization", "status": "📦", "html": "\u003ch1>sre-runbooks 📦\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：📦 可安装（未装）· 类型：运维文档模板 · FDE 位点：Zone C operationalize（runbook 交付物）\u003cbr>候选 A（推荐）：\u003ccode>anthropics/knowledge-work-plugins@runbook\u003c/code>（官方 org）· 热度：2.6K installs · https://skills.sh/anthropics/knowledge-work-plugins/runbook\u003cbr>候选 B：\u003ccode>alphaonedev/openclaw-graph@sre-runbooks\u003c/code> · 50 installs · https://skills.sh/alphaonedev/openclaw-graph/sre-runbooks\u003cbr>安装：\u003ccode>npx skills add anthropics/knowledge-work-plugins@runbook --directory ~/.qoder/skills -y\u003c/code>\u003cbr>说明：早期建档名记作 \u003ccode>sre-runbooks\u003c/code>；registry 中该名存在但热度仅 50，官方 \u003ccode>runbook\u003c/code> 是更优来源，安装命令按候选 A 给出。\u003cbr>取证（2026-08-27）：源文件 \u003ccode>operations/skills/runbook/SKILL.md\u003c/code>（87 行，\u003cstrong>单文件\u003c/strong>，无 \u003ccode>scripts/\u003c/code>、无 \u003ccode>references/\u003c/code>、无网络调用）· https://github.com/anthropics/knowledge-work-plugins/blob/main/operations/skills/runbook/SKILL.md\u003cbr>安全：上游仓库对每个条目跑\u003cstrong>强制 Claude policy scan\u003c/strong>（\u003ccode>.github/workflows/scan-plugins.yml\u003c/code>，按 (plugin, sha) 缓存判定，不通过则被 \u003ccode>revert-failed-bumps.yml\u003c/code> 剔除）。风险面极小。\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>产出结构化 runbook（已读源文件确认其固定模板）：Owner + Frequency + Last Updated/Last Run 头部 → Purpose → Prerequisites → \u003cstrong>Procedure（每一步都有“确切命令 + Expected result + If it fails”三件套）\u003c/strong> → Verification → Troubleshooting 表（症状/可能原因/处置）→ Rollback → Escalation 表（情形/联系人/方式）→ History 执行记录表。\u003cbr>上游提示词接得很死：“\u003ccode>Run the script\u003c/code> 不算一步，\u003ccode>从 ops 服务器跑 python sync.py --prod --dry-run\u003c/code> 才算”。\u003c/p>\n\u003cp>⚠️ 模板\u003cstrong>不含\u003c/strong>告警/指标阈值与影响面判定字段（那是 incident-response 的地盘）——要与客户告警一一对应，得手工加一节。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>fde-scope 交付上线前，客户运维团队要求&quot;每类故障一页怎么办&quot;\u003c/li>\u003cli>\u003ccode>engagement/phases.py\u003c/code> 的 operationalize 阶段交付物（SLO 之后必须有 runbook）\u003c/li>\u003cli>现场排障结束后立刻沉淀：把 \u003ca href=\"#/zone-c-operationalization/investigate\">investigate\u003c/a> 的排查过程转成可复用步骤\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：一次性问题的口头答复（不值得建档）；把 runbook 写成架构图（图走 \u003ca href=\"#/zone-a-pre-engagement/architecture-communicator\">architecture-communicator\u003c/a>）；用 skill 生成的模板直接签字交付（必须客户会签）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说「给 &lt;服务&gt; 的 &lt;故障&gt; 写一份 runbook」「把这次排查过程沉淀成可复用步骤」\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：先安装：\u003ccode>npx skills add anthropics/knowledge-work-plugins@runbook --directory ~/.qoder/skills -y\u003c/code>，然后让 agent 按 runbook 模板产出（Owner/Purpose/Procedure/Verification/Rollback/Escalation 固定结构）\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：模板不含告警/指标阈值与影响面判定字段——要与客户告警一一对应必须手工加一节，直接签字交付就是缺斤短两\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：Procedure 每步必须是&quot;确切命令 + Expected result + If it fails&quot;三件套，&quot;Run the script&quot;不算一步；未现场验证的命令标 \u003ccode>TODO-验证\u003c/code>，否则就是误导值班的人\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>一页一故障：标题就是&quot;现象 + 服务名&quot;，不要写&quot;通用排障指南&quot;\u003c/li>\u003cli>每条命令必须\u003cstrong>现场验证过\u003c/strong>再写进去；未验证的标 \u003ccode>TODO-验证\u003c/code>，否则就是误导\u003c/li>\u003cli>写清&quot;不要做&quot;（重启会丢什么、什么时候必须停线）——工业客户最看重这条\u003c/li>\u003cli>\u003cstrong>拿它的 History 表当审计手段\u003c/strong>：每次值班执行人签字 + 备注，一个季度就能看出哪份 runbook 在真实世界失效\u003c/li>\u003cli>它的 \u003ccode>If Connectors Available\u003c/code> 段默认接 knowledge base / ITSM：没接这些系统时该段就是死话，本地用直接忽略\u003c/li>\u003cli>补上模板缺的“告警对应”字段：没有告警对应的 runbook 段落等于不会有人读\u003c/li>\u003cli>版本与责任人：每页顶部写适用范围（版本/环境）+ owner + 最后验证日期\u003c/li>\u003cli>存放位置：进交付仓库 \u003ccode>docs/runbooks/\u003c/code>，不要只存在 wiki（交接时要有可打包物）\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone C \u003ccode>operationalize\u003c/code>：SLO gate 之后的必备交付物\u003c/li>\u003cli>Zone D handoff：培训与值班手册的原料\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-c-operationalization/incident-response\">incident-response\u003c/a> · \u003ca href=\"#/zone-c-operationalization/investigate\">investigate\u003c/a> · \u003ca href=\"#/zone-c-operationalization/starops\">starops\u003c/a>\u003c/p>"}, {"route": "zone-c-operationalization/incident-response", "zone": "Zone C · Operationalization", "zoneId": "zone-c-operationalization", "status": "📦", "html": "\u003ch1>incident-response 📦\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：📦 可安装（未装）· 类型：事件响应流程 · FDE 位点：Zone C operate（生产事件）\u003cbr>来源：\u003ccode>anthropics/knowledge-work-plugins@incident-response\u003c/code>（官方 org）· 热度：5.3K installs · https://skills.sh/anthropics/knowledge-work-plugins/incident-response\u003cbr>备选：\u003ccode>alirezarezvani/claude-skills@incident-commander\u003c/code>（602，指挥官视角）\u003cbr>安装：\u003ccode>npx skills add anthropics/knowledge-work-plugins@incident-response --directory ~/.qoder/skills -y\u003c/code>\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>结构化事件响应：严重度分级与角色分工（指挥/沟通/处置）、时间线记录、遏制优先于根因、对外沟通模板（客户/内部）、复盘（postmortem）产出与行动项跟踪。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>交付系统在生产上真的炸了：客户在线、管理层在问、工程师在改——需要一套秩序\u003c/li>\u003cli>需要给客户正式的事件说明与复盘（工业客户常把它写进合同 SLA 罚则）\u003c/li>\u003cli>值班机制建立前的过渡期（我方 FDE 兼值班）\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：日常小 bug（→ \u003ca href=\"#/zone-c-operationalization/systematic-debugging\">systematic-debugging\u003c/a>）；已知故障的按步处置（→ \u003ca href=\"#/zone-c-operationalization/sre-runbooks\">sre-runbooks\u003c/a>，runbook 是&quot;平时写、事件时读&quot;）；根因分析工具链（→ \u003ca href=\"#/zone-c-operationalization/starops\">starops\u003c/a> / \u003ca href=\"#/zone-c-operationalization/sentry-mcp\">sentry-mcp\u003c/a>）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说「启动 incident response，这事按 P1 处理」「给客户出一份事件说明/复盘」——真的在生产炸了才用，日常小 bug 不走这套\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：先安装：\u003ccode>npx skills add anthropics/knowledge-work-plugins@incident-response --directory ~/.qoder/skills -y\u003c/code>，然后让 agent 按流程开时间线（谁/何时/做了什么/观察到什么）并做严重度分级与角色分工\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：事件期只做&quot;分级 → 遏制 → 通信&quot;三件事，根因留到复盘——别让它边查边猜，遏制永远优先于根因\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：对外沟通禁止承诺未经确认的恢复时间（用&quot;影响 + 现状 + 下次更新时间&quot;三段式）；涉及停线/安全的事件，agent 只出建议不执行，处置动作必须客户授权人在场\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>事件期只做三件事：\u003cstrong>分级 → 遏制 → 通信\u003c/strong>。根因留到复盘阶段，别在群里边查边猜\u003c/li>\u003cli>时间线从事件第一分钟开始记（谁在何时做了什么、观察到什么），这是复盘与免责的唯一凭据\u003c/li>\u003cli>对外沟通用&quot;影响 + 现状 + 下次更新时间&quot;三段式，禁止承诺未经确认的恢复时间\u003c/li>\u003cli>工业现场红线：涉及停线/安全的事件，任何处置动作必须客户授权人在场，agent 只出建议不执行\u003c/li>\u003cli>复盘要产\u003cstrong>可跟踪行动项 + 负责人 + 截止日\u003c/strong>，并回流到 runbook（否则同类事件必然重演）\u003c/li>\u003cli>与 fde-scope 整合：事件与复盘记录可作为 engagement 状态机的输入（\u003ccode>shift_handover\u003c/code> gate 的交接材料）\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone C \u003ccode>operationalize\u003c/code>：值班与事件响应机制建设\u003c/li>\u003cli>\u003ccode>engagement/gates/shift_handover.py\u003c/code>（\u003ccode>ShiftHandover\u003c/code>）：交接材料的事件部分\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-c-operationalization/sre-runbooks\">sre-runbooks\u003c/a> · \u003ca href=\"#/zone-c-operationalization/starops\">starops\u003c/a> · \u003ca href=\"#/zone-c-operationalization/investigate\">investigate\u003c/a>\u003c/p>"}, {"route": "zone-c-operationalization/gke-observability", "zone": "Zone C · Operationalization", "zoneId": "zone-c-operationalization", "status": "📦", "html": "\u003ch1>gke-observability 📦\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：📦 可安装（未装）· 类型：可观测性（K8s） · FDE 位点：Zone C operate\u003cbr>来源：\u003ccode>google/skills@gke-observability\u003c/code>（Google 官方 org）· 热度：3K installs · https://skills.sh/google/skills/gke-observability\u003cbr>同系列：\u003ccode>gke-upgrades\u003c/code>（3.2K）、\u003ccode>gke-cluster-creation\u003c/code>（2.9K）、\u003ccode>gke-cluster-autoscaler\u003c/code>（1.9K）、\u003ccode>gke-cost-optimization\u003c/code>（1.5K）\u003cbr>安装：\u003ccode>npx skills add google/skills@gke-observability --directory ~/.qoder/skills -y\u003c/code>\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>GKE/K8s 可观测性接入与查询：日志（Cloud Logging）、指标（Cloud Monitoring / Prometheus 栈）、trace 采集与关联，Workload Identity 采集权限、告警规则与 SLO 预算视图，以及&quot;看不到数据&quot;时的采集链路排查。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>客户在 GCP/GKE 上跑 fde-scope 服务，需要把日志指标接进平台监控\u003c/li>\u003cli>自建 Prometheus + Grafana 的 K8s 环境（思路与资源定义可迁移，具体产品名要替换）\u003c/li>\u003cli>上线时要同时交付告警规则与 SLO 视图（Zone C 的必备材料）\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：阿里云客户（→ \u003ca href=\"#/zone-c-operationalization/starops\">starops\u003c/a>）；单容器/ECS 部署（→ 直接 stdout 日志 + 平台监控，别为此上 K8s 观测栈）；应用内错误细节（→ \u003ca href=\"#/zone-c-operationalization/sentry-mcp\">sentry-mcp\u003c/a>）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说「GKE 上看不到服务日志/指标，帮我排查采集链路」「给集群配告警规则和 SLO 预算视图」\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：先安装：\u003ccode>npx skills add google/skills@gke-observability --directory ~/.qoder/skills -y\u003c/code>，然后让 agent 从&quot;要回答什么问题&quot;出发定接入面（先指标 + 告警，trace 等有跨服务排障需求再上）\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：K8s 默认全量采集在工业现场很容易爆盘/爆预算——装采集器前明确采样率与保留期并写进交付文档\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：skill 强绑定 GCP（Cloud Logging / Cloud Monitoring / Workload Identity），非 GCP 客户装它收益有限；权限只要只读监控，绝不为排障给集群 admin\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>先定义&quot;要回答什么问题&quot;再装采集器：只要 SLO（可用性/延迟）就先指标 + 告警，trace 等到有跨服务排障需求时再上\u003c/li>\u003cli>采集成本可控：K8s 默认全量采集在工业现场很容易爆盘/爆预算，明确采样率与保留期并写进交付文档\u003c/li>\u003cli>权限最小化：只读监控权限即可，绝不为排障给集群 admin\u003c/li>\u003cli>与 \u003ca href=\"#/zone-b-build/kubernetes-specialist\">kubernetes-specialist\u003c/a> 配套使用：前者管拓扑与发布，本 skill 管可观测信号\u003c/li>\u003cli>交接视角：告警通知要接到客户既有值班通道（邮件/IM/PagerDuty），否则等于没有监控\u003c/li>\u003cli>官方 skill 可信度高，但因平台强绑定 GCP——非 GCP 客户装它收益有限，按客户平台决定是否安装\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone C：\u003ccode>slo\u003c/code> gate 的指标来源与告警落地\u003c/li>\u003cli>Zone B deploy：容器化交付（\u003ca href=\"#/zone-b-build/docker-build-deploy\">docker-build-deploy\u003c/a> / K8s）之后的观测面\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-b-build/kubernetes-specialist\">kubernetes-specialist\u003c/a> · \u003ca href=\"#/zone-c-operationalization/starops\">starops\u003c/a> · \u003ca href=\"#/zone-c-operationalization/sre-runbooks\">sre-runbooks\u003c/a>\u003c/p>"}, {"route": "zone-c-operationalization/firecrawl-monitor", "zone": "Zone C · Operationalization", "zoneId": "zone-c-operationalization", "status": "✅", "html": "\u003ch1>firecrawl-monitor\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（firecrawl 插件 v0.1.0）· 类型：变更监测 · FDE 位点：Zone C watch\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>监测网页内容变化并通过 \u003cstrong>webhook / 邮件\u003c/strong> 告警，无需自建 cron + 抓取 + diff。内置 AI judge 过滤排版、时间戳、跟踪参数等噪声，只在\u003cstrong>真实内容变化\u003c/strong>时通知。两类用法：① 盯已知 URL（定价页、文档、changelog、状态页、招聘页）；② 盯&quot;网页本身&quot;的新结果（新产品发布、融资、论文、动态），此时给搜索 query + 目标而不是 URL。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>客户竞品/供应商的定价与规格变更监测（售前素材保鲜）\u003c/li>\u003cli>依赖的第三方文档/API/固件版本页变更（现场设备 SDK 更新往往就这样发现）\u003c/li>\u003cli>同一 URL 需要重复检查第二次以上——就该用 monitor 而不是一次次 scrape\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：一次性抓取（→ \u003ca href=\"#/zone-a-pre-engagement/firecrawl-scrape\">firecrawl-scrape\u003c/a>）；站内多页首次建库（→ \u003ca href=\"#/zone-a-pre-engagement/firecrawl-crawl\">firecrawl-crawl\u003c/a>）；内部代码/配置变更监测（用 git CI，不用外网工具）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说「monitor 这个定价页，变了就邮件通知我」「alert me when 文档 changelog 更新」——同一 URL 要查第二次以上就上 monitor，别反复 scrape\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：\u003ccode>firecrawl monitor create --name &quot;竞对定价&quot; --schedule &quot;every 30 minutes&quot; --goal &quot;Alert when pricing changes.&quot; --page https://example.com/pricing --email alerts@example.com\u003c/code>（盯全网新结果则换成 \u003ccode>--queries\u003c/code> + \u003ccode>--goal\u003c/code> 的 web monitor 模式）\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：web monitor 模式 \u003ccode>--queries\u003c/code> 必须配 \u003ccode>--goal\u003c/code>（缺了直接报错）；\u003ccode>--goal\u003c/code> 同时是 AI judge 的降噪开关，不写它整页改动（推荐位、时间戳）都会告警\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：最小调度间隔 15 分钟，高频会快速消耗额度；更新状态用 \u003ccode>--state paused\u003c/code> 而不是 \u003ccode>--status\u003c/code>（参数名写错不生效）\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>明确&quot;什么算变化&quot;：盯价格就锁 price 元素区域，整页监测会被推荐位噪声打爆\u003c/li>\u003cli>频率按业务定：定价类日/周一次足够，状态页类可高频；高频会快速消耗额度\u003c/li>\u003cli>告警落地要有责任人和动作（收到 → 谁评估 → 是否影响交付），否则会变成静音噪音\u003c/li>\u003cli>结果需二次确认：AI judge 过滤后仍要在工单/记录里留证据链接，别只凭通知转述\u003c/li>\u003cli>合规：监测对象 robots/条款允许，避免登录墙后内容与个人隐私数据\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone C watch：外部依赖变更发现（连接器涉及的设备固件/MES 版本页）\u003c/li>\u003cli>Zone A：客户所在行业新闻、竞对信息保鲜\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-a-pre-engagement/firecrawl-scrape\">firecrawl-scrape\u003c/a> · \u003ca href=\"#/zone-a-pre-engagement/firecrawl-crawl\">firecrawl-crawl\u003c/a> · \u003ca href=\"#/cross-cutting/schedule\">schedule\u003c/a>\u003c/p>"}, {"route": "zone-c-operationalization/deploy-checklist", "zone": "Zone C · Operationalization", "zoneId": "zone-c-operationalization", "status": "📦", "html": "\u003ch1>deploy-checklist 📦\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：📦 可安装（未装）· 类型：上线前核验清单 · FDE 位点：Zone B 收口 → Zone C operationalize 交界\u003cbr>真实条目：\u003ccode>anthropics/knowledge-work-plugins@deploy-checklist\u003c/code>（官方 org）· 热度：4.9K installs · https://skills.sh/anthropics/knowledge-work-plugins/deploy-checklist\u003cbr>源文件（已读，2026-08-27 取证）：\u003ccode>engineering/skills/deploy-checklist/SKILL.md\u003c/code>（78 行，无 scripts/、无 references/，纯模板 skill）· https://github.com/anthropics/knowledge-work-plugins/blob/main/engineering/skills/deploy-checklist/SKILL.md\u003cbr>安装：\u003ccode>npx skills add anthropics/knowledge-work-plugins@deploy-checklist --directory ~/.qoder/skills -y\u003c/code>\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>在\u003cstrong>部署前\u003c/strong>生成一份可勾选的 readiness 清单，输出结构固定为四段：Pre-Deploy（CI 全绿 / 已评审 / 无已知严重缺陷 / \u003cstrong>迁移已测\u003c/strong> / \u003cstrong>flag 已配\u003c/strong> / \u003cstrong>回滚方案已写\u003c/strong> / on-call 已通知）、Deploy（staging 验证 → smoke → 生产（有 canary 走 canary）→ 观察错误率与延迟 15 分钟 → 关键流程验证）、Post-Deploy（指标确认 / release notes / 通知干系人 / 关单）、以及 \u003cstrong>Rollback Triggers\u003c/strong>（错误率阈值、P50 延迟阈值、关键流程失败——\u003cstrong>上线前就定好，不是出事时再想\u003c/strong>）。\u003c/p>\n\u003cp>支持按场景定制：说明&quot;有 feature flag / 含数据库迁移 / 是破坏性 API 变更&quot;，它会追加对应核验步骤。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>每一次向客户生产环境投递（包括&quot;例行的小版本&quot;——清单存在的意义正是防&quot;我忘了……&quot;）\u003c/li>\u003cli>变更含 DB migration、feature flag、或破坏性接口变更时（这三类是现场事故高发源）\u003c/li>\u003cli>需要一份\u003cstrong>能作为 gate 证据\u003c/strong>的上线核验记录（fde-scope 的 SLO / HandoffSignoff gate）\u003c/li>\u003cli>交接给客户团队时，把清单本身当交付物\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：反复执行的操作步骤文档（→ \u003ca href=\"#/zone-c-operationalization/sre-runbooks\">sre-runbooks\u003c/a>，runbook 是&quot;怎么做&quot;，本 skill 是&quot;能不能做&quot;）；事件发生时的处置（→ \u003ca href=\"#/zone-c-operationalization/incident-response\">incident-response\u003c/a>）；架构层面的上线风险评估（→ 架构可视化插件 \u003ccode>risk-quality-reviewer\u003c/code>）；本地/演示环境的一次性部署（清单开销不划算）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说「这次发布跑一遍上线核验清单」「这个版本要进客户生产，生成 readiness 清单」——每次向客户生产环境投递都该跑，包括&quot;例行小版本&quot;\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：先安装：\u003ccode>npx skills add anthropics/knowledge-work-plugins@deploy-checklist --directory ~/.qoder/skills -y\u003c/code>，然后告诉它场景（有 feature flag / 含 DB migration / 破坏性 API 变
