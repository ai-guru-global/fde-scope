<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;
--accent:#4f46e5;--ok:#059669;--pkg:#d97706;--radius:14px;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
background:var(--bg);color:var(--ink);line-height:1.65}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:18px;padding:12px 28px;
background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav .brand{font-weight:800;font-size:16px;color:var(--ink);cursor:pointer;white-space:nowrap}
.nav .brand span{color:var(--accent)}
.nav .zlinks{display:flex;gap:14px;overflow-x:auto}
.nav .zlinks a{color:var(--muted);font-size:13px;white-space:nowrap}
.nav input{margin-left:auto;width:230px;padding:7px 12px;border:1px solid var(--line);border-radius:99px;
font-size:13px;outline:none;background:#fff}
.nav input:focus{border-color:var(--accent)}
.hero{background:linear-gradient(135deg,#312e81 0%,#4f46e5 55%,#7c3aed 100%);color:#fff;padding:64px 28px 56px;text-align:center}
.hero h1{font-size:34px;letter-spacing:.5px}
.hero p{margin:14px auto 0;max-width:760px;color:#e0e7ff;font-size:15px}
.hero .stats{display:flex;justify-content:center;gap:14px;margin-top:28px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:99px;
padding:7px 18px;font-size:13px}
.stat b{font-size:16px;margin-right:4px}
.wrap{max-width:1120px;margin:0 auto;padding:36px 24px 72px}
.section-h{display:flex;align-items:baseline;gap:12px;margin:8px 0 18px}
.section-h h2{font-size:21px}
.section-h p{color:var(--muted);font-size:13px}
.scen-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.scen{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;
transition:box-shadow .15s,transform .15s}
.scen:hover{box-shadow:0 10px 30px rgba(17,24,39,.08);transform:translateY(-2px)}
.scen h3{font-size:15px;margin-bottom:4px}
.scen .d{color:var(--muted);font-size:12.5px;margin-bottom:12px}
.scen .links{display:flex;flex-wrap:wrap;gap:8px}
.scen .links a{font-size:12.5px;background:#eef2ff;border:1px solid #e0e7ff;color:#4338ca;
padding:4px 11px;border-radius:99px}
.scen .links a:hover{background:#e0e7ff;text-decoration:none}
.zone-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;margin-top:6px}
.zone{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
display:flex;flex-direction:column}
.zone .zh{padding:16px 20px 12px;border-top:3px solid var(--accent)}
.zone .zh h3{font-size:15.5px}
.zone .zh p{color:var(--muted);font-size:12.5px;margin-top:2px}
.zone .zs{padding:6px 14px 16px;display:flex;flex-wrap:wrap;gap:7px}
.zone .zs a{font-size:12.5px;padding:4px 10px;border-radius:8px;background:#f3f4f6;color:#374151;
border:1px solid var(--line)}
.zone .zs a:hover{text-decoration:none;border-color:var(--accent);color:var(--accent)}
.zone .zs a .st{font-size:11px;margin-right:3px}
.toolbar{display:flex;gap:10px;align-items:center;margin:4px 0 16px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 14px;font-size:12.5px;
cursor:pointer;color:var(--muted)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.all-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.sk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:block;color:var(--ink);
transition:box-shadow .15s,transform .15s}
.sk:hover{box-shadow:0 8px 22px rgba(17,24,39,.08);transform:translateY(-1px);text-decoration:none}
.sk .t{display:flex;align-items:center;gap:8px;font-weight:650;font-size:14px}
.sk .b{color:var(--muted);font-size:12.5px;margin-top:4px}
.sk .z{font-size:11px;color:#9ca3af;margin-top:6px}
.badge{font-size:11px;border-radius:99px;padding:2px 9px;font-weight:600}
.badge.ok{background:#d1fae5;color:#065f46}
.badge.pkg{background:#fef3c7;color:#92400e}
.badge.dead{background:#f3f4f6;color:#6b7280}
.crumb{font-size:13px;color:var(--muted);margin-bottom:6px}
.crumb a{color:var(--muted)}
.article{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
padding:36px 44px;max-width:900px;margin:0 auto}
.article h1{font-size:24px;margin:4px 0 14px}
.article h2{font-size:17px;margin:26px 0 10px;padding-left:10px;border-left:3px solid var(--accent)}
.article h3{font-size:15px;margin:18px 0 8px}
.article p{margin:8px 0}
.article ul{margin:8px 0 8px 22px}
.article li{margin:4px 0}
.article code{font-family:var(--mono);font-size:.86em;background:#f3f4f6;border:1px solid var(--line);
border-radius:5px;padding:1px 5px;word-break:break-all}
.article pre{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:14px 16px;overflow-x:auto;margin:10px 0}
.article pre code{background:none;border:none;color:inherit;padding:0;font-size:12.5px;line-height:1.55}
.article table{border-collapse:collapse;width:100%;margin:12px 0;font-size:13px}
.article th,.article td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.article th{background:#f9fafb}
.article .page-meta{background:#f8f9ff;border:1px solid #e0e7ff;border-left:3px solid var(--accent);
border-radius:10px;padding:12px 16px;margin:6px 0 16px;font-size:13px;color:#374151}
.pager{display:flex;justify-content:space-between;gap:16px;max-width:900px;margin:14px auto 0}
.pager a{font-size:13px;color:var(--muted);border:1px solid var(--line);background:#fff;
border-radius:10px;padding:8px 14px;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pager a:hover{color:var(--accent);text-decoration:none;border-color:var(--accent)}
.empty{display:none;text-align:center;color:var(--muted);padding:40px 0}
footer{border-top:1px solid var(--line);margin-top:56px;padding:26px 28px 40px;color:var(--muted);
font-size:12.5px;text-align:center}
footer code{font-family:var(--mono);background:#f3f4f6;border-radius:5px;padding:1px 5px}
@media(max-width:720px){.article{padding:22px 18px}.nav .zlinks{display:none}.nav input{width:150px}}
</style>

eploy"}, {"name": "kubernetes-specialist", "route": "zone-b-build/kubernetes-specialist"}, {"name": "alibabacloud-spec-ops-suite", "route": "zone-b-build/alibabacloud-spec-ops-suite"}, {"name": "vercel-deploy", "route": "zone-b-build/vercel-deploy"}]}, {"title": "运维与排障", "desc": "根因 → 浏览器取证 → 可观测性 → AIOps", "items": [{"name": "investigate", "route": "zone-c-operationalization/investigate"}, {"name": "systematic-debugging", "route": "zone-c-operationalization/systematic-debugging"}, {"name": "chrome-devtools", "route": "zone-c-operationalization/chrome-devtools"}, {"name": "datadog", "route": "zone-c-operationalization/datadog"}, {"name": "sentry-mcp", "route": "zone-c-operationalization/sentry-mcp"}, {"name": "starops", "route": "zone-c-operationalization/starops"}]}, {"title": "文档与移交", "desc": "补文档 → 出版级 PDF → 规范 → 课程 → 播客", "items": [{"name": "document-generate", "route": "zone-d-handoff/document-generate"}, {"name": "make-pdf", "route": "zone-d-handoff/make-pdf"}, {"name": "anthropic-documentation", "route": "zone-d-handoff/anthropic-documentation"}, {"name": "slidev", "route": "zone-d-handoff/slidev"}, {"name": "shifu", "route": "zone-d-handoff/shifu"}, {"name": "podcast", "route": "zone-d-handoff/podcast"}]}, {"title": "工程纪律（横切）", "desc": "计划 → 执行 → 评审 → 安全 → 生态与调度", "items": [{"name": "writing-plans", "route": "cross-cutting/writing-plans"}, {"name": "executing-plans", "route": "cross-cutting/executing-plans"}, {"name": "code-review", "route": "cross-cutting/code-review"}, {"name": "security-scan", "route": "cross-cutting/security-scan"}, {"name": "skill-discovery", "route": "cross-cutting/skill-discovery"}, {"name": "using-git-worktrees", "route": "cross-cutting/using-git-worktrees"}, {"name": "schedule", "route": "cross-cutting/schedule"}, {"name": "cloud-agents", "route": "cross-cutting/cloud-agents"}]}], "pages": [{"route": "zone-a-pre-engagement/firecrawl-search", "zone": "Zone A · Pre-engagement", "zoneId": "zone-a-pre-engagement", "status": "✅", "html": "\u003ch1>firecrawl-search\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（firecrawl 插件）· 类型：工具 · FDE 位点：Zone A · qualification / site-survey 前置研究\u003cbr>MCP 工具：\u003ccode>firecrawl_firecrawl_search\u003c/code> · 依赖：Firecrawl API 认证（见 security-scan 类安装规约）\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>真实时联网搜索，且不止返回摘要片段——可对命中结果\u003cstrong>连带全文抽取\u003c/strong>（Markdown/结构化 JSON），一次调用得到&quot;搜索结果 + 页面正文&quot;。比内置 WebSearch 多了内容落地能力。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>客户行业背景、竞品方案、技术选型的最新资料调研\u003c/li>\u003cli>需要&quot;别人怎么说的&quot;完整论据，而非 snippet\u003c/li>\u003cli>搜索后紧接着要抓取（省去 search→scrape 两步编排）\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：本地文件、内网系统、代码仓库内部检索（走 SearchCodebase/sourcegraph）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：没给 URL、只要资料时对 agent 说 &quot;search for …&quot; / &quot;find articles about …&quot; / &quot;what are people saying about X&quot;（SKILL.md 原文触发词），即&quot;帮我搜下竞品/行业最新说法&quot;\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：\u003ccode>firecrawl search &quot;你的关键词&quot; -o .firecrawl/result.json --json\u003c/code>；要连带全文就加 \u003ccode>--scrape\u003c/code>，一次调用顶 search→scrape 两步\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：结果必须用 \u003ccode>-o\u003c/code> 落到 \u003ccode>.firecrawl/\u003c/code> 再处理（\u003ccode>jq -r &#x27;.data.web[].url&#x27;\u003c/code> 提取链接），直接打屏会撑爆上下文窗口\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：一次 search 计 2 credits——先窄关键词加 \u003ccode>--limit\u003c/code> 锁定 2-3 条高相关结果再动；拿到结果列表后别逐条重新抓，该用 \u003ccode>--scrape\u003c/code> 一步到位\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>Do：先窄关键词锁定 2-3 条高相关结果再抽全文，控制 token 与费用\u003c/li>\u003cli>Do：对时效敏感话题限定时间范围\u003c/li>\u003cli>Don&#x27;t：不要用它替代本地代码搜索；不要一次抓几十个页面\u003c/li>\u003cli>成本：按次计费，调研阶段够用即可；认证失败时参考 \u003ccode>install\u003c/code> 规则技能修复\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>\u003ccode>pre_engagement.SiteSurveyGate\u003c/code> 之前的行业预研；\u003ccode>docs/manufacturing_scenario.md\u003c/code> 类素材收集\u003c/li>\u003cli>产出可归档进 \u003ccode>.fde_scope/engagements/&lt;id&gt;/\u003c/code> 调研笔记\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-a-pre-engagement/firecrawl-scrape\">firecrawl-scrape\u003c/a> · \u003ca href=\"#/zone-a-pre-engagement/firecrawl-crawl\">firecrawl-crawl\u003c/a> · \u003ca href=\"#/zone-c-operationalization/firecrawl-monitor\">firecrawl-monitor\u003c/a>\u003c/p>"}, {"route": "zone-a-pre-engagement/firecrawl-scrape", "zone": "Zone A · Pre-engagement", "zoneId": "zone-a-pre-engagement", "status": "✅", "html": "\u003ch1>firecrawl-scrape\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（firecrawl 插件）· 类型：工具 · FDE 位点：Zone A/B · 调研与数据接入\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>对给定 URL（含 JS 渲染的 SPA）抽取干净、LLM 友好的 Markdown；支持多 URL 并发、整页截图、结构化抽取。是&quot;给我一个链接，我要它的内容&quot;的默认解。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>用户直接给 URL 要看内容/总结\u003c/li>\u003cli>WebFetch 拿不到的重 JS 页面\u003c/li>\u003cli>客户公开文档页、产品页、API 文档页的单页抓取\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：整站批量（用 \u003ca href=\"#/zone-a-pre-engagement/firecrawl-crawl\">firecrawl-crawl\u003c/a>）、本地文件（用 \u003ca href=\"#/zone-a-pre-engagement/firecrawl-parse\">firecrawl-parse\u003c/a>）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：给 agent 一个 URL 并说 &quot;scrape&quot; / &quot;grab&quot; / &quot;extract from this URL&quot; / &quot;read this webpage&quot;（SKILL.md 原文触发词）——&quot;给我这个链接的内容&quot;\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：\u003ccode>firecrawl scrape &quot;&lt;url&gt;&quot; -o .firecrawl/page.md\u003c/code>；SPA/重 JS 页面加 \u003ccode>--wait-for 3000\u003c/code> 等渲染，只要正文再加 \u003ccode>--only-main-content\u003c/code>\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：URL 必须加引号——shell 会把 \u003ccode>?\u003c/code> 和 \u003ccode>&amp;\u003c/code> 当特殊字符截断参数，裸写会抓错页\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：优先普通 scrape 落盘后自己搜内容，\u003ccode>--query\u003c/code> 问答模式一次多花 5 credits；要登录/点击的页面 scrape 拿不到，改走 interact + profile\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>Do：优先 scrape 而不是自己写 requests+BeautifulSoup\u003c/li>\u003cli>Do：需要页面上特定字段时用 extract/结构化模式，别拿全文再人肉找\u003c/li>\u003cli>Don&#x27;t：不抓需要登录且未配置 profile 的页面（→ interact + profile）\u003c/li>\u003cli>合规：只抓客户授权范围与公开页面，现场交付注意 robots/内网保密约定\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone B \u003ccode>connect\u003c/code> 阶段的补充数据源（无 API 的公开网页）\u003c/li>\u003cli>客户产品手册在线版的快速本地化\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-a-pre-engagement/firecrawl-search\">firecrawl-search\u003c/a> · \u003ca href=\"../zone-a-pre-engagement/#\" target=\"_blank\" rel=\"noopener\">firecrawl-map\u003c/a>（列 URL） · \u003ca href=\"../zone-a-pre-engagement/#\" target=\"_blank\" rel=\"noopener\">firecrawl-interact\u003c/a>（需登录/点击）\u003c/p>"}, {"route": "zone-a-pre-engagement/firecrawl-crawl", "zone": "Zone A · Pre-engagement", "zoneId": "zone-a-pre-engagement", "status": "✅", "html": "\u003ch1>firecrawl-crawl\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（firecrawl 插件）· 类型：工具 · FDE 位点：Zone A/B · 文档区批量入库\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>按站点/站点分区（如 \u003ccode>/docs\u003c/code>）批量抽取全部页面，支持深度限制、路径过滤、并发控制；异步任务，可用 \u003ccode>check_crawl_status\u003c/code> 轮询进度。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>客户产品文档站、开源项目文档整仓本地化\u003c/li>\u003cli>建立语料原料库（爬完 → 进 corpus forge 清洗）\u003c/li>\u003cli>&quot;把 X 网站 docs 下所有内容抓下来&quot;类请求\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：只要 1-3 个页面（scrape 更快更省）；已知变更监控（用 monitor）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：说 &quot;crawl&quot; / &quot;get all the pages&quot; / &quot;extract everything under /docs&quot;（SKILL.md 原文触发词），即&quot;把这个站的 docs 全抓下来&quot;\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：\u003ccode>firecrawl crawl &quot;&lt;url&gt;&quot; --include-paths /docs --limit 50 --wait -o .firecrawl/crawl.json\u003c/code>；大站先小 \u003ccode>--max-depth\u003c/code> 试跑一轮估量级\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：不加 \u003ccode>--wait\u003c/code> 只返回异步 job ID，要立刻拿结果必须显式加上（之后可用 \u003ccode>firecrawl crawl &lt;job-id&gt;\u003c/code> 查进度）\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：按页计 credits，大爬前先 \u003ccode>firecrawl credit-usage\u003c/code> 查余额；用 \u003ccode>--include-paths\u003c/code> 圈死范围，别对整站无差别开爬\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>Do：先用 map/URL 过滤确定范围，再 crawl；设置 \u003ccode>includePaths\u003c/code> 避免全站爆炸\u003c/li>\u003cli>Do：大站先小深度试跑一轮估量级\u003c/li>\u003cli>Don&#x27;t：不要对客户内网/生产系统未经授权使用\u003c/li>\u003cli>后续衔接：爬出的 Markdown 进 \u003ccode>convert-file\u003c/code>/DuckDB 做结构化，再入 \u003ccode>fde_scope.corpus\u003c/code> 管道做脱敏与去重\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone B \u003ccode>connect→corpus\u003c/code>：网页文档 → 原始语料 → 脱敏 → 质量门\u003c/li>\u003cli>ACK/中间件官方文档的离线镜像，供现场 air-gap 环境查询\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-a-pre-engagement/firecrawl-scrape\">firecrawl-scrape\u003c/a> · \u003ca href=\"#/zone-b-build/convert-file\">convert-file\u003c/a> · \u003ca href=\"#/cross-cutting/bailian-cli\">bailian-cli\u003c/a>（知识库入库）\u003c/p>"}, {"route": "zone-a-pre-engagement/firecrawl-parse", "zone": "Zone A · Pre-engagement", "zoneId": "zone-a-pre-engagement", "status": "✅", "html": "\u003ch1>firecrawl-parse\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（firecrawl 插件）· 类型：工具 · FDE 位点：Zone A/B · 客户本地文件接入\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>把\u003cstrong>本地文件\u003c/strong>（PDF/DOCX/DOC/ODT/RTF/XLSX/XLS/HTML）抽取转换为干净的 Markdown 落盘，可附带 AI 摘要或基于内容问答。与 scrape 的分工：parse 处理磁盘路径文件，scrape 处理 URL。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>客户给了报价单、规格书、操作手册的本地文件\u003c/li>\u003cli>用户说&quot;解析这个 PDF / 提取这个文件的内容&quot;并给出本地路径\u003c/li>\u003cli>需要一次性从文档里直接回答问题（parse 的问答模式）\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：URL 页面（→ scrape）；结构化数据文件要看内容概况（→ read-file）；生成新 PDF（→ make-pdf / pdf）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：给出\u003cstrong>本地文件路径\u003c/strong>并说 &quot;parse this PDF&quot; / &quot;convert this document&quot; / &quot;extract text from&quot;（SKILL.md 原文触发词）——磁盘文件走 parse，URL 走 scrape\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：\u003ccode>mkdir -p .firecrawl &amp;&amp; firecrawl parse ./报告.pdf -o .firecrawl/报告.md\u003c/code>；想直接要答案用 \u003ccode>-Q &quot;主要结论是什么&quot;\u003c/code>，要 AI 摘要用 \u003ccode>-S\u003c/code>\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：\u003ccode>-o\u003c/code> 是硬要求——解析结果动辄几百 KB，直接输出会打爆上下文窗口；含空格的路径要加引号（\u003ccode>firecrawl parse &quot;./My Doc.pdf&quot; -o .firecrawl/mydoc.md\u003c/code>）\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：单文件上限 50 MB，PDF 约每页 1 credit，批量前先 \u003ccode>firecrawl credit-usage\u003c/code> 查余额；重复解析前先看 \u003ccode>.firecrawl/\u003c/code> 里有没有现成结果\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>Do：路径直接传本地文件，不要先转格式再喂\u003c/li>\u003cli>Do：大文档先 parse 出 Markdown 再决定哪些进语料库\u003c/li>\u003cli>Don&#x27;t：不要用它做扫描件 OCR 质量保证——扫描件效果取决于源质量，重要合同类仍需人工核对\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone A 合同/SOW/技术协议解读\u003c/li>\u003cli>Zone B 非结构化客户文档 → 语料原料\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-b-build/read-file\">read-file\u003c/a> · \u003ca href=\"#/zone-a-pre-engagement/pdf\">pdf\u003c/a> · \u003ca href=\"#/zone-a-pre-engagement/docx\">docx\u003c/a>\u003c/p>"}, {"route": "zone-a-pre-engagement/zread", "zone": "Zone A · Pre-engagement", "zoneId": "zone-a-pre-engagement", "status": "✅", "html": "\u003ch1>zread\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装 · 类型：工具/文档生成 · FDE 位点：Zone A · site-survey（代码系统摸底）\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>用 \u003ccode>zread\u003c/code> CLI 为代码仓库生成 wiki 式知识库（输出在 \u003ccode>./.zread/wiki/\u003c/code>）：模块拆解、架构说明、上手文档；可浏览、可服务本地站点。也可反向用于&quot;理解陌生 repo 前先读生成的页面&quot;，避免逐文件爬源码。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>接手客户陌生系统，需要快速建立整体认知（对应 Zone A \u003ccode>site-survey\u003c/code>）\u003c/li>\u003cli>需要给交接对象一份&quot;这个 repo 干什么&quot;的入门文档（Zone D 也用得上）\u003c/li>\u003cli>用户提到 zread / 项目 wiki / repo walkthrough\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：一次性事实查询（直接搜代码）；非代码文档库（→ qmind-knowledge）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：想&quot;理解/上手/总结一个陌生 repo&quot;、&quot;这个项目是干嘛的&quot;，或直接点名 zread / repo walkthrough——触发的是意图，不必说出&quot;zread&quot;这个词\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：先看 \u003ccode>./.zread/wiki/current\u003c/code> 是否存在：存在就直接读 \u003ccode>wiki.json\u003c/code> 和页面 Markdown，无需再跑 CLI；不存在才经用户确认后 \u003ccode>zread generate -y\u003c/code>\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：无人值守跑 \u003ccode>generate\u003c/code> 必须带 \u003ccode>-y\u003c/code>，否则会停在目录确认门上不动；\u003ccode>generate\u003c/code> 消耗 LLM token 且大 repo 要跑很多分钟，启动前先跟用户确认\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：看到 \u003ccode>.zread/wiki/drafts/\u003c/code> 说明上次没跑完——\u003ccode>--draft resume\u003c/code> 续跑或 \u003ccode>--draft clear\u003c/code> 重来；静默失败查 \u003ccode>~/.zread/log/zread.log\u003c/code>\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>Do：先看 \u003ccode>./.zread/wiki/current\u003c/code> 是否存在，存在就读现成页面\u003c/li>\u003cli>Do：大 repo 首次生成放后台跑，别阻塞主任务\u003c/li>\u003cli>Don&#x27;t：不要把它当实时真相——代码大改后要 \u003ccode>zread generate\u003c/code> 重生成\u003c/li>\u003cli>组合拳：zread（结构层）+ architecture-visualization（校验/补充视图）覆盖&quot;文档 vs 代码&quot;一致性\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>现场用 fde-scope 服务客户时，对客户 repo 出摸底 wiki\u003c/li>\u003cli>examples/ 中制造业语料的来源系统画像\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-a-pre-engagement/qmind-knowledge\">qmind-knowledge\u003c/a> · \u003ca href=\"#/cross-cutting/architecture-visualization-suite\">architecture-visualization-suite\u003c/a> · \u003ca href=\"#/zone-d-handoff/shifu\">shifu\u003c/a>\u003c/p>"}, {"route": "zone-a-pre-engagement/qmind-knowledge", "zone": "Zone A · Pre-engagement", "zoneId": "zone-a-pre-engagement", "status": "✅", "html": "\u003ch1>qmind-knowledge\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（PROD ONLY，CLI 按需下载）· 类型：工具/知识管理 · FDE 位点：Zone A/D · 知识库检索与维护\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>QMind 知识库工具箱：知识检索、notebook 管理、批量上传文件、编译生成知识卡片、lint 断链/质量检查。适合把散落的调研材料、SOP、故障案例沉淀成可检索知识域。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>用户提到 知识库 / knowledge base / 上传文档 / 知识卡片 / notebook / compile / lint\u003c/li>\u003cli>Zone A 调研材料的集中入库与检索\u003c/li>\u003cli>与 \u003ccode>shifu\u003c/code>/\u003ccode>podcast\u003c/code> 配合：qmind 存知识，shifu 教知识，podcast 播知识\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：代码仓库理解（→ zread）；fde-scope 自身语料（→ \u003ccode>fde_scope.corpus\u003c/code> 管道，不要混仓）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：提到 知识库 / RAG / 上传文档 / notebook / compile / lint / 知识卡片 等关键词即命中（SKILL.md 原文触发词）\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：\u003ccode>$QMIND login\u003c/code>（浏览器 OAuth，凭据落 \u003ccode>~/.qmind/credentials.json\u003c/code>）→ \u003ccode>$QMIND notebook list -format json\u003c/code> 看现有知识库\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：PROD ONLY——不要设 \u003ccode>QMIND_ENV\u003c/code> 等环境变量；\u003ccode>notebook create\u003c/code> 不幂等（不去重），创建前先 \u003ccode>notebook list\u003c/code>，新建后等 5-10 秒再上传，否则同步延迟会报 404\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：\u003ccode>compile\u003c/code> 是最贵操作（消耗 LLM token），批量上传完只触发一次；\u003ccode>notebook delete\u003c/code> / \u003ccode>source delete\u003c/code> 必须先跟用户确认\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>Do：批量上传后先 compile 出卡片再 lint，把质量问题在入库阶段解决\u003c/li>\u003cli>Do：按&quot;知识域&quot;建 notebook（如 05-网络/），与用户既有的目录习惯对齐\u003c/li>\u003cli>Don&#x27;t：生产环境操作前先确认 CLI 认证与权限（PROD ONLY 属性）\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>客户现场 FAQ / 故障处理知识的沉淀容器\u003c/li>\u003cli>工单语料的上游素材库（用户主业：语料工程）\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-a-pre-engagement/zread\">zread\u003c/a> · \u003ca href=\"#/zone-a-pre-engagement/firecrawl-crawl\">firecrawl-crawl\u003c/a> · \u003ca href=\"#/zone-d-handoff/shifu\">shifu\u003c/a>\u003c/p>"}, {"route": "zone-a-pre-engagement/brainstorming", "zone": "Zone A · Pre-engagement", "zoneId": "zone-a-pre-engagement", "status": "✅", "html": "\u003ch1>brainstorming\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（superpowers 系）· 类型：流程/方法论 · FDE 位点：Zone A · qualification / success-criteria\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>在任何创造性工作（新功能、新组件、改行为）动手\u003cstrong>之前\u003c/strong>，用探索性对话厘清意图、需求与设计。防止&quot;用户说了个大概就直接开写&quot;导致的返工。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>用户说&quot;我们做个 X / 加个 X / 改一下 X&quot;而没有明确规格\u003c/li>\u003cli>需求含糊、有多个合理方向、或涉及行为变更\u003c/li>\u003cli>Zone A 与客户对齐成功标准（success-criteria 阶段的方法论支撑）\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：规格已经完全明确的执行型任务；纯查询/纯排障。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：用户说&quot;我们做个 X / 加个 X / 改一下 X&quot;而没有明确规格时启用——SKILL.md 原话：&quot;You MUST use this before any creative work&quot;\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：让 agent 先探索项目现状（文件、文档、最近提交），然后\u003cstrong>一次只问一个问题\u003c/strong>地厘清目的/约束/成功标准，尽量给选择题\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：硬门禁（HARD-GATE）——设计未获用户批准前不许写任何代码或脚手架；&quot;这事太简单不用设计&quot;是 SKILL.md 点名的反模式，改个配置也要走流程\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：终点是调用 writing-plans 出实施计划，不是直接实现；规格落盘到 \u003ccode>docs/superpowers/specs/YYYY-MM-DD-&lt;topic&gt;-design.md\u003c/code> 并提交\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>Do：先问&quot;为什么&quot;再问&quot;做什么&quot;；把假设显式写出来\u003c/li>\u003cli>Do：产出物落成文字（计划/规格），供 \u003ca href=\"#/cross-cutting/writing-plans\">writing-plans\u003c/a> 接续\u003c/li>\u003cli>Don&#x27;t：不要跳过它直接进实现——这是 superpowers 的硬性优先级（流程技能先于实现技能）\u003c/li>\u003cli>边界：brainstorming 管&quot;想清楚&quot;，spec 类技能管&quot;写精确&quot;\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>fde-scope 新阶段/新 gate 设计前的需求探索\u003c/li>\u003cli>与客户开工会（kickoff）的问题清单骨架\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/cross-cutting/writing-plans\">writing-plans\u003c/a> · \u003ca href=\"../zone-a-pre-engagement/#\" target=\"_blank\" rel=\"noopener\">spec\u003c/a>（gstack 系） · \u003ca href=\"#/zone-a-pre-engagement/architecture-communicator\">architecture-communicator\u003c/a>\u003c/p>"}, {"route": "zone-a-pre-engagement/architecture-communicator", "zone": "Zone A · Pre-engagement", "zoneId": "zone-a-pre-engagement", "status": "✅", "html": "\u003ch1>architecture-communicator\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（架构可视化插件）· 类型：场景技能 · FDE 位点：Zone A/D · 干系人沟通与交付视图\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>把已有架构模型按\u003cstrong>受众\u003c/strong>重新表达：高管要能力地图、产品要边界与流程、运维要拓扑、安全要信任边界——裁剪范围、调整语言粒度、决定图的详细度，并产出对应交付物。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>&quot;给我老板/客户/运维团队讲清楚这个系统&quot;\u003c/li>\u003cli>stakeholder-map 阶段为不同干系人准备不同视图\u003c/li>\u003cli>移交文档需要受众定制版\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：还没有模型可讲时（先走 \u003ccode>explore\u003c/code> → \u003ccode>system-modeler\u003c/code> 建模）；风险评审（→ risk-quality-reviewer）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说「给我老板/客户/运维团队讲清楚这个系统」「为 XX 干系人准备架构讲解」——诉求里带明确\u003cstrong>受众\u003c/strong>的架构表达\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：告诉 agent 三件事：受众是谁、他要做什么决策、时间/细节约束（如「给高管 10 分钟版能力地图」），让它按 workflow 挑 1-3 个视图再翻译语言\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：手上还没有证据模型时别直接用它——先走 \u003ccode>explore\u003c/code> → \u003ccode>system-modeler\u003c/code> 建模，本技能只做&quot;受众翻译&quot;，不发明架构事实\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：简化不能把实质性风险和假设一起删掉；支撑材料要保留 \u003ccode>sourceRefs\u003c/code> 与稳定 ID 溯源；别把所有受众塞进同一张图\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>Do：先确认受众的决策问题是什么，再选视图层级（L0 能力 → L4 代码）\u003c/li>\u003cli>Do：复用 \u003ca href=\"#/cross-cutting/architecture-visualization-suite\">architecture-visualization-suite\u003c/a> 产出的证据模型，不重画一套事实\u003c/li>\u003cli>Don&#x27;t：不要给技术团队发高管版简图，也不要给高管画 L4 依赖网\u003c/li>\u003cli>组合：本技能做&quot;翻译&quot;，格式由 c4model/graphviz 基础技能承担\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone A \u003ccode>stakeholder-map\u003c/code> 产出物\u003c/li>\u003cli>Zone D \u003ccode>knowledge-transfer\u003c/code> 的分角色讲解材料\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/cross-cutting/architecture-visualization-suite\">architecture-visualization-suite\u003c/a> · \u003ca href=\"#/zone-a-pre-engagement/drawio\">drawio\u003c/a> · \u003ca href=\"#/zone-d-handoff/shifu\">shifu\u003c/a>\u003c/p>"}, {"route": "zone-a-pre-engagement/drawio", "zone": "Zone A · Pre-engagement", "zoneId": "zone-a-pre-engagement", "status": "✅", "html": "\u003ch1>drawio\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（架构可视化插件）· 类型：基础/交付格式 · FDE 位点：Zone A/D · 可编辑图交付\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>把架构证据模型导出为 Draw.io / diagrams.net 可编辑 \u003ccode>.drawio\u003c/code> 文件，供客户方人员手工修改；含本地 Draw.io MCP 设置指引。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>用户\u003cstrong>明确\u003c/strong>要 Draw.io、\u003ccode>.drawio\u003c/code>、diagrams.net、&quot;可编辑的图&quot;或本地 Draw.io MCP\u003c/li>\u003cli>交付物需要客户拿回去自己改图（他们没装 Qoder/Graphviz）\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：默认出图路径（文本型 DOT/DSL 更可维护）；把 \u003ccode>.drawio\u003c/code> 当事实源。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：用户\u003cstrong>明确\u003c/strong>点名 Draw.io / \u003ccode>.drawio\u003c/code> / diagrams.net / &quot;可编辑的图&quot;才触发；只说&quot;画个架构图&quot;不走它（先经 \u003ccode>explore\u003c/code> 路由）\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：让 agent 先出规范源文件（Mermaid / DOT / Structurizr DSL），再经本地 Draw.io MCP 转 \u003ccode>.drawio\u003c/code>——MCP 配置 \u003ccode>npx -y @drawio/mcp\u003c/code>，提供 \u003ccode>open_drawio_mermaid\u003c/code> / \u003ccode>open_drawio_xml\u003c/code> 等工具\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：\u003ccode>.drawio\u003c/code> 只是派生的可编辑交付层，证据模型（JSON/DOT/DSL）才是事实源——手改了 \u003ccode>.drawio\u003c/code> 不同步回模型，下次重生成会覆盖手工修改\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：转换时保留稳定的节点/边 ID 与 \u003ccode>sourceRefs\u003c/code>；MCP 工具不可用时让它给安装步骤并照常交付源文件，别硬造不存在的工具\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>Do：证据模型（JSON/DOT/DSL）永远是 source of truth，Draw.io 只是派生的可编辑交付层\u003c/li>\u003cli>Do：改了 \u003ccode>.drawio\u003c/code> 要同步回证据模型，否则下次重生成会覆盖手工修改\u003c/li>\u003cli>Don&#x27;t：不要因为&quot;好看&quot;而手改导出件偏离模型事实（插件明确禁止）\u003c/li>\u003cli>现场技巧：air-gap 客户用 diagrams.net 桌面版打开即可，无需网络\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone D 移交包里给运维团队的可编辑拓扑图\u003c/li>\u003cli>客户评审会上现场改图答疑\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/cross-cutting/architecture-visualization-suite\">architecture-visualization-suite\u003c/a> · \u003ca href=\"#/zone-a-pre-engagement/architecture-communicator\">architecture-communicator\u003c/a>\u003c/p>"}, {"route": "zone-a-pre-engagement/pdf", "zone": "Zone A · Pre-engagement", "zoneId": "zone-a-pre-engagement", "status": "✅", "html": "\u003ch1>pdf\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装 · 类型：工具/文档 · FDE 位点：横切（A 解读 / D 交付）\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>PDF 全流程工具箱：文本与表格抽取、页面操纵（合并/拆分/旋转）、表单填写、专业文档生成。读 \u003ccode>.pdf\u003c/code> 附件时的默认技能。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>用户消息里出现 \u003ccode>.pdf\u003c/code> 附件或路径\u003c/li>\u003cli>需要生成正式交付 PDF（非 Markdown 转换场景，用本技能的生成能力）\u003c/li>\u003cli>填写/解析 PDF 表单（客户设备验收单等）\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：Markdown → PDF 出版级排版（→ \u003ca href=\"#/zone-d-handoff/make-pdf\">make-pdf\u003c/a>）；只要内容抽取且文件是纯文本型（firecrawl-parse 也可以）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：用户消息里出现 \u003ccode>.pdf\u003c/code> 附件或路径，或要求&quot;解析 PDF 文本/表格 / 合并拆分 / 填表单 / 生成 PDF&quot;\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：读内容从 pypdf 起手：\u003ccode>from pypdf import PdfReader\u003c/code> → \u003ccode>PdfReader(&quot;sample.pdf&quot;)\u003c/code> 数页、\u003ccode>pg.extract_text()\u003c/code> 抽文本；要表格用 pdfplumber 的 \u003ccode>pg.extract_tables()\u003c/code>\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：生成含中文的 PDF 后必须打开目检——Arial/Helvetica 等标准字体不支持 CJK，中文会渲染成黑方块 ■，需注册 CJK 字体（如 macOS \u003ccode>PingFang.ttc\u003c/code>）或安装 \u003ccode>fonts-noto-cjk\u003c/code>\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：扫描件抽取结果不可全信，关键数字（金额/参数/日期）交付前人工复核\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>Do：先 extract 成结构化文本再处理，不要对二进制直接动手\u003c/li>\u003cli>Do：交付生成的 PDF 带页眉版本号和日期，现场文件生命周期长\u003c/li>\u003cli>Don&#x27;t：扫描件 OCR 结果要人工复核关键数字（金额/参数/日期）\u003c/li>\u003cli>现场：车间设备手册多为 PDF，入库语料前先统一抽取\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone A 合同/设备手册解读；Zone D 签字版报告\u003c/li>\u003cli>\u003ccode>reports/\u003c/code> 产物的 PDF 化归档\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-a-pre-engagement/firecrawl-parse\">firecrawl-parse\u003c/a> · \u003ca href=\"#/zone-d-handoff/make-pdf\">make-pdf\u003c/a> · \u003ca href=\"#/zone-a-pre-engagement/docx\">docx\u003c/a>\u003c/p>"}, {"route": "zone-a-pre-engagement/docx", "zone": "Zone A · Pre-engagement", "zoneId": "zone-a-pre-engagement", "status": "✅", "html": "\u003ch1>docx\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装 · 类型：工具/文档 · FDE 位点：横切（A 解读 / D 交付）\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>Word 文档工具箱：内容/表格抽取、专业文档生成、页面操纵、可填表单处理。处理 \u003ccode>.docx\u003c/code> 的默认技能。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>用户提到 &quot;word doc / .docx / 报告 / 备忘录&quot; 或附 \u003ccode>.docx\u003c/code> 文件\u003c/li>\u003cli>交付物要求 Word 格式（客户方流程常强制 docx）\u003c/li>\u003cli>生成带样式的正式文档（SOW、验收单模板填充）\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：\u003ccode>.pdf\u003c/code>（→ pdf）；\u003ccode>.txt/.md\u003c/code> 直接读。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：用户提到 &quot;word doc / .docx / 报告 / 备忘录&quot;，或消息附 \u003ccode>.docx\u003c/code> 文件\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：只读内容先转 Markdown：\u003ccode>pandoc --track-changes=all 文件.docx -o output.md\u003c/code>（顺带保留修订痕迹）；要动 XML 先解包：\u003ccode>python openxml/scripts/extract.py &lt;office_file&gt; &lt;输出目录&gt;\u003c/code>\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：改第三方/法务/学术类文档必须走 revision tracking 工作流，且只标记真正变化的文本（保留原 \u003ccode>&lt;w:r&gt;\u003c/code> 的 RSID）——整句 del+ins 重写会被评审打回\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：生成新文档用 docx-js 前必须完整读完 word-generator.md（约 500 行），SKILL.md 明令禁止带范围限制跳读\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>Do：改现有 docx 用编辑能力而非重生成，保住客户的模板/修订痕迹\u003c/li>\u003cli>Do：生成的文档用统一公司模板，移交时观感一致\u003c/li>\u003cli>Don&#x27;t：不要解析含宏的不可信 docx；注意 doc/docx 扩展名区分\u003c/li>\u003cli>现场：企业客户的 SOP 几乎都在 Word 里，语料化第一步常是 docx 抽取\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone A 客户 SOP/协议抽取为结构化语料原料\u003c/li>\u003cli>Zone D \u003ccode>knowledge-transfer\u003c/code> 的 Word 交付件\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-a-pre-engagement/pdf\">pdf\u003c/a> · \u003ca href=\"#/zone-a-pre-engagement/xlsx\">xlsx\u003c/a> · \u003ca href=\"#/zone-a-pre-engagement/firecrawl-parse\">firecrawl-parse\u003c/a>\u003c/p>"}, {"route": "zone-a-pre-engagement/xlsx", "zone": "Zone A · Pre-engagement", "zoneId": "zone-a-pre-engagement", "status": "✅", "html": "\u003ch1>xlsx\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装 · 类型：工具/数据 · FDE 位点：Zone A/B（点单）· D（报表）\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>高级电子表格工具箱：数据与公式双向抽取、复杂格式处理、专业表格生成、可填表单。处理 Excel/CSV/TSV 的默认技能。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>用户附 \u003ccode>.xlsx/.csv/.tsv\u003c/code> 文件或提到 spreadsheet/工作表/报表\u003c/li>\u003cli>交付结构化报表（KPI 表、bad case 清单、语料盘点表）\u003c/li>\u003cli>需要保留公式/多 sheet 结构的表格操作\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：只需看数据内容不关心格式（→ \u003ca href=\"#/zone-b-build/read-file\">read-file\u003c/a>）；超大数据文件分析（→ DuckDB \u003ca href=\"#/zone-b-build/query\">query\u003c/a>）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：附 \u003ccode>.xlsx/.csv/.tsv\u003c/code> 文件，或提到 spreadsheet / 工作表 / 报表 / 数据分析\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：数据画像用 pandas：\u003ccode>pd.read_excel(&#x27;file.xlsx&#x27;, sheet_name=None)\u003c/code> 一次拿全部 sheet，再 \u003ccode>df.head()\u003c/code> / \u003ccode>df.info()\u003c/code> 确认列结构\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：公式类需求必须生成真 Excel 公式（如 \u003ccode>=B5*(1+$B$6)\u003c/code>），不许在 Python 里算死硬编码；交付标准是零公式错误（#REF!/#DIV/0! 等）\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：公式求值依赖 LibreOffice（\u003ccode>formula_processor.py\u003c/code>），环境里没有会跑不动；改既有文件要保住原模板格式，别用统一格式覆盖客户既有约定\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>Do：先 \u003ccode>read-file\u003c/code>/画像确认列结构，再决定转换或分析路径\u003c/li>\u003cli>Do：公式计算类需求直接生成带公式的 xlsx，不要预先在代码里算死\u003c/li>\u003cli>Don&#x27;t：不要用文本方式手改二进制；合并多表时注意列名归一\u003c/li>\u003cli>现场：客户工单导出、设备点检表几乎都是 xlsx，是 connectors 之外的重要入口\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone B \u003ccode>connect\u003c/code>：客户点检表/工单表 → \u003ccode>fde_scope.connectors.csv_fallback\u003c/code> 前的格式归一（\u003ccode>convert-file\u003c/code>）\u003c/li>\u003cli>Zone C KPI 报表（OEE/MTBF 表）交付\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-b-build/read-file\">read-file\u003c/a> · \u003ca href=\"#/zone-b-build/convert-file\">convert-file\u003c/a> · \u003ca href=\"#/zone-b-build/query\">query\u003c/a>\u003c/p>"}, {"route": "zone-b-build/read-file", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "\u003ch1>read-file\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（duckdb-skills 系）· 类型：工具/数据 · FDE 位点：Zone B · connect 前置画像\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>读取任意数据文件（CSV/JSON/Parquet/Avro/Excel/spatial/SQLite）或远程 URL（S3/HTTPS），预览与画像数据。只读数据文件，\u003cstrong>不用于源代码\u003c/strong>。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>用户提到某个数据文件、问&quot;这里面是什么&quot;、要先看一眼数据集\u003c/li>\u003cli>决定后续走转换（convert-file）、查询（query）还是入管道（corpus）之前的探查\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：源代码阅读（用 Read）；Office 文档的格式级操作（→ docx/xlsx/pdf 技能）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：用户指着数据文件问&quot;这里面是什么&quot;或要先画像数据集（SKILL.md 触发语：&quot;what&#x27;s in this file&quot;、preview/profile a dataset）——只管数据文件，源代码不在射程内\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：对 agent 说「用 read-file 画像 examples/sample_tickets.csv，告诉我 schema 和行数」——它用一条 \u003ccode>duckdb -csv\u003c/code> 命令（read_any 宏）输出 \u003ccode>DESCRIBE\u003c/code> + 行数 + 前 20 行样本三件套\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：远程与特殊格式要先补前缀：\u003ccode>s3://\u003c/code>/\u003ccode>https://\u003c/code> 必须先 \u003ccode>LOAD httpfs;\u003c/code>（S3 还要 \u003ccode>CREATE SECRET (TYPE S3, PROVIDER credential_chain);\u003c/code>），xlsx/spatial/sqlite 要先 \u003ccode>INSTALL excel/spatial/sqlite_scanner; LOAD ...;\u003c/code>，否则直接报 extension 错\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：\u003ccode>duckdb: command not found\u003c/code> 先走 install-duckdb 再重试，别换工具硬读；给裸文件名（无 \u003ccode>/\u003c/code>）时 skill 会先 \u003ccode>find\u003c/code> 搜全路径，大目录里直接给精确路径更快\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>Do：接到客户数据第一步就画像：行数/列型/空值/编码，再谈清洗\u003c/li>\u003cli>Do：与 \u003ccode>fde_scope.connectors\u003c/code> 分工——连接器管生产接入，read-file 管一次性探查\u003c/li>\u003cli>Don&#x27;t：不要用它打开二进制大文件全量进上下文，先看 schema 再看样本\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone B \u003ccode>connect\u003c/code> 前的数据体检；examples/ 里 sample_tickets.csv、*.jsonl 的快速验证\u003c/li>\u003cli>语料入库前对 alarm_corpus.jsonl 之类的抽查\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-b-build/convert-file\">convert-file\u003c/a> · \u003ca href=\"#/zone-b-build/attach-db\">attach-db\u003c/a> · \u003ca href=\"#/zone-b-build/query\">query\u003c/a> · \u003ca href=\"#/zone-a-pre-engagement/xlsx\">xlsx\u003c/a>\u003c/p>"}, {"route": "zone-b-build/convert-file", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "\u003ch1>convert-file\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（duckdb-skills 系）· 类型：工具/数据 · FDE 位点：Zone B · connect 格式归一\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>任意方向的数据文件格式转换：CSV ↔ Parquet ↔ Excel ↔ JSON ↔ GeoJSON……包括 AI 原生无法直接产出的二进制格式（如 Parquet/xlsx 写入）。触发语：&quot;转成 parquet / 存成 xlsx / 导出 JSON / 做成 CSV&quot;。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>客户给 xlsx 但连接器只吃 CSV；分析完要把结果落成 Excel 交付\u003c/li>\u003cli>大数据落 Parquet 压缩存储；跨工具交换格式\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：文档格式互转（PDF→Word 这类走 firecrawl-parse/pdf/docx）；数据库表迁移（SQL 层面解决）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：说「转成 parquet」「存成 xlsx」「导出 JSON」「做成 CSV」这类格式到格式的话（SKILL.md 原文触发语）；AI 原生写不出的二进制格式（Parquet/xlsx）也由它兜底\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：对 agent 说「把 data.csv 转成 data.parquet」——核心就是一条 \u003ccode>duckdb -c &quot;COPY (FROM &#x27;data.csv&#x27;) TO &#x27;data.parquet&#x27;;&quot;\u003c/code>；不指定输出文件时默认同名 \u003ccode>.parquet\u003c/code>\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：输出格式由扩展名决定，缺扩展会直接报错：\u003ccode>.xlsx\u003c/code> 要先 \u003ccode>INSTALL excel; LOAD excel;\u003c/code>，\u003ccode>.geojson\u003c/code>/\u003ccode>.gpkg\u003c/code>/\u003ccode>.shp\u003c/code> 要 \u003ccode>LOAD spatial;\u003c/code>，漏了必然失败\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：\u003ccode>PARTITION_BY (col)\u003c/code> 只对 Parquet/CSV 输出生效，\u003ccode>CODEC &#x27;zstd&#x27;\u003c/code> 仅限 Parquet——对其他格式提分区/压缩会被忽略或报错；转换后要抽样验证行数与列型没劣化\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>Do：转换后抽样验证行数和列型没劣化\u003c/li>\u003cli>Do：现场归档统一 Parquet（列存、压缩、DuckDB 原生友好）\u003c/li>\u003cli>Don&#x27;t：不要对含公式的 xlsx 直接转 CSV——公式结果可以带走，公式本身丢失\u003c/li>\u003cli>组合：\u003ccode>convert-file\u003c/code> → DuckDB \u003ccode>query\u003c/code> 是轻量 ETL 标配，不必拉 Airflow\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone B \u003ccode>connect\u003c/code>：多源格式归一后进 \u003ccode>fde_scope.connectors.csv_fallback\u003c/code>\u003c/li>\u003cli>Corpus 原料准备：客户各种破格式 → JSONL/CSV\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-b-build/read-file\">read-file\u003c/a> · \u003ca href=\"#/zone-b-build/query\">query\u003c/a> · \u003ca href=\"#/zone-a-pre-engagement/xlsx\">xlsx\u003c/a>\u003c/p>"}, {"route": "zone-b-build/attach-db", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "\u003ch1>attach-db\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（duckdb-skills 系）· 类型：工具/数据 · FDE 位点：Zone B · 查询会话准备\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>把 DuckDB 数据库文件挂进当前会话（\u003ccode>/duckdb-skills:query\u003c/code> 的前置）：探索表/列/行数，写 SQL 状态文件，让后续查询自动恢复会话。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>同一个数据文件/库要连续做多轮 SQL 分析\u003c/li>\u003cli>用户给了 \u003ccode>.duckdb\u003c/code>/\u003ccode>.db\u003c/code>/\u003ccode>.sqlite\u003c/code> 文件要长期用\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：一次性看一眼文件（→ read-file）；没有 DuckDB 环境时先 \u003ccode>install-duckdb\u003c/code>。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：拿到 \u003ccode>.duckdb\u003c/code>/\u003ccode>.db\u003c/code>/\u003ccode>.sqlite\u003c/code> 文件要连续做多轮 SQL 时，对 agent 说「attach 这个库」/「把这个库文件挂进会话」（SKILL.md：为 /duckdb-skills:query 准备会话）\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：先验库再挂：\u003ccode>duckdb &lt;库文件&gt; -c &quot;PRAGMA version;&quot;\u003c/code> + \u003ccode>duckdb &lt;库文件&gt; -csv -c &quot;SELECT table_name, estimated_size FROM duckdb_tables();&quot;\u003c/code>，skill 会把 \u003ccode>ATTACH &#x27;&lt;path&gt;&#x27; AS &lt;alias&gt;;\u003c/code> 写进状态文件，之后 \u003ccode>duckdb -init .duckdb-skills/state.sql -c &quot;SHOW TABLES;&quot;\u003c/code> 即恢复会话\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：状态文件 \u003ccode>.duckdb-skills/state.sql\u003c/code>（或 \u003ccode>~/.duckdb-skills/&lt;project-id&gt;/state.sql\u003c/code>）是全 skill 共享、只追加不覆盖的——SKILL.md 明说 &quot;Never overwrite it&quot;，追加前先查重，别名冲突要让用户改名\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：文件不存在时 skill 会问&quot;要不要新建空库&quot;——DuckDB 首次写入才落文件，路径拼错不报错，挂完必须 \u003ccode>SHOW TABLES\u003c/code> 核对绑定的确是预期路径\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>Do：挂完先看生成的状态文件确认绑定的是正确路径\u003c/li>\u003cli>Do：多文件分析优先直接对文件查询（DuckDB 可查 CSV/Parquet），不必都导入\u003c/li>\u003cli>Don&#x27;t：不要挂载生产数据库文件副本以外的敏感数据到共享机器\u003c/li>\u003cli>现场：air-gap 环境 DuckDB 单机零服务，是最好的本地分析引擎\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone B eval 结果集、KPI 时序的多轮分析会话\u003c/li>\u003cli>制造业样例 \u003ccode>station_samples.jsonl\u003c/code> 的深度切片\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-b-build/query\">query\u003c/a> · \u003ca href=\"../zone-b-build/#\" target=\"_blank\" rel=\"noopener\">install-duckdb\u003c/a> · \u003ca href=\"#/zone-b-build/read-file\">read-file\u003c/a>\u003c/p>"}, {"route": "zone-b-build/query", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "\u003ch1>query\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（duckdb-skills 系）· 类型：工具/数据 · FDE 位点：Zone B · 分析主力\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>对挂载的 DuckDB 库或\u003cstrong>临时对文件\u003c/strong>跑 SQL：接受原生 SQL 或自然语言问题（&quot;上周告警最多的设备&quot;），用 DuckDB 方言习惯写法。覆盖 CSV/Parquet/Excel/JSON 直查。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>数据画像、聚合统计、异常切片、覆盖率分析\u003c/li>\u003cli>语料盘点（多少条、类别分布、重复率）与 eval 结果分析\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：源数据文件先要看结构（→ read-file / attach-db）；写操作类生产库（本技能偏只读分析）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：直接问自然语言「上周告警最多的设备是哪些」或贴一段 SQL；SQL 里带 \u003ccode>&#x27;file.csv&#x27;\u003c/code> 文件引用或 \u003ccode>--file\u003c/code> 参数走 ad-hoc 模式，否则走 attach-db 挂载的会话模式（SKILL.md Step 1 的分模式规则）\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：先 attach-db 挂库，再对 agent 说「统计每个工位的样本行数」；没有库文件也能临时直查：\u003ccode>duckdb :memory: -c &quot;FROM &#x27;data.csv&#x27; LIMIT 10;&quot;\u003c/code>（ad-hoc 沙箱模式，DuckDB 直查 CSV 不用导入）\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：大结果会先被拦：表 &gt;1M 行且查询无 \u003ccode>LIMIT\u003c/code>/聚合时 skill 会要求确认（建议加 \u003ccode>LIMIT 1000\u003c/code>），&gt;10 GB 还会追加耗时警告——长跑查询先想好边界\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：多行 SQL 必须用 heredoc \u003ccode>&lt;&lt;&#x27;SQL&#x27;\u003c/code> 传（SKILL.md 明说避免 shell 引号问题），塞进 \u003ccode>-c &quot;...&quot;\u003c/code> 单引号字符串容易被引号坑；ad-hoc 模式是沙箱（\u003ccode>enable_external_access=false\u003c/code>），只允许 \u003ccode>allowed_paths\u003c/code> 里列出的文件\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>Do：大 CSV 不导入，直接 \u003ccode>SELECT ... FROM &#x27;file.csv&#x27;\u003c/code> 查——DuckDB 的杀手锏\u003c/li>\u003cli>Do：分析结论落成 SQL 文件归档，移交时客户可复跑\u003c/li>\u003cli>Don&#x27;t：不要在自然语言模式下问跨越多个语义域的大杂问，拆成多查询\u003c/li>\u003cli>组合：query + coverage_analyzer 思路可以给 \u003ccode>fde_scope.corpus\u003c/code> 报告做二次挖掘\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone B \u003ccode>corpus\u003c/code> 后的语料质量复盘；Zone C KPI（OEE/MTBF）临时口径计算\u003c/li>\u003cli>examples/manufacturing 场景数据的即席分析\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-b-build/attach-db\">attach-db\u003c/a> · \u003ca href=\"#/zone-b-build/convert-file\">convert-file\u003c/a> · \u003ca href=\"#/zone-b-build/spatial\">spatial\u003c/a>\u003c/p>"}, {"route": "zone-b-build/spatial", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "\u003ch1>spatial\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（duckdb-skills 系）· 类型：工具/数据 · FDE 位点：Zone B · 地理数据分析\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>用 DuckDB 回答地理空间问题：位置/坐标/距离/地图地址、邻近与包含判断、GeoJSON/Shapefile/GeoPackage/GPX/GeoParquet 格式处理；全球基础地图数据经 Overture Maps（S3 免费无 key）。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>提到 lat/lng、距离、&quot;离 X 最近的&quot;、区域包含、地图数据文件\u003c/li>\u003cli>物流/车辆/网点类客户数据的空间分析（工单地理分布、服务站覆盖）\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：非空间的普通数据分析（→ query）；地图渲染类产品开发。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：问题里带 lat/lng、距离、「离 X 最近的」、区域包含判断或 GeoJSON/Shapefile/GeoPackage 文件（SKILL.md 触发清单原文）；没给文件的真实地点问题会自动走 Overture Maps（S3 免费无 key）\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：任何空间查询都以这两行开头（SKILL.md Step 2 规定）：\u003ccode>LOAD spatial;\u003c/code> + \u003ccode>SET geometry_always_xy = true;\u003c/code>——CSV 坐标转点用 \u003ccode>ST_Point(longitude, latitude)\u003c/code>，经度在前\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：球面距离函数 \u003ccode>ST_Distance_Spheroid\u003c/code> 只吃 \u003ccode>POINT_2D\u003c/code> 类型，Overture 的 \u003ccode>GEOMETRY\u003c/code> 列要先 \u003ccode>ST_Point(ST_X(geometry), ST_Y(geometry))::POINT_2D\u003c/code> 抽坐标，直接传会算错；平面 \u003ccode>ST_Distance\u003c/code> 对经纬度结果无意义\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：查 Overture 必须先用 \u003ccode>bbox.xmin/xmax/ymin/ymax\u003c/code> 粗筛再做空间函数——否则绕过 Parquet 谓词下推，等于把全球数据集整段拉下来\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>Do：先确认坐标系（WGS84 vs 投影坐标），距离计算错坐标系是最常见事故\u003c/li>\u003cli>Do：大表空间 join 前用边界框粗筛再精算\u003c/li>\u003cli>Don&#x27;t：不要拿 Overture 数据当权威产权/行政数据交付客户，注明数据源与时间\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>制造业/物流案例：园区设备点位、巡检路线覆盖分析\u003c/li>\u003cli>ticket 场景的网点地理热力图数据准备\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-b-build/query\">query\u003c/a> · \u003ca href=\"#/zone-b-build/convert-file\">convert-file\u003c/a>\u003c/p>"}, {"route": "zone-b-build/mqtt-development", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "📦", "html": "\u003ch1>mqtt-development 📦\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：📦 可安装（未装）· 类型：领域知识 · FDE 位点：Zone B · connect（工业消息）\u003cbr>来源：\u003ccode>mindrally/skills@mqtt-development\u003c/code> · 热度：908 installs · 详情：https://skills.sh/mindrally/skills/mqtt-development\u003cbr>安装：\u003ccode>npx skills add mindrally/skills@mqtt-development --directory ~/.qoder/skills -y\u003c/code>\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>MQTT 协议开发模式与最佳实践参考（订阅/QoS/保留消息/遗嘱等），辅助排查与实现消息接入层代码。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>对接客户 MQTT broker、调试 \u003ccode>fde_scope.connectors.mqtt_sparkplug\u003c/code> 相关问题时作为参考手册\u003c/li>\u003cli>现场设备上报异常（掉线、重复、乱序）需要协议层判断\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：fde-scope 已有自研 connector——以我方可控实现为主，该 skill 只做知识辅助，不要让外部 skill 改写核心连接器语义。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对接客户 MQTT broker、排查设备掉线/重复/乱序上报时提到 MQTT/QoS/保留消息/遗嘱等协议词（页面&quot;何时使用&quot;；该 skill 尚未安装，先装再问）\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：装前先让 agent 过 \u003ca href=\"#/cross-cutting/skill-criticagent\">skill-criticagent\u003c/a> 评估，通过后执行 \u003ccode>npx skills add mindrally/skills@mqtt-development --directory ~/.qoder/skills -y\u003c/code> 安装，再对 agent 说「用 mqtt-development 的订阅/QoS 要点过一遍我的接入代码」\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：它是知识参考件不接代码——Sparkplug 状态机（NDEATH/DBIRTH）细节未必覆盖，与 \u003ccode>fde_scope/connectors/mqtt_sparkplug.py\u003c/code> 实现或规范原文冲突时以后者为准，别让外部模板改写连接器语义\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：908 installs 的社区件质量未经官方验证，跳过评估直接装遇到过时协议细节/虚构参数没有任何兜底；评估结论要回写本页&quot;最佳实践&quot;段\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>装前门禁：先用 \u003ca href=\"#/cross-cutting/skill-criticagent\">skill-criticagent\u003c/a> 评估（社区 skill，质量未经官方验证）\u003c/li>\u003cli>Sparkplug 规范（状态机 NDEATH/DBIRTH）细节该 skill 未必覆盖，冲突时以 \u003ccode>fde_scope/connectors/mqtt_sparkplug.py\u003c/code> 的实现与规范原文为准\u003c/li>\u003cli>评估通过后再安装，并把结论回写本页&quot;最佳实践&quot;段\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone B \u003ccode>connect\u003c/code> 工业消息接入的辅助知识\u003c/li>\u003cli>tests/test_mqtt_connector.py 排障参考\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-b-build/read-file\">read-file\u003c/a> · \u003ca href=\"#/cross-cutting/skill-criticagent\">skill-criticagent\u003c/a>\u003c/p>"}, {"route": "zone-b-build/bailian-train-deploy", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "\u003ch1>bailian-train-deploy\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装 · 类型：工作流/平台 · FDE 位点：Zone B validate/deploy + Zone C flywheel\u003cbr>依赖：\u003ccode>bl\u003c/code> CLI + 百炼平台账号（需 API key；写操作先 \u003ccode>--dry-run\u003c/code>）\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>用百炼 CLI 走完「数据→微调训练→导出→部署→调用」完整闭环，或跳过训练直接部署基座模型。覆盖文本（SFT/DPO/CPT）、TTS（CosyVoice）、图像（Wan2.7）、视频（Wan i2v/kf2v）微调。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>涉及百炼/DashScope 的&quot;训练/微调/精调/部署模型/上线/LoRA/SFT/DPO&quot;任何环节——即使用户没点名 \u003ccode>bl\u003c/code>\u003c/li>\u003cli>数据飞轮回流后的周期性重训（\u003ccode>fde_scope.flywheel.retrain_scheduler\u003c/code> 的落地执行器）\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：火山方舟 ark 精调；本地 GPU 训练（→ trl-training / huggingface-llm-trainer）；纯选型（→ bailian-model-recommend）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：提到百炼/DashScope 的「训练模型」「微调」「fine-tune」「部署模型/上线」「SFT/DPO/LoRA」任一环节即触发，用户没点名 \u003ccode>bl\u003c/code> 也算（skill description 触发语 + 页面&quot;何时使用&quot;）\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：按固定链路推进：\u003ccode>bl dataset validate\u003c/code> 校验数据格式对齐模板 → \u003ccode>bl dataset upload\u003c/code> 拿 file-id → \u003ccode>bl finetune create\u003c/code> 建任务 → watch 到完成 → export 最佳 checkpoint → \u003ccode>bl deploy\u003c/code>——不要跳步；所有写操作先加 \u003ccode>--dry-run\u003c/code> 预览\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：顺序不可省：未 watch 完成就 export 会拿到未就绪 checkpoint（页面 Don&#x27;t 明令）；数据格式没在 validate 阶段对齐模板，训练跑到一半才失败，白烧按时长计费的额度\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：不要凭记忆拼 \u003ccode>bl\u003c/code> 参数（页面 Don&#x27;t，百炼 skill 家族要求先读命令文档）；API key 只走环境变量（项目不变量），禁止写进脚本/日志\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>Do：链路固定为 validate 数据 → upload 拿 file-id → finetune create → watch → export → deploy，\u003cstrong>不要跳步\u003c/strong>\u003c/li>\u003cli>Do：所有写操作先 \u003ccode>--dry-run\u003c/code> 预览再执行\u003c/li>\u003cli>Do：数据集格式在 validate 阶段就对齐模板，省得训练失败再查\u003c/li>\u003cli>Don&#x27;t：不要凭记忆拼 \u003ccode>bl\u003c/code> 参数；不要未 watch 完成就 export\u003c/li>\u003cli>成本：训练/部署按时长计费，demo 用最小规格，验证通就下线\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone B \u003ccode>validate→deploy\u003c/code>：微调产物的真实落地路径\u003c/li>\u003cli>Zone C flywheel：bad case 回流 → 周度重训 → 新模型再部署\u003c/li>\u003cli>docs/llm_integration.md 中 MiMo 之外的平台侧选项\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/cross-cutting/bailian-cli\">bailian-cli\u003c/a> · \u003ca href=\"#/zone-c-operationalization/trl-training\">trl-training\u003c/a> · \u003ca href=\"#/zone-c-operationalization/huggingface-llm-trainer\">huggingface-llm-trainer\u003c/a>\u003c/p>"}, {"route": "zone-b-build/huggingface-datasets", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "\u003ch1>huggingface-datasets\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（huggingface 插件家族）· 类型：工具/数据 · FDE 位点：Zone B corpus\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>基于 HF Dataset Viewer API 的数据集工作流：拉 subset/split 元数据、分页取行、全文搜索、过滤、拿 parquet 下载 URL、读规模与统计——不下载全量就能探查任意 Hub 数据集。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>为语料库找公开数据补充（中文指令集、故障诊断域数据）\u003c/li>\u003cli>对比候选数据集的规模/字段/样例后再决定下载\u003c/li>\u003cli>需要 parquet URL 直接喂给 DuckDB 分析\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：Hub 认证/仓库管理等泛操作（→ hf-cli）；训练本身（→ trl-training）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：为语料找公开数据补充、对比 Hub 数据集规模/字段、要 parquet 直查 URL 时，对 agent 说「看看 XX 数据集里有什么」（skill description：fetch subset/split metadata、paginate rows、search/filter、parquet URLs）\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：让 agent 走 Dataset Viewer API 探查：\u003ccode>/is-valid\u003c/code> 验存在 → \u003ccode>/splits\u003c/code> 定 config/split → \u003ccode>/first-rows\u003c/code> 看样例，如 \u003ccode>curl &quot;https://datasets-server.huggingface.co/rows?dataset=stanfordnlp/imdb&amp;config=plain_text&amp;split=train&amp;offset=0&amp;length=100&quot;\u003c/code>（SKILL.md 分页示例）\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：分页 \u003ccode>length\u003c/code> 上限 100、\u003ccode>offset\u003c/code> 从 0 起，传大值会被拒；gated/私有数据集必须带 \u003ccode>Authorization: Bearer &lt;HF_TOKEN&gt;\u003c/code>，否则 401\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：受限数据集注意 license 与用途限制，交付客户前二次确认；别无脑 \u003ccode>load_dataset\u003c/code> 全量进内存——先 Viewer 看 100 条样例判质量，再用 \u003ccode>/parquet\u003c/code> URL 喂 DuckDB 直查\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>Do：先用 search+分页看 100 条样例判断质量，再 \u003ccode>convert-file\u003c/code>/parquet URL 拉全量\u003c/li>\u003cli>Do：私有/受限数据集注意 license 与用途限制，交付客户前二次确认\u003c/li>\u003cli>Don&#x27;t：不要无脑 \u003ccode>load_dataset\u003c/code> 全量进内存，先 Viewer 探查\u003c/li>\u003cli>组合：Viewer 探查 → parquet URL → \u003ccode>query\u003c/code>（DuckDB 直查远程文件）是零落地分析链路\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone B corpus 的外部语料补充源\u003c/li>\u003cli>eval 基准数据（分类/检索 benchmark）的快速引入\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-b-build/convert-file\">convert-file\u003c/a> · \u003ca href=\"#/zone-b-build/query\">query\u003c/a> · \u003ca href=\"#/zone-b-build/train-sentence-transformers\">train-sentence-transformers\u003c/a>\u003c/p>"}, {"route": "zone-b-build/train-sentence-transformers", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "\u003ch1>train-sentence-transformers\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装 · 类型：训练/领域 · FDE 位点：Zone B corpus + Zone C flywheel\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>训练/精调 sentence-transformers 全家族：\u003ccode>SentenceTransformer\u003c/code>（双塔嵌入：检索、相似、聚类、分类、 paraphrase 挖掘、去重、多模态）、\u003ccode>CrossEncoder\u003c/code>（重排器/ pair 分类）、\u003ccode>SparseEncoder\u003c/code>（SPLADE 稀疏检索）。覆盖损失选择、难负例挖掘、评估器、LoRA、Matryoshka、Hub 发布。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>语料工程需要\u003cstrong>领域定制嵌入模型\u003c/strong>：工单相似检索、故障案例去重、告警聚类\u003c/li>\u003cli>\u003ccode>fde_scope.corpus\u003c/code> 的语义去重/覆盖度分析用通用模型效果不够时\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：生成式 LLM 微调（→ bailian-train-deploy / trl-training）；只是调 API 检索（平台侧知识库解决）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：要训/精调嵌入或重排模型时说「训练 sentence-transformers」「微调个 embedding 模型」「训个 reranker」（skill description：any sentence-transformers training task；先按双塔/重排/稀疏三类定位模型类型）\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：别让 agent 从零写训练脚本——SKILL.md 开头明说&quot;this is a router, not a manual&quot;：确定类型后复制对应生产模板 \u003ccode>scripts/train_&lt;type&gt;_example.py\u003c/code> 起步，并完整读 \u003ccode>references/losses_*.md\u003c/code> 的损失-数据形状映射\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：CrossEncoder 非 BCE 损失必须 \u003ccode>activation_fn=Identity()\u003c/code>，漏了会&quot;silent eval-rank collapse&quot;（SKILL.md 原话）；MNRL 损失族要求 \u003ccode>BatchSamplers.NO_DUPLICATES\u003c/code> 采样器，随机负例直接训错\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：精度别写 \u003ccode>torch_dtype=bfloat16\u003c/code>——规则是 fp32 加载 + autocast（bf16/fp16）；\u003ccode>save_steps\u003c/code> 必须是 \u003ccode>eval_steps\u003c/code> 的倍数，否则 \u003ccode>load_best_model_at_end\u003c/code> 不生效。训前先跑现成模型 baseline（recall@k），不够再训\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>Do：先拿现成模型跑 baseline 并量化（recall@k / 聚类纯度），不够再训——训练是最后手段\u003c/li>\u003cli>Do：难负例挖掘（hard-negative mining）是效果大头，别只喂随机负例\u003c/li>\u003cli>Do：Matryoshka 维度裁剪（如 1024→256）省现场存储与延迟\u003c/li>\u003cli>Don&#x27;t：不要在无标注数据时盲目对比学习&quot;试试&quot;；先把 bad case 判读做成标注集\u003c/li>\u003cli>组合：bad_case_miner 产出 → 本技能训练 → 部署进 KnowledgeBase collection\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone B corpus：语义去重、覆盖度聚类的嵌入内核\u003c/li>\u003cli>Zone C flywheel：周期性重训的检索侧分支（区别于生成侧）\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-c-operationalization/trl-training\">trl-training\u003c/a> · \u003ca href=\"#/zone-b-build/huggingface-datasets\">huggingface-datasets\u003c/a> · \u003ca href=\"#/zone-b-build/bailian-train-deploy\">bailian-train-deploy\u003c/a>\u003c/p>"}, {"route": "zone-b-build/rag-agent-builder", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "📦", "html": "\u003ch1>rag-agent-builder 📦\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：📦 可安装（未装）· 类型：工作流 · FDE 位点：Zone B prototype/deploy\u003cbr>来源：\u003ccode>qodex-ai/ai-agent-skills@rag-agent-builder\u003c/code> · 热度：239 installs · 详情：https://skills.sh/qodex-ai/ai-agent-skills/rag-agent-builder\u003cbr>安装：\u003ccode>npx skills add qodex-ai/ai-agent-skills@rag-agent-builder --directory ~/.qoder/skills -y\u003c/code>\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>RAG 智能体搭建流程参考：检索管道组织、知识库接线、生成端拼装。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>给客户做&quot;文档问答/工单辅助&quot;类 RAG demo，想要一套现成套路\u003c/li>\u003cli>补 Corpus 产物 → 可服务知识库这一环的\u003cstrong>方法论\u003c/strong>参考\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：百炼平台知识库（\u003ccode>bl knowledge\u003c/code> 已安装，平台路径优先）；AgentScope 的 Knowledge 体系（以 \u003ccode>fde_scope/deploy\u003c/code> 真实 API 为准，别被通用模板带偏用虚构 API）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：给客户做&quot;文档问答/工单辅助&quot;类 RAG demo、想要现成搭建套路时说「帮我搭一个 RAG 智能体」（页面&quot;何时使用&quot;；该 skill 尚未安装，先装再问）\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：装前先让 agent 过 \u003ca href=\"#/cross-cutting/skill-criticagent\">skill-criticagent\u003c/a> 门禁（重点审它推荐的 API 是否真实存在），通过后执行 \u003ccode>npx skills add qodex-ai/ai-agent-skills@rag-agent-builder --directory ~/.qoder/skills -y\u003c/code>，再按&quot;检索管道→知识库接线→生成端拼装&quot;的流程走\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：低热度社区模板最容易教 agent 编造 API：与 docs/agentscope_api_mapping.md 的&quot;真实 2.0.5 API&quot;冲突时一律以映射表为准，照抄模板虚构调用会直接跑不通\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：百炼知识库走已装的 \u003ccode>bl knowledge\u003c/code> 平台路径，AgentScope Knowledge 体系以 \u003ccode>fde_scope/deploy\u003c/code> 真实 API 为准——该模板只做方法论参考，不落地成代码\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>装前门禁：239 installs 属低热度社区件，\u003cstrong>必须\u003c/strong>先过 \u003ca href=\"#/cross-cutting/skill-criticagent\">skill-criticagent\u003c/a>，重点审它推荐的 API 是否真实存在（本项目 docs/agentscope_api_mapping.md 就是为虚构 API 坑而写的）\u003c/li>\u003cli>若模板与 \u003ccode>docs/agentscope_api_mapping.md\u003c/code> 的&quot;真实 2.0.5 API&quot;冲突，一律以本项目映射表为准\u003c/li>\u003cli>评估结论回写本页\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone B prototype-on-real-data：语料 → 可演示问答原型\u003c/li>\u003cli>Zone C：客户自助知识库的搭建参考\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-b-build/huggingface-datasets\">huggingface-datasets\u003c/a> · \u003ca href=\"#/zone-b-build/train-sentence-transformers\">train-sentence-transformers\u003c/a> · \u003ca href=\"#/cross-cutting/bailian-cli\">bailian-cli\u003c/a>\u003c/p>"}, {"route": "zone-b-build/frontend-design", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "\u003ch1>frontend-design\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装 · 类型：实现/设计 · FDE 位点：Zone B prototype\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>产出有辨识度、生产级质量的前端界面（网页/组件/dashboard/海报/app），规避&quot;AI 通用审美&quot;（千篇一律的紫渐变、Inter 字体、卡片套卡片）。用户要求构建 Web 组件、页面、落地页或美化任何 UI 时使用。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>给客户做 demo 工作台、结果展示页、汇报用视觉物料\u003c/li>\u003cli>\u003ccode>fde_scope/web\u003c/code> 工作台前端升级观感\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：只要功能不要脸的内部脚本页（直接写）；设计系统咨询（→ ui-designer 更系统）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：让 agent 构建网页/组件/落地页/dashboard/海报或&quot;美化任何 UI&quot;时适用（skill description），项目里典型话术：「给 demo 工作台出一版有辨识度的界面」\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：先给设计 brief 再让它写码——受众、情绪/参考、页面的唯一任务；skill 流程第一步是产出 token 系统：4–6 个命名 hex 色板、display/body 字体搭配、布局 ASCII 草图、一个 signature 记忆点，再进代码\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：skill 点名三种&quot;AI 默认脸&quot;（暖米底+衬线+terracotta 点缀、近黑底+荧光绿/朱红单点缀、报纸式 hairline 排版）——不给 brief 任其发挥大概率落进这三款之一\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：别引入需联网的字体/CDN：air-gap 现场断网资源加载失败，比丑更致命（页面 Don&#x27;t）；动效按 skill 建议克制编排，别抢演示焦点\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>Do：先定设计方向（受众、情绪、参考）再写码——它是&quot;设计+实现&quot;一体的技能\u003c/li>\u003cli>Do：现场 demo 保持&quot;一屏看懂&quot;：KPI 大数字 + 流程图 + 少量交互\u003c/li>\u003cli>Don&#x27;t：不要堆动效炫技抢演示焦点；不要引入需联网的字体/CDN（air-gap 环境失效）\u003c/li>\u003cli>离线检查：交付前断网开一遍，资源加载失败的 demo 比丑更致命\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone B \u003ccode>prototype-on-real-data\u003c/code> 的展示层\u003c/li>\u003cli>examples/ 的 corpus HTML 报告美化（templates/corpus_report.html.j2）\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-b-build/ui-designer\">ui-designer\u003c/a> · \u003ca href=\"#/zone-b-build/shadcn\">shadcn\u003c/a> · \u003ca href=\"../zone-b-build/#\" target=\"_blank\" rel=\"noopener\">canvas\u003c/a>（可视化制品）\u003c/p>"}, {"route": "zone-b-build/ui-designer", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "\u003ch1>ui-designer\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装 · 类型：设计/原型 · FDE 位点：Zone B prototype\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>Web UI 设计与原型专家：建立设计系统、视觉风格，输出可运行 MVP 原型。偏&quot;从 0 定系统&quot;，比 frontend-design 更上游。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>新客户工作台/产品需要先定视觉体系（色板、字体、组件规范）再多人/多页开发\u003c/li>\u003cli>&quot;帮我设计一个 XX 应用界面&quot;级别的完整任务\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：已有设计系统只缺页面（→ frontend-design / shadcn）；单张小海报图类物料。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：说「帮我设计一个 XX 应用界面」「给新工作台定一套设计系统」这类完整设计任务（SKILL.md When to Activate：新网站/落地页/Web 应用、要 MVP 原型、提到 &quot;UI&quot;/&quot;design&quot;/&quot;vibe coding&quot;）\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：把产品定位和受众一段话给 agent，让它按默认技术栈（React + Vite + Tailwind + TypeScript + shadcn/ui）先出设计系统（CSS 变量 token）再落可运行 MVP 原型\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：该 skill 激活时会覆盖&quot;避免过度设计&quot;类默认约束（SKILL.md 开头明说 rich design systems/动画/渐变 ARE the goal）——评审前原型只保真到&quot;能讲清交互&quot;，别按它默认深度过度实现\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：已有设计系统只缺页面时不要用它重新定风格（页面&quot;不用于&quot;→ frontend-design/shadcn），多套 token 并存风格漂移更难救\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>Do：设计系统产出以 token 形式落文档（色/距/字阶），交接时客户运维能延续\u003c/li>\u003cli>Do：原型只保真到&quot;能讲清交互&quot;的深度，别在评审前过度实现\u003c/li>\u003cli>Don&#x27;t：不要跳过它直接写码再&quot;顺手设计&quot;，风格漂移更难救\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>多客户 engagement 时按品牌色派生工作台主题\u003c/li>\u003cli>pawapp 桌面端 UI 风格基线（配合 \u003ccode>pawapp/ui\u003c/code>）\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-b-build/frontend-design\">frontend-design\u003c/a> · \u003ca href=\"#/zone-b-build/shadcn\">shadcn\u003c/a> · \u003ca href=\"../zone-b-build/#\" target=\"_blank\" rel=\"noopener\">design-system\u003c/a>\u003c/p>"}, {"route": "zone-b-build/shadcn", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "\u003ch1>shadcn\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（vercel 插件 v0.44.0，priority=6 自动触发）· 类型：组件体系/工作流 · FDE 位点：Zone B demo\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>shadcn/ui 全套能力：CLI 初始化（非交互）、组件添加（\u003ccode>npx shadcn@latest add\u003c/code>）、组件组合成产品级 UI、自定义 registry 发布、Tailwind 主题/暗色定制、组件问题排查。核心概念：组件是\u003cstrong>复制进仓库的源码\u003c/strong>，不是 npm 依赖——所以完全可改。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>fde-scope Web 控制台（\u003ccode>fde_scope/web/\u003c/code>）的 React 面板需要成体系的组件与主题时\u003c/li>\u003cli>现场 demo 要在几小时内做出&quot;像成品&quot;的表格/表单/对话框/侧栏组合\u003c/li>\u003cli>路径命中 \u003ccode>components.json\u003c/code>、\u003ccode>components/ui/**\u003c/code>、\u003ccode>npx shadcn ...\u003c/code> 时该 skill 会自动激活\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：纯静态单页原型（→ \u003ca href=\"#/zone-b-build/ui-designer\">ui-designer\u003c/a> 或 \u003ca href=\"#/zone-b-build/frontend-design\">frontend-design\u003c/a> 足够）；非 React 技术栈（Vue/Svelte）不要硬套。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：路径命中 \u003ccode>components.json\u003c/code>、\u003ccode>components/ui/**\u003c/code> 或命令出现 \u003ccode>npx shadcn init/add\u003c/code> 时自动激活（SKILL.md metadata 的 pathPatterns/bashPatterns，priority=6）；对 agent 说「加一个 Dialog 组件」「调主题」同样命中\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：项目根跑 \u003ccode>npx shadcn@latest init\u003c/code> 用非交互参数初始化（页面 Do：避免 agent 卡在交互提示上），然后按需 \u003ccode>npx shadcn@latest add &lt;component&gt;\u003c/code>\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：项目用 AI Elements 时必须 \u003ccode>npx shadcn@latest init -d --base radix -f\u003c/code>——SKILL.md 内置校验规则：Base UI 与 Radix API（asChild/openDelay）不兼容，装错基底组件会带类型错\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：别 \u003ccode>add\u003c/code> 全家桶——组件是复制进仓库的源码不是 npm 依赖，一次性 add 全部会塞满没人维护的副本；主题统一走 CSS 变量 + Tailwind token，逐组件改颜色后面改不动\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>Do：\u003ccode>npx shadcn@latest init\u003c/code> 用非交互参数，避免 agent 卡在提示上\u003c/li>\u003cli>Do：只 add 真正用到的组件——一次性 add 全部会把仓库塞满没人维护的副本\u003c/li>\u003cli>Do：主题走 CSS 变量 + Tailwind token，不要逐个组件改颜色\u003c/li>\u003cli>Warning：若项目使用 AI Elements，必须 \u003ccode>npx shadcn@latest init -d --base radix -f\u003c/code>（Base UI 与 Radix API 不兼容，skill 里带此校验规则）\u003c/li>\u003cli>组合优于新增：优先用已有组件拼（Card/Table/Dialog/Form），而不是自己造轮子\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone B demo/原型：Web 控制台的组件底座与主题一致性\u003c/li>\u003cli>与 \u003ca href=\"#/zone-b-build/frontend-design\">frontend-design\u003c/a> 配合：shadcn 出结构，frontend-design 管设计质量下限\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-b-build/frontend-design\">frontend-design\u003c/a> · \u003ca href=\"#/zone-b-build/ui-designer\">ui-designer\u003c/a> · \u003ca href=\"#/zone-b-build/vercel-deploy\">vercel-deploy\u003c/a>\u003c/p>"}, {"route": "zone-b-build/vercel-deploy", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "\u003ch1>vercel-deploy\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（vercel 插件 v0.44.0；实际 skill 名为 \u003ccode>deployments-cicd\u003c/code> + \u003ccode>vercel-cli\u003c/code>，本页为&quot;用 Vercel 上线 demo&quot;的合页档案）· 类型：部署/平台 · FDE 位点：Zone B demo→客户可访问 URL\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>把前端 demo 快速变成客户可点开的 URL：\u003ccode>vercel\u003c/code> CLI 部署、preview → production 提升、回滚、查看部署日志与构建产物（\u003ccode>--prebuilt\u003c/code>）、CI 工作流接入（GitHub/GitLab）。配套还有 env-vars、vercel-functions、vercel-storage、routing-middleware 等同插件 skill。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>现场给客户看原型：本地跑通后要一个\u003cstrong>能分享\u003c/strong>的链接，而不是让客户装环境\u003c/li>\u003cli>配 \u003ccode>.github/workflows/*\u003c/code> 做 PR preview 时\u003c/li>\u003cli>部署失败/环境变量丢失/缓存导致旧版本还在服务的排障\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：客户内网/离线场景（Vercel 出网不可用 → 走 \u003ca href=\"#/zone-b-build/docker-build-deploy\">docker-build-deploy\u003c/a> 或 \u003ca href=\"#/zone-b-build/alibabacloud-workbench-cli\">alibabacloud-workbench-cli\u003c/a>）；纯后端 Python 服务（fde-scope 的 FastAPI 主体）更适合容器化交付。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：说「部署到 Vercel」「给个能分享的链接」，或排障时问 deployment status / vercel logs / deploy failing 这类短语（vercel-cli SKILL.md promptSignals 原文）\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：项目目录跑 \u003ccode>vercel\u003c/code>（或 \u003ccode>npx vercel\u003c/code>）拿 preview URL 给客户看，确认后再 \u003ccode>vercel --prod\u003c/code> 上生产；排障用 \u003ccode>vercel logs &lt;deployment&gt;\u003c/code> / \u003ccode>vercel inspect\u003c/code>\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：不要拿 production 部署当冒烟测试（页面 Don&#x27;t）：preview → \u003ccode>vercel promote\u003c/code> 才是安全路径；Secret 一律走 \u003ccode>vercel env\u003c/code>，写进仓库或命令行历史即泄漏\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：构建重复耗时长改用 \u003ccode>vercel build\u003c/code> + \u003ccode>vercel deploy --prebuilt\u003c/code> 只传产物（deployments-cicd SKILL.md 覆盖的流程）；客户真实数据/工单不得进 public preview，demo 只用合成数据\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>Do：先 preview 再 promote——preview URL 是给客户&quot;看一眼&quot;的最小暴露面\u003c/li>\u003cli>Do：Secret 走 \u003ccode>vercel env\u003c/code>，不要写进仓库或命令行历史\u003c/li>\u003cli>Do：构建重复耗时长时用 \u003ccode>--prebuilt\u003c/code>（本地/CI 构建一次，部署只传产物）\u003c/li>\u003cli>Don&#x27;t：不要用 production 部署做冒烟测试；不要留着 demo 长期免费额度消耗\u003c/li>\u003cli>隐私红线：客户数据/真实工单一律不得进入 public preview；demo 只用合成数据（\u003ccode>fde_scope\u003c/code> 的 mock/JSONL 模式）\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone B demo：Web 控制台前端或独立汇报面板的上线通道\u003c/li>\u003cli>Zone D handoff：交付演示时的临时环境（会后即降级/删除）\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-b-build/cloudflare\">cloudflare\u003c/a> · \u003ca href=\"#/zone-b-build/docker-build-deploy\">docker-build-deploy\u003c/a> · \u003ca href=\"#/zone-b-build/frontend-design\">frontend-design\u003c/a>\u003c/p>"}, {"route": "zone-b-build/cloudflare", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "\u003ch1>cloudflare\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（cloudflare 插件 v1.0.0，同插件含 workers-best-practices / durable-objects / web-perf / wrangler / agents-sdk 等）· 类型：平台/决策树 · FDE 位点：Zone B deploy（边缘/无服务器）\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>Cloudflare 全平台决策树 + 实现指导：Workers / Pages / KV / D1 / R2 / Queues / Vectorize / Durable Objects / Workflows / Containers / Tunnel / Spectrum / WAF / Flagship 特性开关 / Terraform &amp; Pulumi。\u003cstrong>内置强约束：极限值、定价、API 签名必须从 Cloudflare docs 检索，不许凭记忆\u003c/strong>。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>客户要&quot;零运维 + 全球低延迟&quot;的轻量交付面（看板、上报页、Agent 端点）\u003c/li>\u003cli>需要选型：这段逻辑该放 Worker、Pages Function 还是 Durable Object\u003c/li>\u003cli>需要边缘侧存储/向量检索（R2 + Vectorize）而不是自建集群\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：客户内网离线部署（Cloudflare 依赖公网 → \u003ca href=\"#/zone-b-build/docker-build-deploy\">docker-build-deploy\u003c/a> / \u003ca href=\"#/zone-b-build/kubernetes-specialist\">kubernetes-specialist\u003c/a>）；GPU 推理（→ \u003ca href=\"#/zone-b-build/vllm-deploy-docker\">vllm-deploy-docker\u003c/a>，Workers AI 只适合小模型）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：任何 Cloudflare 开发任务（Workers/Pages/KV/D1/R2/Vectorize/WAF…）都适用（skill description）；选型问题直接问「这段逻辑该放 Worker、Pages Function 还是 Durable Object」\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：确认 \u003ccode>wrangler --version\u003c/code>（要求 v4.x+，缺则先装），本地验证一律 \u003ccode>wrangler dev\u003c/code>——同插件的 wrangler skill 要求敲命令前先读它，保证语法与配置字段不凭记忆\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：引用限额/定价/API 签名前必须先拉 Cloudflare docs（SKILL.md 强约束：&quot;trust the docs&quot;，references 与 docs 冲突以 docs 为准）——凭记忆写数字必错\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：别在生产 Worker 上试错，先 \u003ccode>wrangler dev\u003c/code> 本地过；客户数据入边缘存储前确认可出境/合规（工业客户通常禁止），默认只放配置与匿名指标\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>严格遵守 skill 的 retrieval 规则：引用数字/价格/限额前先拉最新 docs，reference 文件与 docs 冲突时\u003cstrong>以 docs 为准\u003c/strong>\u003c/li>\u003cli>用 \u003ccode>wrangler\u003c/code> 做本地 dev + 类型校验，别在生产 Worker 上试错\u003c/li>\u003cli>数据边界：客户数据入边缘存储前必须确认可出境/合规条款，工业客户通常禁止 → 默认只放配置与匿名指标\u003c/li>\u003cli>成本：Workers 免费额度适合 demo，规模化前先算 request/GB-s\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone B deploy：面向多客户分支的轻量看板 / 遥测接收端点\u003c/li>\u003cli>Zone C：\u003ccode>web-perf\u003c/code>（同插件）用于交付 Web 面板的 Core Web Vitals 分析\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-b-build/docker-build-deploy\">docker-build-deploy\u003c/a> · \u003ca href=\"#/zone-b-build/kubernetes-specialist\">kubernetes-specialist\u003c/a> · \u003ca href=\"#/zone-c-operationalization/web-perf\">web-perf\u003c/a>\u003c/p>"}, {"route": "zone-b-build/kubernetes-specialist", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "📦", "html": "\u003ch1>kubernetes-specialist 📦\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：📦 可安装（未装）· 类型：部署/运维 · FDE 位点：Zone B deploy + Zone C operate\u003cbr>来源：\u003ccode>jeffallan/claude-skills@kubernetes-specialist\u003c/code> · 热度：12.5K installs · 详情：https://skills.sh/jeffallan/claude-skills/kubernetes-specialist\u003cbr>安装：\u003ccode>npx skills add jeffallan/claude-skills@kubernetes-specialist --directory ~/.qoder/skills -y\u003c/code>\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>K8s 现场交付与排障的通用专家技能：manifest/Helm 编写、Deployment/Service/Ingress/ConfigMap/Secret 语义、探针与资源配额、滚动发布与回滚、\u003ccode>kubectl\u003c/code> 排障路径（Pod 卡住、CrashLoopBackOff、OOMKilled、镜像拉取失败、网络策略阻断）。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>客户侧已有 K8s 平台，fde-scope 要以 Deployment 形式落地（含 GPU device plugin 场景）\u003c/li>\u003cli>现场发布出问题时按&quot;先定位后修&quot;的排障流程走，而不是逐个改 yaml 试\u003c/li>\u003cli>写交付物的 \u003ccode>deploy/\u003c/code> 目录（ Helm chart / kustomize overlay）需要规范基线\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：单客户内网只有一台 ECS 的小规模交付（→ \u003ca href=\"#/zone-b-build/alibabacloud-workbench-cli\">alibabacloud-workbench-cli\u003c/a> 或 \u003ca href=\"#/zone-b-build/docker-build-deploy\">docker-build-deploy\u003c/a>）；纯本地 dev（docker compose 足够）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：现场 Pod 起不来或要写交付清单时直接说，如&quot;帮我看看为什么 Pod 一直 CrashLoopBackOff&quot;、&quot;给这个服务写一套 Deployment + Ingress 的 manifest&quot;\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：先安装 \u003ccode>npx skills add jeffallan/claude-skills@kubernetes-specialist --directory ~/.qoder/skills -y\u003c/code>（社区源，装前按规约过一次 \u003ca href=\"#/cross-cutting/skill-criticagent\">skill-criticagent\u003c/a> 门禁），再让 agent 按该技能&quot;先定位后修&quot;的路径排障（如&quot;排查 namespace prod 里 xxx 服务 Pod 卡在 Pending 的原因&quot;），而不是逐个改 yaml 试\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：让 agent 裸跑 \u003ccode>kubectl\u003c/code> 不带 \u003ccode>--context\u003c/code>/\u003ccode>--namespace\u003c/code>——context 漂移是 agent 误操作客户集群的最大来源，任何命令都要显式指定；把 skill 生成的 manifest 直接 apply 到客户集群——必须先 dry-run + diff 再由客户确认\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>装前门禁：社区 skill（非官方），先用 \u003ca href=\"#/cross-cutting/skill-criticagent\">skill-criticagent\u003c/a> 评估；若不通过，可考虑热度更高的 \u003ccode>microsoft/azure-skills@azure-kubernetes\u003c/code>（375.4K）作为云平台特化替代\u003c/li>\u003cli>生产红线：不要让 skill 生成的 manifest 直接 apply 到客户集群——必须 dry-run + diff 后再由客户确认\u003c/li>\u003cli>明确 namespace/context：任何命令都带 \u003ccode>--context/--namespace\u003c/code>，agent 误操作集群的最大来源就是 context 漂移\u003c/li>\u003cli>优先声明式：所有变更走 git 中的 yaml，不接受 \u003ccode>kubectl edit\u003c/code> 类临时改动（会造成集群与仓库漂移）\u003c/li>\u003cli>记录到项目：把最终 topology 回写 \u003ccode>docs/architecture-model/\u003c/code>，配合 \u003ca href=\"#/cross-cutting/architecture-visualization-suite\">deployment-topology-analyzer\u003c/a>\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone B deploy：多客户/规模化交付时的编排层\u003c/li>\u003cli>Zone C operate：现场故障排查与回滚 SOP 的执行依据\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-b-build/docker-build-deploy\">docker-build-deploy\u003c/a> · \u003ca href=\"#/zone-b-build/vllm-deploy-docker\">vllm-deploy-docker\u003c/a> · \u003ca href=\"#/cross-cutting/skill-criticagent\">skill-criticagent\u003c/a>\u003c/p>"}, {"route": "zone-b-build/docker-build-deploy", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "📦", "html": "\u003ch1>docker-build-deploy 📦\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：📦 可安装（未装）· 类型：部署/生产化 · FDE 位点：Zone B deploy\u003cbr>来源：\u003ccode>wu529778790/shenzjd-skills@docker-build-deploy\u003c/code> · 热度：745 installs · 详情：https://skills.sh/wu529778790/shenzjd-skills/docker-build-deploy\u003cbr>备选：\u003ccode>ailabs-393/ai-labs-claude-skills@docker-containerization\u003c/code>（1.1K installs）、\u003ccode>thebushidocollective/han@docker-compose-production\u003c/code>（421）\u003cbr>安装：\u003ccode>npx skills add wu529778790/shenzjd-skills@docker-build-deploy --directory ~/.qoder/skills -y\u003c/code>\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>把 Python 服务做成可交付容器：多阶段构建、层缓存顺序、非 root 用户、healthcheck、compose 编排、镜像瘦身与生产化 checklist。\u003c/p
