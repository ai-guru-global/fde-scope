<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;
--accent:#4f46e5;--ok:#059669;--pkg:#d97706;--radius:14px;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
background:var(--bg);color:var(--ink);line-height:1.65}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:18px;padding:12px 28px;
background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav .brand{font-weight:800;font-size:16px;color:var(--ink);cursor:pointer;white-space:nowrap}
.nav .brand span{color:var(--accent)}
.nav .zlinks{display:flex;gap:14px;overflow-x:auto}
.nav .zlinks a{color:var(--muted);font-size:13px;white-space:nowrap}
.nav input{margin-left:auto;width:230px;padding:7px 12px;border:1px solid var(--line);border-radius:99px;
font-size:13px;outline:none;background:#fff}
.nav input:focus{border-color:var(--accent)}
.hero{background:linear-gradient(135deg,#312e81 0%,#4f46e5 55%,#7c3aed 100%);color:#fff;padding:64px 28px 56px;text-align:center}
.hero h1{font-size:34px;letter-spacing:.5px}
.hero p{margin:14px auto 0;max-width:760px;color:#e0e7ff;font-size:15px}
.hero .stats{display:flex;justify-content:center;gap:14px;margin-top:28px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:99px;
padding:7px 18px;font-size:13px}
.stat b{font-size:16px;margin-right:4px}
.wrap{max-width:1120px;margin:0 auto;padding:36px 24px 72px}
.section-h{display:flex;align-items:baseline;gap:12px;margin:8px 0 18px}
.section-h h2{font-size:21px}
.section-h p{color:var(--muted);font-size:13px}
.scen-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.scen{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;
transition:box-shadow .15s,transform .15s}
.scen:hover{box-shadow:0 10px 30px rgba(17,24,39,.08);transform:translateY(-2px)}
.scen h3{font-size:15px;margin-bottom:4px}
.scen .d{color:var(--muted);font-size:12.5px;margin-bottom:12px}
.scen .links{display:flex;flex-wrap:wrap;gap:8px}
.scen .links a{font-size:12.5px;background:#eef2ff;border:1px solid #e0e7ff;color:#4338ca;
padding:4px 11px;border-radius:99px}
.scen .links a:hover{background:#e0e7ff;text-decoration:none}
.zone-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;margin-top:6px}
.zone{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
display:flex;flex-direction:column}
.zone .zh{padding:16px 20px 12px;border-top:3px solid var(--accent)}
.zone .zh h3{font-size:15.5px}
.zone .zh p{color:var(--muted);font-size:12.5px;margin-top:2px}
.zone .zs{padding:6px 14px 16px;display:flex;flex-wrap:wrap;gap:7px}
.zone .zs a{font-size:12.5px;padding:4px 10px;border-radius:8px;background:#f3f4f6;color:#374151;
border:1px solid var(--line)}
.zone .zs a:hover{text-decoration:none;border-color:var(--accent);color:var(--accent)}
.zone .zs a .st{font-size:11px;margin-right:3px}
.toolbar{display:flex;gap:10px;align-items:center;margin:4px 0 16px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 14px;font-size:12.5px;
cursor:pointer;color:var(--muted)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.all-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.sk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:block;color:var(--ink);
transition:box-shadow .15s,transform .15s}
.sk:hover{box-shadow:0 8px 22px rgba(17,24,39,.08);transform:translateY(-1px);text-decoration:none}
.sk .t{display:flex;align-items:center;gap:8px;font-weight:650;font-size:14px}
.sk .b{color:var(--muted);font-size:12.5px;margin-top:4px}
.sk .z{font-size:11px;color:#9ca3af;margin-top:6px}
.badge{font-size:11px;border-radius:99px;padding:2px 9px;font-weight:600}
.badge.ok{background:#d1fae5;color:#065f46}
.badge.pkg{background:#fef3c7;color:#92400e}
.badge.dead{background:#f3f4f6;color:#6b7280}
.crumb{font-size:13px;color:var(--muted);margin-bottom:6px}
.crumb a{color:var(--muted)}
.article{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
padding:36px 44px;max-width:900px;margin:0 auto}
.article h1{font-size:24px;margin:4px 0 14px}
.article h2{font-size:17px;margin:26px 0 10px;padding-left:10px;border-left:3px solid var(--accent)}
.article h3{font-size:15px;margin:18px 0 8px}
.article p{margin:8px 0}
.article ul{margin:8px 0 8px 22px}
.article li{margin:4px 0}
.article code{font-family:var(--mono);font-size:.86em;background:#f3f4f6;border:1px solid var(--line);
border-radius:5px;padding:1px 5px;word-break:break-all}
.article pre{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:14px 16px;overflow-x:auto;margin:10px 0}
.article pre code{background:none;border:none;color:inherit;padding:0;font-size:12.5px;line-height:1.55}
.article table{border-collapse:collapse;width:100%;margin:12px 0;font-size:13px}
.article th,.article td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.article th{background:#f9fafb}
.article .page-meta{background:#f8f9ff;border:1px solid #e0e7ff;border-left:3px solid var(--accent);
border-radius:10px;padding:12px 16px;margin:6px 0 16px;font-size:13px;color:#374151}
.pager{display:flex;justify-content:space-between;gap:16px;max-width:900px;margin:14px auto 0}
.pager a{font-size:13px;color:var(--muted);border:1px solid var(--line);background:#fff;
border-radius:10px;padding:8px 14px;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pager a:hover{color:var(--accent);text-decoration:none;border-color:var(--accent)}
.empty{display:none;text-align:center;color:var(--muted);padding:40px 0}
footer{border-top:1px solid var(--line);margin-top:56px;padding:26px 28px 40px;color:var(--muted);
font-size:12.5px;text-align:center}
footer code{font-family:var(--mono);background:#f3f4f6;border-radius:5px;padding:1px 5px}
@media(max-width:720px){.article{padding:22px 18px}.nav .zlinks{display:none}.nav input{width:150px}}
</style>

r-build-deploy"}, {"name": "kubernetes-specialist", "route": "zone-b-build/kubernetes-specialist"}, {"name": "alibabacloud-spec-ops-suite", "route": "zone-b-build/alibabacloud-spec-ops-suite"}, {"name": "vercel-deploy", "route": "zone-b-build/vercel-deploy"}]}, {"title": "运维与排障", "desc": "根因 → 浏览器取证 → 可观测性 → AIOps", "items": [{"name": "investigate", "route": "zone-c-operationalization/investigate"}, {"name": "systematic-debugging", "route": "zone-c-operationalization/systematic-debugging"}, {"name": "chrome-devtools", "route": "zone-c-operationalization/chrome-devtools"}, {"name": "datadog", "route": "zone-c-operationalization/datadog"}, {"name": "sentry-mcp", "route": "zone-c-operationalization/sentry-mcp"}, {"name": "starops", "route": "zone-c-operationalization/starops"}]}, {"title": "文档与移交", "desc": "补文档 → 出版级 PDF → 规范 → 课程 → 播客", "items": [{"name": "document-generate", "route": "zone-d-handoff/document-generate"}, {"name": "make-pdf", "route": "zone-d-handoff/make-pdf"}, {"name": "anthropic-documentation", "route": "zone-d-handoff/anthropic-documentation"}, {"name": "slidev", "route": "zone-d-handoff/slidev"}, {"name": "shifu", "route": "zone-d-handoff/shifu"}, {"name": "podcast", "route": "zone-d-handoff/podcast"}]}, {"title": "工程纪律（横切）", "desc": "计划 → 执行 → 评审 → 安全 → 生态与调度", "items": [{"name": "writing-plans", "route": "cross-cutting/writing-plans"}, {"name": "executing-plans", "route": "cross-cutting/executing-plans"}, {"name": "code-review", "route": "cross-cutting/code-review"}, {"name": "security-scan", "route": "cross-cutting/security-scan"}, {"name": "skill-discovery", "route": "cross-cutting/skill-discovery"}, {"name": "using-git-worktrees", "route": "cross-cutting/using-git-worktrees"}, {"name": "schedule", "route": "cross-cutting/schedule"}, {"name": "cloud-agents", "route": "cross-cutting/cloud-agents"}]}], "pages": [{"route": "zone-a-pre-engagement/firecrawl-search", "zone": "Zone A · Pre-engagement", "zoneId": "zone-a-pre-engagement", "status": "✅", "html": "<h1>firecrawl-search<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（firecrawl 插件）· 类型：工具 · FDE 位点：Zone A · qualification / site-survey 前置研究<br>MCP 工具：<code>firecrawl_firecrawl_search<\/code> · 依赖：Firecrawl API 认证（见 security-scan 类安装规约）<\/div>\n<h2>能做什么<\/h2>\n<p>真实时联网搜索，且不止返回摘要片段——可对命中结果<strong>连带全文抽取<\/strong>（Markdown/结构化 JSON），一次调用得到\"搜索结果 + 页面正文\"。比内置 WebSearch 多了内容落地能力。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>客户行业背景、竞品方案、技术选型的最新资料调研<\/li><li>需要\"别人怎么说的\"完整论据，而非 snippet<\/li><li>搜索后紧接着要抓取（省去 search→scrape 两步编排）<\/li><\/ul>\n<p><strong>不用于<\/strong>：本地文件、内网系统、代码仓库内部检索（走 SearchCodebase/sourcegraph）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>Do：先窄关键词锁定 2-3 条高相关结果再抽全文，控制 token 与费用<\/li><li>Do：对时效敏感话题限定时间范围<\/li><li>Don't：不要用它替代本地代码搜索；不要一次抓几十个页面<\/li><li>成本：按次计费，调研阶段够用即可；认证失败时参考 <code>install<\/code> 规则技能修复<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li><code>pre_engagement.SiteSurveyGate<\/code> 之前的行业预研；<code>docs/manufacturing_scenario.md<\/code> 类素材收集<\/li><li>产出可归档进 <code>.fde_scope/engagements/<id>/<\/code> 调研笔记<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-a-pre-engagement/firecrawl-scrape\">firecrawl-scrape<\/a> · <a href=\"#/zone-a-pre-engagement/firecrawl-crawl\">firecrawl-crawl<\/a> · <a href=\"#/zone-c-operationalization/firecrawl-monitor\">firecrawl-monitor<\/a><\/p>"}, {"route": "zone-a-pre-engagement/firecrawl-scrape", "zone": "Zone A · Pre-engagement", "zoneId": "zone-a-pre-engagement", "status": "✅", "html": "<h1>firecrawl-scrape<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（firecrawl 插件）· 类型：工具 · FDE 位点：Zone A/B · 调研与数据接入<\/div>\n<h2>能做什么<\/h2>\n<p>对给定 URL（含 JS 渲染的 SPA）抽取干净、LLM 友好的 Markdown；支持多 URL 并发、整页截图、结构化抽取。是\"给我一个链接，我要它的内容\"的默认解。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>用户直接给 URL 要看内容/总结<\/li><li>WebFetch 拿不到的重 JS 页面<\/li><li>客户公开文档页、产品页、API 文档页的单页抓取<\/li><\/ul>\n<p><strong>不用于<\/strong>：整站批量（用 <a href=\"#/zone-a-pre-engagement/firecrawl-crawl\">firecrawl-crawl<\/a>）、本地文件（用 <a href=\"#/zone-a-pre-engagement/firecrawl-parse\">firecrawl-parse<\/a>）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>Do：优先 scrape 而不是自己写 requests+BeautifulSoup<\/li><li>Do：需要页面上特定字段时用 extract/结构化模式，别拿全文再人肉找<\/li><li>Don't：不抓需要登录且未配置 profile 的页面（→ interact + profile）<\/li><li>合规：只抓客户授权范围与公开页面，现场交付注意 robots/内网保密约定<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone B <code>connect<\/code> 阶段的补充数据源（无 API 的公开网页）<\/li><li>客户产品手册在线版的快速本地化<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-a-pre-engagement/firecrawl-search\">firecrawl-search<\/a> · <a href=\"../zone-a-pre-engagement/#\" target=\"_blank\" rel=\"noopener\">firecrawl-map<\/a>（列 URL） · <a href=\"../zone-a-pre-engagement/#\" target=\"_blank\" rel=\"noopener\">firecrawl-interact<\/a>（需登录/点击）<\/p>"}, {"route": "zone-a-pre-engagement/firecrawl-crawl", "zone": "Zone A · Pre-engagement", "zoneId": "zone-a-pre-engagement", "status": "✅", "html": "<h1>firecrawl-crawl<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（firecrawl 插件）· 类型：工具 · FDE 位点：Zone A/B · 文档区批量入库<\/div>\n<h2>能做什么<\/h2>\n<p>按站点/站点分区（如 <code>/docs<\/code>）批量抽取全部页面，支持深度限制、路径过滤、并发控制；异步任务，可用 <code>check_crawl_status<\/code> 轮询进度。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>客户产品文档站、开源项目文档整仓本地化<\/li><li>建立语料原料库（爬完 → 进 corpus forge 清洗）<\/li><li>\"把 X 网站 docs 下所有内容抓下来\"类请求<\/li><\/ul>\n<p><strong>不用于<\/strong>：只要 1-3 个页面（scrape 更快更省）；已知变更监控（用 monitor）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>Do：先用 map/URL 过滤确定范围，再 crawl；设置 <code>includePaths<\/code> 避免全站爆炸<\/li><li>Do：大站先小深度试跑一轮估量级<\/li><li>Don't：不要对客户内网/生产系统未经授权使用<\/li><li>后续衔接：爬出的 Markdown 进 <code>convert-file<\/code>/DuckDB 做结构化，再入 <code>fde_scope.corpus<\/code> 管道做脱敏与去重<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone B <code>connect→corpus<\/code>：网页文档 → 原始语料 → 脱敏 → 质量门<\/li><li>ACK/中间件官方文档的离线镜像，供现场 air-gap 环境查询<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-a-pre-engagement/firecrawl-scrape\">firecrawl-scrape<\/a> · <a href=\"#/zone-b-build/convert-file\">convert-file<\/a> · <a href=\"#/cross-cutting/bailian-cli\">bailian-cli<\/a>（知识库入库）<\/p>"}, {"route": "zone-a-pre-engagement/firecrawl-parse", "zone": "Zone A · Pre-engagement", "zoneId": "zone-a-pre-engagement", "status": "✅", "html": "<h1>firecrawl-parse<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（firecrawl 插件）· 类型：工具 · FDE 位点：Zone A/B · 客户本地文件接入<\/div>\n<h2>能做什么<\/h2>\n<p>把<strong>本地文件<\/strong>（PDF/DOCX/DOC/ODT/RTF/XLSX/XLS/HTML）抽取转换为干净的 Markdown 落盘，可附带 AI 摘要或基于内容问答。与 scrape 的分工：parse 处理磁盘路径文件，scrape 处理 URL。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>客户给了报价单、规格书、操作手册的本地文件<\/li><li>用户说\"解析这个 PDF / 提取这个文件的内容\"并给出本地路径<\/li><li>需要一次性从文档里直接回答问题（parse 的问答模式）<\/li><\/ul>\n<p><strong>不用于<\/strong>：URL 页面（→ scrape）；结构化数据文件要看内容概况（→ read-file）；生成新 PDF（→ make-pdf / pdf）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>Do：路径直接传本地文件，不要先转格式再喂<\/li><li>Do：大文档先 parse 出 Markdown 再决定哪些进语料库<\/li><li>Don't：不要用它做扫描件 OCR 质量保证——扫描件效果取决于源质量，重要合同类仍需人工核对<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone A 合同/SOW/技术协议解读<\/li><li>Zone B 非结构化客户文档 → 语料原料<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-b-build/read-file\">read-file<\/a> · <a href=\"#/zone-a-pre-engagement/pdf\">pdf<\/a> · <a href=\"#/zone-a-pre-engagement/docx\">docx<\/a><\/p>"}, {"route": "zone-a-pre-engagement/zread", "zone": "Zone A · Pre-engagement", "zoneId": "zone-a-pre-engagement", "status": "✅", "html": "<h1>zread<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装 · 类型：工具/文档生成 · FDE 位点：Zone A · site-survey（代码系统摸底）<\/div>\n<h2>能做什么<\/h2>\n<p>用 <code>zread<\/code> CLI 为代码仓库生成 wiki 式知识库（输出在 <code>./.zread/wiki/<\/code>）：模块拆解、架构说明、上手文档；可浏览、可服务本地站点。也可反向用于\"理解陌生 repo 前先读生成的页面\"，避免逐文件爬源码。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>接手客户陌生系统，需要快速建立整体认知（对应 Zone A <code>site-survey<\/code>）<\/li><li>需要给交接对象一份\"这个 repo 干什么\"的入门文档（Zone D 也用得上）<\/li><li>用户提到 zread / 项目 wiki / repo walkthrough<\/li><\/ul>\n<p><strong>不用于<\/strong>：一次性事实查询（直接搜代码）；非代码文档库（→ qmind-knowledge）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>Do：先看 <code>./.zread/wiki/current<\/code> 是否存在，存在就读现成页面<\/li><li>Do：大 repo 首次生成放后台跑，别阻塞主任务<\/li><li>Don't：不要把它当实时真相——代码大改后要 <code>zread generate<\/code> 重生成<\/li><li>组合拳：zread（结构层）+ architecture-visualization（校验/补充视图）覆盖\"文档 vs 代码\"一致性<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>现场用 fde-scope 服务客户时，对客户 repo 出摸底 wiki<\/li><li>examples/ 中制造业语料的来源系统画像<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-a-pre-engagement/qmind-knowledge\">qmind-knowledge<\/a> · <a href=\"#/cross-cutting/architecture-visualization-suite\">architecture-visualization-suite<\/a> · <a href=\"#/zone-d-handoff/shifu\">shifu<\/a><\/p>"}, {"route": "zone-a-pre-engagement/qmind-knowledge", "zone": "Zone A · Pre-engagement", "zoneId": "zone-a-pre-engagement", "status": "✅", "html": "<h1>qmind-knowledge<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（PROD ONLY，CLI 按需下载）· 类型：工具/知识管理 · FDE 位点：Zone A/D · 知识库检索与维护<\/div>\n<h2>能做什么<\/h2>\n<p>QMind 知识库工具箱：知识检索、notebook 管理、批量上传文件、编译生成知识卡片、lint 断链/质量检查。适合把散落的调研材料、SOP、故障案例沉淀成可检索知识域。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>用户提到 知识库 / knowledge base / 上传文档 / 知识卡片 / notebook / compile / lint<\/li><li>Zone A 调研材料的集中入库与检索<\/li><li>与 <code>shifu<\/code>/<code>podcast<\/code> 配合：qmind 存知识，shifu 教知识，podcast 播知识<\/li><\/ul>\n<p><strong>不用于<\/strong>：代码仓库理解（→ zread）；fde-scope 自身语料（→ <code>fde_scope.corpus<\/code> 管道，不要混仓）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>Do：批量上传后先 compile 出卡片再 lint，把质量问题在入库阶段解决<\/li><li>Do：按\"知识域\"建 notebook（如 05-网络/），与用户既有的目录习惯对齐<\/li><li>Don't：生产环境操作前先确认 CLI 认证与权限（PROD ONLY 属性）<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>客户现场 FAQ / 故障处理知识的沉淀容器<\/li><li>工单语料的上游素材库（用户主业：语料工程）<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-a-pre-engagement/zread\">zread<\/a> · <a href=\"#/zone-a-pre-engagement/firecrawl-crawl\">firecrawl-crawl<\/a> · <a href=\"#/zone-d-handoff/shifu\">shifu<\/a><\/p>"}, {"route": "zone-a-pre-engagement/brainstorming", "zone": "Zone A · Pre-engagement", "zoneId": "zone-a-pre-engagement", "status": "✅", "html": "<h1>brainstorming<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（superpowers 系）· 类型：流程/方法论 · FDE 位点：Zone A · qualification / success-criteria<\/div>\n<h2>能做什么<\/h2>\n<p>在任何创造性工作（新功能、新组件、改行为）动手<strong>之前<\/strong>，用探索性对话厘清意图、需求与设计。防止\"用户说了个大概就直接开写\"导致的返工。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>用户说\"我们做个 X / 加个 X / 改一下 X\"而没有明确规格<\/li><li>需求含糊、有多个合理方向、或涉及行为变更<\/li><li>Zone A 与客户对齐成功标准（success-criteria 阶段的方法论支撑）<\/li><\/ul>\n<p><strong>不用于<\/strong>：规格已经完全明确的执行型任务；纯查询/纯排障。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>Do：先问\"为什么\"再问\"做什么\"；把假设显式写出来<\/li><li>Do：产出物落成文字（计划/规格），供 <a href=\"#/cross-cutting/writing-plans\">writing-plans<\/a> 接续<\/li><li>Don't：不要跳过它直接进实现——这是 superpowers 的硬性优先级（流程技能先于实现技能）<\/li><li>边界：brainstorming 管\"想清楚\"，spec 类技能管\"写精确\"<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>fde-scope 新阶段/新 gate 设计前的需求探索<\/li><li>与客户开工会（kickoff）的问题清单骨架<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/cross-cutting/writing-plans\">writing-plans<\/a> · <a href=\"../zone-a-pre-engagement/#\" target=\"_blank\" rel=\"noopener\">spec<\/a>（gstack 系） · <a href=\"#/zone-a-pre-engagement/architecture-communicator\">architecture-communicator<\/a><\/p>"}, {"route": "zone-a-pre-engagement/architecture-communicator", "zone": "Zone A · Pre-engagement", "zoneId": "zone-a-pre-engagement", "status": "✅", "html": "<h1>architecture-communicator<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（架构可视化插件）· 类型：场景技能 · FDE 位点：Zone A/D · 干系人沟通与交付视图<\/div>\n<h2>能做什么<\/h2>\n<p>把已有架构模型按<strong>受众<\/strong>重新表达：高管要能力地图、产品要边界与流程、运维要拓扑、安全要信任边界——裁剪范围、调整语言粒度、决定图的详细度，并产出对应交付物。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>\"给我老板/客户/运维团队讲清楚这个系统\"<\/li><li>stakeholder-map 阶段为不同干系人准备不同视图<\/li><li>移交文档需要受众定制版<\/li><\/ul>\n<p><strong>不用于<\/strong>：还没有模型可讲时（先走 <code>explore<\/code> → <code>system-modeler<\/code> 建模）；风险评审（→ risk-quality-reviewer）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>Do：先确认受众的决策问题是什么，再选视图层级（L0 能力 → L4 代码）<\/li><li>Do：复用 <a href=\"#/cross-cutting/architecture-visualization-suite\">architecture-visualization-suite<\/a> 产出的证据模型，不重画一套事实<\/li><li>Don't：不要给技术团队发高管版简图，也不要给高管画 L4 依赖网<\/li><li>组合：本技能做\"翻译\"，格式由 c4model/graphviz 基础技能承担<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone A <code>stakeholder-map<\/code> 产出物<\/li><li>Zone D <code>knowledge-transfer<\/code> 的分角色讲解材料<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/cross-cutting/architecture-visualization-suite\">architecture-visualization-suite<\/a> · <a href=\"#/zone-a-pre-engagement/drawio\">drawio<\/a> · <a href=\"#/zone-d-handoff/shifu\">shifu<\/a><\/p>"}, {"route": "zone-a-pre-engagement/drawio", "zone": "Zone A · Pre-engagement", "zoneId": "zone-a-pre-engagement", "status": "✅", "html": "<h1>drawio<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（架构可视化插件）· 类型：基础/交付格式 · FDE 位点：Zone A/D · 可编辑图交付<\/div>\n<h2>能做什么<\/h2>\n<p>把架构证据模型导出为 Draw.io / diagrams.net 可编辑 <code>.drawio<\/code> 文件，供客户方人员手工修改；含本地 Draw.io MCP 设置指引。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>用户<strong>明确<\/strong>要 Draw.io、<code>.drawio<\/code>、diagrams.net、\"可编辑的图\"或本地 Draw.io MCP<\/li><li>交付物需要客户拿回去自己改图（他们没装 Qoder/Graphviz）<\/li><\/ul>\n<p><strong>不用于<\/strong>：默认出图路径（文本型 DOT/DSL 更可维护）；把 <code>.drawio<\/code> 当事实源。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>Do：证据模型（JSON/DOT/DSL）永远是 source of truth，Draw.io 只是派生的可编辑交付层<\/li><li>Do：改了 <code>.drawio<\/code> 要同步回证据模型，否则下次重生成会覆盖手工修改<\/li><li>Don't：不要因为\"好看\"而手改导出件偏离模型事实（插件明确禁止）<\/li><li>现场技巧：air-gap 客户用 diagrams.net 桌面版打开即可，无需网络<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone D 移交包里给运维团队的可编辑拓扑图<\/li><li>客户评审会上现场改图答疑<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/cross-cutting/architecture-visualization-suite\">architecture-visualization-suite<\/a> · <a href=\"#/zone-a-pre-engagement/architecture-communicator\">architecture-communicator<\/a><\/p>"}, {"route": "zone-a-pre-engagement/pdf", "zone": "Zone A · Pre-engagement", "zoneId": "zone-a-pre-engagement", "status": "✅", "html": "<h1>pdf<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装 · 类型：工具/文档 · FDE 位点：横切（A 解读 / D 交付）<\/div>\n<h2>能做什么<\/h2>\n<p>PDF 全流程工具箱：文本与表格抽取、页面操纵（合并/拆分/旋转）、表单填写、专业文档生成。读 <code>.pdf<\/code> 附件时的默认技能。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>用户消息里出现 <code>.pdf<\/code> 附件或路径<\/li><li>需要生成正式交付 PDF（非 Markdown 转换场景，用本技能的生成能力）<\/li><li>填写/解析 PDF 表单（客户设备验收单等）<\/li><\/ul>\n<p><strong>不用于<\/strong>：Markdown → PDF 出版级排版（→ <a href=\"#/zone-d-handoff/make-pdf\">make-pdf<\/a>）；只要内容抽取且文件是纯文本型（firecrawl-parse 也可以）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>Do：先 extract 成结构化文本再处理，不要对二进制直接动手<\/li><li>Do：交付生成的 PDF 带页眉版本号和日期，现场文件生命周期长<\/li><li>Don't：扫描件 OCR 结果要人工复核关键数字（金额/参数/日期）<\/li><li>现场：车间设备手册多为 PDF，入库语料前先统一抽取<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone A 合同/设备手册解读；Zone D 签字版报告<\/li><li><code>reports/<\/code> 产物的 PDF 化归档<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-a-pre-engagement/firecrawl-parse\">firecrawl-parse<\/a> · <a href=\"#/zone-d-handoff/make-pdf\">make-pdf<\/a> · <a href=\"#/zone-a-pre-engagement/docx\">docx<\/a><\/p>"}, {"route": "zone-a-pre-engagement/docx", "zone": "Zone A · Pre-engagement", "zoneId": "zone-a-pre-engagement", "status": "✅", "html": "<h1>docx<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装 · 类型：工具/文档 · FDE 位点：横切（A 解读 / D 交付）<\/div>\n<h2>能做什么<\/h2>\n<p>Word 文档工具箱：内容/表格抽取、专业文档生成、页面操纵、可填表单处理。处理 <code>.docx<\/code> 的默认技能。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>用户提到 \"word doc / .docx / 报告 / 备忘录\" 或附 <code>.docx<\/code> 文件<\/li><li>交付物要求 Word 格式（客户方流程常强制 docx）<\/li><li>生成带样式的正式文档（SOW、验收单模板填充）<\/li><\/ul>\n<p><strong>不用于<\/strong>：<code>.pdf<\/code>（→ pdf）；<code>.txt/.md<\/code> 直接读。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>Do：改现有 docx 用编辑能力而非重生成，保住客户的模板/修订痕迹<\/li><li>Do：生成的文档用统一公司模板，移交时观感一致<\/li><li>Don't：不要解析含宏的不可信 docx；注意 doc/docx 扩展名区分<\/li><li>现场：企业客户的 SOP 几乎都在 Word 里，语料化第一步常是 docx 抽取<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone A 客户 SOP/协议抽取为结构化语料原料<\/li><li>Zone D <code>knowledge-transfer<\/code> 的 Word 交付件<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-a-pre-engagement/pdf\">pdf<\/a> · <a href=\"#/zone-a-pre-engagement/xlsx\">xlsx<\/a> · <a href=\"#/zone-a-pre-engagement/firecrawl-parse\">firecrawl-parse<\/a><\/p>"}, {"route": "zone-a-pre-engagement/xlsx", "zone": "Zone A · Pre-engagement", "zoneId": "zone-a-pre-engagement", "status": "✅", "html": "<h1>xlsx<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装 · 类型：工具/数据 · FDE 位点：Zone A/B（点单）· D（报表）<\/div>\n<h2>能做什么<\/h2>\n<p>高级电子表格工具箱：数据与公式双向抽取、复杂格式处理、专业表格生成、可填表单。处理 Excel/CSV/TSV 的默认技能。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>用户附 <code>.xlsx/.csv/.tsv<\/code> 文件或提到 spreadsheet/工作表/报表<\/li><li>交付结构化报表（KPI 表、bad case 清单、语料盘点表）<\/li><li>需要保留公式/多 sheet 结构的表格操作<\/li><\/ul>\n<p><strong>不用于<\/strong>：只需看数据内容不关心格式（→ <a href=\"#/zone-b-build/read-file\">read-file<\/a>）；超大数据文件分析（→ DuckDB <a href=\"#/zone-b-build/query\">query<\/a>）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>Do：先 <code>read-file<\/code>/画像确认列结构，再决定转换或分析路径<\/li><li>Do：公式计算类需求直接生成带公式的 xlsx，不要预先在代码里算死<\/li><li>Don't：不要用文本方式手改二进制；合并多表时注意列名归一<\/li><li>现场：客户工单导出、设备点检表几乎都是 xlsx，是 connectors 之外的重要入口<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone B <code>connect<\/code>：客户点检表/工单表 → <code>fde_scope.connectors.csv_fallback<\/code> 前的格式归一（<code>convert-file<\/code>）<\/li><li>Zone C KPI 报表（OEE/MTBF 表）交付<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-b-build/read-file\">read-file<\/a> · <a href=\"#/zone-b-build/convert-file\">convert-file<\/a> · <a href=\"#/zone-b-build/query\">query<\/a><\/p>"}, {"route": "zone-b-build/read-file", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "<h1>read-file<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（duckdb-skills 系）· 类型：工具/数据 · FDE 位点：Zone B · connect 前置画像<\/div>\n<h2>能做什么<\/h2>\n<p>读取任意数据文件（CSV/JSON/Parquet/Avro/Excel/spatial/SQLite）或远程 URL（S3/HTTPS），预览与画像数据。只读数据文件，<strong>不用于源代码<\/strong>。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>用户提到某个数据文件、问\"这里面是什么\"、要先看一眼数据集<\/li><li>决定后续走转换（convert-file）、查询（query）还是入管道（corpus）之前的探查<\/li><\/ul>\n<p><strong>不用于<\/strong>：源代码阅读（用 Read）；Office 文档的格式级操作（→ docx/xlsx/pdf 技能）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>Do：接到客户数据第一步就画像：行数/列型/空值/编码，再谈清洗<\/li><li>Do：与 <code>fde_scope.connectors<\/code> 分工——连接器管生产接入，read-file 管一次性探查<\/li><li>Don't：不要用它打开二进制大文件全量进上下文，先看 schema 再看样本<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone B <code>connect<\/code> 前的数据体检；examples/ 里 sample_tickets.csv、*.jsonl 的快速验证<\/li><li>语料入库前对 alarm_corpus.jsonl 之类的抽查<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-b-build/convert-file\">convert-file<\/a> · <a href=\"#/zone-b-build/attach-db\">attach-db<\/a> · <a href=\"#/zone-b-build/query\">query<\/a> · <a href=\"#/zone-a-pre-engagement/xlsx\">xlsx<\/a><\/p>"}, {"route": "zone-b-build/convert-file", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "<h1>convert-file<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（duckdb-skills 系）· 类型：工具/数据 · FDE 位点：Zone B · connect 格式归一<\/div>\n<h2>能做什么<\/h2>\n<p>任意方向的数据文件格式转换：CSV ↔ Parquet ↔ Excel ↔ JSON ↔ GeoJSON……包括 AI 原生无法直接产出的二进制格式（如 Parquet/xlsx 写入）。触发语：\"转成 parquet / 存成 xlsx / 导出 JSON / 做成 CSV\"。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>客户给 xlsx 但连接器只吃 CSV；分析完要把结果落成 Excel 交付<\/li><li>大数据落 Parquet 压缩存储；跨工具交换格式<\/li><\/ul>\n<p><strong>不用于<\/strong>：文档格式互转（PDF→Word 这类走 firecrawl-parse/pdf/docx）；数据库表迁移（SQL 层面解决）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>Do：转换后抽样验证行数和列型没劣化<\/li><li>Do：现场归档统一 Parquet（列存、压缩、DuckDB 原生友好）<\/li><li>Don't：不要对含公式的 xlsx 直接转 CSV——公式结果可以带走，公式本身丢失<\/li><li>组合：<code>convert-file<\/code> → DuckDB <code>query<\/code> 是轻量 ETL 标配，不必拉 Airflow<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone B <code>connect<\/code>：多源格式归一后进 <code>fde_scope.connectors.csv_fallback<\/code><\/li><li>Corpus 原料准备：客户各种破格式 → JSONL/CSV<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-b-build/read-file\">read-file<\/a> · <a href=\"#/zone-b-build/query\">query<\/a> · <a href=\"#/zone-a-pre-engagement/xlsx\">xlsx<\/a><\/p>"}, {"route": "zone-b-build/attach-db", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "<h1>attach-db<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（duckdb-skills 系）· 类型：工具/数据 · FDE 位点：Zone B · 查询会话准备<\/div>\n<h2>能做什么<\/h2>\n<p>把 DuckDB 数据库文件挂进当前会话（<code>/duckdb-skills:query<\/code> 的前置）：探索表/列/行数，写 SQL 状态文件，让后续查询自动恢复会话。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>同一个数据文件/库要连续做多轮 SQL 分析<\/li><li>用户给了 <code>.duckdb<\/code>/<code>.db<\/code>/<code>.sqlite<\/code> 文件要长期用<\/li><\/ul>\n<p><strong>不用于<\/strong>：一次性看一眼文件（→ read-file）；没有 DuckDB 环境时先 <code>install-duckdb<\/code>。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>Do：挂完先看生成的状态文件确认绑定的是正确路径<\/li><li>Do：多文件分析优先直接对文件查询（DuckDB 可查 CSV/Parquet），不必都导入<\/li><li>Don't：不要挂载生产数据库文件副本以外的敏感数据到共享机器<\/li><li>现场：air-gap 环境 DuckDB 单机零服务，是最好的本地分析引擎<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone B eval 结果集、KPI 时序的多轮分析会话<\/li><li>制造业样例 <code>station_samples.jsonl<\/code> 的深度切片<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-b-build/query\">query<\/a> · <a href=\"../zone-b-build/#\" target=\"_blank\" rel=\"noopener\">install-duckdb<\/a> · <a href=\"#/zone-b-build/read-file\">read-file<\/a><\/p>"}, {"route": "zone-b-build/query", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "<h1>query<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（duckdb-skills 系）· 类型：工具/数据 · FDE 位点：Zone B · 分析主力<\/div>\n<h2>能做什么<\/h2>\n<p>对挂载的 DuckDB 库或<strong>临时对文件<\/strong>跑 SQL：接受原生 SQL 或自然语言问题（\"上周告警最多的设备\"），用 DuckDB 方言习惯写法。覆盖 CSV/Parquet/Excel/JSON 直查。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>数据画像、聚合统计、异常切片、覆盖率分析<\/li><li>语料盘点（多少条、类别分布、重复率）与 eval 结果分析<\/li><\/ul>\n<p><strong>不用于<\/strong>：源数据文件先要看结构（→ read-file / attach-db）；写操作类生产库（本技能偏只读分析）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>Do：大 CSV 不导入，直接 <code>SELECT ... FROM 'file.csv'<\/code> 查——DuckDB 的杀手锏<\/li><li>Do：分析结论落成 SQL 文件归档，移交时客户可复跑<\/li><li>Don't：不要在自然语言模式下问跨越多个语义域的大杂问，拆成多查询<\/li><li>组合：query + coverage_analyzer 思路可以给 <code>fde_scope.corpus<\/code> 报告做二次挖掘<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone B <code>corpus<\/code> 后的语料质量复盘；Zone C KPI（OEE/MTBF）临时口径计算<\/li><li>examples/manufacturing 场景数据的即席分析<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-b-build/attach-db\">attach-db<\/a> · <a href=\"#/zone-b-build/convert-file\">convert-file<\/a> · <a href=\"#/zone-b-build/spatial\">spatial<\/a><\/p>"}, {"route": "zone-b-build/spatial", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "<h1>spatial<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（duckdb-skills 系）· 类型：工具/数据 · FDE 位点：Zone B · 地理数据分析<\/div>\n<h2>能做什么<\/h2>\n<p>用 DuckDB 回答地理空间问题：位置/坐标/距离/地图地址、邻近与包含判断、GeoJSON/Shapefile/GeoPackage/GPX/GeoParquet 格式处理；全球基础地图数据经 Overture Maps（S3 免费无 key）。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>提到 lat/lng、距离、\"离 X 最近的\"、区域包含、地图数据文件<\/li><li>物流/车辆/网点类客户数据的空间分析（工单地理分布、服务站覆盖）<\/li><\/ul>\n<p><strong>不用于<\/strong>：非空间的普通数据分析（→ query）；地图渲染类产品开发。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>Do：先确认坐标系（WGS84 vs 投影坐标），距离计算错坐标系是最常见事故<\/li><li>Do：大表空间 join 前用边界框粗筛再精算<\/li><li>Don't：不要拿 Overture 数据当权威产权/行政数据交付客户，注明数据源与时间<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>制造业/物流案例：园区设备点位、巡检路线覆盖分析<\/li><li>ticket 场景的网点地理热力图数据准备<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-b-build/query\">query<\/a> · <a href=\"#/zone-b-build/convert-file\">convert-file<\/a><\/p>"}, {"route": "zone-b-build/mqtt-development", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "📦", "html": "<h1>mqtt-development 📦<\/h1>\n<div class=\"page-meta\">状态：📦 可安装（未装）· 类型：领域知识 · FDE 位点：Zone B · connect（工业消息）<br>来源：<code>mindrally/skills@mqtt-development<\/code> · 热度：908 installs · 详情：https://skills.sh/mindrally/skills/mqtt-development<br>安装：<code>npx skills add mindrally/skills@mqtt-development --directory ~/.qoder/skills -y<\/code><\/div>\n<h2>能做什么<\/h2>\n<p>MQTT 协议开发模式与最佳实践参考（订阅/QoS/保留消息/遗嘱等），辅助排查与实现消息接入层代码。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>对接客户 MQTT broker、调试 <code>fde_scope.connectors.mqtt_sparkplug<\/code> 相关问题时作为参考手册<\/li><li>现场设备上报异常（掉线、重复、乱序）需要协议层判断<\/li><\/ul>\n<p><strong>不用于<\/strong>：fde-scope 已有自研 connector——以我方可控实现为主，该 skill 只做知识辅助，不要让外部 skill 改写核心连接器语义。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>装前门禁：先用 <a href=\"#/cross-cutting/skill-criticagent\">skill-criticagent<\/a> 评估（社区 skill，质量未经官方验证）<\/li><li>Sparkplug 规范（状态机 NDEATH/DBIRTH）细节该 skill 未必覆盖，冲突时以 <code>fde_scope/connectors/mqtt_sparkplug.py<\/code> 的实现与规范原文为准<\/li><li>评估通过后再安装，并把结论回写本页\"最佳实践\"段<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone B <code>connect<\/code> 工业消息接入的辅助知识<\/li><li>tests/test_mqtt_connector.py 排障参考<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-b-build/read-file\">read-file<\/a> · <a href=\"#/cross-cutting/skill-criticagent\">skill-criticagent<\/a><\/p>"}, {"route": "zone-b-build/bailian-train-deploy", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "<h1>bailian-train-deploy<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装 · 类型：工作流/平台 · FDE 位点：Zone B validate/deploy + Zone C flywheel<br>依赖：<code>bl<\/code> CLI + 百炼平台账号（需 API key；写操作先 <code>--dry-run<\/code>）<\/div>\n<h2>能做什么<\/h2>\n<p>用百炼 CLI 走完「数据→微调训练→导出→部署→调用」完整闭环，或跳过训练直接部署基座模型。覆盖文本（SFT/DPO/CPT）、TTS（CosyVoice）、图像（Wan2.7）、视频（Wan i2v/kf2v）微调。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>涉及百炼/DashScope 的\"训练/微调/精调/部署模型/上线/LoRA/SFT/DPO\"任何环节——即使用户没点名 <code>bl<\/code><\/li><li>数据飞轮回流后的周期性重训（<code>fde_scope.flywheel.retrain_scheduler<\/code> 的落地执行器）<\/li><\/ul>\n<p><strong>不用于<\/strong>：火山方舟 ark 精调；本地 GPU 训练（→ trl-training / huggingface-llm-trainer）；纯选型（→ bailian-model-recommend）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>Do：链路固定为 validate 数据 → upload 拿 file-id → finetune create → watch → export → deploy，<strong>不要跳步<\/strong><\/li><li>Do：所有写操作先 <code>--dry-run<\/code> 预览再执行<\/li><li>Do：数据集格式在 validate 阶段就对齐模板，省得训练失败再查<\/li><li>Don't：不要凭记忆拼 <code>bl<\/code> 参数；不要未 watch 完成就 export<\/li><li>成本：训练/部署按时长计费，demo 用最小规格，验证通就下线<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone B <code>validate→deploy<\/code>：微调产物的真实落地路径<\/li><li>Zone C flywheel：bad case 回流 → 周度重训 → 新模型再部署<\/li><li>docs/llm_integration.md 中 MiMo 之外的平台侧选项<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/cross-cutting/bailian-cli\">bailian-cli<\/a> · <a href=\"#/zone-c-operationalization/trl-training\">trl-training<\/a> · <a href=\"#/zone-c-operationalization/huggingface-llm-trainer\">huggingface-llm-trainer<\/a><\/p>"}, {"route": "zone-b-build/huggingface-datasets", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "<h1>huggingface-datasets<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（huggingface 插件家族）· 类型：工具/数据 · FDE 位点：Zone B corpus<\/div>\n<h2>能做什么<\/h2>\n<p>基于 HF Dataset Viewer API 的数据集工作流：拉 subset/split 元数据、分页取行、全文搜索、过滤、拿 parquet 下载 URL、读规模与统计——不下载全量就能探查任意 Hub 数据集。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>为语料库找公开数据补充（中文指令集、故障诊断域数据）<\/li><li>对比候选数据集的规模/字段/样例后再决定下载<\/li><li>需要 parquet URL 直接喂给 DuckDB 分析<\/li><\/ul>\n<p><strong>不用于<\/strong>：Hub 认证/仓库管理等泛操作（→ hf-cli）；训练本身（→ trl-training）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>Do：先用 search+分页看 100 条样例判断质量，再 <code>convert-file<\/code>/parquet URL 拉全量<\/li><li>Do：私有/受限数据集注意 license 与用途限制，交付客户前二次确认<\/li><li>Don't：不要无脑 <code>load_dataset<\/code> 全量进内存，先 Viewer 探查<\/li><li>组合：Viewer 探查 → parquet URL → <code>query<\/code>（DuckDB 直查远程文件）是零落地分析链路<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone B corpus 的外部语料补充源<\/li><li>eval 基准数据（分类/检索 benchmark）的快速引入<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-b-build/convert-file\">convert-file<\/a> · <a href=\"#/zone-b-build/query\">query<\/a> · <a href=\"#/zone-b-build/train-sentence-transformers\">train-sentence-transformers<\/a><\/p>"}, {"route": "zone-b-build/train-sentence-transformers", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "<h1>train-sentence-transformers<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装 · 类型：训练/领域 · FDE 位点：Zone B corpus + Zone C flywheel<\/div>\n<h2>能做什么<\/h2>\n<p>训练/精调 sentence-transformers 全家族：<code>SentenceTransformer<\/code>（双塔嵌入：检索、相似、聚类、分类、 paraphrase 挖掘、去重、多模态）、<code>CrossEncoder<\/code>（重排器/ pair 分类）、<code>SparseEncoder<\/code>（SPLADE 稀疏检索）。覆盖损失选择、难负例挖掘、评估器、LoRA、Matryoshka、Hub 发布。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>语料工程需要<strong>领域定制嵌入模型<\/strong>：工单相似检索、故障案例去重、告警聚类<\/li><li><code>fde_scope.corpus<\/code> 的语义去重/覆盖度分析用通用模型效果不够时<\/li><\/ul>\n<p><strong>不用于<\/strong>：生成式 LLM 微调（→ bailian-train-deploy / trl-training）；只是调 API 检索（平台侧知识库解决）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>Do：先拿现成模型跑 baseline 并量化（recall@k / 聚类纯度），不够再训——训练是最后手段<\/li><li>Do：难负例挖掘（hard-negative mining）是效果大头，别只喂随机负例<\/li><li>Do：Matryoshka 维度裁剪（如 1024→256）省现场存储与延迟<\/li><li>Don't：不要在无标注数据时盲目对比学习\"试试\"；先把 bad case 判读做成标注集<\/li><li>组合：bad_case_miner 产出 → 本技能训练 → 部署进 KnowledgeBase collection<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone B corpus：语义去重、覆盖度聚类的嵌入内核<\/li><li>Zone C flywheel：周期性重训的检索侧分支（区别于生成侧）<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-c-operationalization/trl-training\">trl-training<\/a> · <a href=\"#/zone-b-build/huggingface-datasets\">huggingface-datasets<\/a> · <a href=\"#/zone-b-build/bailian-train-deploy\">bailian-train-deploy<\/a><\/p>"}, {"route": "zone-b-build/rag-agent-builder", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "📦", "html": "<h1>rag-agent-builder 📦<\/h1>\n<div class=\"page-meta\">状态：📦 可安装（未装）· 类型：工作流 · FDE 位点：Zone B prototype/deploy<br>来源：<code>qodex-ai/ai-agent-skills@rag-agent-builder<\/code> · 热度：239 installs · 详情：https://skills.sh/qodex-ai/ai-agent-skills/rag-agent-builder<br>安装：<code>npx skills add qodex-ai/ai-agent-skills@rag-agent-builder --directory ~/.qoder/skills -y<\/code><\/div>\n<h2>能做什么<\/h2>\n<p>RAG 智能体搭建流程参考：检索管道组织、知识库接线、生成端拼装。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>给客户做\"文档问答/工单辅助\"类 RAG demo，想要一套现成套路<\/li><li>补 Corpus 产物 → 可服务知识库这一环的<strong>方法论<\/strong>参考<\/li><\/ul>\n<p><strong>不用于<\/strong>：百炼平台知识库（<code>bl knowledge<\/code> 已安装，平台路径优先）；AgentScope 的 Knowledge 体系（以 <code>fde_scope/deploy<\/code> 真实 API 为准，别被通用模板带偏用虚构 API）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>装前门禁：239 installs 属低热度社区件，<strong>必须<\/strong>先过 <a href=\"#/cross-cutting/skill-criticagent\">skill-criticagent<\/a>，重点审它推荐的 API 是否真实存在（本项目 docs/agentscope_api_mapping.md 就是为虚构 API 坑而写的）<\/li><li>若模板与 <code>docs/agentscope_api_mapping.md<\/code> 的\"真实 2.0.5 API\"冲突，一律以本项目映射表为准<\/li><li>评估结论回写本页<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone B prototype-on-real-data：语料 → 可演示问答原型<\/li><li>Zone C：客户自助知识库的搭建参考<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-b-build/huggingface-datasets\">huggingface-datasets<\/a> · <a href=\"#/zone-b-build/train-sentence-transformers\">train-sentence-transformers<\/a> · <a href=\"#/cross-cutting/bailian-cli\">bailian-cli<\/a><\/p>"}, {"route": "zone-b-build/frontend-design", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "<h1>frontend-design<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装 · 类型：实现/设计 · FDE 位点：Zone B prototype<\/div>\n<h2>能做什么<\/h2>\n<p>产出有辨识度、生产级质量的前端界面（网页/组件/dashboard/海报/app），规避\"AI 通用审美\"（千篇一律的紫渐变、Inter 字体、卡片套卡片）。用户要求构建 Web 组件、页面、落地页或美化任何 UI 时使用。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>给客户做 demo 工作台、结果展示页、汇报用视觉物料<\/li><li><code>fde_scope/web<\/code> 工作台前端升级观感<\/li><\/ul>\n<p><strong>不用于<\/strong>：只要功能不要脸的内部脚本页（直接写）；设计系统咨询（→ ui-designer 更系统）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>Do：先定设计方向（受众、情绪、参考）再写码——它是\"设计+实现\"一体的技能<\/li><li>Do：现场 demo 保持\"一屏看懂\"：KPI 大数字 + 流程图 + 少量交互<\/li><li>Don't：不要堆动效炫技抢演示焦点；不要引入需联网的字体/CDN（air-gap 环境失效）<\/li><li>离线检查：交付前断网开一遍，资源加载失败的 demo 比丑更致命<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone B <code>prototype-on-real-data<\/code> 的展示层<\/li><li>examples/ 的 corpus HTML 报告美化（templates/corpus_report.html.j2）<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-b-build/ui-designer\">ui-designer<\/a> · <a href=\"#/zone-b-build/shadcn\">shadcn<\/a> · <a href=\"../zone-b-build/#\" target=\"_blank\" rel=\"noopener\">canvas<\/a>（可视化制品）<\/p>"}, {"route": "zone-b-build/ui-designer", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "<h1>ui-designer<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装 · 类型：设计/原型 · FDE 位点：Zone B prototype<\/div>\n<h2>能做什么<\/h2>\n<p>Web UI 设计与原型专家：建立设计系统、视觉风格，输出可运行 MVP 原型。偏\"从 0 定系统\"，比 frontend-design 更上游。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>新客户工作台/产品需要先定视觉体系（色板、字体、组件规范）再多人/多页开发<\/li><li>\"帮我设计一个 XX 应用界面\"级别的完整任务<\/li><\/ul>\n<p><strong>不用于<\/strong>：已有设计系统只缺页面（→ frontend-design / shadcn）；单张小海报图类物料。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>Do：设计系统产出以 token 形式落文档（色/距/字阶），交接时客户运维能延续<\/li><li>Do：原型只保真到\"能讲清交互\"的深度，别在评审前过度实现<\/li><li>Don't：不要跳过它直接写码再\"顺手设计\"，风格漂移更难救<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>多客户 engagement 时按品牌色派生工作台主题<\/li><li>pawapp 桌面端 UI 风格基线（配合 <code>pawapp/ui<\/code>）<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-b-build/frontend-design\">frontend-design<\/a> · <a href=\"#/zone-b-build/shadcn\">shadcn<\/a> · <a href=\"../zone-b-build/#\" target=\"_blank\" rel=\"noopener\">design-system<\/a><\/p>"}, {"route": "zone-b-build/shadcn", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "<h1>shadcn<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（vercel 插件 v0.44.0，priority=6 自动触发）· 类型：组件体系/工作流 · FDE 位点：Zone B demo<\/div>\n<h2>能做什么<\/h2>\n<p>shadcn/ui 全套能力：CLI 初始化（非交互）、组件添加（<code>npx shadcn@latest add<\/code>）、组件组合成产品级 UI、自定义 registry 发布、Tailwind 主题/暗色定制、组件问题排查。核心概念：组件是<strong>复制进仓库的源码<\/strong>，不是 npm 依赖——所以完全可改。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>fde-scope Web 控制台（<code>fde_scope/web/<\/code>）的 React 面板需要成体系的组件与主题时<\/li><li>现场 demo 要在几小时内做出\"像成品\"的表格/表单/对话框/侧栏组合<\/li><li>路径命中 <code>components.json<\/code>、<code>components/ui/**<\/code>、<code>npx shadcn ...<\/code> 时该 skill 会自动激活<\/li><\/ul>\n<p><strong>不用于<\/strong>：纯静态单页原型（→ <a href=\"#/zone-b-build/ui-designer\">ui-designer<\/a> 或 <a href=\"#/zone-b-build/frontend-design\">frontend-design<\/a> 足够）；非 React 技术栈（Vue/Svelte）不要硬套。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>Do：<code>npx shadcn@latest init<\/code> 用非交互参数，避免 agent 卡在提示上<\/li><li>Do：只 add 真正用到的组件——一次性 add 全部会把仓库塞满没人维护的副本<\/li><li>Do：主题走 CSS 变量 + Tailwind token，不要逐个组件改颜色<\/li><li>Warning：若项目使用 AI Elements，必须 <code>npx shadcn@latest init -d --base radix -f<\/code>（Base UI 与 Radix API 不兼容，skill 里带此校验规则）<\/li><li>组合优于新增：优先用已有组件拼（Card/Table/Dialog/Form），而不是自己造轮子<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone B demo/原型：Web 控制台的组件底座与主题一致性<\/li><li>与 <a href=\"#/zone-b-build/frontend-design\">frontend-design<\/a> 配合：shadcn 出结构，frontend-design 管设计质量下限<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-b-build/frontend-design\">frontend-design<\/a> · <a href=\"#/zone-b-build/ui-designer\">ui-designer<\/a> · <a href=\"#/zone-b-build/vercel-deploy\">vercel-deploy<\/a><\/p>"}, {"route": "zone-b-build/vercel-deploy", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "<h1>vercel-deploy<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（vercel 插件 v0.44.0；实际 skill 名为 <code>deployments-cicd<\/code> + <code>vercel-cli<\/code>，本页为\"用 Vercel 上线 demo\"的合页档案）· 类型：部署/平台 · FDE 位点：Zone B demo→客户可访问 URL<\/div>\n<h2>能做什么<\/h2>\n<p>把前端 demo 快速变成客户可点开的 URL：<code>vercel<\/code> CLI 部署、preview → production 提升、回滚、查看部署日志与构建产物（<code>--prebuilt<\/code>）、CI 工作流接入（GitHub/GitLab）。配套还有 env-vars、vercel-functions、vercel-storage、routing-middleware 等同插件 skill。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>现场给客户看原型：本地跑通后要一个<strong>能分享<\/strong>的链接，而不是让客户装环境<\/li><li>配 <code>.github/workflows/*<\/code> 做 PR preview 时<\/li><li>部署失败/环境变量丢失/缓存导致旧版本还在服务的排障<\/li><\/ul>\n<p><strong>不用于<\/strong>：客户内网/离线场景（Vercel 出网不可用 → 走 <a href=\"#/zone-b-build/docker-build-deploy\">docker-build-deploy<\/a> 或 <a href=\"#/zone-b-build/alibabacloud-workbench-cli\">alibabacloud-workbench-cli<\/a>）；纯后端 Python 服务（fde-scope 的 FastAPI 主体）更适合容器化交付。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>Do：先 preview 再 promote——preview URL 是给客户\"看一眼\"的最小暴露面<\/li><li>Do：Secret 走 <code>vercel env<\/code>，不要写进仓库或命令行历史<\/li><li>Do：构建重复耗时长时用 <code>--prebuilt<\/code>（本地/CI 构建一次，部署只传产物）<\/li><li>Don't：不要用 production 部署做冒烟测试；不要留着 demo 长期免费额度消耗<\/li><li>隐私红线：客户数据/真实工单一律不得进入 public preview；demo 只用合成数据（<code>fde_scope<\/code> 的 mock/JSONL 模式）<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone B demo：Web 控制台前端或独立汇报面板的上线通道<\/li><li>Zone D handoff：交付演示时的临时环境（会后即降级/删除）<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-b-build/cloudflare\">cloudflare<\/a> · <a href=\"#/zone-b-build/docker-build-deploy\">docker-build-deploy<\/a> · <a href=\"#/zone-b-build/frontend-design\">frontend-design<\/a><\/p>"}, {"route": "zone-b-build/cloudflare", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "<h1>cloudflare<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（cloudflare 插件 v1.0.0，同插件含 workers-best-practices / durable-objects / web-perf / wrangler / agents-sdk 等）· 类型：平台/决策树 · FDE 位点：Zone B deploy（边缘/无服务器）<\/div>\n<h2>能做什么<\/h2>\n<p>Cloudflare 全平台决策树 + 实现指导：Workers / Pages / KV / D1 / R2 / Queues / Vectorize / Durable Objects / Workflows / Containers / Tunnel / Spectrum / WAF / Flagship 特性开关 / Terraform & Pulumi。<strong>内置强约束：极限值、定价、API 签名必须从 Cloudflare docs 检索，不许凭记忆<\/strong>。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>客户要\"零运维 + 全球低延迟\"的轻量交付面（看板、上报页、Agent 端点）<\/li><li>需要选型：这段逻辑该放 Worker、Pages Function 还是 Durable Object<\/li><li>需要边缘侧存储/向量检索（R2 + Vectorize）而不是自建集群<\/li><\/ul>\n<p><strong>不用于<\/strong>：客户内网离线部署（Cloudflare 依赖公网 → <a href=\"#/zone-b-build/docker-build-deploy\">docker-build-deploy<\/a> / <a href=\"#/zone-b-build/kubernetes-specialist\">kubernetes-specialist<\/a>）；GPU 推理（→ <a href=\"#/zone-b-build/vllm-deploy-docker\">vllm-deploy-docker<\/a>，Workers AI 只适合小模型）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>严格遵守 skill 的 retrieval 规则：引用数字/价格/限额前先拉最新 docs，reference 文件与 docs 冲突时<strong>以 docs 为准<\/strong><\/li><li>用 <code>wrangler<\/code> 做本地 dev + 类型校验，别在生产 Worker 上试错<\/li><li>数据边界：客户数据入边缘存储前必须确认可出境/合规条款，工业客户通常禁止 → 默认只放配置与匿名指标<\/li><li>成本：Workers 免费额度适合 demo，规模化前先算 request/GB-s<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone B deploy：面向多客户分支的轻量看板 / 遥测接收端点<\/li><li>Zone C：<code>web-perf<\/code>（同插件）用于交付 Web 面板的 Core Web Vitals 分析<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-b-build/docker-build-deploy\">docker-build-deploy<\/a> · <a href=\"#/zone-b-build/kubernetes-specialist\">kubernetes-specialist<\/a> · <a href=\"#/zone-c-operationalization/web-perf\">web-perf<\/a><\/p>"}, {"route": "zone-b-build/kubernetes-specialist", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "📦", "html": "<h1>kubernetes-specialist 📦<\/h1>\n<div class=\"page-meta\">状态：📦 可安装（未装）· 类型：部署/运维 · FDE 位点：Zone B deploy + Zone C operate<br>来源：<code>jeffallan/claude-skills@kubernetes-specialist<\/code> · 热度：12.5K installs · 详情：https://skills.sh/jeffallan/claude-skills/kubernetes-specialist<br>安装：<code>npx skills add jeffallan/claude-skills@kubernetes-specialist --directory ~/.qoder/skills -y<\/code><\/div>\n<h2>能做什么<\/h2>\n<p>K8s 现场交付与排障的通用专家技能：manifest/Helm 编写、Deployment/Service/Ingress/ConfigMap/Secret 语义、探针与资源配额、滚动发布与回滚、<code>kubectl<\/code> 排障路径（Pod 卡住、CrashLoopBackOff、OOMKilled、镜像拉取失败、网络策略阻断）。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>客户侧已有 K8s 平台，fde-scope 要以 Deployment 形式落地（含 GPU device plugin 场景）<\/li><li>现场发布出问题时按\"先定位后修\"的排障流程走，而不是逐个改 yaml 试<\/li><li>写交付物的 <code>deploy/<\/code> 目录（ Helm chart / kustomize overlay）需要规范基线<\/li><\/ul>\n<p><strong>不用于<\/strong>：单客户内网只有一台 ECS 的小规模交付（→ <a href=\"#/zone-b-build/alibabacloud-workbench-cli\">alibabacloud-workbench-cli<\/a> 或 <a href=\"#/zone-b-build/docker-build-deploy\">docker-build-deploy<\/a>）；纯本地 dev（docker compose 足够）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>装前门禁：社区 skill（非官方），先用 <a href=\"#/cross-cutting/skill-criticagent\">skill-criticagent<\/a> 评估；若不通过，可考虑热度更高的 <code>microsoft/azure-skills@azure-kubernetes<\/code>（375.4K）作为云平台特化替代<\/li><li>生产红线：不要让 skill 生成的 manifest 直接 apply 到客户集群——必须 dry-run + diff 后再由客户确认<\/li><li>明确 namespace/context：任何命令都带 <code>--context/--namespace<\/code>，agent 误操作集群的最大来源就是 context 漂移<\/li><li>优先声明式：所有变更走 git 中的 yaml，不接受 <code>kubectl edit<\/code> 类临时改动（会造成集群与仓库漂移）<\/li><li>记录到项目：把最终 topology 回写 <code>docs/architecture-model/<\/code>，配合 <a href=\"#/cross-cutting/architecture-visualization-suite\">deployment-topology-analyzer<\/a><\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone B deploy：多客户/规模化交付时的编排层<\/li><li>Zone C operate：现场故障排查与回滚 SOP 的执行依据<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-b-build/docker-build-deploy\">docker-build-deploy<\/a> · <a href=\"#/zone-b-build/vllm-deploy-docker\">vllm-deploy-docker<\/a> · <a href=\"#/cross-cutting/skill-criticagent\">skill-criticagent<\/a><\/p>"}, {"route": "zone-b-build/docker-build-deploy", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "📦", "html": "<h1>docker-build-deploy 📦<\/h1>\n<div class=\"page-meta\">状态：📦 可安装（未装）· 类型：部署/生产化 · FDE 位点：Zone B deploy<br>来源：<code>wu529778790/shenzjd-skills@docker-build-deploy<\/code> · 热度：745 installs · 详情：https://skills.sh/wu529778790/shenzjd-skills/docker-build-deploy<br>备选：<code>ailabs-393/ai-labs-claude-skills@docker-containerization<\/code>（1.1K installs）、<code>thebushidocollective/han@docker-compose-production<\/code>（421）<br>安装：<code>npx skills add wu529778790/shenzjd-skills@docker-build-deploy --directory ~/.qoder/skills -y<\/code><\/div>\n<h2>能做什么<\/h2>\n<p>把 Python 服务做成可交付容器：多阶段构建、层缓存顺序、非 root 用户、healthcheck、compose 编排、镜像瘦身与生产化 checklist。<\/p>\n<h2>何时使用<\/h2>\n<ul><li><strong>本仓库当前缺口<\/strong>：<code>fde-scope<\/code> 仓库里没有任何项目级 Dockerfile / compose（仅 <code>.venv<\/code> 内 agentscope 自带的模板），要把 <code>fde_scope.web<\/code> 或 <code>pawapp/backend<\/code> 容器化交付时正好需要它<\/li><li>客户只接受\"给一个镜像 + 一条 docker run\"的交付形式<\/li><li>现场镜像体积/拉取时间成为阻塞（工业内网带宽有限）<\/li><\/ul>\n<p><strong>不用于<\/strong>：sandbox 运行时隔离——那是 <code>fde_scope/deploy/sandbox_config.py<\/code> 通过 agentscope <code>DockerWorkspace<\/code> 做的事，已有自研实现，不要被外部 skill 改写语义；K8s 编排（→ <a href=\"#/zone-b-build/kubernetes-specialist\">kubernetes-specialist<\/a>）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>装前门禁：社区个人源、热度中等 → 先用 <a href=\"#/cross-cutting/skill-criticagent\">skill-criticagent<\/a> 评估；不通过就直接用官方 docker docs + 自建 <code>deploy/Dockerfile<\/code><\/li><li>Python 服务必做：<code>pip install<\/code> 层与源码拷贝层分离（缓存命中）、<code>--no-cache-dir<\/code>、锁定 <code>python3.12<\/code> 与 pyproject 一致、非 root <code>USER<\/code><\/li><li>敏感信息：<code>FDE_SCOPE_MIMO_API_KEY<\/code> 等只能运行时注入（<code>-e<\/code>/secret），<strong>不得进入镜像层<\/strong>（现场审计会 <code>docker history<\/code>）<\/li><li>复现性：镜像 tag 绑定 git sha；交付文档里写清 <code>docker inspect<\/code> 取版本的方法<\/li><li>离线交付：内网客户要 <code>docker save/load<\/code> 的 tar 流程与校验和<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone B deploy：补齐 <code>deploy/Dockerfile<\/code> + <code>deploy/docker-compose.yml<\/code>（当前缺失，属于可执行的改进项）<\/li><li>Zone D handoff：镜像启动命令与回滚方式是交接文档必答项<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-b-build/kubernetes-specialist\">kubernetes-specialist<\/a> · <a href=\"#/zone-b-build/vllm-deploy-docker\">vllm-deploy-docker<\/a> · <a href=\"#/zone-b-build/alibabacloud-workbench-cli\">alibabacloud-workbench-cli<\/a><\/p>"}, {"route": "zone-b-build/alibabacloud-workbench-cli", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "<h1>alibabacloud-workbench-cli<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（alibabacloud-workbench 插件 v1.1.0）· 类型：运维通道/CLI · FDE 位点：Zone B deploy + Zone C operate<\/div>\n<h2>能做什么<\/h2>\n<p>面向 <strong>无公网 IP 的 ECS 实例<\/strong> 的 agent 原生 CLI：毫秒级远程命令执行（<code>workbench exec<\/code>）、最大 1GB 文件传输（<code>upload<\/code>/<code>download<\/code>）、会话管理、实例查询过滤、5 种鉴权模式（AK / StsToken / RamRoleArn / CredentialsCmd / CredentialsURI）。插件自带 <code>scripts/install-cli.sh<\/code> 与 <code>scripts/wb-config.sh<\/code>，并有 <code>/alibabacloud-workbench:setup<\/code>、<code>/alibabacloud-workbench:doctor<\/code> 两个 command。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>客户的产线/测试机在 VPC 内、没有跳板机权限，需要\"打进去跑一条命令、拿一份日志\"<\/li><li>部署 fde-scope 容器或替换配置后需要即时验证（看进程、看端口、看日志）<\/li><li>大文件（数据集/模型权重）进出内网机器<\/li><\/ul>\n<p><strong>不用于<\/strong>：有 SSH 直连的环境（直接 ssh 更简单）；非阿里云的机器（→ <a href=\"#/zone-b-build/docker-build-deploy\">docker-build-deploy<\/a> / <a href=\"#/zone-b-build/kubernetes-specialist\">kubernetes-specialist<\/a>）；批量生产变更（要走 IaC，不要用 exec 手搓）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>首次用先跑 <code>/alibabacloud-workbench:setup<\/code>（装 CLI + 配凭据），出问题用 <code>:doctor<\/code> 诊断，不要手工排查环境变量<\/li><li>凭据优先 <code>RamRoleArn<\/code> / <code>CredentialsCmd<\/code>，<strong>不要把 AK 写进仓库或 shell 历史<\/strong>；用 <code>wb-config.sh verify<\/code> 确认生效<\/li><li>命令幂等：exec 的脚本要能在重跑时不出副作用（现场网络抖动会重试）<\/li><li>需要出网到 <code>*.aliyuncs.com<\/code> 与 Workbench WebSocket，客户防火墙策略要提前申请——这是常见的交付前置条件<\/li><li>大文件传输走 <code>upload/download<\/code>（1GB 上限），不要 base64 塞进 exec<\/li><li>安全边界：现场机器上的任何写操作都要先向客户确认窗口期，日志里不留客户数据<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone B deploy：把 fde-scope 服务落到客户 ECS（内网机）并自检<\/li><li>Zone C operate：现场取日志/看进程/改配置的主通道<\/li><li>docs/architecture.md 的部署侧运维入口<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-b-build/docker-build-deploy\">docker-build-deploy<\/a> · <a href=\"#/zone-b-build/kubernetes-specialist\">kubernetes-specialist<\/a> · <a href=\"#/zone-c-operationalization/starops\">starops<\/a><\/p>"}, {"route": "zone-b-build/alibabacloud-core-suite", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "<h1>alibabacloud-core 套件（阿里云 OpenAPI/CLI 9 件套）<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（Quest Marketplace 插件 alibabacloud-core v1.0.20）· 类型：套件档案 · FDE 位点：Zone B deploy（客户资源在阿里云）<\/div>\n<h2>能做什么<\/h2>\n<p>通过受约束的 MCP 服务器操作阿里云 OpenAPI：CLI 命令生成与语法指引（<code>alibabacloud-cli-guidance<\/code> / <code>suggest-cli<\/code>）、<strong>跨账号资源查询<\/strong>（<code>multi-account-query<\/code>，RD ListAccounts 拿 UID → <code>x_assume_account_id<\/code> 代入）、SDK 代码生成（<code>sdk-usage<\/code> / <code>terraform-code-generation<\/code>）、存量资源 Terraform 导入（<code>terraform-import<\/code>）、沙箱 RunScript 脚本生成（<code>mcp-core-script-generate<\/code>）、阿里云生态技能发现（<code>alibabacloud-find-skills<\/code>）、MCP 用法总纲（<code>mcp-core-best-practices<\/code>）。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>客户资源在阿里云：资源盘点、多账号/多 Member 环境查询、组网与产品配置确认<\/li><li>要生成调用阿里云 OpenAPI 的 SDK/CLI 代码（fde-scope 集成代码或一次性脚本）<\/li><li>存量资源要转 Terraform 管理的起步（import）<\/li><\/ul>\n<p><strong>不用于<\/strong>：百炼/DashScope（→ <a href=\"#/cross-cutting/bailian-cli\">bailian-cli 家族<\/a>）；无公网 IP 的单机 ECS 运维（→ <a href=\"#/zone-b-build/alibabacloud-workbench-cli\">alibabacloud-workbench-cli<\/a>）；带评审与执行门禁的 IaC 全流程交付（→ <a href=\"#/zone-b-build/alibabacloud-spec-ops-suite\">alibabacloud-spec-ops 套件<\/a>）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>只读查询直连；<strong>写操作先 dry-run/plan 思维<\/strong>，确认 diff 再发，AccessKey/Secret 永不进命令行与日志<\/li><li>多账号先 <code>ListAccounts<\/code> 解析 alias → UID，再用 <code>x_assume_account_id<\/code> 切换，别手工翻控制台<\/li><li>CLI 输出用 JMESPath 过滤（<code>--output<\/code> / query 参数）只取需要的字段——省 token 也省得误读<\/li><li>走 MCP 工具而不是手拼 OpenAPI URL：签名/版本/.region 由 server 保证<\/li><li>生成的 SDK 代码过一遍 mypy/ruff 再进仓库，别把生成器风格直接合入<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone B 制造业客户的云资源前置检查（网络/白名单/账号权限），对接 connectors 的数据源可达性<\/li><li>deploy/tenant_manager 的租户云资源初始化脚本来源<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-b-build/alibabacloud-spec-ops-suite\">alibabacloud-spec-ops-suite<\/a> · <a href=\"#/zone-b-build/alibabacloud-workbench-cli\">alibabacloud-workbench-cli<\/a> · <a href=\"#/cross-cutting/bailian-cli\">bailian-cli<\/a><\/p>"}, {"route": "zone-b-build/alibabacloud-spec-ops-suite", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "<h1>alibabacloud-spec-ops 套件（阿里云 IaC 工作流 6 件套）<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（Quest Marketplace 插件 alibabacloud-spec-ops v0.1.4，含 2 个评审 agent）· 类型：套件档案 · FDE 位点：Zone B deploy（IaC 交付流水线）<\/div>\n<h2>能做什么<\/h2>\n<p>把\"基础设施需求\"变成\"可校验、可重放的 Terraform 落地\"的完整流水线：<code>alibabacloud-planning<\/code>（需求 → 设计文档）→ <code>alibabacloud-writing-plans<\/code>（设计 → HCL/CLI 计划）→ <code>alibabacloud-terraform-codegen<\/code>（生成 Terraform 代码）→ <code>alibabacloud-validate<\/code>（并行派发 spec-reviewer + code-quality-reviewer 两个 agent 审规格符合性与代码质量）→ <code>alibabacloud-executing-plans<\/code>（执行 apply，<strong>强制人工确认<\/strong>）→ <code>alibabacloud-ram-permission-diagnose<\/code>（403/NoPermission 类权限诊断与修复建议）。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>客户要\"资源开通 / 组网 / 上云\"的 IaC 交付，需要可评审、可重放的过程资产（design.md → plan → code → apply 记录）<\/li><li>多环境（dev/staging/prod）一致开通，人工点控制台已经要出错的时候<\/li><li>RAM 权限报错排查：先跑诊断，别盲改策略<\/li><\/ul>\n<p><strong>不用于<\/strong>：单机 ECS 运维（→ <a href=\"#/zone-b-build/alibabacloud-workbench-cli\">alibabacloud-workbench-cli<\/a>）；K8s 应用层部署（→ <a href=\"#/zone-b-build/kubernetes-specialist\">kubernetes-specialist<\/a>）；非阿里云的 Terraform（本套件绑定 alicloud provider，通用流程自己写 plan）；只想查资源（→ <a href=\"#/zone-b-build/alibabacloud-core-suite\">alibabacloud-core 套件<\/a>）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li><strong>流程顺序不可跳<\/strong>：先 planning 再 codegen，validate 不过不 apply——跳步省下的时间都会在回滚时加倍还<\/li><li>apply 前把 plan diff 展示给用户确认（工具强制 <code>--yes<\/code> 是底线不是充分条件）<\/li><li>权限报错先 <code>ram-permission-diagnose<\/code>，输出最小授权建议，别一上来给 <code>AdministratorAccess<\/code><\/li><li>过程资产（design.md / plan 文件 / 生成代码）归档进交付物目录，Zone D 移交时就是\"环境是怎么来的\"的答案<\/li><li>存量资源先用 core 套件的 <code>terraform-import<\/code> 收编，再进本流水线管理增量<\/li><li>state 文件是敏感资产：远端远端存储 + 锁，绝不进 git<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>fde-scope 制造业场景的云资源编排章节（数据源所在 VPC/白名单/对象存储开通）<\/li><li>与 connectors 的部署前置条件检查单互补：环境开通以 IaC 记录为准<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-b-build/alibabacloud-core-suite\">alibabacloud-core-suite<\/a> · <a href=\"#/zone-b-build/kubernetes-specialist\">kubernetes-specialist<\/a> · <a href=\"#/zone-b-build/docker-build-deploy\">docker-build-deploy<\/a><\/p>"}, {"route": "zone-b-build/vllm-deploy-docker", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "📦", "html": "<h1>vllm-deploy-docker 📦<\/h1>\n<div class=\"page-meta\">状态：📦 可安装（未装）· 类型：推理栈部署 · FDE 位点：Zone B deploy（私有化 LLM）<br>来源：<code>vllm-project/vllm-skills@vllm-deploy-docker<\/code>（官方 org）· 热度：174 installs · 详情：https://skills.sh/vllm-project/vllm-skills/vllm-deploy-docker<br>同系列：<code>vllm-deploy-simple<\/code>（148）、<code>vllm-deploy-k8s<\/code>（112）<br>安装：<code>npx skills add vllm-project/vllm-skills@vllm-deploy-docker --directory ~/.qoder/skills -y<\/code><\/div>\n<h2>能做什么<\/h2>\n<p>vLLM 官方容器部署指导：镜像选择（CUDA 版本/driver 匹配）、<code>--gpu-memory-utilization<\/code>/<code>--max-model-len<\/code>/tensor-parallel 参数、OpenAI 兼容 server 启动、量化与显存预算、健康检查与常见启动失败定位。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>客户要求<strong>私有化 LLM<\/strong>（数据不出厂），fde-scope 的 <code>llm<\/code> 层要指向内网 OpenAI 兼容端点<\/li><li>现场 GPU 机器（A10/A100/4090/昇腾）上把开源模型起成服务<\/li><li>评估\"这个模型在这张卡上能不能跑、能撑多少并发\"<\/li><\/ul>\n<p><strong>不用于<\/strong>：只用 MiMo Token Plan 的公有云路径（→ <a href=\"#/zone-b-build/bailian-train-deploy\">bailian-train-deploy<\/a>）；边缘小设备（→ <code>nvidia/skills@jetson-llm-serve<\/code>，1.1K）；昇腾 NPU（→ <a href=\"#/zone-b-build/vllm-ascend\">vllm-ascend<\/a>）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>官方 org 出品，可信度高于社区同类，可直接作为主选；仍建议装前用 <a href=\"#/cross-cutting/skill-criticagent\">skill-criticagent<\/a> 过一次门禁（版本迭代快，看是否与当前 vLLM 版本相符）<\/li><li>与 fde-scope 的契约：vLLM 起来后以 <strong>OpenAI 兼容 base_url + key<\/strong> 接入，凭据仍走 <code>FDE_SCOPE_MIMO_API_KEY<\/code> 风格的环境变量注入，不落配置文件<\/li><li>显存预算先算再跑：<code>模型权重 + KV cache<\/code>，<code>--gpu-memory-utilization<\/code> 从 0.9 起，OOM 时先降 <code>--max-model-len<\/code><\/li><li>现场网络受限：镜像与权重都要走离线搬运（<code>docker save<\/code> + modelscope/HF 镜像源），提前列清单<\/li><li>版本锁定：交付时记录 vLLM / CUDA / driver / 模型 revision 四元组，否则无法复现<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone B deploy：<code>fde_scope.llm<\/code> 的私有化后端落地<\/li><li>Zone A air-gap gate：气隙环境下的模型服务可行性证据（[air_gap.py <code>AirGapGate<\/code>](../../../fde_scope/engagement/gates/air_gap.py)）<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-b-build/vllm-ascend\">vllm-ascend<\/a> · <a href=\"#/zone-b-build/bailian-train-deploy\">bailian-train-deploy<\/a> · <a href=\"#/zone-b-build/docker-build-deploy\">docker-build-deploy<\/a><\/p>"}, {"route": "zone-b-build/vllm-ascend", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "📦", "html": "<h1>vllm-ascend 📦<\/h1>\n<div class=\"page-meta\">状态：📦 可安装（未装）· 类型：推理栈部署（昇腾 NPU） · FDE 位点：Zone B deploy<br>候选 A（知识型）：<code>ascend-ai-coding/awesome-ascend-skills@vllm-ascend<\/code> · 63 installs · repo 164★ · https://skills.sh/ascend-ai-coding/awesome-ascend-skills/vllm-ascend<br>候选 B（官方 org · 工作流型）：<code>ascend/agent-skills@vllm-ascend-deploy<\/code> · 91 installs · repo 37★ · https://skills.sh/ascend/agent-skills/vllm-ascend-deploy<br>安装（择一）：<code>npx skills add ascend/agent-skills@vllm-ascend-deploy --directory ~/.qoder/skills -y<\/code><\/div>\n<h2>能做什么<\/h2>\n<p>在<strong>华为昇腾 NPU<\/strong> 上跑 vLLM 推理服务：<code>vllm-ascend<\/code> 插件安装与版本匹配、必需环境变量（<code>VLLM_WORKER_MULTIPROC_METHOD=spawn<\/code>）、Ascend 优化 kernel、量化（W8A8 等）、多卡分布式推理。候选 B 额外提供一键部署工作流：SSH 检查 → 解析模型 → NPU 检查 → 配置发现 → 用户确认 → 执行部署 → 监控启动 → 验证服务。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>客户是国产算力环境（Atlas 800/300I、昇腾 910B），CUDA 路径不可用——国内工业/政企项目高频<\/li><li>现场已经在昇腾上起了服务但报 kernel/版本不匹配，需要按插件矩阵定位<\/li><li>写\"私有化 LLM 可行性\"方案时评估 NPU 侧的支持面<\/li><\/ul>\n<p><strong>不用于<\/strong>：NVIDIA 卡（→ <a href=\"#/zone-b-build/vllm-deploy-docker\">vllm-deploy-docker<\/a>）；昇腾<strong>算子开发<\/strong>（属另一类需求，registry 有 <code>ascend/agent-skills@ascendc-operator-*<\/code> 系列，超出 FDE 交付范围）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>⚠️ <strong>安全审计现状<\/strong>（skills.sh 页面可见，建档日 2026-08-27 复核）：候选 A = Agent Trust Hub <strong>Fail<\/strong> / Socket Pass / Snyk Warn；候选 B = 三项均 <strong>Warn<\/strong>。两者都<strong>未通过干净审计<\/strong>，属于必须先过门禁的类型<\/li><li>强制门禁：装前用 <a href=\"#/cross-cutting/skill-criticagent\">skill-criticagent<\/a> 人工审 SKILL.md 全文，重点看候选 B 是否会<strong>自动执行远程命令<\/strong>（SSH + 部署脚本）——这类 skill 相当于给 agent 一把现场钥匙<\/li><li>若只用候选 A（纯知识、不改环境），风险显著更低，优先作为默认选择；需要执行部署时更宁愿手写 runbook<\/li><li>版本矩阵必须查官方文档：<code>vllm<\/code> / <code>vllm-ascend<\/code> / <code>CANN<\/code> / NPU driver 四元组强绑定，任一升级都可能失效<\/li><li>现场凭据：绝不把 SSH key/密码交给 skill 明文使用；走 <a href=\"#/zone-b-build/alibabacloud-workbench-cli\">alibabacloud-workbench-cli<\/a> 或客户跳板机审批流程<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone B deploy：国产化算力客户的模型服务落地路径<\/li><li>Zone A：<code>fat_sat<\/code> gate 前评估“NPU + 目标模型”在客户设备上是否跑得动<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-b-build/vllm-deploy-docker\">vllm-deploy-docker<\/a> · <a href=\"#/cross-cutting/skill-criticagent\">skill-criticagent<\/a> · <a href=\"#/zone-b-build/alibabacloud-workbench-cli\">alibabacloud-workbench-cli<\/a><\/p>"}, {"route": "zone-b-build/huggingface-local-models", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "<h1>huggingface-local-models<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（hugging-face 插件 v1.0.0）· 类型：本地推理 · FDE 位点：Zone B build/deploy（客户内网 & air-gap）<\/div>\n<h2>能做什么<\/h2>\n<p>用 llama.cpp + GGUF 把开源模型跑在 CPU / Mac Metal / CUDA / ROCm 上：GGUF 检索与精确文件定位、量化档位选择、本地起服务、格式转换、OpenAI 兼容 serving。配套 <code>hf-mem<\/code> 可先估算权重加载内存再决定下哪个档。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>客户数据不能出域 / 无公网（air-gap 工厂、政务、金融内网）——LLM 能力只能本地化<\/li><li>现场用 MacBook 演示 Agent 能力，不依赖任何云端 API<\/li><li>低成本 PoC：单机跑通\"LLM 参与的链路\"，再决定是否上 GPU<\/li><li>给 fde-scope 这类\"LLM 可选回退\"系统准备本地端点做联调<\/li><\/ul>\n<p><strong>不用于<\/strong>：有 GPU 集群且要并发吞吐（→ <a href=\"#/zone-b-build/vllm-deploy-docker\">vllm-deploy-docker<\/a>）；昇腾 NPU（→ <a href=\"#/zone-b-build/vllm-ascend\">vllm-ascend<\/a>）；模型训练/微调（→ <a href=\"#/zone-c-operationalization/huggingface-llm-trainer\">huggingface-llm-trainer<\/a>）；客户已采购商用 API（直接接，别自建）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>量化选档：Q4_K_M 是吞吐/质量默认起点；给客户演示优先 Q5/Q6 起步，\"答得慢但对\"好过\"快但胡说\"<\/li><li>下载前先跑 <code>hf-mem<\/code> 估内存，现场机器爆内存是最难看的演示事故<\/li><li>用 OpenAI 兼容端点接系统：本仓库 <code>fde_scope/config.py<\/code> 的 LLM 接入即 OpenAI 兼容——本地服务 URL 指过去、<code>FDE_SCOPE_MIMO_API_KEY<\/code> 给任意占位值即可全链路验证回退逻辑<\/li><li>上下文长度吃内存：长上下文需求（语料摘要、工单全文）要把 KV cache 算进预算，别只看权重<\/li><li>许可证三查：GGUF 的发布许可、基座模型许可（部分禁商用/需申请）、客户合规红线<\/li><li>版本固化：把 GGUF 文件名 + llama.cpp commit 写进交付记录，别用\"latest\"复现不了<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone B manufacturing 场景的 air-gap 部署形态（fde_scope/deploy 无网部署分支）<\/li><li>LLM 回退链路测试：本地端点 → 断电 → 规则兜底，三态验证<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-b-build/vllm-deploy-docker\">vllm-deploy-docker<\/a> · <a href=\"#/zone-b-build/vllm-ascend\">vllm-ascend<\/a> · <a href=\"#/zone-b-build/huggingface-best\">huggingface-best<\/a> · <a href=\"#/cross-cutting/bailian-cli\">bailian-cli<\/a><\/p>"}, {"route": "zone-b-build/huggingface-best", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "<h1>huggingface-best<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（hugging-face 插件 v1.0.0）· 类型：模型选型 · FDE 位点：Zone A 方案设计 / Zone B build<\/div>\n<h2>能做什么<\/h2>\n<p>回答\"这个任务用什么模型最好\"：按任务类型、榜单成绩、生态成熟度对比候选模型并给出推荐。核心是<strong>帮客户做决策<\/strong>，不是罗列资料。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>客户/方案书里的模型选型章节：\"我们要做缺陷分类，选哪个模型？\"<\/li><li>现有模型不达标时的替代候选调研<\/li><li>与 <a href=\"#/cross-cutting/bailian-cli\">bailian-model-recommend<\/a> 互补：本 skill 覆盖<strong>开源/HF 生态<\/strong>，bailian 覆盖<strong>百炼商用 API<\/strong>——客户问\"开源自部署还是直接买 API\"时两边都要出数<\/li><\/ul>\n<p><strong>不用于<\/strong>：合同已锁定模型的场景（别推翻商业决定）；百炼在售模型选型（→ bailian-model-recommend）；榜单之外需要实测的最终决策（推荐只是假设，→ <a href=\"#/zone-b-build/huggingface-community-evals\">huggingface-community-evals<\/a> 实测）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>推荐 ≠ 测评：把推荐当\"待验证假设\"，在<strong>客户自己的数据<\/strong>上跑 eval 后才写进方案<\/li><li>三查必做：上下文窗口（对得上客户工单/图纸文本长度吗）、许可证（商用/air-gap 是否允许）、硬件需求（客户机房有什么卡）<\/li><li>榜单分数与客户任务分布未必对齐：写清\"推荐依据 + 未覆盖的假设\"，别把 Leaderboard 当真理<\/li><li>输出物固定为对比表：候选 × 上下文/许可/硬件/预估成本，留档进方案书，未来换模型有基线<\/li><li>小模型优先：边缘/内网场景，3B~8B 能过验收就不用 70B（→ <a href=\"#/zone-b-build/huggingface-local-models\">huggingface-local-models<\/a>）<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone A 成功标准定义时的\"模型假设\"一行（谁、哪个尺寸、什么许可）<\/li><li>fde-scope 语料管线的嵌入模型选型（对接 train-sentence-transformers 前的候选筛选）<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-b-build/huggingface-community-evals\">huggingface-community-evals<\/a> · <a href=\"#/zone-b-build/huggingface-local-models\">huggingface-local-models<\/a> · <a href=\"#/cross-cutting/bailian-cli\">bailian-cli 家族（含 model-recommend）<\/a><\/p>"}, {"route": "zone-b-build/huggingface-community-evals", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "<h1>huggingface-community-evals<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（hugging-face 插件 v1.0.0）· 类型：评估执行 · FDE 位点：Zone B validate<\/div>\n<h2>能做什么<\/h2>\n<p>在<strong>本地硬件<\/strong>上对 HF Hub 模型跑评估：<code>inspect-ai<\/code> 与 <code>lighteval<\/code> 两条路线、backend 选型（vLLM / Transformers / accelerate）、GPU 显存适配、任务选择、smoke test 与 backend 回退策略。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>需要拿<strong>公开 benchmark<\/strong>（MMLU/GSM8K/HumanEval/…）给客户证明\"这个模型比那个强\"<\/li><li>现场机器只有消费级 GPU，要选能跑动的 backend 与并发<\/li><li>与 <code>fde_scope.eval<\/code> 的自研业务指标做交叉验证：公开分 + 业务分双证<\/li><\/ul>\n<p><strong>不用于<\/strong>：HF Jobs 云端编排（→ <a href=\"#/zone-c-operationalization/huggingface-llm-trainer\">huggingface-llm-trainer<\/a>）、model-card PR / <code>.eval_results<\/code> 发布自动化（skill 自身声明的边界）、客户私有数据评估（→ 用 <code>fde_scope.eval<\/code>，数据不出机）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>顺序固定：先 smoke test（小样本 5~10 题）打通 backend，再全量——直接全量最容易在显存/依赖上浪费半天<\/li><li>backend 优先级：本地 GPU 大模型用 vLLM，小模型/需要 logits 的用 Transformers，多卡分片用 accelerate<\/li><li>公平比较：不同模型的 chat template / max_gen_toks / few-shot 数必须一致，否则结论无效（现场最常见的坑）<\/li><li>与本项目契约：把外部 benchmark 结果当\"参考量\"，<code>EvalReport<\/code> 的 <code>metrics<\/code> 仍以 <code>fde_scope/eval/metrics.py<\/code> 的业务指标（intent_accuracy / first_contact / adoption / escalation / handle_time_ratio）为准<\/li><li>许可证：商用评估要记录 benchmark 与模型的 license 限制（部分 benchmark 禁止用于商业宣称）<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone B <code>validate<\/code>：模型选型证据链的公开分部分<\/li><li><code>fde_scope/eval/benchmark.py<\/code> 的外部对照；docs/evaluation.md 补强<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-b-build/evaluating-llms-harness\">evaluating-llms-harness<\/a> · <a href=\"#/zone-b-build/phoenix-evals\">phoenix-evals<\/a> · <a href=\"#/zone-b-build/vllm-deploy-docker\">vllm-deploy-docker<\/a><\/p>"}, {"route": "zone-b-build/phoenix-evals", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "📦", "html": "<h1>phoenix-evals 📦<\/h1>\n<div class=\"page-meta\">状态：📦 可安装（未装）· 类型：评估指标开发 · FDE 位点：Zone B validate + Zone C 观测<br>来源：<code>arize-ai/phoenix@phoenix-evals<\/code>（官方 org，repo 11.2K★）· 热度：1.3K installs · https://skills.sh/arize-ai/phoenix/phoenix-evals<br>安全审计：Agent Trust Hub <strong>Pass<\/strong> · Socket <strong>Pass<\/strong> · Snyk <strong>Pass<\/strong>（三项全绿，2026-08-27 复核）<br>安装：<code>npx skills add arize-ai/phoenix@phoenix-evals --directory ~/.qoder/skills -y<\/code><br>说明：早期建档时记为 <code>phoenix-evals-new-metric<\/code>，registry 中不存在该名，已更正为官方真实条目 <code>phoenix-evals<\/code><br>同系列：<code>phoenix-tracing<\/code>（1.4K，观测接入）、<code>phoenix-cli<\/code>（1.4K）<\/div>\n<h2>能做什么<\/h2>\n<p>为 AI/LLM 应用<strong>构建评估器<\/strong>（evaluator）：code-first 规则打分 + LLM-as-judge 处理语义细节，并用人工标注做校验闭环。含 Phoenix 的 evals API 用法、指标编写范式、experiments 对比。<\/p>\n<h2>何时使用<\/h2>\n<ul><li><code>fde_scope/eval/metrics.py<\/code> 只有规则型指标，需要新增<strong>语义类<\/strong>指标（回答是否解决了工单诉求、是否符合客户话术规范）<\/li><li>bad case 规模化挖掘：<code>BadCaseMiner<\/code> 之外想要可复用的 judge 指标库<\/li><li>交付时要给客户一个可持续跑的评估框架，而不是一次性脚本<\/li><\/ul>\n<p><strong>不用于<\/strong>：公开 benchmark 跑分（→ <a href=\"#/zone-b-build/huggingface-community-evals\">huggingface-community-evals<\/a> / <a href=\"#/zone-b-build/evaluating-llms-harness\">evaluating-llms-harness<\/a>）；纯 APM/链路追踪（→ <a href=\"#/zone-c-operationalization/sentry-mcp\">sentry-mcp<\/a>）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>该 skill 三项安全审计全绿且来自官方 org，是本 catalog 里<strong>风险最低的 📦 项之一<\/strong>，可直接安装；仍按规约走一次 <a href=\"#/cross-cutting/skill-criticagent\">skill-criticagent<\/a> 并把结论回填本页<\/li><li>Judge 也是模型：先在同一批样本上做 <strong>human-judge 一致性抽检<\/strong>（skill 的核心主张：\"validate against humans\"），一致率不足就别拿分数对客户讲话<\/li><li>成本：LLM-as-judge 每条样本一次以上调用，1k 数据集评估成本要预估；规则指标能覆盖的不要上 judge<\/li><li>数据边界：judge 用的是外部 LLM 时，客户原文会出境——气隙/合规客户必须换本地 judge（→ <a href=\"#/zone-b-build/vllm-deploy-docker\">vllm-deploy-docker<\/a>）<\/li><li>与本项目整合姿势：把新指标实现为 <code>fde_scope/eval/<\/code> 里的函数并注册进 <code>METRICS<\/code>，不要另起一套评估栈<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone B <code>validate<\/code>：语义指标补齐（intent/话术合规/引用正确性）<\/li><li>Zone C：上线后持续评估与漂移监测的指标来源<\/li><li><code>fde_scope/eval/manufacturing_metrics.py<\/code> 的工业场景语义扩展<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-b-build/huggingface-community-evals\">huggingface-community-evals<\/a> · <a href=\"#/zone-b-build/evaluating-llms-harness\">evaluating-llms-harness<\/a> · <a href=\"#/zone-b-build/rag-agent-builder\">rag-agent-builder<\/a><\/p>"}, {"route": "zone-b-build/evaluating-llms-harness", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "📦", "html": "<h1>evaluating-llms-harness 📦<\/h1>\n<div class=\"page-meta\">状态：📦 可安装（未装）· 类型：评估基准知识 · FDE 位点：Zone B validate<br>来源：<code>firecrawl/ai-research-skills@evaluating-llms-harness<\/code> · 热度：22 installs · repo 17★ · https://skills.sh/firecrawl/ai-research-skills/evaluating-llms-harness<br>安全审计：Agent Trust Hub <strong>Pass<\/strong> · Socket <strong>Pass<\/strong> · Snyk <strong>Warn<\/strong>（2026-08-27 复核）<br>备选：<code>ovachiever/droid-tings@evaluating-llms-harness<\/code>（53 installs，第三方同名）<br>安装：<code>npx skills add firecrawl/ai-research-skills@evaluating-llms-harness --directory ~/.qoder/skills -y<\/code><\/div>\n<h2>能做什么<\/h2>\n<p>EleutherAI <strong>lm-evaluation-harness<\/strong>（<code>lm-eval<\/code>）的用法手册：一条命令在 60+ 学术基准（MMLU / GSM8K / HellaSwag / …）上评估 HF 模型，涵盖 <code>--model hf|vllm<\/code>、task 组合、batch/device 配置、结果解读与自定义 task。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>需要<strong>标准化、可引用<\/strong>的公开分数（客户/评审会拿论文数字对比）<\/li><li>已装 <code>huggingface-community-evals<\/code> 但想在 inspect-ai/lighteval 之外再用 <code>lm-eval<\/code> 交叉核对<\/li><li>需要给自定义评估写新 task（本地化业务基准）时的参考范式<\/li><\/ul>\n<p><strong>不用于<\/strong>：客户工单/产线数据评估（→ <code>fde_scope.eval<\/code> + <a href=\"#/zone-b-build/phoenix-evals\">phoenix-evals<\/a>）；生产回归测试（学术基准不是回归门禁）；只要一个 quick score 时用已装的 <a href=\"#/zone-b-build/huggingface-community-evals\">huggingface-community-evals<\/a> 即可，不必双栈并存。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>⚠️ 定位判断：这是<strong>知识型<\/strong> skill（教 <code>lm-eval<\/code> 用法），不是执行器。装的唯一理由是\"经常要用 lm-eval 且记不住参数矩阵\"。若已覆盖在 huggingface-community-evals 里，<strong>可以不装<\/strong>，避免评估栈碎片化<\/li><li>热度只有 22、repo 17★、Snyk Warn：属于\"内容看着没问题但社区验证薄\"，按规约先过 <a href=\"#/cross-cutting/skill-criticagent\">skill-criticagent<\/a><\/li><li>环境隔离：<code>pip install lm-eval<\/code> 装到独立 venv，它的 transformers 版本约束常与项目主环境冲突<\/li><li>结果可比性：报告分数必须注明 harness 版本 + task 配置 + few-shot 数，否则不同来源的数字混在一起会得出错误结论<\/li><li>离线现场：<code>lm-eval<\/code> 会下载数据集，气隙环境需提前准备离线数据集与 <code>--include_path<\/code><\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone B <code>validate<\/code>：模型选型公开分第二来源<\/li><li>docs/evaluation.md 的 benchmark 章节参考<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-b-build/huggingface-community-evals\">huggingface-community-evals<\/a> · <a href=\"#/zone-b-build/phoenix-evals\">phoenix-evals<\/a> · <a href=\"#/zone-b-build/vllm-deploy-docker\">vllm-deploy-docker<\/a><\/p>"}, {"route": "zone-b-build/huggingface-spaces", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "<h1>huggingface-spaces<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（hugging-face 插件 v1.0.0）· 类型：Demo 托管 · FDE 位点：Zone B prototype / Zone D handoff 演示<\/div>\n<h2>能做什么<\/h2>\n<p>在 Hugging Face Spaces 上构建、部署、维护应用：Gradio / Docker / Static 三种 SDK，ZeroGPU 与专用硬件、模型加载、调试、buckets、inference providers、社区 grants 申请。产物是一个<strong>可分享的公网链接<\/strong>。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>给干系人一个\"点开就能玩\"的 POC 链接（售前比截图有说服力一个量级）<\/li><li>模型/数据集的配套 demo：训练完直接挂 Gradio 演示（配合 lora-space-builder 发 LoRA demo）<\/li><li>团队内轻量工具页：语料抽检、评测结果浏览器<\/li><\/ul>\n<p><strong>不用于<\/strong>：客户真实数据上云（出境/合规不过就别想，→ 本地部署）；生产负载（Spaces 会休眠、无 SLA）；客户内网访问不到外网的演示（准备离线版）；包含客户敏感配置的镜像（公开 Space = 公开代码）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>密钥走 Space secrets，永远不进代码和 requirements；公开 Space 默认一切可见<\/li><li>ZeroGPU 记得 <code>@spaces.GPU<\/code> 装饰，注意配额余量；演示前先自己跑一遍热身<\/li><li>免费 CPU Space 会休眠：<strong>演示当天提前唤醒 + 预热<\/strong>，冷启动 30s+ 足够让干系人失去兴趣<\/li><li>Gradio 热更新迭代快，适合现场按干系人反馈当场改当场看<\/li><li>演示数据一律合成/脱敏；Space 描述里写清\"数据仅用于演示\"<\/li><li>移交阶段把 Space 链接 + 截图 + 归档说明写进交付文档，上游 repo 断更也有据可查<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone D 移交演示：fde-scope 语料管线/评测结果的浏览器 demo<\/li><li>Zone B 验证：让客户方工程师自己在浏览器里复现结论，比口头汇报可信<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-c-operationalization/huggingface-llm-trainer\">huggingface-gradio 相关训练页<\/a> · <a href=\"#/zone-b-build/frontend-design\">frontend-design<\/a> · <a href=\"#/zone-b-build/vercel-deploy\">vercel-deploy<\/a>（另一条 demo 托管路径，适合纯 Web 应用）<\/p>"}, {"route": "zone-b-build/postman", "zone": "Zone B · Build", "zoneId": "zone-b-build", "status": "✅", "html": "<h1>postman<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（Quest Marketplace 插件 postman v1.0.1，MCP 连接器）· 类型：API 生命周期 · FDE 位点：Zone B validate（客户 API 联调）<\/div>\n<h2>能做什么<\/h2>\n<p>Qoder 内的完整 API 生命周期：同步 Collection、生成类型化客户端代码、发现 API、运行测试、创建 Mock、改进文档、安全审计，并分析 API 对 AI Agent 的就绪度。三个 skill 分工：<code>postman-knowledge<\/code>（MCP 工具用法与取舍）、<code>postman-routing<\/code>（把 API 请求路由到正确命令）、<code>agent-ready-apis<\/code>（8 支柱 48 检查的 agent 就绪度评分与整改建议）。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>对接客户 MES/Historian/Zammad/Salesforce 等 REST API <strong>之前<\/strong>：先 Collection + Mock 验证契约，别拿生产环境试错<\/li><li>给 fde-scope 连接器写集成测试：请求/断言沉淀在 Collection 里随回归跑<\/li><li>评估客户 API 对 agent 调用的就绪度（agent-ready-apis 报告可直接当\"给客户的 API 改进清单\"交付物）<\/li><\/ul>\n<p><strong>不用于<\/strong>：工业协议（OPC UA / MQTT / ROS2 不是 HTTP，→ <a href=\"#/zone-b-build/mqtt-development\">mqtt-development<\/a> 与连接器代码）；一次性验证（为一次 curl 建 Collection 是负资产）；客户 API 无 OpenAPI/无文档时先做发现，别凭空猜端点。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>先导入 OpenAPI/抓包生成 Collection，<strong>不要手写请求<\/strong>——手写版本两周后就没人信了<\/li><li>Mock 先行：前端/agent 开发不必等客户排期联调，契约先冻结<\/li><li>environment 变量隔离客户环境（dev/staging/prod），生产密钥绝不进 Collection 文件<\/li><li>断言写进请求的 Tests 标签，Collection Runner 就是免费回归套件<\/li><li>agent-ready-apis 的评分维度（鉴权/分页/幂等/错误语义等）也是我们自己写 API 的检查单<\/li><li>与客户共享前清 Collection 的历史与变量快照，Postman 同步会把敏感值带上去<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>fde_scope/connectors 的 HTTP 类连接器（Zammad / Salesforce / MES REST）联调与契约回归<\/li><li>integrations 模块对外暴露 API 的自检（发布前跑一遍 agent-ready-apis）<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-b-build/mqtt-development\">mqtt-development<\/a> · <a href=\"#/zone-b-build/query\">query<\/a>（数据侧验证） · <a href=\"#/cross-cutting/code-review\">code-review<\/a><\/p>"}, {"route": "zone-c-operationalization/starops", "zone": "Zone C · Operationalization", "zoneId": "zone-c-operationalization", "status": "✅", "html": "<h1>starops<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（starops 插件 v0.1.3）· 类型：AIOps/诊断 · FDE 位点：Zone C operate（有云监控的客户）<\/div>\n<h2>能做什么<\/h2>\n<p>阿里云 STAROps（Agentic Ops）：查指标/APM/trace/日志、服务拓扑与依赖、告警分析与降噪、调用链追踪、影响面分析、k8s/主机诊断、变更守护、故障复盘与恢复建议——通过 STAROps Agent 以自然语言驱动。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>客户已经用阿里云 ARMS/SLS/云监控，上线后出现接口报错、慢请求、告警风暴<\/li><li>需要\"影响面有多大\"这类结论来做客户沟通（不只是\"哪里坏了\"）<\/li><li>变更后守护：判断这次发布是否引入了指标异常<\/li><\/ul>\n<p><strong>不用于<\/strong>：客户自建 Prometheus/Grafana 栈（→ <a href=\"#/zone-c-operationalization/gke-observability\">gke-observability<\/a> 或直接读 Prometheus）；无云监控的离线现场（→ <a href=\"#/zone-c-operationalization/investigate\">investigate<\/a> + 手工日志）；代码级 bug 复现（→ <a href=\"#/zone-c-operationalization/systematic-debugging\">systematic-debugging<\/a>）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>提问题时带上<strong>时间窗 + 服务名 + 现象<\/strong>三要素，否则 agent 会给出泛化结论<\/li><li>把它的根因结论当\"假设\"：要求给出支撑的 trace/指标证据，再落到 runbook<\/li><li>恢复建议要走客户审批，不允许 agent 直接在生产执行写操作<\/li><li>与本项目衔接：SLO 类 gate（<code>slo<\/code> gate）所需的指标取数可以用它，但结论要写进交付文档而不是留在对话里<\/li><li>权限：只读 AK 即可满足大部分诊断，别为排障申请写权限<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone C <code>operationalize<\/code>：SLO 验证与线上异常定位<\/li><li>阿里云客户的交接运维手册（配合 <a href=\"#/zone-b-build/alibabacloud-workbench-cli\">alibabacloud-workbench-cli<\/a>）<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-c-operationalization/investigate\">investigate<\/a> · <a href=\"#/zone-c-operationalization/sentry-mcp\">sentry-mcp<\/a> · <a href=\"#/zone-c-operationalization/sre-runbooks\">sre-runbooks<\/a><\/p>"}, {"route": "zone-c-operationalization/investigate", "zone": "Zone C · Operationalization", "zoneId": "zone-c-operationalization", "status": "✅", "html": "<h1>investigate<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（gstack 插件 v1.58.5 · 该插件共 53 个 skill）· 类型：调试方法论 · FDE 位点：Zone C operate<\/div>\n<h2>能做什么<\/h2>\n<p>GStack（YC CEO Garry Tan 的技能包）里的<strong>根因导向系统排查<\/strong>流程：从现象出发建立可复现证据链，逐步二分/缩小范围，反对\"猜了就改\"。附带同类项：<code>debug<\/code>、<code>qa<\/code>、<code>review<\/code>、<code>health<\/code>、<code>retro<\/code>。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>现场交付环境出现异常但原因不明（数据没进来、指标突然掉了、模型输出变差）<\/li><li>需要一个可写进交接文档的排查过程记录，而不是一次性口头解释<\/li><li>团队/客户方工程师接手前，示范\"怎么查\"<\/li><\/ul>\n<p><strong>不用于<\/strong>：已知原因的小修改（直接改）；纯前端性能问题（→ <a href=\"#/zone-c-operationalization/debug-optimize-lcp\">debug-optimize-lcp<\/a> / <a href=\"#/zone-c-operationalization/web-perf\">web-perf<\/a>）；需要方法论约束的测试失败（→ <a href=\"#/zone-c-operationalization/systematic-debugging\">systematic-debugging<\/a>，superpowers 版更严格）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>先固定\"复现三件套\"：环境、输入、期望 vs 实际，再动代码<\/li><li>排查日志与结论落盘（<code>docs/incidents/<\/code> 或 engagement 记录），这是 Zone C→D 的交接资产<\/li><li>gstack 是<strong>大插件<\/strong>（53 skill、含 browser/headless 工具链），只启用你实际用的几个，避免 skill 路由互相抢触发<\/li><li>与 <code>systematic-debugging<\/code> 二选一拍板：日常代码 bug 用 superpowers 版；现场跨系统排障用 gstack 版。两者都装时要在指令里写明优先级<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone C operate：现场故障与数据异常定位<\/li><li><code>fde_scope/connectors/<\/code> 排障（连接器拿到空数据/超时）<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-c-operationalization/systematic-debugging\">systematic-debugging<\/a> · <a href=\"#/zone-c-operationalization/starops\">starops<\/a> · <a href=\"#/zone-c-operationalization/chrome-devtools\">chrome-devtools<\/a><\/p>"}, {"route": "zone-c-operationalization/systematic-debugging", "zone": "Zone C · Operationalization", "zoneId": "zone-c-operationalization", "status": "✅", "html": "<h1>systematic-debugging<\/h1>\n<div class=\"page-meta\">状态：✅ 已安装（superpowers 插件 v5.1.0）· 类型：方法论/流程约束 · FDE 位点：Zone B test + Zone C operate<\/div>\n<h2>能做什么<\/h2>\n<p>遇到任何 bug、测试失败、非预期行为时，<strong>在提出修复之前<\/strong>强制走完整流程：复现 → 定位（读代码/加日志/二分）→ 假设 → 最小验证 → 修复 → 回归。是 superpowers 全家桶里对交付质量最有杠杆的一个。<\/p>\n<h2>何时使用<\/h2>\n<ul><li>任何\"看起来是 X 问题所以改一下 X\"的冲动出现时——这就是它的触发点<\/li><li>测试失败但你不确信是测试错还是实现错<\/li><li>现场环境只有只读权限、不能试错时（先推理再动）<\/li><\/ul>\n<p><strong>不用于<\/strong>：纯需求变更（不是 bug）；性能调优（→ <a href=\"#/zone-c-operationalization/web-perf\">web-perf<\/a> / <a href=\"#/zone-c-operationalization/debug-optimize-lcp\">debug-optimize-lcp<\/a>）；跨系统监控类排障（→ <a href=\"#/zone-c-operationalization/investigate\">investigate<\/a>）。<\/p>\n<h2>最佳实践<\/h2>\n<ul><li>与 <a href=\"#/cross-cutting/using-superpowers-family\">test-driven-development<\/a> 配套：先用失败测试固化 bug，再修<\/li><li>写下\"当前假设 + 证伪方式\"再继续，避免无限层猜测<\/li><li>一次只改一个变量；改完没解决要<strong>回滚<\/strong>再换假设，不要叠加改动（最容易造成\"看起来修好了\"）<\/li><li>修复后补一条能防止复现的测试，交付项目里这是客户信任的基础<\/li><li>Don't：不要在该 skill 的流程里顺手重构——把重构和修 bug 分成两个提交<\/li><\/ul>\n<h2>项目应用位点<\/h2>\n<ul><li>Zone B <code>build/test<\/code>：<code>tests/<\/code> 下任何失败的处理规范<\/li><li>Zone C：连接器/评估指标异常的定位流程（配合 <a href=\"#/zone-c-operationalization/investigate\">investigate<\/a>）<\/li><\/ul>\n<h2>相关<\/h2>\n<p><a href=\"#/zone-c-operationalization/investigate\">investigate<\/a> · <a href=\"#/zone-c-operationalization/troubleshooting\">troubleshooting<\/a> · <a href=\"#/cross-cutting/using-superpowers-family\">using-superpowers-family<\/a><\/p>"}, {"route": "zone-c-operationalization/troubleshooting", "zone": "Zone C · Operationalization", "zoneId": "zon
