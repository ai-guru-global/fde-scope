 {"route": "cross-cutting/security-scan", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "✅", "html": "\u003ch1>security-scan\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（Qoder 内置插件包 qoder-bundler/security-scan）· 类型：安全门禁 · FDE 位点：横切（推送/发布前）\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>Qoder 安全扫描：全仓库或指定路径的云端扫描，分 \u003cstrong>L2 轻量\u003c/strong> 与 \u003cstrong>L3 深度\u003c/strong> 两档；在 push / 开 PR / 发布 / 部署等&quot;把手提交给外部&quot;的节点上会被要求先提供 L3 深度评审。修复批准需单独确认（不会因上次扫描通过而默认授权）。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>任何 \u003ccode>git push\u003c/code>、开 PR/MR、release、deploy 之前\u003c/li>\u003cli>交付包出件前的最后一道安全体检（客户安全部门常要求）\u003c/li>\u003cli>新增连接器/凭据处理/子进程执行（\u003ccode>fde_scope/integrations/subprocess_runner.py\u003c/code>）之后\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：替代 \u003ca href=\"#/cross-cutting/code-review\">code-review\u003c/a> 的逻辑评审；渗透测试与红队（那是人工/专业服务）；依赖许可证合规审查（另有工具链）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说 \u003ccode>/security-scan\u003c/code>，或在 \u003ccode>git push\u003c/code> / 开 PR/MR / merge / release / deploy 前被自动要求先过 L3 深度评审（skill 描述明确列出这些动作）\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：裸敲 \u003ccode>/security-scan\u003c/code> 会弹固定三选一——L3 深度扫描 / L2 轻量扫描 / 项目与文件扫描：日常小改动选 L2，涉及认证、凭据、子进程、部署配置选 L3；要按路径扫描就选「项目与文件扫描」并给出明确路径（全仓库才用 \u003ccode>--all\u003c/code>）\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：云端扫描有 10000 行代码的规模上限，超限直接提示不支持，不要自行拆分/缩小范围重试；扫描常需数分钟且中途无输出，别当成卡死中断重跑\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：修复批准必须单独确认——上次扫描通过不会默认授权修下次的发现；扫描结果是候选不是事实，逐条判真/误报\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>档位选择：日常小改动 L2；涉及认证、凭据、外部输入、子进程、部署配置一律 L3\u003c/li>\u003cli>扫描结果是\u003cstrong>候选\u003c/strong>，不是事实：逐条判定真/误报，误报要在项目里记录理由并做规则抑制\u003c/li>\u003cli>交付敏感项优先级：硬编码凭据 &gt; 越权/路径穿越 &gt; 反序列化/子进程注入 &gt; 依赖漏洞（本仓库靠环境变量注入密钥，扫描最该确认的是&quot;没有绕过 env 的地方&quot;）\u003c/li>\u003cli>不把扫描报告原文交给客户前先看是否含内部路径/凭据样例，必要时脱敏\u003c/li>\u003cli>与 fde-scope gate 结合：安全类发现应写入对应阶段的 gate 证据，而不是散在对话里\u003c/li>\u003cli>一次修复只做一类改动，便于回归与审计追溯\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>横切：Zone B→C 发布门禁、Zone D 交付前体检\u003c/li>\u003cli>制造业客户的功能安全/合规语境（配合 \u003ccode>engagement/gates/functional_safety.py\u003c/code>、\u003ccode>conformity.py\u003c/code>）\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/cross-cutting/code-review\">code-review\u003c/a> · \u003ca href=\"#/cross-cutting/architecture-visualization-suite\">risk-quality-reviewer\u003c/a> · \u003ca href=\"#/zone-b-build/kubernetes-specialist\">kubernetes-specialist\u003c/a>\u003c/p>"}, {"route": "cross-cutting/writing-plans", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "✅", "html": "\u003ch1>writing-plans\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（superpowers 插件 v5.1.0）· 类型：流程纪律 · FDE 位点：横切（多步任务开始前）\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>在动手写代码之前产出\u003cstrong>可执行计划\u003c/strong>：任务分解、步骤粒度（2~5 分钟一步）、文件路径、验证点、回滚位点，并保存为文档供后续评审与执行（默认存 \u003ccode>docs/superpowers/plans/\u003c/code>）。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>任何 3 步以上的任务：新连接器、迁移、批量文档重构、现场部署脚本\u003c/li>\u003cli>需要客户/同事评审&quot;你打算怎么做&quot;的时候（交付场景里这是信任来源）\u003c/li>\u003cli>上下文即将切换或多轮会话推进同一任务（计划就是持久化的意图）\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：单步小改动（直接做）；探索性原型（先 \u003ca href=\"#/zone-a-pre-engagement/brainstorming\">brainstorming\u003c/a> 再回来）；已有计划要执行（→ \u003ca href=\"#/cross-cutting/executing-plans\">executing-plans\u003c/a>）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说「用 writing-plans 把这个需求写成实施计划」——SKILL.md 触发描述是&quot;有 spec/需求、动代码之前&quot;（3 步以上的任务就该用它）\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：产物落盘到 \u003ccode>docs/superpowers/plans/YYYY-MM-DD-&lt;feature-name&gt;.md\u003c/code>；计划由 2~5 分钟粒度的步骤组成（写失败测试 → 跑它确认失败 → 最小实现 → 跑通过 → commit），开头必须带固定头（Goal / Architecture / Tech Stack / Global Constraints + REQUIRED SUB-SKILL 行）\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：每个步骤必须写验证方式（跑什么命令、期望什么输出）——没有验证点的计划无法判定完成；spec 覆盖多个独立子系统时必须拆成多份计划，每份单独产出可测试的软件\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：计划头是固定模板不是可选项——漏掉它，\u003ccode>executing-plans\u003c/code> / \u003ccode>subagent-driven-development\u003c/code> 就不知道按哪个 skill 接手执行\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>步骤要含\u003cstrong>验证方式\u003c/strong>（跑什么命令、期望什么输出），否则计划无法判定完成\u003c/li>\u003cli>计划里显式标注&quot;需要人工确认&quot;的节点（生产变更、客户环境写操作、删数据）\u003c/li>\u003cli>粒度宁细勿粗：粗计划在执行时会被迫即兴决策，即兴决策就是风险\u003c/li>\u003cli>与本项目工作流对齐：复杂任务用 Plan 模式产出 plan 文件，Agent 模式执行；跨会话续做时先读 plan\u003c/li>\u003cli>计划不是合同：发现假设错了要改计划并留痕，不要悄悄偏离\u003c/li>\u003cli>大计划要拆分：一次会话只推进一个可验证的子计划\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>横切：本 catalog 自身的建设就是按&quot;计划 → 分批执行 → 校验&quot;跑完的\u003c/li>\u003cli>Zone B：连接器/评估改造的实施计划载体\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/cross-cutting/executing-plans\">executing-plans\u003c/a> · \u003ca href=\"#/zone-a-pre-engagement/brainstorming\">brainstorming\u003c/a> · \u003ca href=\"#/cross-cutting/using-superpowers-family\">using-superpowers-family\u003c/a>\u003c/p>"}, {"route": "cross-cutting/executing-plans", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "✅", "html": "\u003ch1>executing-plans\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（superpowers 插件 v5.1.0）· 类型：流程纪律 · FDE 位点：横切\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>按已评审的计划执行：\u003cstrong>分阶段推进 + 评审检查点\u003c/strong>（每完成一段就停下来核对，而不是闷头跑完），配合 todo 跟踪与验证门（完成前必须有证据）。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>有 \u003ca href=\"#/cross-cutting/writing-plans\">writing-plans\u003c/a> 产出的计划文件要落地\u003c/li>\u003cli>任务跨越多个会话/多天（防止上下文丢失后重复或漏做）\u003c/li>\u003cli>需要在客户/团队面前展示进度与可验证性\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：没有计划的小改动；探索性试验（会破坏&quot;按计划执行&quot;的前提）；纯调研（→ \u003ca href=\"#/zone-a-pre-engagement/firecrawl-search\">research-*\u003c/a> 系列）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：有一份已写好的计划要落地，对 agent 说「用 executing-plans 执行 &lt;plan 文件&gt;」——SKILL.md 触发描述是&quot;有书面实施计划、带评审检查点地在独立会话执行&quot;\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：它先批判性通读计划、有疑问先向人提出，然后逐任务勾选执行（每步照计划跑、按计划跑验证）；宿主有子 agent 能力时会建议改走 \u003ccode>subagent-driven-development\u003c/code>\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：遇阻塞（缺依赖、测试失败、指令不明）立即停下问人，禁止靠猜推进；验证反复失败同样是停止条件——&quot;强行穿过 blocker&quot;是 skill 明令禁止的行为\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：未经用户明确同意不得在 main/master 上直接实施（&quot;Never start implementation on main/master branch without explicit user consent&quot;）；开工前先用 using-git-worktrees 确认隔离工作区，收尾走 \u003ccode>finishing-a-development-branch\u003c/code>\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>执行前先把计划读进来再动手，别凭上一轮的记忆\u003c/li>\u003cli>每个检查点做三件事：跑验证命令 → 对照计划验收标准 → 更新状态（不要&quot;看起来做完了&quot;）\u003c/li>\u003cli>偏离计划要显式记录偏离原因和后续动作，不能悄悄改路线\u003c/li>\u003cli>遇到阻塞：先诊断再决定（换方案 / 问用户 / 停下），不要靠猜继续推进\u003c/li>\u003cli>与 \u003ca href=\"#/cross-cutting/using-superpowers-family\">verification-before-completion\u003c/a> 绑定：没有验证证据不宣称完成——这条纪律在交付场景能救命\u003c/li>\u003cli>现场适用性：客户环境里的写操作阶段，检查点必须包含&quot;客户确认&quot;这一步\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>横切：多阶段交付任务（如连接器扩展 + 评估改造 + 文档同步）的执行框架\u003c/li>\u003cli>Zone C/D：分批推进交接清单时的进度控制器\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/cross-cutting/writing-plans\">writing-plans\u003c/a> · \u003ca href=\"#/cross-cutting/using-superpowers-family\">using-superpowers-family\u003c/a> · \u003ca href=\"#/cross-cutting/dispatching-parallel-agents\">dispatching-parallel-agents\u003c/a>\u003c/p>"}, {"route": "cross-cutting/dispatching-parallel-agents", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "✅", "html": "\u003ch1>dispatching-parallel-agents\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（superpowers 插件 v5.1.0）· 类型：并行调度 · FDE 位点：横切\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>面对 2 个以上\u003cstrong>互相独立\u003c/strong>的任务，派发多个并行 agent 各管一个（各自完整上下文、互不污染），再汇总结果；也可用于探索/验证并行的场景。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>多个模块互不相关的改造（例：给 3 个 connector 分别补测试）\u003c/li>\u003cli>同时需要&quot;调研 A + 验证 B + 起草 C&quot;且三者无依赖\u003c/li>\u003cli>大范围代码库分析：分区并行比单线扫更快\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：有共享状态/会改同一文件的任务（会冲突）；顺序依赖强的流程（→ \u003ca href=\"#/cross-cutting/executing-plans\">executing-plans\u003c/a>）；需要保持推理链连续的单任务（拆分会丢上下文）；任何生产写操作（并行执行事故面更大）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：面对 2 个以上互不依赖的任务，对 agent 说「这几个任务并行派发」——SKILL.md 触发描述是&quot;2+ independent tasks, no shared state, no sequential dependencies&quot;\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：先按问题域分组（例：3 个测试文件各有独立根因 → 3 个子 agent），然后在\u003cstrong>同一轮回复\u003c/strong>里发出全部派发——SKILL.md 原话：&quot;Multiple dispatch calls in one response = parallel execution. One per response = sequential&quot;（分多条消息发就退化成串行）\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：子 agent 不继承你的会话上下文，每个指令必须自带完整范围 / 目标 / 约束 / 期望输出——只说&quot;修好它&quot;会得到跑偏的产出\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：任务共享状态或会改同一文件时禁止并行（互相干扰）；全部返回后要人工读摘要、验证互不冲突并跑全量测试，不能只看各份汇报\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>派发前三问：有重叠改动吗？有顺序依赖吗？结果能独立验收吗？任一为&quot;否&quot;就别并行\u003c/li>\u003cli>每个子任务给\u003cstrong>明确边界\u003c/strong>：只碰哪些文件、成功判据是什么、不要越界改别的\u003c/li>\u003cli>用 \u003ca href=\"#/cross-cutting/using-git-worktrees\">using-git-worktrees\u003c/a> 做物理隔离，避免多 agent 抢同一工作树\u003c/li>\u003cli>汇总阶段人工过一遍：并行的产出风格/假设可能不一致，合并就是统一的机会\u003c/li>\u003cli>并行数控制在能审得过来的量（一般 2~3），并行不是越多越好\u003c/li>\u003cli>成本注意：每个并行 agent 都吃一份上下文，重复的检索会放大 token 消耗\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>横切：多场景（ticket / manufacturing）并行推进时的调度方式\u003c/li>\u003cli>本 catalog 建设即属可并行类型（按 Zone 分批、彼此无文件冲突）\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/cross-cutting/using-git-worktrees\">using-git-worktrees\u003c/a> · \u003ca href=\"#/cross-cutting/executing-plans\">executing-plans\u003c/a> · \u003ca href=\"#/cross-cutting/using-superpowers-family\">using-superpowers-family\u003c/a>\u003c/p>"}, {"route": "cross-cutting/using-git-worktrees", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "✅", "html": "\u003ch1>using-git-worktrees\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（\u003ccode>~/.qoder/skills/using-git-worktrees\u003c/code>，亦随 superpowers 插件 v5.1.0 分发）· 类型：工作区隔离 · FDE 位点：横切（Zone B 实施 / 横切调度）\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>在动手改代码前，确保工作发生在一个\u003cstrong>隔离工作区\u003c/strong>：优先用平台原生 worktree 工具，没有才回退到 \u003ccode>git worktree add\u003c/code>。流程固定为「检测已有隔离 → 征求同意 → 建区 → 装依赖 → 跑基线测试」，核心原则是 \u003cstrong>先检测、再原生、最后 git 兜底，绝不跟 harness 抢管理\u003c/strong>。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>开始一项 feature 改造，而当前分支上有未收口的东西（客户现场分支尤其危险）\u003c/li>\u003cli>执行实现计划前（→ \u003ca href=\"#/cross-cutting/executing-plans\">executing-plans\u003c/a>），需要一条干净的对照基线\u003c/li>\u003cli>并行派发多个 agent 改同一仓库（→ \u003ca href=\"#/cross-cutting/dispatching-parallel-agents\">dispatching-parallel-agents\u003c/a>），必须有物理隔离\u003c/li>\u003cli>想在客户 repo 上做实验性修复，但不能污染交付分支\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：只读分析、答疑、生成文档（不写代码就别开销）；已经在 linked worktree 里（先检测，别套娃再建一层）；submodule 内部——\u003ccode>GIT_DIR != GIT_COMMON\u003c/code> 在 submodule 里同样成立，要用 \u003ccode>git rev-parse --show-superproject-working-tree\u003c/code> 排除误判。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：开工前对 agent 说「建一个隔离工作区」或「先起个 worktree」——SKILL.md 触发描述是&quot;starting feature work that needs isolation… or before executing implementation plans&quot;\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：它先检测再动手：比对 \u003ccode>git rev-parse --git-dir\u003c/code> 与 \u003ccode>--git-common-dir\u003c/code>，两者不等说明已在 worktree 里（直接复用，不套娃）；确认要新建时优先用平台原生工具（\u003ccode>EnterWorktree\u003c/code> / \u003ccode>/worktree\u003c/code> / \u003ccode>--worktree\u003c/code>），没有才回退 \u003ccode>git worktree add\u003c/code>\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：submodule 里 \u003ccode>GIT_DIR != GIT_COMMON\u003c/code> 同样成立，会误判成&quot;已在 worktree&quot;——必须用 \u003ccode>git rev-parse --show-superproject-working-tree\u003c/code> 排除\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：project-local 的 \u003ccode>.worktrees/\u003c/code> 建前必须 \u003ccode>git check-ignore -q .worktrees\u003c/code> 验证已被 gitignore——没忽略就先加 ignore 再提交，否则 worktree 内容会被误提交进仓库；建区后装依赖 + 跑基线测试两步不能省，基线红了先报告\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>同意优先\u003c/strong>：用户没表达过 worktree 偏好时，先问一句&quot;要不要建隔离工作区&quot;；已经声明过偏好就直接执行，不重复问\u003c/li>\u003cli>有原生工具（如 \u003ccode>EnterWorktree\u003c/code> / \u003ccode>/worktree\u003c/code> 命令 / \u003ccode>--worktree\u003c/code> 标志）就必须用它——手动 \u003ccode>git worktree add\u003c/code> 会造出 harness 看不见的&quot;幽灵状态&quot;，清理时踩坑\u003c/li>\u003cli>project-local 目录默认 \u003ccode>.worktrees/\u003c/code>；\u003cstrong>建之前强制验证被 gitignore\u003c/strong>（\u003ccode>git check-ignore -q .worktrees\u003c/code>），没忽略就先加 ignore 再提交——否则 worktree 内容会被误提交进仓库\u003c/li>\u003cli>建区后两件事不能省：装依赖（按 \u003ccode>package.json\u003c/code>/\u003ccode>pyproject.toml\u003c/code> 自动识别）+ 跑基线测试。\u003cstrong>基线红了就先报告，别带着失败继续改\u003c/strong>，否则无法区分&quot;我改坏的&quot;和&quot;本来就坏的&quot;\u003c/li>\u003cli>沙箱拒绝 \u003ccode>git worktree add\u003c/code> 时如实说明并就地工作，不要静默降级\u003c/li>\u003cli>收尾走 superpowers 的 \u003ccode>finishing-a-development-branch\u003c/code>（合并/PR/丢弃三选一，见 \u003ca href=\"#/cross-cutting/using-superpowers-family\">using-superpowers-family\u003c/a>），别留一堆游离 worktree\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>fde-scope 分支纪律：\u003ccode>connectors/\u003c/code> 大改与 \u003ccode>pawapp/\u003c/code> 适配属于互不影响的两条线，适合各占一个 worktree，避免 \u003ccode>git status\u003c/code> 混污\u003c/li>\u003cli>客户现场：在客户 repo 上验证&quot;猜测型修复&quot;时先建 worktree，保证随时能整块丢弃——比 \u003ccode>git stash\u003c/code> 可靠，也不会因为 IDE 自动恢复而串味\u003c/li>\u003cli>本 catalog 的批量建档（按 Zone 分批写文件、互不冲突）就是典型的&quot;可并行 + 宜隔离&quot;任务\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/cross-cutting/executing-plans\">executing-plans\u003c/a> · \u003ca href=\"#/cross-cutting/dispatching-parallel-agents\">dispatching-parallel-agents\u003c/a> · \u003ca href=\"#/cross-cutting/writing-plans\">writing-plans\u003c/a> · \u003ca href=\"#/cross-cutting/using-superpowers-family\">using-superpowers-family\u003c/a> · \u003ca href=\"#/cross-cutting/gstack-suite\">gstack-suite\u003c/a>（\u003ccode>freeze\u003c/code>/\u003ccode>guard\u003c/code> 是另一类&quot;防误改&quot;机制）\u003c/p>"}, {"route": "cross-cutting/schedule", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "✅", "html": "\u003ch1>schedule\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 平台内置（随 Qoder 客户端注入，\u003cstrong>不在\u003c/strong> \u003ccode>~/.qoder/skills/\u003c/code> 下，无本地文件可改）· 类型：定时/周期任务 · FDE 位点：横切（Zone C 运维节奏）\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>用\u003cstrong>唯一一套调度引擎\u003c/strong>创建、更新、列出、推进、取消计划任务。四类语义：\u003c/p>\n\u003cul>\u003cli>\u003ccode>at\u003c/code> —— 一次性，未来某具体时刻（必须给具体 datetime + 时区）\u003c/li>\u003cli>\u003ccode>every\u003c/code> —— 固定间隔重复\u003c/li>\u003cli>\u003ccode>cron\u003c/code> —— cron 表达式周期\u003c/li>\u003cli>\u003ccode>until\u003c/code> —— 有明确终止条件的每日唤醒（&quot;直到 X 完成为止，每天看一次&quot;）\u003c/li>\u003c/ul>\n\u003cp>时间戳由模型自己换算，不接受&quot;明天下午吧&quot;这种模糊表达直接落库。\u003cstrong>关键纪律：任何&quot;稍后 / 定时 / 周期 / 到点做 X&quot;的需求都走这里，不要自己写 cron、不要造 in-agent 轮询循环。\u003c/strong>\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>每日/每周交付节奏物：日报、周度指标巡检、gate 状态提醒\u003c/li>\u003cli>有终点的持续观察：客户系统上线后&quot;连续 7 天每天检查错误率，达标即停&quot;\u003c/li>\u003cli>把一次性任务变成周期巡检：季度 catalog 巡检（本手册库维护规约第 2 条）就该挂 \u003ccode>cron\u003c/code>\u003c/li>\u003cli>长任务托管的本地触发端：到点后由 agent 去做，而不是人守着\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：\u003cstrong>网页内容变更监测\u003c/strong> → \u003ca href=\"#/zone-c-operationalization/firecrawl-monitor\">firecrawl-monitor\u003c/a>（它自带 diff + AI judge + webhook 告警，比&quot;定时抓一遍再人看&quot;省得多）；\u003cstrong>需要合上笔记本仍然继续跑\u003c/strong>的任务 → \u003ca href=\"#/cross-cutting/cloud-agents\">cloud-agents\u003c/a>（本地调度依赖客户端在线，云端 agent 才与本机解耦）；单纯记录一个提醒（用日历，别占用 agent 额度）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：直接说「每天早上 9 点帮我……」「连续 7 天每天检查一次错误率，达标即停」「下周三下午提醒我」——一切&quot;稍后 / 定时 / 周期 / 到点做 X&quot;都走这套调度引擎，不要自己写 cron 或造轮询循环\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：把任务 + 终止条件 + 时区一次说清：「每天 09:00（UTC+8）汇总 gate 临期清单，连续 14 天或全部清零即停」；四类语义 \u003ccode>at\u003c/code>（一次性）/ \u003ccode>every\u003c/code>（固定间隔）/ \u003ccode>cron\u003c/code>（表达式周期）/ \u003ccode>until\u003c/code>（有终点的每日唤醒）由 agent 按语义选\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：不接受&quot;明天下午吧&quot;这类模糊表达直接落库——必须落到具体日期时间；时区不写死在任务里（客户在 UTC+8 还是 UTC+1 车间班表），告警时点就全错\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：没有退出标准的周期任务是永动的 token 黑洞——先问终止条件再建；改动走 \u003ccode>update\u003c/code> 而不是&quot;取消 + 新建&quot;，否则丢历史执行记录\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>先问终止条件\u003c/strong>：周期任务默认要有退出标准和复查日期，否则就是永动的 token 黑洞\u003c/li>\u003cli>时区写死在任务里（客户在 UTC+8 还是 UTC+1 车间班表，直接影响告警是否有意义）\u003c/li>\u003cli>一个任务只做一件事、只发一份产出；把&quot;检查 + 判断 + 通知&quot;三段都写清，避免每次自由发挥\u003c/li>\u003cli>与 goal 的配合：创建成功后可以把当前目标置为 paused，唤醒时再恢复——不要同时挂多个语义重叠的周期任务\u003c/li>\u003cli>成本护栏：\u003ccode>every\u003c/code> 间隔小于 10 分钟要质疑必要性；巡检类宁可 cron 定时点，不要高频轮询\u003c/li>\u003cli>失败可见：任务产出要落到能被看见的地方（文档/表格/工单），而不是只在会话里说过一次\u003c/li>\u003cli>变更走 \u003ccode>update\u003c/code>，不要&quot;取消 + 新建&quot;，否则丢失历史执行记录\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone C：SLO 达成周期复查、飞轮数据回流（\u003ccode>fde_scope/flywheel/\u003c/code>）的定期 reflow\u003c/li>\u003cli>Zone A/B：gate 临期提醒（10 个 gate 中若干需要客户方书面回复，需要盯时限）\u003c/li>\u003cli>本 catalog 维护：季度 \u003ccode>npx skills check\u003c/code> 巡检、📦 项审计复核，都应成为带终止条件的周期任务而不是&quot;想起来再做&quot;\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/cross-cutting/cloud-agents\">cloud-agents\u003c/a> · \u003ca href=\"#/zone-c-operationalization/firecrawl-monitor\">firecrawl-monitor\u003c/a> · \u003ca href=\"#/zone-c-operationalization/sre-runbooks\">sre-runbooks\u003c/a> · \u003ca href=\"#/cross-cutting/dispatching-parallel-agents\">dispatching-parallel-agents\u003c/a>\u003c/p>"}, {"route": "cross-cutting/cloud-agents", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "✅", "html": "\u003ch1>cloud-agents\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（\u003cstrong>两个\u003c/strong>插件并存，用途不同）· 类型：云端常驻 agent · FDE 位点：横切（Zone B 长任务 / Zone C 无人值守）\u003cbr>- \u003ccode>cloud-agents\u003c/code> v1.1.0（作者 Qoder）→ **REST / \u003ccode>bl\u003c/code>-style curl 直连** CAS API，PAT 鉴权 · \u003ccode>~/.qoder/plugins/cache/qoder-marketplace/cloud-agents/1.1.0\u003c/code>\u003cbr>- \u003ccode>qoder-cloud-agents\u003c/code> v0.1.0（作者 Qoder）→ \u003cstrong>官方 MCP 连接器\u003c/strong>驱动（本机会话实测 82 个工具，覆盖 agents/environments/sessions/files/vaults/memories/deployments/skills），身份由 Gateway 注入 · \u003ccode>~/.qoder/plugins/cache/qoder-marketplace/qoder-cloud-agents/0.1.0\u003c/code>（含 \u003ccode>mcp.json\u003c/code>）\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>在 Cloud Agents 平台的容器里创建并运行 agent，\u003cstrong>与本地机器解耦\u003c/strong>：合上笔记本它继续跑、可按计划跑、可被脚本与 CI 调起、可封装成团队共享的一个 API。核心资源模型：\u003ccode>agent_\u003c/code> / \u003ccode>sess_\u003c/code> / \u003ccode>env_\u003c/code> / \u003ccode>evt_\u003c/code> / \u003ccode>file_\u003c/code> / \u003ccode>mem_store_\u003c/code> / \u003ccode>skill_\u003c/code>，支持会话消息、SSE 事件流、文件/记忆/技能上传。\u003c/p>\n\u003cp>本地装 skill 只服务装在谁电脑上；云端 agent 是\u003cstrong>一个共享服务，全团队用同一个 API 调\u003c/strong>——这是它相对本地 skill 的本质差异。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>长任务托管\u003c/strong>：大代码库分析、批量语料处理（本地不必一直在线）\u003c/li>\u003cli>\u003cstrong>定时/常驻自动化\u003c/strong>：日报、周期巡检（与 \u003ca href=\"#/cross-cutting/schedule\">schedule\u003c/a> 的分工：本地调度靠客户端醒着，云端调度靠平台）\u003c/li>\u003cli>\u003cstrong>高风险代码沙箱执行\u003c/strong>：客户现场脚本/未知数据解析放 disposable 容器，炸了也碰不到真机\u003c/li>\u003cli>\u003cstrong>接入系统/CI\u003c/strong>：PAT + curl/SDK 就是一个可调用的 AI 后端\u003c/li>\u003cli>\u003cstrong>团队共享工具\u003c/strong>：给客户 IT 或同事一个入口，而不是挨个装插件\u003c/li>\u003c/ul>\n\u003cp>选哪个入口：**明确要 MCP 工具（\u003ccode>list_models\u003c/code>/\u003ccode>create_agent\u003c/code>/\u003ccode>create_session\u003c/code>/\u003ccode>send_session_events\u003c/code>/\u003ccode>run_deployment\u003c/code>）、或宿主环境要求托管身份 → \u003ccode>qoder-cloud-agents\u003c/code>**；要写脚本、进 CI、自己管 PAT、直连 REST → \u003ccode>cloud-agents\u003c/code>。\u003c/p>\n\u003cp>\u003cstrong>不用于\u003c/strong>：用户明确说要本地 Qoder CLI 或自托管 agent；一次性小任务（开云端会话的固定开销不划算）；需要读客户内网资源的任务（云端容器不在客户网络里，除非走 \u003ca href=\"#/zone-b-build/alibabacloud-workbench-cli\">alibabacloud-workbench-cli\u003c/a> 那类跳板）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：说「创建一个 cloud agent」「把任务丢给云端跑」「合上电脑也要继续跑」——触发词覆盖 &quot;cloud agent / remote agent / background agent / always-on agent&quot;；明确要本地 Qoder CLI 或自托管 agent 时跳过\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：在 https://qoder.com/cloud/pat-keys 创建 PAT（请求带 \u003ccode>Authorization: Bearer &lt;PAT&gt;\u003c/code>，Base URL \u003ccode>https://api.qoder.com/api/v1/cloud\u003c/code>），按核心流程走：\u003ccode>POST /environments\u003c/code> 建环境 → \u003ccode>POST /agents\u003c/code> → \u003ccode>POST /sessions\u003c/code> → \u003ccode>POST /sessions/{id}/events\u003c/code> 发消息，等 \u003ccode>session.status_idle\u003c/code> 再发下一轮\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：新账号没有默认 environment——不先 \u003ccode>POST /environments\u003c/code>（body 必须含 \u003ccode>&quot;config&quot;: {&quot;type&quot;:&quot;cloud&quot;,&quot;networking&quot;:{&quot;type&quot;:&quot;unrestricted&quot;}}\u003c/code>，只发 \u003ccode>{name}\u003c/code> 返回 400）直接起会话必失败，这是最常见的入门坑\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：\u003ccode>POST /sessions\u003c/code> 的字段名是 \u003ccode>agent\u003c/code> 不是 \u003ccode>agent_id\u003c/code>（否则 400）；消息必须包在 \u003ccode>{&quot;events&quot;:[…]}\u003c/code> 数组里；模型名用 \u003ccode>ultimate\u003c/code>（其他名字可能 \u003ccode>session.error\u003c/code>）；首轮事件有 5-60 秒容器冷启动，别过早判超时\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>新账号没有默认 environment\u003c/strong>：起会话前必须先 \u003ccode>POST /environments\u003c/code>，否则直接失败——这是最常见的入门坑\u003c/li>\u003cli>REST 侧鉴权：\u003ccode>Authorization: Bearer &lt;PAT&gt;\u003c/code>，PAT 在 https://qoder.com/cloud/pat-keys 创建；Base URL \u003ccode>https://api.qoder.com/api/v1/cloud\u003c/code>\u003c/li>\u003cli>\u003cstrong>MCP 侧绝不要自己拼 HTTP\u003c/strong>：用发现到的逻辑工具名，输入是扁平 JSON（不要包 \u003ccode>path\u003c/code>/\u003ccode>query\u003c/code>/\u003ccode>body\u003c/code>），并先读该工具的 live \u003ccode>inputSchema\u003c/code>\u003c/li>\u003cli>MCP 侧\u003cstrong>不要\u003c/strong>送 PAT/SAT/Authorization/user ID/Gateway header——由 Gateway 供给；缺能力时如实说明并问用户，\u003cstrong>不要静默回落到 REST 或 curl\u003c/strong>\u003c/li>\u003cli>分页三选一：\u003ccode>page\u003c/code> / \u003ccode>after_id\u003c/code> / \u003ccode>before_id\u003c/code> 只用一个；\u003ccode>next_page\u003c/code> 只能再当 \u003ccode>page\u003c/code> 用，别当数字\u003c/li>\u003cli>大数据集走 Files API 挂成 session 资源让容器内读盘，别把内容塞进消息\u003c/li>\u003cli>\u003cstrong>破坏性操作清单\u003c/strong>（MCP 契约明示）：\u003ccode>delete_session\u003c/code> 连事件一起删；\u003ccode>delete_vault\u003c/code> 连带删所有凭据；被引用过的 environment 常删不掉 → 用 archive；agent/deployment 只有 archive 无 delete\u003c/li>\u003cli>不自动批准 \u003ccode>agent.tool_use\u003c/code>：先展示动作，确认覆盖到它才发 \u003ccode>user.tool_confirmation\u003c/code>\u003c/li>\u003cli>成本与凭据：常驻 agent 每次唤醒都算 token；PAT 只放环境变量/密钥管理，\u003cstrong>绝不写进仓库或 catalog 文档\u003c/strong>\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone B：批量语料的长时处理、\u003ca href=\"#/zone-b-build/bailian-train-deploy\">bailian-train-deploy\u003c/a> 训练等待期的异步盯守\u003c/li>\u003cli>Zone C：客户侧定时报表与巡检的&quot;不依赖我笔记本&quot;执行端；配合 \u003ca href=\"#/zone-c-operationalization/sentry-mcp\">sentry-mcp\u003c/a> 做每日错误汇总\u003c/li>\u003cli>fde-scope 的 \u003ccode>deploy/\u003c/code> 已经有 AgentScope \u003ccode>DockerWorkspace\u003c/code> 的容器化路径——云端 agent 是&quot;托管容器&quot;，二者是不同层的选项（一个管 agent 跑在哪，一个管客户交付物跑在哪）\u003c/li>\u003cli>与 PawApp 的关系：PawApp 复用 QwenPaw 宿主能力（本地桌面），云端 agent 用于团队共享与无人值守，不要混用场景\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/cross-cutting/schedule\">schedule\u003c/a> · \u003ca href=\"#/cross-cutting/dispatching-parallel-agents\">dispatching-parallel-agents\u003c/a> · \u003ca href=\"#/cross-cutting/mcp-criticagent\">mcp-criticagent\u003c/a> · \u003ca href=\"#/zone-b-build/bailian-train-deploy\">bailian-train-deploy\u003c/a>\u003c/p>"}, {"route": "cross-cutting/bailian-cli", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "✅", "html": "\u003ch1>bailian-cli（百炼 \u003ccode>bl\u003c/code> 家族入口）\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（\u003ccode>~/.qoder/skills/bailian-cli\u003c/code> v1.17.1，requires bin \u003ccode>bl\u003c/code>）· 类型：平台 CLI hub · FDE 位点：横切（Zone B 训练/部署 / Zone C 用量治理）\u003cbr>官方安装方式是\u003cstrong>整包\u003c/strong>：\u003ccode>bl skill init\u003c/code>（hub + protocol + 各业务 skill 同装），不要只装 hub 一个\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>阿里云百炼 / DashScope 的\u003cstrong>资源管理与命令入口总机\u003c/strong>：应用调用（\u003ccode>bl app\u003c/code>）、应用记忆、知识库检索、模型目录/列表、用量与额度配额（含免费额度）、工作空间、MCP 市场、pipeline、文件上传、console API、登录鉴权与配置、以及 agent skill 的安装/列出/更新/卸载（\u003ccode>bl skill add|list|update|remove\u003c/code>）。\u003c/p>\n\u003cp>它是\u003cstrong>家族 hub\u003c/strong>——本地已装共 \u003cstrong>9 个\u003c/strong> \u003ccode>bailian-*\u003c/code>：本 hub + 6 个业务 skill + 1 个文档知识库 + 1 个共享协议：\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>成员\u003c/th>\u003cth>管什么\u003c/th>\u003cth>关键命令\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>bailian-protocol\u003c/code>\u003c/td>\u003ctd>共享执行协议：consent、版本预检、鉴权/安装、错误上报、文件与输出约定（\u003cstrong>非业务入口\u003c/strong>）\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>bailian-gen\u003c/code>\u003c/td>\u003ctd>生图/生视频/配音/TTS/ASR/图文与视频理解（默认生成类都走它）\u003c/td>\u003ctd>`bl image\\\u003c/td>\u003ctd>video\\\u003c/td>\u003ctd>speech\\\u003c/td>\u003ctd>omni\\\u003c/td>\u003ctd>vision`\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>bailian-finetune\u003c/code>\u003c/td>\u003ctd>精调训练全链：校验数据 → 上传 → 建任务 → watch → export → deploy\u003c/td>\u003ctd>`bl dataset\\\u003c/td>\u003ctd>finetune\\\u003c/td>\u003ctd>deploy`\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>bailian-managed-agent\u003c/code>\u003c/td>\u003ctd>\u003ccode>agents.yaml\u003c/code> 声明式托管 Agent（IaC：init/validate/plan/apply/destroy）\u003c/td>\u003ctd>\u003ccode>bl managed-agent\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>bailian-web-search\u003c/code>\u003c/td>\u003ctd>联网搜索的\u003cstrong>路径分发\u003c/strong>（Token Plan 自带搜索 vs MCP 搜索 + 一次兜底）\u003c/td>\u003ctd>\u003ccode>bl search web\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>bailian-model-recommend\u003c/code>\u003c/td>\u003ctd>场景 → 模型选型决策（不是查资料，是帮做决定）\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>bailian-docs-llm-wiki\u003c/code>\u003c/td>\u003ctd>百炼官方文档知识库（模型市场结构化数据 + wiki 合成层 + raw 层）\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>bailian-train-deploy\u003c/code>\u003c/td>\u003ctd>&quot;数据→训练→部署→调用&quot;闭环剧本（本库另有一页）\u003c/td>\u003ctd>见 \u003ca href=\"#/zone-b-build/bailian-train-deploy\">该页\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>用户\u003cstrong>点名\u003c/strong>百炼 / DashScope / \u003ccode>bl\u003c/code>，或续跑既有 \u003ccode>bl\u003c/code> 工作流\u003c/li>\u003cli>用量、额度、配额、工作空间、知识库、MCP 市场等资源侧问题\u003c/li>\u003cli>不知道哪条 \u003ccode>bl\u003c/code> 命令做这件事 → hub 的 \u003ccode>reference/&lt;group&gt;.md\u003c/code> 是权威清单（不要凭记忆拼命令）\u003c/li>\u003cli>首次环境搭建 / 鉴权失败 / \u003ccode>bl\u003c/code> 报错要上报\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：普通问答、编程、写作、翻译、摘要、泛搜索、图片理解——\u003cstrong>宿主自己能做的任务不触发本 skill\u003c/strong>（skill 描述里写明了反触发边界）；用户点名火山方舟/ark 的训练不走 \u003ccode>bailian-finetune\u003c/code>；调已上线的百炼应用走 \u003ccode>bl app\u003c/code>，不是 \u003ccode>managed-agent\u003c/code>。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：点名「百炼 / DashScope / \u003ccode>bl\u003c/code>」或续跑既有 \u003ccode>bl\u003c/code> 工作流——skill 描述写明反触发边界：普通问答、编程、写作、翻译、摘要、泛搜索不触发\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：首次环境先跑 \u003ccode>bl skill init\u003c/code> 整包安装（hub + protocol + 各业务 skill 同装，别只装 hub），之后 \u003ccode>bl app list --output json\u003c/code>、\u003ccode>bl usage stats\u003c/code>、\u003ccode>bl model list --model qwen\u003c/code> 都是入口级命令\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：执行前必读 \u003ccode>bailian-protocol/SKILL.md\u003c/code>（consent / 版本预检 / 鉴权），协议文件缺失就停下重跑 \u003ccode>bl skill init\u003c/code>，不要猜鉴权；命令不凭记忆拼——先查 \u003ccode>reference/&lt;group&gt;.md\u003c/code> 或 \u003ccode>bl &lt;cmd&gt; --help\u003c/code>，跑前先 \u003ccode>bl --version\u003c/code>\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：console 登录必须显式带 \u003ccode>--console-site domestic|international\u003c/code>；未指明产品先问清再跑 \u003ccode>bl usage\u003c/code> / \u003ccode>bl quota\u003c/code>（否则查的额度是错的对象）；写操作先 \u003ccode>--dry-run\u003c/code>，\u003ccode>managed-agent apply/destroy\u003c/code> 必须 \u003ccode>plan\u003c/code> 看 diff 后带 \u003ccode>--yes\u003c/code>\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>**执行前必读 \u003ccode>bailian-protocol/SKILL.md\u003c/code>**（provider 选择与 consent、版本与更新预检、setup/auth、错误上报）。协议文件缺失就停下先跑 \u003ccode>bl skill init\u003c/code>，\u003cstrong>不要猜鉴权和 consent\u003c/strong>\u003c/li>\u003cli>版本预检是硬步骤：\u003ccode>bl\u003c/code> 是快速迭代的 CLI，旧版本上的&quot;正确命令&quot;可能已改名；先看 \u003ccode>bl --version\u003c/code> 与 \u003ccode>bl &lt;cmd&gt; --help\u003c/code>\u003c/li>\u003cli>**写操作先 \u003ccode>--dry-run\u003c/code> 预览**；\u003ccode>managed-agent apply/destroy\u003c/code> 必须带 \u003ccode>--yes\u003c/code>，且**必须先 \u003ccode>plan\u003c/code> 把 diff 给用户看**再要确认\u003c/li>\u003cli>凭据只走环境变量/密钥管理，不进仓库、不进日志、不进文档\u003c/li>\u003cli>未指明产品就问清楚用哪个产品，再跑 \u003ccode>bl usage\u003c/code> / \u003ccode>bl quota\u003c/code>（否则查出来的额度是错的对象）\u003c/li>\u003cli>家族 skill 之间是\u003cstrong>软交接\u003c/strong>：按名字 Read 对应 skill，装了就参考，没装就回落到 \u003ccode>bl … --help\u003c/code>，不要因为缺文件就中断任务\u003c/li>\u003cli>与 MiMo/AgentScope 的关系：fde-scope 的 LLM 抽象层可指向百炼 compatible-mode 端点；\u003ccode>bl\u003c/code> 管的是\u003cstrong>平台资源生命周期\u003c/strong>，不是运行时调用库——别把两者混为一层\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone B：把语料（\u003ccode>fde_scope/corpus/\u003c/code>）产出物送进百炼做精调、把专属模型部署成 endpoint 供 \u003ca href=\"#/zone-b-build/rag-agent-builder\">rag-agent-builder\u003c/a> 或 web 控制台调用\u003c/li>\u003cli>Zone C：额度/用量巡检（交付期成本可控性是客户关心项）；知识库检索用于交付后客户自助\u003c/li>\u003cli>Zone D：\u003ccode>bl managed-agent\u003c/code> 的 \u003ccode>agents.yaml\u003c/code> 是\u003cstrong>可交付的声明式基建\u003c/strong>，比口头描述部署方式更适合进交接包\u003c/li>\u003cli>反例提醒：fde-scope 内置的是 MiMo（OpenAI 兼容）路径，凭据只走 \u003ccode>FDE_SCOPE_MIMO_API_KEY\u003c/code>；用百炼时同样坚持&quot;凭据只走环境变量&quot;\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-b-build/bailian-train-deploy\">bailian-train-deploy\u003c/a> · \u003ca href=\"#/zone-b-build/vllm-deploy-docker\">vllm-deploy-docker\u003c/a> · \u003ca href=\"#/zone-b-build/rag-agent-builder\">rag-agent-builder\u003c/a> · \u003ca href=\"#/cross-cutting/create-skill\">create-skill\u003c/a>（\u003ccode>bl skill\u003c/code> 与本地 skill 是两套 registry，别混淆）\u003c/p>"}, {"route": "cross-cutting/using-superpowers-family", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "✅", "html": "\u003ch1>superpowers 套件（方法论族 14 件套）\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（Quest Marketplace 插件 \u003ccode>superpowers\u003c/code> v5.1.0，作者 Jesse Vincent）· 类型：套件档案 · FDE 位点：横切（约束 Zone B~D 的执行纪律）\u003cbr>本地路径：\u003ccode>~/.qoder/plugins/cache/qoder-marketplace/superpowers/5.1.0\u003c/code>（skill 同时镜像到 \u003ccode>~/.qoder/skills/\u003c/code>）\u003cbr>特点：\u003cstrong>带 hooks\u003c/strong>（\u003ccode>hooks/session-start\u003c/code>）——会话启动即注入 \u003ccode>using-superpowers\u003c/code> 的强制规则，是本目录里唯一会主动改变 agent 默认行为的套件\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>把&quot;随手改代码&quot;强行拉回一条固定流水线：\u003cstrong>explore → brainstorm → plan → TDD → review → verify → finish\u003c/strong>。14 个 skill 全是流程纪律，没有一个业务能力，因此它们必须与领域 skill（数据/训练/部署/文档）搭配使用。\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Skill\u003c/th>\u003cth>触发时机\u003c/th>\u003cth>已有单页\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>using-superpowers\u003c/code>\u003c/td>\u003ctd>每次会话开始：先查有无适用 skill，再动手（连澄清问题之前都要查）\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>brainstorming\u003c/code>\u003c/td>\u003ctd>任何创造性工作之前（做新功能/组件/改行为）\u003c/td>\u003ctd>✅ \u003ca href=\"#/zone-a-pre-engagement/brainstorming\">Zone A\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>writing-plans\u003c/code>\u003c/td>\u003ctd>有多步需求的 spec，\u003cstrong>动代码之前\u003c/strong>\u003c/td>\u003ctd>✅ \u003ca href=\"#/cross-cutting/writing-plans\">本页同层\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>executing-plans\u003c/code>\u003c/td>\u003ctd>执行已写好的计划，带评审检查点\u003c/td>\u003ctd>✅ \u003ca href=\"#/cross-cutting/executing-plans\">本页同层\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>subagent-driven-development\u003c/code>\u003c/td>\u003ctd>在当前会话内用子 agent 跑计划里的独立任务\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>dispatching-parallel-agents\u003c/code>\u003c/td>\u003ctd>2 个以上无共享状态的任务并行派发\u003c/td>\u003ctd>✅ \u003ca href=\"#/cross-cutting/dispatching-parallel-agents\">本页同层\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>test-driven-development\u003c/code>\u003c/td>\u003ctd>写实现代码之前先写测试\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>systematic-debugging\u003c/code>\u003c/td>\u003ctd>遇到任何 bug / 测试失败 / 意外行为，\u003cstrong>在给修复方案之前\u003c/strong>\u003c/td>\u003ctd>✅ \u003ca href=\"#/zone-c-operationalization/systematic-debugging\">Zone C\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>verification-before-completion\u003c/code>\u003c/td>\u003ctd>声称&quot;完成/修好了/通过了&quot;之前，必须真跑验证命令并贴输出\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>requesting-code-review\u003c/code>\u003c/td>\u003ctd>完成任务、上大 feature、合并前\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>receiving-code-review\u003c/code>\u003c/td>\u003ctd>收到评审意见后、动手改之前（尤其意见可疑时）\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>using-git-worktrees\u003c/code>\u003c/td>\u003ctd>需要隔离工作区时\u003c/td>\u003ctd>✅ \u003ca href=\"#/cross-cutting/using-git-worktrees\">本页同层\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>finishing-a-development-branch\u003c/code>\u003c/td>\u003ctd>实现完成、测试全绿后决定如何合流\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>writing-skills\u003c/code>\u003c/td>\u003ctd>新建/编辑 skill、部署前校验\u003c/td>\u003ctd>✅ \u003ca href=\"#/cross-cutting/writing-skills\">本页同层\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch2>何时使用（按 FDE 阶段）\u003c/h2>\n\u003cul>\u003cli>Zone B 实施：\u003ccode>writing-plans\u003c/code> → \u003ccode>executing-plans\u003c/code> / \u003ccode>subagent-driven-development\u003c/code> → \u003ccode>test-driven-development\u003c/code>，这是把 fde-scope 的模块改动落地的正链\u003c/li>\u003cli>Zone C 排障：\u003ccode>systematic-debugging\u003c/code> 必须在任何&quot;看起来是这个问题&quot;的修复之前（客户现场的复现成本极高，猜一次亏一天）\u003c/li>\u003cli>收口阶段：\u003ccode>verification-before-completion\u003c/code> + \u003ccode>requesting-code-review\u003c/code> + \u003ccode>finishing-a-development-branch\u003c/code>，对应 gate 需要证据的纪律\u003c/li>\u003cli>横切：本 catalog 的建档本身就是 \u003ccode>writing-plans\u003c/code> + 分批执行 + 完成前逐项校验的产物\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：纯只读问答与检索（族内 skill 会说&quot;先检查 skill&quot;，但不代表每个都要跑）；\u003ccode>using-superpowers\u003c/code> 明确写了 \u003cstrong>SUBAGENT-STOP\u003c/strong>——被派发去执行特定任务的子 agent 应忽略它，不要在工作子进程里再套一层方法论；紧急生产事故止血阶段先恢复再补流程（但事后仍要走 \u003ccode>systematic-debugging\u003c/code> 复盘）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：装好即生效、无需手动触发——\u003ccode>hooks/session-start\u003c/code> 在每次会话启动注入 \u003ccode>using-superpowers\u003c/code> 的强制规则（&quot;哪怕 1% 可能适用也必须先调用 skill&quot;），是本目录唯一主动改变 agent 默认行为的套件\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：正常开工并观察 agent 是否&quot;先查 skill 再动手&quot;（连澄清问题之前都要查）；要定点拉起就点名成员：「用 writing-plans 写计划」「按 systematic-debugging 查这个 bug」「先 brainstorming 再动手」\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：\u003ccode>using-superpowers\u003c/code> 带有 \u003ccode>&lt;SUBAGENT-STOP&gt;\u003c/code>——被派发执行特定任务的子 agent 应忽略它，别在工作子进程里再套一层方法论\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：\u003ccode>~/.qoder/skills/\u003c/code> 下有早期散装的同名镜像，插件升级后以插件版（v5.1.0）为准，别两边各改各的；它的规则让位于用户指令——在 fde-scope 里按仓库维护规约裁剪，别为改一行 README 走完整 TDD\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>冲突时以本仓约定为准\u003c/strong>：superpowers 的规则很强硬（&quot;哪怕 1% 可能适用也必须调用&quot;）。在 fde-scope 里，文档/小改动场景按 \u003ca href=\"../README.md\" target=\"_blank\" rel=\"noopener\">../README.md\u003c/a> 的维护规约裁剪，别为改一行 README 走完整 TDD\u003c/li>\u003cli>计划文件要落盘可评审（\u003ccode>writing-plans\u003c/code> 的产物），别只在会话里说过——\u003ccode>executing-plans\u003c/code> 依赖它做检查点\u003c/li>\u003cli>\u003ccode>verification-before-completion\u003c/code> 是本族\u003cstrong>性价比最高\u003c/strong>的一条：要求贴真实命令输出。把它当交付前的固定门禁\u003c/li>\u003cli>\u003ccode>receiving-code-review\u003c/code> 与 \u003ccode>requesting-code-review\u003c/code> 要搭配本库的 \u003ca href=\"#/cross-cutting/code-review\">code-review\u003c/a>（CodeRabbit）与 \u003ca href=\"#/cross-cutting/security-scan\">security-scan\u003c/a> 使用——机器评审出意见，人按 \u003ccode>receiving-code-review\u003c/code> 的判断流程处置，不盲从也不硬抗\u003c/li>\u003cli>hooks 会带来会话开销与额外上下文占用：若某会话不需要这套纪律，可临时禁用该插件而不是逐个 skill 绕\u003c/li>\u003cli>版本注意：\u003ccode>~/.qoder/skills/\u003c/code> 下有同名镜像（早期散装安装），插件升级后以插件版本为准，\u003cstrong>不要两边各改各的\u003c/strong>\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>\u003ccode>docs/code_review_checklist.md\u003c/code> 与本族的 review 类 skill 是同一层规范，可互相引用\u003c/li>\u003cli>fde-scope 的 10 个 gate 本质是&quot;人工版 verification-before-completion&quot;——把 skill 纪律映射进 gate 证据要求，是本套件在该项目最落地的用法\u003c/li>\u003cli>测试基线（\u003ccode>tests/\u003c/code>，含 \u003ccode>test_app_service.py\u003c/code>/\u003ccode>test_roles.py\u003c/code>/\u003ccode>test_documents_connector.py\u003c/code>）遵循 \u003ccode>test-driven-development\u003c/code> 的&quot;先测后码&quot;\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/cross-cutting/gstack-suite\">gstack-suite\u003c/a>（同类流程套件，偏 startup 交付视角） · \u003ca href=\"#/cross-cutting/architecture-visualization-suite\">architecture-visualization-suite\u003c/a> · \u003ca href=\"#/cross-cutting/knowledge-work-suite\">knowledge-work-suite\u003c/a> · \u003ca href=\"#/cross-cutting/create-skill\">create-skill\u003c/a> · \u003ca href=\"#/cross-cutting/skill-discovery\">skill-discovery\u003c/a>\u003c/p>"}, {"route": "cross-cutting/gstack-suite", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "✅", "html": "\u003ch1>GStack 套件（53 件套 · YC CEO 的开发全流程工厂）\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（Quest Marketplace 插件 \u003ccode>gstack\u003c/code> v1.58.5，作者 Garry Tan / Y Combinator，MIT）· 类型：套件档案 · FDE 位点：横切（Zone B 实施 ~ Zone D 交付）\u003cbr>本地路径：\u003ccode>~/.qoder/plugins/cache/qoder-marketplace/gstack/1.58.5\u003c/code> · 上游：https://github.com/garrytan/gstack\u003cbr>定位：&quot;我的开源软件工厂&quot;——把 agent 变成一支虚拟工程团队（CEO/工程经理/设计师/评审/QA/安全官/发布工程师）\u003cbr>⚠️ 计数事实：\u003cstrong>打包 53 个 skill，当前会话实际注册可调用 43 个\u003c/strong>；未注册的 10 个（\u003ccode>spec\u003c/code>、\u003ccode>retro\u003c/code>、\u003ccode>qa-only\u003c/code>、\u003ccode>devex-review\u003c/code>、\u003ccode>design-shotgun\u003c/code>、\u003ccode>benchmark-models\u003c/code>、\u003ccode>ios-sync\u003c/code>、\u003ccode>open-gstack-browser\u003c/code>、\u003ccode>sync-gbrain\u003c/code>、\u003ccode>skillify\u003c/code>）需要时直接 Read 其 \u003ccode>SKILL.md\u003c/code> 按其流程执行。插件元数据里&quot;23 个 skill&quot;的说法是旧版本描述，已过时。\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>全部以 slash-command 风格组织的 skill + 一个\u003cstrong>快速 headless 浏览器\u003c/strong>（自带 \u003ccode>bin/\u003c/code>，\u003ccode>/browse\u003c/code> 用它，不用其他浏览器 MCP）。按用途分八组：\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>组\u003c/th>\u003cth>Skill\u003c/th>\u003cth>干什么\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>意图→规格\u003c/td>\u003ctd>\u003ccode>spec\u003c/code> \u003ccode>office-hours\u003c/code> \u003ccode>autoplan\u003c/code> \u003ccode>plan-tune\u003c/code>\u003c/td>\u003ctd>模糊需求→可执行 spec；五阶段收敛；自动串行跑四类评审\u003c/td>\u003c/tr>\u003ctr>\u003ctd>多角色评审\u003c/td>\u003ctd>\u003ccode>plan-ceo-review\u003c/code> \u003ccode>plan-eng-review\u003c/code> \u003ccode>plan-design-review\u003c/code> \u003ccode>plan-devex-review\u003c/code> \u003ccode>review\u003c/code> \u003ccode>cso\u003c/code>\u003c/td>\u003ctd>产品/架构/设计/开发者体验四视角 + 代码评审 + 安全官（OWASP + STRIDE）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>设计与前端\u003c/td>\u003ctd>\u003ccode>design-consultation\u003c/code> \u003ccode>design-html\u003c/code> \u003ccode>design-review\u003c/code> \u003ccode>ios-design-review\u003c/code> \u003ccode>diagram\u003c/code>\u003c/td>\u003ctd>设计咨询、HTML 出稿、设计找 AI slop、图\u003c/td>\u003c/tr>\u003ctr>\u003ctd>浏览器与 QA\u003c/td>\u003ctd>\u003ccode>browse\u003c/code> \u003ccode>qa\u003c/code> \u003ccode>qa-only\u003c/code> \u003ccode>scrape\u003c/code> \u003ccode>setup-browser-cookies\u003c/code> \u003ccode>open-gstack-browser\u003c/code>\u003c/td>\u003ctd>真浏览器打开预发/线上做 QA、抓取、cookie 复用\u003c/td>\u003c/tr>\u003ctr>\u003ctd>排障与稳定性\u003c/td>\u003ctd>\u003ccode>investigate\u003c/code> \u003ccode>health\u003c/code> \u003ccode>canary\u003c/code> \u003ccode>benchmark\u003c/code> \u003ccode>benchmark-models\u003c/code>\u003c/td>\u003ctd>根因排查、健康度、发布后金丝雀观察、性能与跨模型基准\u003c/td>\u003c/tr>\u003ctr>\u003ctd>安全护栏\u003c/td>\u003ctd>\u003ccode>careful\u003c/code> \u003ccode>guard\u003c/code> \u003ccode>freeze\u003c/code> \u003ccode>unfreeze\u003c/code>\u003c/td>\u003ctd>破坏性命令告警、目录级只读锁定（改代码前后夹住）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>发布与运维\u003c/td>\u003ctd>\u003ccode>ship\u003c/code> \u003ccode>land-and-deploy\u003c/code> \u003ccode>setup-deploy\u003c/code> \u003ccode>retro\u003c/code> \u003ccode>learn\u003c/code>\u003c/td>\u003ctd>检测 base 分支→跑测试→审 diff→bump VERSION→CHANGELOG→commit→push→PR；周复盘；项目学习记录管理\u003c/td>\u003c/tr>\u003ctr>\u003ctd>交付文档\u003c/td>\u003ctd>\u003ccode>document-generate\u003c/code> \u003ccode>document-release\u003c/code> \u003ccode>make-pdf\u003c/code> \u003ccode>landing-report\u003c/code>\u003c/td>\u003ctd>补文档、发布后同步文档、Markdown→出版级 PDF、落地页报告\u003c/td>\u003c/tr>\u003ctr>\u003ctd>上下文与协作\u003c/td>\u003ctd>\u003ccode>context-save\u003c/code> \u003ccode>context-restore\u003c/code> \u003ccode>pair-agent\u003c/code> \u003ccode>codex\u003c/code> \u003ccode>gstack-upgrade\u003c/code>\u003c/td>\u003ctd>跨会话上下文存取、结对、调用 Codex、自升级\u003c/td>\u003c/tr>\u003ctr>\u003ctd>iOS/移动端\u003c/td>\u003ctd>\u003ccode>ios-qa\u003c/code> \u003ccode>ios-fix\u003c/code> \u003ccode>ios-clean\u003c/code> \u003ccode>ios-sync\u003c/code>\u003c/td>\u003ctd>真机 SwiftUI QA、自治修 bug、清理 DebugBridge 接线\u003c/td>\u003c/tr>\u003ctr>\u003ctd>代码检索基建\u003c/td>\u003ctd>\u003ccode>setup-gbrain\u003c/code> \u003ccode>sync-gbrain\u003c/code> \u003ccode>skillify\u003c/code>\u003c/td>\u003ctd>gbrain 索引安装/同步；把成功的一次 \u003ccode>/scrape\u003c/code> 固化成常驻 browser-skill\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch2>何时使用（按 FDE 阶段）\u003c/h2>\n\u003cul>\u003cli>Zone B：\u003ccode>spec\u003c/code> 收敛客户需求 → \u003ccode>plan-eng-review\u003c/code> 锁架构 → \u003ccode>careful\u003c/code>/\u003ccode>guard\u003c/code> 夹住改动范围 → \u003ccode>investigate\u003c/code> 排障\u003c/li>\u003cli>Zone C：\u003ccode>health\u003c/code> + \u003ccode>canary\u003c/code> 做上线后观察；\u003ccode>cso\u003c/code> 做交付前 OWASP/STRIDE 审计（\u003cstrong>给客户安全部门看的东西\u003c/strong>）\u003c/li>\u003cli>Zone D：\u003ccode>document-generate\u003c/code> / \u003ccode>document-release\u003c/code> / \u003ccode>make-pdf\u003c/code> 出交付物（本库已有三张单页：\u003ca href=\"#/zone-d-handoff/document-generate\">document-generate\u003c/a> · \u003ca href=\"#/zone-d-handoff/document-release\">document-release\u003c/a> · \u003ca href=\"#/zone-d-handoff/make-pdf\">make-pdf\u003c/a>）\u003c/li>\u003cli>需要真浏览器验证时：\u003ccode>browse\u003c/code> / \u003ccode>qa\u003c/code>（本地另有 \u003ca href=\"#/zone-c-operationalization/chrome-devtools\">chrome-devtools\u003c/a>，两者只需保留一个以免行为不一致）\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：\u003c/p>\n\u003cul>\u003cli>**客户仓库上的 \u003ccode>ship\u003c/code> / \u003ccode>land-and-deploy\u003c/code>** —— 它们会自动 commit、push、开 PR、改 VERSION/CHANGELOG。这是给&quot;自己产品高速迭代&quot;设计的，在客户现场必须换成本地约定：先问、再提交，绝不自动 push\u003c/li>\u003cli>\u003ccode>ios-*\u003c/code> 组：目标是 \u003cstrong>SwiftUI iOS 真机\u003c/strong>，不是 macOS 桌面打包（\u003ccode>docs/macos_app_packaging.md\u003c/code> / \u003ccode>appbuild/\u003c/code> 那条线用不上，别误触发）\u003c/li>\u003cli>纯数据/工业接入任务（Zone B 的 connector/corpus 工作没有对应 gstack skill，用 DuckDB/Firecrawl/HF 那一族）\u003c/li>\u003cli>需要严格证据链的架构建模 → \u003ca href=\"#/cross-cutting/architecture-visualization-suite\">architecture-visualization-suite\u003c/a>（GStack 的图偏沟通，不带 sourceRefs 门禁）\u003c/li>\u003c/ul>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：直接敲 slash command——\u003ccode>/ship\u003c/code>、\u003ccode>/qa\u003c/code>、\u003ccode>/cso\u003c/code>、\u003ccode>/investigate\u003c/code> 等；模糊需求收敛走 \u003ccode>/spec\u003c/code>（其触发短语：「spec this out」「file an issue」「write up a ticket」）\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：Zone B 常用链：\u003ccode>/spec\u003c/code> 五阶段收敛需求 → \u003ccode>/plan-eng-review\u003c/code> 锁架构 → \u003ccode>/careful\u003c/code> 或 \u003ccode>/guard\u003c/code> 夹住改动范围再动代码\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：客户仓库禁用 \u003ccode>/ship\u003c/code> 与 \u003ccode>/land-and-deploy\u003c/code>——它们会自动 commit、push、开 PR、改 VERSION/CHANGELOG（为&quot;自己产品高速迭代&quot;设计），客户现场必须先问再提交\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：打包 53 个但会话只注册 43 个——\u003ccode>spec\u003c/code>、\u003ccode>retro\u003c/code>、\u003ccode>qa-only\u003c/code> 等 10 个未注册，用前先 \u003ccode>Read ~/.qoder/plugins/cache/qoder-marketplace/gstack/1.58.5/&lt;name&gt;/SKILL.md\u003c/code> 按其步骤手工执行；与 superpowers 同开会互相抢触发，主线二选一\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>与 superpowers 族二选一做主线\u003c/strong>：两套都主张强流程，同开会互相抢触发。本项目建议：\u003cstrong>主线用 superpowers（纪律+TDD），需要某个 GStack 强项时定点调用\u003c/strong>（\u003ccode>cso\u003c/code>、\u003ccode>canary\u003c/code>、\u003ccode>make-pdf\u003c/code>、\u003ccode>document-*\u003c/code>、\u003ccode>benchmark\u003c/code>）\u003c/li>\u003cli>\u003ccode>guard\u003c/code>/\u003ccode>freeze\u003c/code> 在客户现场是很好用的&quot;防手滑&quot;开关：进入只读分析阶段前 \u003ccode>freeze\u003c/code>，改动阶段 \u003ccode>guard\u003c/code> 限定目录\u003c/li>\u003cli>\u003ccode>autoplan\u003c/code> 会\u003cstrong>自动替你做决策\u003c/strong>（按 6 条决策原则串行跑四类评审）——产出要逐条复核，不能当&quot;已通过评审&quot;直接进交付\u003c/li>\u003cli>\u003ccode>review\u003c/code> 与已装的 \u003ca href=\"#/cross-cutting/code-review\">code-review\u003c/a>（CodeRabbit）功能重叠：一个走 PR 机器人、一个走本地流程。选一个作门禁，另一个作补充，\u003cstrong>不要两边同时要求修同一处风格问题\u003c/strong>\u003c/li>\u003cli>\u003ccode>skillify\u003c/code> 是这套里最被低估的一个：把一次成功的抓取/验证流程固化成常驻 skill，等于自制 fde-scope 的 \u003ccode>skills/\u003c/code> 沉淀\u003c/li>\u003cli>版本与污染：\u003ccode>gstack-upgrade\u003c/code> 会拉上游；本仓库不要提交 \u003ccode>~/.claude/skills/gstack\u003c/code> 生成的项目内文件（确认 \u003ccode>.gitignore\u003c/code> 覆盖 \u003ccode>CLAUDE.md\u003c/code> 之类的写入）\u003c/li>\u003cli>未注册的 10 个 skill 用前先 \u003ccode>Read .../gstack/1.58.5/&lt;name&gt;/SKILL.md\u003c/code>，按其步骤手工执行并说明来源\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone D 交付物三件套的\u003cstrong>实际来源\u003c/strong>就是本套件（已在三张单页头部标注）\u003c/li>\u003cli>\u003ccode>cso\u003c/code> 可补 fde-scope 目前缺的&quot;交付前安全审计&quot;证据：与 \u003ca href=\"#/cross-cutting/security-scan\">security-scan\u003c/a> 一起构成 LLM 应用 + 传统 Web 双视角\u003c/li>\u003cli>\u003ccode>canary\u003c/code> + \u003ccode>benchmark\u003c/code> 对应 Zone C 的 SLO gate：把&quot;上线后观察&quot;变成有脚本支撑的动作\u003c/li>\u003cli>\u003ccode>learn\u003c/code> 的项目学习记录机制与 fde-scope 的 flywheel（经验回流）思路一致，可作为其外部参考实现\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/cross-cutting/using-superpowers-family\">using-superpowers-family\u003c/a> · \u003ca href=\"#/cross-cutting/knowledge-work-suite\">knowledge-work-suite\u003c/a> · \u003ca href=\"#/cross-cutting/code-review\">code-review\u003c/a> · \u003ca href=\"#/cross-cutting/security-scan\">security-scan\u003c/a> · \u003ca href=\"#/zone-d-handoff/document-generate\">document-generate\u003c/a> · \u003ca href=\"#/zone-c-operationalization/investigate\">investigate\u003c/a>\u003c/p>"}, {"route": "cross-cutting/knowledge-work-suite", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "📦", "html": "\u003ch1>knowledge-work 套件（anthropics/knowledge-work-plugins）\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：📦 可安装（\u003cstrong>未装\u003c/strong>，且建议\u003cstrong>按需单装、不要整包装\u003c/strong>）· 类型：套件档案 · FDE 位点：横切（Zone A 调研 ~ Zone D 交付）\u003cbr>来源：\u003ccode>anthropics/knowledge-work-plugins\u003c/code>（Anthropic 官方 org）· 上游：https://github.com/anthropics/knowledge-work-plugins\u003cbr>规模事实（skills.sh，2026-08-27 抓取）：\u003cstrong>230 个 skill / 497.5K 总安装量\u003c/strong> —— 不是&quot;40+ 件套&quot;，早期建档的估计严重偏低，已在本页与 README 更正\u003cbr>单装：\u003ccode>npx skills add anthropics/knowledge-work-plugins@&lt;skill&gt; --directory ~/.qoder/skills -y\u003c/code>\u003cbr>本 catalog 已有 4 个 📦 条目的\u003cstrong>真实来源就是本仓库\u003c/strong>：\u003ca href=\"#/zone-c-operationalization/deploy-checklist\">deploy-checklist\u003c/a> · \u003ca href=\"#/zone-c-operationalization/sre-runbooks\">sre-runbooks\u003c/a>（真名 \u003ccode>runbook\u003c/code>）· \u003ca href=\"#/zone-c-operationalization/incident-response\">incident-response\u003c/a> · \u003ca href=\"#/zone-d-handoff/anthropic-documentation\">anthropic-documentation\u003c/a>（真名 \u003ccode>documentation\u003c/code>）\u003cbr>仓库结构（2026-08-27 用 GitHub API 核对）：\u003cstrong>18 个子插件包\u003c/strong>——\u003ccode>bio-research\u003c/code> \u003ccode>cowork-plugin-management\u003c/code> \u003ccode>customer-support\u003c/code> \u003ccode>data\u003c/code> \u003ccode>design\u003c/code> \u003ccode>engineering\u003c/code> \u003ccode>enterprise-search\u003c/code> \u003ccode>finance\u003c/code> \u003ccode>human-resources\u003c/code> \u003ccode>legal\u003c/code> \u003ccode>marketing\u003c/code> \u003ccode>operations\u003c/code> \u003ccode>partner-built\u003c/code> \u003ccode>pdf-viewer\u003c/code> \u003ccode>product-management\u003c/code> \u003ccode>productivity\u003c/code> \u003ccode>sales\u003c/code> \u003ccode>small-business\u003c/code>；路径统一为 \u003ccode>&lt;plugin&gt;/skills/&lt;name&gt;/SKILL.md\u003c/code>。\u003cbr>安全事实：上游对每个条目跑\u003cstrong>强制 Claude policy scan\u003c/strong>（\u003ccode>.github/workflows/scan-plugins.yml\u003c/code>，按 (plugin, sha) 缓存判定，不通过则被 \u003ccode>revert-failed-bumps.yml\u003c/code> 自动剔除）——这是选它而不选个人作者的实质理由。\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>把&quot;知识工作&quot;按岗位拆成 skill：工程（\u003ccode>system-design\u003c/code> \u003ccode>architecture\u003c/code> \u003ccode>tech-debt\u003c/code> \u003ccode>testing-strategy\u003c/code> \u003ccode>debug\u003c/code> \u003ccode>code-review\u003c/code> \u003ccode>deploy-checklist\u003c/code>）、数据（\u003ccode>explore-data\u003c/code> \u003ccode>analyze\u003c/code> \u003ccode>sql-queries\u003c/code> \u003ccode>write-query\u003c/code> \u003ccode>validate-data\u003c/code> \u003ccode>statistical-analysis\u003c/code> \u003ccode>create-viz\u003c/code> \u003ccode>data-visualization\u003c/code> \u003ccode>data-context-extractor\u003c/code>）、文档与研究（\u003ccode>documentation\u003c/code> \u003ccode>knowledge-synthesis\u003c/code> \u003ccode>research-synthesis\u003c/code> \u003ccode>synthesize-research\u003c/code> \u003ccode>search-strategy\u003c/code> \u003ccode>search\u003c/code> \u003ccode>source-management\u003c/code> \u003ccode>view-pdf\u003c/code> \u003ccode>write-spec\u003c/code>）、运维（\u003ccode>incident-response\u003c/code> \u003ccode>runbook\u003c/code> \u003ccode>ticket-triage\u003c/code> \u003ccode>status-report\u003c/code> \u003ccode>daily-briefing\u003c/code> \u003ccode>standup\u003c/code>）、产品与设计（\u003ccode>product-brainstorming\u003c/code> \u003ccode>design-critique\u003c/code> \u003ccode>design-system\u003c/code> \u003ccode>design-handoff\u003c/code> \u003ccode>ux-copy\u003c/code> \u003ccode>accessibility-review\u003c/code> \u003ccode>user-research\u003c/code>）、以及大量非技术岗位（法务 \u003ccode>review-contract\u003c/code> \u003ccode>legal-risk-assessment\u003c/code>、财务 \u003ccode>financial-statements\u003c/code> \u003ccode>variance-analysis\u003c/code> \u003ccode>reconciliation\u003c/code>、HR \u003ccode>interview-prep\u003c/code> \u003ccode>performance-review\u003c/code>、市场 \u003ccode>brand-*\u003c/code> \u003ccode>campaign-plan\u003c/code> \u003ccode>seo-audit\u003c/code>）。\u003c/p>\n\u003cp>与 GStack/superpowers 的差别：那两个管\u003cstrong>工程流程纪律\u003c/strong>，这一个管\u003cstrong>岗位化产出物\u003c/strong>——它的 skill 输出往往是文档、看板、分析报告，而不是代码路径。\u003c/p>\n\u003ch2>何时使用（FDE 视角的高价值子集）\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>需求\u003c/th>\u003cth>装这个\u003c/th>\u003cth>热度\u003c/th>\u003cth>对应 FDE 位点\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>客户看板/指标可视化\u003c/td>\u003ctd>\u003ccode>data-visualization\u003c/code> / \u003ccode>build-dashboard\u003c/code> / \u003ccode>create-viz\u003c/code>\u003c/td>\u003ctd>11.5K / 7.8K / 4.7K\u003c/td>\u003ctd>Zone B 演示、Zone C 运维大屏\u003c/td>\u003c/tr>\u003ctr>\u003ctd>交付文档写作规范\u003c/td>\u003ctd>\u003ca href=\"#/zone-d-handoff/anthropic-documentation\">documentation\u003c/a>\u003c/td>\u003ctd>8.8K\u003c/td>\u003ctd>Zone D（已有页，见上）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>现场数据探查\u003c/td>\u003ctd>\u003ccode>explore-data\u003c/code> / \u003ccode>analyze\u003c/code> / \u003ccode>sql-queries\u003c/code>\u003c/td>\u003ctd>5.2K / 5.1K / 3.8K\u003c/td>\u003ctd>Zone B，配合 \u003ca href=\"#/zone-b-build/query\">query\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>架构与技术债评估\u003c/td>\u003ctd>\u003ccode>architecture\u003c/code> / \u003ccode>system-design\u003c/code> / \u003ccode>tech-debt\u003c/code>\u003c/td>\u003ctd>5.7K / 6.6K / 5.7K\u003c/td>\u003ctd>Zone A 摸底遗留系统\u003c/td>\u003c/tr>\u003ctr>\u003ctd>事件响应与 runbook\u003c/td>\u003ctd>\u003ca href=\"#/zone-c-operationalization/incident-response\">incident-response\u003c/a> / \u003ca href=\"#/zone-c-operationalization/sre-runbooks\">runbook\u003c/a> / \u003ccode>ticket-triage\u003c/code>\u003c/td>\u003ctd>5.3K / 2.6K / 2.6K\u003c/td>\u003ctd>Zone C（前两页已建）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>上线清单\u003c/td>\u003ctd>\u003ca href=\"#/zone-c-operationalization/deploy-checklist\">deploy-checklist\u003c/a>\u003c/td>\u003ctd>4.9K\u003c/td>\u003ctd>Zone B→C 交界，正好补 gate 证据模板\u003c/td>\u003c/tr>\u003ctr>\u003ctd>客户资料综合\u003c/td>\u003ctd>\u003ccode>knowledge-synthesis\u003c/code> / \u003ccode>research-synthesis\u003c/code>\u003c/td>\u003ctd>5.9K / 3.3K\u003c/td>\u003ctd>Zone A，配合 \u003ca href=\"#/zone-a-pre-engagement/firecrawl-crawl\">firecrawl-crawl\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PDF 读取\u003c/td>\u003ctd>\u003ccode>view-pdf\u003c/code>\u003c/td>\u003ctd>5.8K\u003c/td>\u003ctd>Zone A 客户文档（与本地 \u003ca href=\"#/zone-a-pre-engagement/pdf\">pdf\u003c/a> 重叠）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>不用于\u003c/strong>：\u003c/p>\n\u003cul>\u003cli>\u003cstrong>整包安装 230 个 skill\u003c/strong> —— 会严重污染 skill 触发空间（描述互相抢、上下文膨胀、定位变慢），并且其中大半是法务/财务/HR/市场岗，与 FDE 交付无关\u003c/li>\u003cli>写代码的流程纪律 → \u003ca href=\"#/cross-cutting/using-superpowers-family\">using-superpowers-family\u003c/a>；发布/QA/安全审计流水线 → \u003ca href=\"#/cross-cutting/gstack-suite\">gstack-suite\u003c/a>\u003c/li>\u003cli>已有本地等价物时：\u003ccode>documentation\u003c/code> vs \u003ca href=\"#/zone-d-handoff/document-generate\">document-generate\u003c/a>、\u003ccode>view-pdf\u003c/code> vs \u003ca href=\"#/zone-a-pre-engagement/pdf\">pdf\u003c/a>、\u003ccode>code-review\u003c/code> vs \u003ca href=\"#/cross-cutting/code-review\">code-review\u003c/a>、\u003ccode>search\u003c/code> vs \u003ca href=\"#/zone-a-pre-engagement/firecrawl-search\">firecrawl-search\u003c/a>\u003c/li>\u003c/ul>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：先确认没装——本套件 230 件\u003cstrong>未整包安装\u003c/strong>（也禁止整包：会污染触发空间）；想用某件直接对 agent 点名，如「用 deploy-checklist 出上线清单」「用 runbook 写 XX 的运维手册」\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：install-first——按需单装：\u003ccode>npx skills add anthropics/knowledge-work-plugins@&lt;skill&gt; --directory ~/.qoder/skills -y\u003c/code>（推荐顺序：\u003ccode>deploy-checklist\u003c/code> → \u003ccode>runbook\u003c/code> → \u003ccode>documentation\u003c/code>，三者已源码取证），装完再点名调用\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：\u003ccode>--directory ~/.qoder/skills\u003c/code> 必须带——这些 skill 源自 Claude 生态，缺这个参数会装进 \u003ccode>.claude/skills/\u003c/code>，Qoder 看不到\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：同仓库条目也会抢触发——实测 \u003ccode>documentation\u003c/code> 的 description 含 \u003ccode>&quot;write a runbook&quot;\u003c/code>、与 \u003ccode>runbook\u003c/code> 直接重叠；\u003ccode>architecture\u003c/code> / \u003ccode>debug\u003c/code> / \u003ccode>analyze\u003c/code> 这类极通用名易与其他来源撞车，装前过 skill-criticagent 门禁并写清&quot;它替代了谁的哪部分&quot;\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>一次只装一个，并写清&quot;它替代了谁的哪部分职责&quot;\u003c/strong>——这是本 catalog 维护规约第 3 条（装前门禁）的落地点：先跑 \u003ca href=\"#/cross-cutting/skill-criticagent\">skill-criticagent\u003c/a> 评估，通过才装\u003c/li>\u003cli>装完把该页从 📦 改 ✅、补安装日期，并在本页表格对应行标注&quot;已装&quot;\u003c/li>\u003cli>官方 skill 的产出偏&quot;通用企业知识工作&quot;，用于制造业/具身客户时要\u003cstrong>换术语\u003c/strong>：把它的模板里的 SaaS 指标替换成现场指标（OEE、停机时长、缺陷率、节拍）\u003c/li>\u003cli>平台适配：这些 skill 源自 Claude 生态，安装时务必指定 \u003ccode>--directory ~/.qoder/skills\u003c/code>（否则只会活在 \u003ccode>.claude/skills/\u003c/code>，Qoder 看不到）\u003c/li>\u003cli>版本巡检用 \u003ccode>npx skills check\u003c/code> / \u003ccode>update\u003c/code>（见 \u003ca href=\"#/cross-cutting/skill-discovery\">skill-discovery\u003c/a>），季度一次，只处理真在用的\u003c/li>\u003cli>\u003cstrong>同仓库条目之间也会抢触发\u003c/strong>：已实测 \u003ccode>documentation\u003c/code> 的 description 含 \u003ccode>&quot;write a runbook&quot;\u003c/code>，与 \u003ccode>runbook\u003c/code> 直接重叠——同时装就必须按页内约定切开职责（前者管文档体系，后者管单份手册）\u003c/li>\u003cli>取证方式：不要只看 skills.sh（页面 JS 渲染，常常抓不到正文），直接读 GitHub 上的原始 \u003ccode>SKILL.md\u003c/code>。本仓库四个候选均已按此核实为**单文件、无 \u003ccode>scripts/\u003c/code>、无网络调用**的纯模板 skill\u003c/li>\u003cli>注意命名冲突：本仓库里 \u003ccode>architecture\u003c/code>、\u003ccode>debug\u003c/code>、\u003ccode>analyze\u003c/code>、\u003ccode>search\u003c/code>、\u003ccode>update\u003c/code>、\u003ccode>start\u003c/code>、\u003ccode>standup\u003c/code> 这类\u003cstrong>极通用名\u003c/strong>与其他来源的 skill 高概率撞车——装前确认目录与触发描述是否已被占用\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>若只装 3 个的推荐顺序：\u003ca href=\"#/zone-c-operationalization/deploy-checklist\">deploy-checklist\u003c/a>（直接补 gate 证据模板）→ \u003ca href=\"#/zone-c-operationalization/sre-runbooks\">runbook\u003c/a>（Zone C 交付物）→ \u003ca href=\"#/zone-d-handoff/anthropic-documentation\">documentation\u003c/a>（Zone D 写作规范）——三者均已完成源码取证，风险面同为“纯模板”，可按此顺序直接安装\u003c/li>\u003cli>fde-scope 的 \u003ccode>docs/fde_playbook.md\u003c/code> / \u003ccode>fde_sop_full.md\u003c/code> 结构与 \u003ccode>runbook\u003c/code>、\u003ccode>deploy-checklist\u003c/code> 的输出模板可互相校准\u003c/li>\u003cli>与 \u003ccode>fde_scope/skills/\u003c/code> 的关系：这里是外部生态手册；现场沉淀的自制 skill 走 \u003ccode>.fde_scope/skills/\u003c/code> 文件库，二者不覆盖（维护规约第 5 条）\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/cross-cutting/skill-discovery\">skill-discovery\u003c/a> · \u003ca href=\"#/cross-cutting/skill-criticagent\">skill-criticagent\u003c/a> · \u003ca href=\"#/zone-c-operationalization/sre-runbooks\">sre-runbooks\u003c/a> · \u003ca href=\"#/zone-c-operationalization/incident-response\">incident-response\u003c/a> · \u003ca href=\"#/zone-d-handoff/anthropic-documentation\">anthropic-documentation\u003c/a>\u003c/p>"}, {"route": "mcp/overview", "zone": "MCP · 服务器", "zoneId": "mcp", "status": "✅", "html": "\u003ch1>MCP 服务器总览\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已连接（2026-08-31 实测：\u003cstrong>9 个 server · 178 个工具\u003c/strong>）· 类型：能力底座总览 · FDE 位点：横切（所有 Zone 的上游）\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>MCP（Model Context Protocol）是把\u003cstrong>外部系统能力\u003c/strong>接进 agent 会话的标准协议：每个 server 暴露一组工具，agent 按需调用。它与另外两层能力的关系是新人最该先建立的模型：\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>层\u003c/th>\u003cth>形态\u003c/th>\u003cth>例子\u003c/th>\u003cth>特点\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>内置工具\u003c/strong>\u003c/td>\u003ctd>随客户端自带，零安装\u003c/td>\u003ctd>Read / Edit / Bash / Agent\u003c/td>\u003ctd>永远可用，见 \u003ca href=\"#/tools/overview\">内置工具总览\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>MCP 工具\u003c/strong>\u003c/td>\u003ctd>server 按协议动态暴露\u003c/td>\u003ctd>\u003ccode>firecrawl_scrape\u003c/code>、\u003ccode>take_screenshot\u003c/code>\u003c/td>\u003ctd>数量随插件版本漂移，schema 按需加载\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Skill\u003c/strong>\u003c/td>\u003ctd>方法论 + 脚本包\u003c/td>\u003ctd>firecrawl-search、chrome-devtools\u003c/td>\u003ctd>在 MCP/内置之上封装最佳实践，见各 Zone 页\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>本机已连接的 9 个 server 全景：\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Server\u003c/th>\u003cth>工具数\u003c/th>\u003cth>提供方\u003c/th>\u003cth>一句话\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#/mcp/cloud-agents-qca\">qca（cloud-agents）\u003c/a>\u003c/td>\u003ctd>82\u003c/td>\u003ctd>插件 qoder-cloud-agents v0.1.0\u003c/td>\u003ctd>云端 agent 全生命周期管理\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#/mcp/chrome-devtools-mcp\">chrome-devtools\u003c/a>\u003c/td>\u003ctd>29\u003c/td>\u003ctd>插件 chrome-devtools-mcp v1.2.0\u003c/td>\u003ctd>浏览器调试全栈（性能/网络/快照）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#/mcp/firecrawl-mcp\">firecrawl\u003c/a>\u003c/td>\u003ctd>27\u003c/td>\u003ctd>插件 firecrawl v0.1.0\u003c/td>\u003ctd>搜索/抓取/爬站/监测/论文研究\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#/mcp/browser-use\">browser-use\u003c/a>\u003c/td>\u003ctd>16\u003c/td>\u003ctd>客户端内置\u003c/td>\u003ctd>轻量浏览器交互自动化\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#/mcp/computer-use\">computer-use\u003c/a>\u003c/td>\u003ctd>10\u003c/td>\u003ctd>插件 computer-use（bundler 分发）\u003c/td>\u003ctd>原生 macOS 应用自动化\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#/mcp/qmind-mcp\">qoder-qmind\u003c/a>\u003c/td>\u003ctd>7\u003c/td>\u003ctd>客户端内置\u003c/td>\u003ctd>QMind 知识库检索与管理\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#/mcp/record-and-replay\">record-and-replay\u003c/a>\u003c/td>\u003ctd>3\u003c/td>\u003ctd>客户端内置\u003c/td>\u003ctd>录制操作流 → 生成 skill\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#/mcp/extension-market\">extension-market\u003c/a>\u003c/td>\u003ctd>2\u003c/td>\u003ctd>客户端内置\u003c/td>\u003ctd>插件市场搜索/安装\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#/mcp/cloudflare-docs-mcp\">cloudflare-docs\u003c/a>\u003c/td>\u003ctd>2\u003c/td>\u003ctd>插件 cloudflare v1.0.0\u003c/td>\u003ctd>CF 官方文档检索/迁移指南\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>另有 sentry / datadog / postman 等 MCP 型插件已按\u003cstrong>插件维度\u003c/strong>建档（\u003ca href=\"#/zone-c-operationalization/sentry-mcp\">sentry-mcp\u003c/a> / \u003ca href=\"#/zone-c-operationalization/datadog\">datadog\u003c/a> / \u003ca href=\"#/zone-b-build/postman\">postman\u003c/a>），不重复立页。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>新人第一件事\u003c/strong>：扫一遍本页表格建立&quot;手边有什么&quot;的地图，再按任务进对应页；配合&quot;新人第一周&quot;场景卡（门户主页顶部）走完上手路径\u003c/li>\u003cli>\u003cstrong>取证与自动化\u003c/strong>：浏览器（chrome-devtools / browser-use）、桌面应用（computer-use）、网页数据（firecrawl）都是直接可调的工具面，不必先装任何东西\u003c/li>\u003cli>\u003cstrong>要把能力变成共享服务\u003c/strong>：qca 的 82 个工具就是云端 agent 的完整 API 面，可被脚本与 CI 调用\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：把本页当 API 手册逐字背——参数以 live schema 为准（见最佳实践）；重复封装 skill 已覆盖的场景（先查 \u003ca href=\"../README.md\" target=\"_blank\" rel=\"noopener\">手册库索引\u003c/a> 有没有对应 skill）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：入职第一天 / 接手新环境先读这页——&quot;我手边有哪些 MCP 能力&quot;从这张表开始\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：扫一遍上面的 9 server 表记住&quot;有事找哪个 server&quot;，再拿一个工具练手 lazy-loading 三步：\u003ccode>mcp_list({keyword: &quot;screenshot&quot;})\u003c/code> → \u003ccode>mcp_get\u003c/code> 读 schema → \u003ccode>mcp_call\u003c/code> 调用\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：以为 178 个工具会话开始就全在上下文里——MCP 是 lazy-loading，不 \u003ccode>mcp_list\u003c/code> 就不存在；凭记忆传参会撞 schema 校验错，调用前必读 \u003ccode>mcp_get\u003c/code>\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Lazy-loading 三步\u003c/strong>：工具 schema 不在会话开始时全量注入，而是 \u003ccode>mcp_list\u003c/code>（按关键词发现）→ \u003ccode>mcp_get\u003c/code>（读单个工具的 inputSchema）→ \u003ccode>mcp_call\u003c/code>（调用）。\u003cstrong>调用前必读 schema\u003c/strong>，输入是扁平 JSON，不要自作主张包 \u003ccode>path\u003c/code>/\u003ccode>query\u003c/code>/\u003ccode>body\u003c/code>\u003c/li>\u003cli>\u003cstrong>工具数会漂移\u003c/strong>：本页数字是 2026-08-31 快照；插件升级后以 \u003ccode>mcp_list\u003c/code> 实测为准，页内改动走 \u003ccode>make check-catalog\u003c/code> 门禁\u003c/li>\u003cli>\u003cstrong>skill 优先原则\u003c/strong>：MCP 工具是&quot;原料&quot;，skill 是&quot;菜谱&quot;——firecrawl 的日常入口是 \u003ca href=\"#/zone-a-pre-engagement/firecrawl-search\">firecrawl-search\u003c/a> 这类 skill 页，直接调 MCP 工具留给组合与底账场景\u003c/li>\u003cli>\u003cstrong>破坏性工具先确认\u003c/strong>：qca 的 \u003ccode>delete_*\u003c/code> 族、monitor 的删除、\u003ccode>handle_dialog\u003c/code> 代答确认框，都属于&quot;先展示、再执行&quot;\u003c/li>\u003cli>报错时先 \u003ccode>mcp_get\u003c/code> 复核参数名与类型，再怀疑网络/服务端\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>fde-scope 的 \u003ccode>connectors/\u003c/code> 层与 MCP 是同构思想：都把外部系统适配成统一工具面；给客户做集成时，\u003cstrong>写一个 MCP server 本身就是可交付物之一\u003c/strong>（参考 \u003ca href=\"#/cross-cutting/mcp-criticagent\">mcp-criticagent\u003c/a> 的评估标准）\u003c/li>\u003cli>Zone B 验证环节：chrome-devtools 的性能/网络取证是 Web 交付验收标配\u003c/li>\u003cli>Zone C：sentry / datadog（MCP 型插件）是可观测性入口；qca 是无人值守执行端\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/tools/overview\">内置工具总览\u003c/a> · \u003ca href=\"#/mcp/cloud-agents-qca\">cloud-agents-qca\u003c/a> · \u003ca href=\"#/mcp/chrome-devtools-mcp\">chrome-devtools\u003c/a> · \u003ca href=\"#/mcp/firecrawl-mcp\">firecrawl\u003c/a> · \u003ca href=\"#/mcp/browser-use\">browser-use\u003c/a> · \u003ca href=\"#/mcp/computer-use\">computer-use\u003c/a> · \u003ca href=\"#/mcp/qmind-mcp\">qmind\u003c/a> · \u003ca href=\"#/mcp/cloudflare-docs-mcp\">cloudflare-docs\u003c/a> · \u003ca href=\"#/mcp/extension-market\">extension-market\u003c/a> · \u003ca href=\"#/mcp/record-and-replay\">record-and-replay\u003c/a> · \u003ca href=\"#/cross-cutting/skill-discovery\">skill-discovery\u003c/a>\u003c/p>"}, {"route": "mcp/cloud-agents-qca", "zone": "MCP · 服务器", "zoneId": "mcp", "status": "✅", "html": "\u003ch1>cloud-agents / qca（MCP server）\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已连接（插件 qoder-cloud-agents v0.1.0，带 \u003ccode>mcp.json\u003c/code>）· 类型：MCP 服务器 · \u003cstrong>82 个工具\u003c/strong>（本机会话 2026-08-31 实测）· FDE 位点：Zone B 长任务 / Zone C 无人值守\u003cbr>平台概念、REST 直连、成本与选型见 \u003ca href=\"#/cross-cutting/cloud-agents\">cloud-agents\u003c/a>；本页只讲 MCP 工具面\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>Cloud Agents 平台的完整工具面，按资源域分组（\u003ccode>list_\u003c/code> / \u003ccode>create_\u003c/code> / \u003ccode>get_\u003c/code> / \u003ccode>update_\u003c/code> / \u003ccode>delete_\u003c/code> / \u003ccode>archive_\u003c/code> 动词族）：\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>资源域\u003c/th>\u003cth>工具（举要）\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>agents\u003c/strong>\u003c/td>\u003ctd>\u003ccode>create_agent\u003c/code> / \u003ccode>get_agent\u003c/code> / \u003ccode>update_agent\u003c/code> / \u003ccode>archive_agent\u003c/code> / \u003ccode>list_agents\u003c/code> / \u003ccode>list_agent_versions\u003c/code>\u003c/td>\u003ctd>定义 agent 与版本管理；只有 archive 没有 delete\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>environments\u003c/strong>\u003c/td>\u003ctd>\u003ccode>create_environment\u003c/code> / \u003ccode>get_environment\u003c/code> / \u003ccode>update_environment\u003c/code> / \u003ccode>delete_environment\u003c/code> / \u003ccode>archive_environment\u003c/code> / \u003ccode>list_environments\u003c/code>\u003c/td>\u003ctd>运行环境；被引用过的删不掉，走 archive\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>sessions\u003c/strong>\u003c/td>\u003ctd>\u003ccode>create_session\u003c/code> / \u003ccode>get_session\u003c/code> / \u003ccode>update_session\u003c/code> / \u003ccode>delete_session\u003c/code> / \u003ccode>cancel_session\u003c/code> / \u003ccode>archive_session\u003c/code> / \u003ccode>send_session_events\u003c/code> / \u003ccode>list_session_threads\u003c/code> / \u003ccode>list_session_events\u003c/code> / \u003ccode>list_session_event_summaries\u003c/code> / \u003ccode>list_session_thread_events\u003c/code>\u003c/td>\u003ctd>会话生命周期 + 事件流（SSE 语义）+ 线程\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>files &amp; resources\u003c/strong>\u003c/td>\u003ctd>\u003ccode>list_files\u003c/code> / \u003ccode>get_file\u003c/code> / \u003ccode>get_file_content\u003c/code> / \u003ccode>delete_file\u003c/code> + session resources \u003ccode>add/get/update/delete/list_session_resource\u003c/code>\u003c/td>\u003ctd>大数据集挂成资源让容器内读盘\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>memories &amp; stores\u003c/strong>\u003c/td>\u003ctd>\u003ccode>create_memory\u003c/code> / \u003ccode>get_memory\u003c/code> / \u003ccode>update_memory\u003c/code> / \u003ccode>delete_memory\u003c/code> / \u003ccode>redact_memory_version\u003c/code> / \u003ccode>list_memory_versions\u003c/code> + memory store 族\u003c/td>\u003ctd>agent 记忆；\u003ccode>redact_memory_version\u003c/code> 是合规利器\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>vaults\u003c/strong>\u003c/td>\u003ctd>\u003ccode>create_vault\u003c/code> / \u003ccode>list_vaults\u003c/code> / \u003ccode>delete_vault\u003c/code> / \u003ccode>archive_vault\u003c/code> + credentials \u003ccode>get/delete/archive_vault_credential\u003c/code> / \u003ccode>list_vault_credentials\u003c/code> / \u003ccode>validate_vault_credential\u003c/code> / \u003ccode>start_vault_oauth\u003c/code>\u003c/td>\u003ctd>凭据托管与 OAuth 流程\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>deployments\u003c/strong>\u003c/td>\u003ctd>\u003ccode>create_deployment\u003c/code> / \u003ccode>get_deployment\u003c/code> / \u003ccode>update_deployment\u003c/code> / \u003ccode>archive_deployment\u003c/code> / \u003ccode>list_deployments\u003c/code> / \u003ccode>list_deployment_runs\u003c/code> / \u003ccode>run_deployment\u003c/code> / \u003ccode>pause_deployment\u003c/code> / \u003ccode>unpause_deployment\u003c/code>\u003c/td>\u003ctd>计划任务/常驻服务的发布与运维\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>skills\u003c/strong>\u003c/td>\u003ctd>\u003ccode>get_skill\u003c/code> / \u003ccode>list_skills\u003c/code> / \u003ccode>list_skill_versions\u003c/code> / \u003ccode>delete_skill\u003c/code> / \u003ccode>delete_skill_version\u003c/code>\u003c/td>\u003ctd>云端 agent 的技能库管理\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>dreams &amp; models\u003c/strong>\u003c/td>\u003ctd>\u003ccode>create_dream\u003c/code> / \u003ccode>get_dream\u003c/code> / \u003ccode>list_dreams\u003c/code> / \u003ccode>cancel_dream\u003c/code> / \u003ccode>archive_dream\u003c/code> + \u003ccode>list_models\u003c/code>\u003c/td>\u003ctd>异步意图任务与可用模型查询\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>长任务托管\u003c/strong>：大代码库分析、批量语料处理，合上笔记本继续跑\u003c/li>\u003cli>\u003cstrong>无人值守\u003c/strong>：定时报表/巡检（与本地 \u003ca href=\"#/cross-cutting/schedule\">schedule\u003c/a> 的分工见下）\u003c/li>\u003cli>\u003cstrong>团队共享入口\u003c/strong>：脚本/CI 通过它驱动云端 agent，不依赖任何人本机在线\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：一次性小任务（云端会话固定开销不划算）；要读客户内网资源的任务（云端容器不在客户网络里）；宿主环境要求 MCP 托管身份之外的直连场景（→ REST 入口，见 \u003ca href=\"#/cross-cutting/cloud-agents\">cloud-agents\u003c/a>）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说&quot;把这个长任务放到云端跑 / 定时每天巡检 / 查一下我的 cloud agents&quot;\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：新账号先 \u003ccode>create_environment\u003c/code>——没有环境 \u003ccode>create_session\u003c/code> 直接失败，这是最常见的入门坑；建会话前先 \u003ccode>list_models\u003c/code> 确认模型可用性\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：绝不给工具传 PAT/Authorization header（身份由 Gateway 注入，缺能力就问用户，不要静默回落 REST）；\u003ccode>delete_session\u003c/code> 连事件一起删、\u003ccode>delete_vault\u003c/code> 连带删凭据——破坏性调用前必须确认\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>新账号先建 environment\u003c/strong>：\u003ccode>create_session\u003c/code> 前必须 \u003ccode>create_environment\u003c/code>，否则直接失败——最常见的入门坑\u003c/li>\u003cli>\u003cstrong>绝不自带鉴权\u003c/strong>：不要给工具传 PAT/SAT/Authorization header/user ID——身份由 Gateway 注入；缺能力就如实说明并问用户，\u003cstrong>不要静默回落到 REST/curl\u003c/strong>\u003c/li>\u003cli>**先 \u003ccode>list_models\u003c/code> 再 \u003ccode>create_agent\u003c/code>**：模型可用性因账号/区域而异，写死模型名是脆弱配置\u003c/li>\u003cli>\u003cstrong>分页参数三选一\u003c/strong>：\u003ccode>page\u003c/code> / \u003ccode>after_id\u003c/code> / \u003ccode>before_id\u003c/code> 只用一个；\u003ccode>next_page\u003c/code> 只能再当 \u003ccode>page\u003c/code> 用，别当数字\u003c/li>\u003cli>\u003cstrong>破坏性操作清单\u003c/strong>（调用前必须确认）：\u003ccode>delete_session\u003c/code> 连事件一起删、\u003ccode>delete_vault\u003c/code> 连带删所有凭据、\u003ccode>delete_skill_version\u003c/code> 不可恢复；agent/deployment/environment 被引用过删不掉 → 用 archive\u003c/li>\u003cli>\u003cstrong>大数据走 Files API\u003c/strong>：把数据集挂成 session resource 让容器读盘，别把内容塞进消息\u003c/li>\u003cli>**不自动批准 \u003ccode>agent.tool_use\u003c/code>**：先向用户展示动作，确认后才发 \u003ccode>user.tool_confirmation\u003c/code>\u003c/li>\u003cli>与本地 \u003ca href=\"#/cross-cutting/schedule\">schedule\u003c/a> 的分工：本地调度靠客户端醒着，云端调度靠平台（deployment）——要&quot;不依赖我笔记本&quot;就选云端\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone B：批量语料长时处理、\u003ca href=\"#/zone-b-build/bailian-train-deploy\">bailian-train-deploy\u003c/a> 训练等待期的异步盯守\u003c/li>\u003cli>Zone C：客户侧定时报表与巡检的&quot;不依赖我笔记本&quot;执行端；配合 \u003ca href=\"#/zone-c-operationalization/sentry-mcp\">sentry-mcp\u003c/a> 做每日错误汇总\u003c/li>\u003cli>fde-scope 的 \u003ccode>deploy/\u003c/code>（AgentScope \u003ccode>DockerWorkspace\u003c/code>）管&quot;客户交付物跑在哪&quot;，qca 管&quot;agent 跑在哪&quot;——两个不同层的容器化选项，不要混用\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/mcp/overview\">总览\u003c/a> · \u003ca href=\"#/cross-cutting/cloud-agents\">cloud-agents 平台页\u003c/a> · \u003ca href=\"#/cross-cutting/schedule\">schedule\u003c/a> · \u003ca href=\"#/cross-cutting/dispatching-parallel-agents\">dispatching-parallel-agents\u003c/a> · \u003ca href=\"#/cross-cutting/mcp-criticagent\">mcp-criticagent\u003c/a>\u003c/p>"}, {"route": "mcp/chrome-devtools-mcp", "zone": "MCP · 服务器", "zoneId": "mcp", "status": "✅", "html": "\u003ch1>chrome-devtools（MCP server）\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已连接（插件 chrome-devtools-mcp v1.2.0）· 类型：MCP 服务器 · \u003cstrong>29 个工具\u003c/strong> · FDE 位点：Zone B 验证 / Zone C 排障\u003cbr>skill 页：\u003ca href=\"#/zone-c-operationalization/chrome-devtools\">chrome-devtools\u003c/a>（方法论）· \u003ca href=\"#/zone-c-operationalization/web-perf\">web-perf\u003c/a> / \u003ca href=\"#/zone-c-operationalization/debug-optimize-lcp\">debug-optimize-lcp\u003c/a>（性能专项）\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>本地 Chrome 的\u003cstrong>调试全栈\u003c/strong>工具面，29 个工具分五族：\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>工具族\u003c/th>\u003cth>工具\u003c/th>\u003cth>用途\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>页面管理\u003c/td>\u003ctd>\u003ccode>list_pages\u003c/code> / \u003ccode>new_page\u003c/code> / \u003ccode>navigate_page\u003c/code> / \u003ccode>select_page\u003c/code> / \u003ccode>close_page\u003c/code> / \u003ccode>resize_page\u003c/code> / \u003ccode>emulate\u003c/code>\u003c/td>\u003ctd>多标签管理、导航、视口调整、\u003cstrong>设备/网络仿真\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>交互\u003c/td>\u003ctd>\u003ccode>click\u003c/code> / \u003ccode>fill\u003c/code> / \u003ccode>fill_form\u003c/code> / \u003ccode>hover\u003c/code> / \u003ccode>drag\u003c/code> / \u003ccode>type_text\u003c/code> / \u003ccode>press_key\u003c/code> / \u003ccode>upload_file\u003c/code> / \u003ccode>handle_dialog\u003c/code> / \u003ccode>wait_for\u003c/code>\u003c/td>\u003ctd>表单、点击、键盘、上传、对话框、条件等待\u003c/td>\u003c/tr>\u003ctr>\u003ctd>取证\u003c/td>\u003ctd>\u003ccode>take_snapshot\u003c/code> / \u003ccode>take_screenshot\u003c/code> / \u003ccode>evaluate_script\u003c/code>\u003c/td>\u003ctd>AX 树快照（给 agent 看的结构）、截图、页内 JS 执行\u003c/td>\u003c/tr>\u003ctr>\u003ctd>网络与控制台\u003c/td>\u003ctd>\u003ccode>list_network_requests\u003c/code> / \u003ccode>get_network_request\u003c/code> / \u003ccode>list_console_messages\u003c/code> / \u003ccode>get_console_message\u003c/code>\u003c/td>\u003ctd>请求瀑布/单请求详情、报错与日志取证\u003c/td>\u003c/tr>\u003ctr>\u003ctd>性能\u003c/td>\u003ctd>\u003ccode>performance_start_trace\u003c/code> / \u003ccode>performance_stop_trace\u003c/code> / \u003ccode>performance_analyze_insight\u003c/code> / \u003ccode>lighthouse_audit\u003c/code> / \u003ccode>take_heapsnapshot\u003c/code>\u003c/td>\u003ctd>性能追踪与 insight 解读、Lighthouse 审计、堆快照（内存泄漏）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Web 交付验收\u003c/strong>：功能走查（snapshot + 交互）+ 性能（trace/lighthouse）+ 网络（请求取证）一站式\u003c/li>\u003cli>\u003cstrong>排障取证\u003c/strong>：console 报错、失败请求的响应体、竞态时的时序截图\u003c/li>\u003cli>\u003cstrong>性能专项\u003c/strong>：LCP/INP 调优走 trace → \u003ccode>performance_analyze_insight\u003c/code> 读结论，配合 \u003ca href=\"#/zone-c-operationalization/debug-optimize-lcp\">debug-optimize-lcp\u003c/a>\u003c/li>\u003cli>\u003cstrong>内存泄漏\u003c/strong>：\u003ccode>take_heapsnapshot\u003c/code> + \u003ca href=\"#/zone-c-operationalization/memory-leak-debugging\">memory-leak-debugging\u003c/a>\u003c/li>\u003cli>\u003cstrong>响应式检查\u003c/strong>：\u003ccode>resize_page\u003c/code> / \u003ccode>emulate\u003c/code> 模拟移动视口与弱网\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：纯数据抓取（\u003ca href=\"#/mcp/firecrawl-mcp\">firecrawl\u003c/a> 更省）；非浏览器桌面应用（\u003ca href=\"#/mcp/computer-use\">computer-use\u003c/a>）；需要离线确定性产物的批量截图（并行会话共用 Chrome 会互相干扰，用隔离 profile 的 headless CLI）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说&quot;打开页面走一遍并截图 / 看看 console 报什么错 / 测下 LCP / 跑个 Lighthouse&quot;\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：交互前先让 agent \u003ccode>take_snapshot\u003c/code> 拿 AX 树——click/fill 都基于快照元素定位；取证顺序固定 snapshot → console → network\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：并行会话共用同一个 Chrome，\u003ccode>select_page\u003c/code>/视口互相抢占——确定性截图改用隔离 profile 的 headless CLI；\u003ccode>wait_for\u003c/code> 等条件而非固定 sleep\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>**先 \u003ccode>take_snapshot\u003c/code> 再交互**：AX 树快照给出可寻址的元素结构，比&quot;截图猜坐标&quot;可靠一个数量级；\u003ccode>click\u003c/code>/\u003ccode>fill\u003c/code> 都基于快照里的元素定位\u003c/li>\u003cli>\u003cstrong>并行会话抢 Chrome\u003c/strong>：多个 agent 会话共用同一个浏览器时，\u003ccode>select_page\u003c/code>/视口设置会互相抢占——长流程取证前确认没有并行会话在操作浏览器，或改用 headless CLI\u003c/li>\u003cli>\u003ccode>wait_for\u003c/code> 等条件而不是 \u003ccode>sleep\u003c/code>：等文本出现/请求完成，避免固定延时造成的假阳性\u003c/li>\u003cli>\u003ccode>emulate\u003c/code> 可仿真 CPU 降速与网络节流——性能问题客户&quot;复现不出来&quot;时先用它\u003c/li>\u003cli>\u003ccode>evaluate_script\u003c/code> 是双刃剑：取证方便，但注入的脚本要幂等、无副作用，别在客户页面留状态\u003c/li>\u003cli>网络取证先 \u003ccode>list_network_requests\u003c/code> 看瀑布，再对可疑请求 \u003ccode>get_network_request\u003c/code> 看请求/响应体——报障单里这对组合最有说服力\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>fde-scope 的 Web 交付（pawapp 前端、门户 site/index.html）验收：双模式（浅/深）+
