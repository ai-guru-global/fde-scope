更），它会按 Pre-Deploy / Deploy / Post-Deploy / Rollback Triggers 四段生成清单并追加对应核验项\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：Rollback Triggers 阈值必须填真实基线（\u003ccode>P50 超过 X ms\u003c/code> 的空占位符等于没写），并与客户\u003cstrong>书面\u003c/strong>确认后才算通过——口头共识不算\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：清单要落成文件进交付包或 \u003ccode>.fde_scope/\u003c/code>，只留在会话里无法追溯；客户现场用它做核验留痕，别用自动改远端的发布流程替代\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>上游信源已核\u003c/strong>：该 skill 是纯模板（无可执行脚本、无外部依赖、无网络调用），风险面极小；且上游仓库对每个条目跑\u003cstrong>强制的 Claude policy scan 状态检查\u003c/strong>（\u003ccode>.github/workflows/scan-plugins.yml\u003c/code>，按 (plugin, sha) 缓存判定，未通过会由 \u003ccode>revert-failed-bumps.yml\u003c/code> 自动剔除），供应链治理在同类 skill 里属最强一档\u003c/li>\u003cli>与已装的 \u003ca href=\"#/cross-cutting/gstack-suite\">gstack-suite\u003c/a> \u003ccode>land-and-deploy\u003c/code> / \u003ccode>setup-deploy\u003c/code> 有重叠：GStack 偏&quot;自动化执行发布动作&quot;，本 skill 偏&quot;人工核验清单&quot;。\u003cstrong>在客户现场优先用本 skill\u003c/strong>（核验留痕，不自动改远端）\u003c/li>\u003cli>阈值必须填\u003cstrong>真实基线\u003c/strong>：\u003ccode>P50 超过 X ms\u003c/code> 的空占位符等于没写；从 \u003ca href=\"#/zone-c-operationalization/web-perf\">web-perf\u003c/a> / \u003ca href=\"#/zone-c-operationalization/sentry-mcp\">sentry-mcp\u003c/a> / 现场历史指标取数\u003c/li>\u003cli>把&quot;回滚触发条件&quot;当作硬契约：与客户方书面确认后才算通过，口头共识不算（这是 gate 证据的关键一环）\u003c/li>\u003cli>制造业/具身场景要加自己的项：气隙环境离线包校验、固件/模型版本对照表、产线停机窗口确认、班次交接（ShiftHandover gate）\u003c/li>\u003cli>清单落地成文件（进交付包或 \u003ccode>.fde_scope/\u003c/code>），不要只留在会话里——否则无法追溯\u003c/li>\u003cli>装前门禁：按 \u003ca href=\"../README.md\" target=\"_blank\" rel=\"noopener\">../README.md\u003c/a> 规约第 3 条，安装后跑一次 \u003ca href=\"#/cross-cutting/skill-criticagent\">skill-criticagent\u003c/a> 记录本地行为判定，再把本页状态改为 ✅\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone B→C 交界：\u003ccode>fde-scope engage advance\u003c/code> 触达 SLO / HandoffSignoff gate 前的固定核验动作\u003c/li>\u003cli>与 \u003ccode>docs/code_review_checklist.md\u003c/code> 配对：一个管代码合入前，一个管投递生产前\u003c/li>\u003cli>候选用法：把本 skill 的四段模板直接改造成 fde-scope 的 gate 证据模板（\u003ccode>fde_scope/engagement/gates/\u003c/code> 的工业 gate 各缺一份&quot;上线核验&quot;附件）\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-c-operationalization/sre-runbooks\">sre-runbooks\u003c/a> · \u003ca href=\"#/zone-c-operationalization/incident-response\">incident-response\u003c/a> · \u003ca href=\"#/cross-cutting/gstack-suite\">gstack-suite\u003c/a> · \u003ca href=\"#/cross-cutting/knowledge-work-suite\">knowledge-work-suite\u003c/a> · 架构可视化插件的 \u003ccode>architecture-health\u003c/code>（文档/图与代码一致性，见 \u003ca href=\"#/cross-cutting/architecture-visualization-suite\">architecture-visualization-suite\u003c/a>）\u003c/p>"}, {"route": "zone-c-operationalization/huggingface-llm-trainer", "zone": "Zone C · Operationalization", "zoneId": "zone-c-operationalization", "status": "✅", "html": "\u003ch1>huggingface-llm-trainer\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（hugging-face 插件 v1.0.0）· 类型：训练执行 · FDE 位点：Zone C flywheel（重训后端候选）\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>在 \u003cstrong>Hugging Face Jobs 云 GPU\u003c/strong> 上做 SFT / DPO / GRPO / reward modeling，并支持 GGUF 转换用于本地部署。覆盖 TRL Jobs 包、PEP 723 头的 UV 脚本、数据集准备与校验、硬件选型、\u003cstrong>成本预估\u003c/strong>、Trackio 监控、Hub 认证与模型持久化。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>\u003ccode>fde_scope/flywheel/retrain_scheduler.py\u003c/code> 目前是 \u003cstrong>stub\u003c/strong>（&quot;actual fine-tune submission is a roadmap item&quot;）——本 skill 是把这个 stub 落成真实动作的候选后端之一\u003c/li>\u003cli>现场没有本地 GPU，但要跑微调实验\u003c/li>\u003cli>交付产物需要一个可直接调用的 Hub 模型，或需要 GGUF 让客户在内网笔记本上跑\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：本地 GPU 训练（→ \u003ca href=\"#/zone-c-operationalization/trl-training\">trl-training\u003c/a>）；百炼平台客户（→ \u003ca href=\"#/zone-b-build/bailian-train-deploy\">bailian-train-deploy\u003c/a>，数据不出阿里云）；视觉模型（→ \u003ca href=\"#/zone-c-operationalization/huggingface-vision-trainer\">huggingface-vision-trainer\u003c/a>）；\u003cstrong>含客户数据\u003c/strong>的训练（HF Jobs 会把数据传到 Hub——合规红线）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说「用 HF Jobs 微调一个模型」「fine-tune 后转成 GGUF 在客户内网跑」——SKILL.md 约定：用户提&quot;train a model&quot;它就必须建脚本并立即用 \u003ccode>hf_jobs()\u003c/code> 提交\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：先验证前置：\u003ccode>hf auth whoami\u003c/code> 确认登录（Jobs 需 Pro/Team/Enterprise 计划、token 有 write 权限），再校验数据集 \u003ccode>uv run scripts/dataset_inspector.py --dataset &lt;user/dataset&gt; --split train\u003c/code>，通过后才让 agent 用 \u003ccode>hf_jobs(&quot;uv&quot;, {...})\u003c/code> 提交训练\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：job 默认 timeout 30 分钟对多数训练\u003cstrong>太短\u003c/strong>——超时即失败且丢失全部进度，提交前按预估时长把 timeout 调到 1–2 小时以上\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：训练环境是临时的，不推 Hub 结果全丢——job 配置必须带 \u003ccode>secrets={&quot;HF_TOKEN&quot;: &quot;$HF_TOKEN&quot;}\u003c/code> 且脚本开 \u003ccode>push_to_hub=True\u003c/code>、\u003ccode>hub_model_id=&quot;user/model-name&quot;\u003c/code>；另外 TRL 配置参数是 \u003ccode>max_length\u003c/code>，写 \u003ccode>max_seq_length\u003c/code> 会直接 TypeError\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>⚠️ \u003cstrong>数据出境判断\u003c/strong>：HF Jobs 需要把数据集上传 Hub（即便 private repo）。工业客户/政企默认视为不可接受，须书面确认后才用；否则一律走本地/私有云训练\u003c/li>\u003cli>先成本预估再提交：明确 GPU 型号与时长，demo 用最小规格，跑通即停\u003c/li>\u003cli>数据集准备阶段就用 skill 的 validate 流程，训练失败往往源于格式与字段缺失\u003c/li>\u003cli>训练与评估闭环：Trackio 曲线留档 → 用 \u003ca href=\"#/zone-b-build/huggingface-community-evals\">huggingface-community-evals\u003c/a> + \u003ccode>fde_scope.eval\u003c/code> 双证，再谈上线\u003c/li>\u003cli>版本可追溯：记录 base model revision + dataset hash + 训练配置，写进 engagement 记录（交接必需）\u003c/li>\u003cli>GGUF 转换只在&quot;客户要离线本地跑&quot;时用，别为省事牺牲精度\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone C \u003ccode>flywheel\u003c/code>：周度增量重训的执行后端候选（配合 \u003ca href=\"#/cross-cutting/schedule\">schedule\u003c/a>）\u003c/li>\u003cli>Zone B \u003ccode>validate\u003c/code>：LoRA/SFT 实验的云端算力来源\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-c-operationalization/trl-training\">trl-training\u003c/a> · \u003ca href=\"#/zone-c-operationalization/huggingface-vision-trainer\">huggingface-vision-trainer\u003c/a> · \u003ca href=\"#/zone-b-build/bailian-train-deploy\">bailian-train-deploy\u003c/a>\u003c/p>"}, {"route": "zone-c-operationalization/huggingface-vision-trainer", "zone": "Zone C · Operationalization", "zoneId": "zone-c-operationalization", "status": "✅", "html": "\u003ch1>huggingface-vision-trainer\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（hugging-face 插件 v1.0.0）· 类型：视觉训练 · FDE 位点：Zone B/C 具身与制造业场景\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>在 Transformers + HF Jobs 云 GPU 上训练/微调视觉模型：目标检测（D-FINE、RT-DETR v2、DETR、YOLOS）、图像分类（timm：MobileNetV3、MobileViT、ResNet、ViT/DINOv3 等）、SAM/SAM2 分割（bbox/point prompt、DiceCE loss）。含 COCO 格式数据准备、Albumentations 增强、mAP/mAR 与准确率评估、硬件选型、成本预估、Trackio 监控、Hub 持久化。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>制造业/具身机器人场景的视觉质检、部件定位、抓取前分割（fde-scope 的 manufacturing profile 延伸能力）\u003c/li>\u003cli>客户只有几百张标注图，需要小样本微调而不是从零训练\u003c/li>\u003cli>需要在边缘设备上跑分类 → 先用 MobileNetV3/MobileViT 这类小模型验证可行性\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：LLM/文本微调（→ \u003ca href=\"#/zone-c-operationalization/trl-training\">trl-training\u003c/a> / \u003ca href=\"#/zone-c-operationalization/huggingface-llm-trainer\">huggingface-llm-trainer\u003c/a>）；ROS2 bag 的解析与数据集导出（→ \u003ccode>fde_scope/connectors/ros2_bag.py\u003c/code>）；数据不出厂客户（HF Jobs 需上传数据，先做合规判断）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说「微调一个缺陷检测模型」「用几张标注图 fine-tune SAM 做分割」——SKILL.md 触发词覆盖 object detection / image classification / SAM2 / DETR / timm 等\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：先 \u003ccode>hf auth whoami\u003c/code> 确认认证（Jobs 需付费计划），再跑 \u003ccode>uv run scripts/dataset_inspector.py --dataset &lt;user/dataset&gt; --split train\u003c/code> 校验数据格式，✓ READY 后让 agent 按 \u003ccode>scripts/object_detection_training.py\u003c/code> / \u003ccode>image_classification_training.py\u003c/code> / \u003ccode>sam_segmentation_training.py\u003c/code> 提交\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：格式不匹配是训练失败的头号原因——目标检测注记必须在 \u003ccode>objects\u003c/code> 列（\u003ccode>bbox\u003c/code> + \u003ccode>category\u003c/code>），分类必须有 \u003ccode>image\u003c/code> + \u003ccode>label\u003c/code> 列，SAM 数据必须带 \u003ccode>prompt\u003c/code>/\u003ccode>bbox\u003c/code>/\u003ccode>point\u003c/code> prompt 列（bbox 用 xyxy 绝对像素）；GPU 训练前必跑 inspector\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：job 默认 timeout 30 分钟太短，超时丢全部进度；先 10% 数据/1 个 epoch 验证收敛再放全量，Trackio 曲线存档进交付记录\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>数据格式先对齐 COCO（bbox 归一化/类别映射最容易出错），再谈模型选择\u003c/li>\u003cli>模型选择从任务反推：实时性优先 RT-DETR/MobileViT；精度优先 D-FINE/DINOv3；标注少考虑 SAM 交互式分割补标\u003c/li>\u003cli>指标口径要提前和客户书面确认（mAP@0.5 还是 @0.5:0.95），验收扯皮多源于此\u003c/li>\u003cli>增强策略保守：工业图像不要乱用颜色抖动（会破坏缺陷判据）\u003c/li>\u003cli>算力成本：先 1 个 epoch 小样本验证收敛趋势，再放全量；Trackio 曲线存档进交付记录\u003c/li>\u003cli>与 fde-scope 衔接：训练产物的评估报告应接入 \u003ccode>EvalReport\u003c/code> 形式，保持交付材料同一口径\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone B \u003ccode>manufacturing\u003c/code>：视觉质检模型的小样本微调\u003c/li>\u003cli>Zone C：缺陷类型漂移后的再训练（flywheel 视觉分支）\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-c-operationalization/trl-training\">trl-training\u003c/a> · \u003ca href=\"#/zone-c-operationalization/huggingface-llm-trainer\">huggingface-llm-trainer\u003c/a> · \u003ca href=\"#/zone-b-build/huggingface-datasets\">huggingface-datasets\u003c/a>\u003c/p>"}, {"route": "zone-c-operationalization/trl-training", "zone": "Zone C · Operationalization", "zoneId": "zone-c-operationalization", "status": "✅", "html": "\u003ch1>trl-training\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（hugging-face 插件 v1.0.0）· 类型：本地训练执行 · FDE 位点：Zone C flywheel + Zone B validate\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>用 \u003ccode>trl\u003c/code> CLI 在\u003cstrong>本地/自有 GPU\u003c/strong> 上跑 SFT、DPO、GRPO、KTO、RLOO 与 reward model 训练（\u003ccode>trl sft\u003c/code>、\u003ccode>trl dpo\u003c/code> 等），含数据集/参数与训练配置约束。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>客户现场有 GPU 机器（或自有训练机），数据不得出厂 → 这是唯一合规路线\u003c/li>\u003cli>做小规模对齐实验（偏好对 DPO）验证&quot;话术规范&quot;能否被训出来\u003c/li>\u003cli>需要完全掌控超参与日志复现时\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：无本地算力（→ \u003ca href=\"#/zone-c-operationalization/huggingface-llm-trainer\">huggingface-llm-trainer\u003c/a> 走 HF Jobs）；百炼生态客户（→ \u003ca href=\"#/zone-b-build/bailian-train-deploy\">bailian-train-deploy\u003c/a>）；嵌入模型训练（→ \u003ca href=\"#/zone-b-build/train-sentence-transformers\">train-sentence-transformers\u003c/a>）；只想调用不训练。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说「在现场 GPU 上跑个 SFT/DPO」「用 trl CLI 微调」——对应 \u003ccode>trl sft\u003c/code> / \u003ccode>trl dpo\u003c/code> / \u003ccode>trl grpo\u003c/code> / \u003ccode>trl kto\u003c/code> / \u003ccode>trl rloo\u003c/code> / \u003ccode>trl reward\u003c/code> 六个 CLI 命令\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：先小步验证再放全量：\u003ccode>trl sft --model_name_or_path &lt;模型&gt; --dataset_name &lt;数据集&gt; --max_steps 1 --output_dir smoke-test\u003c/code> 确认显存与数据管道通了，再改回完整超参（参考 SKILL.md 模板：\u003ccode>--learning_rate 2.0e-5 --packing --per_device_train_batch_size 2 --gradient_accumulation_steps 8\u003c/code>）\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：数据格式必须与训练方法对应——SFT 要 \u003ccode>messages\u003c/code>/text/prompt-completion，DPO 要 \u003ccode>chosen\u003c/code>/\u003ccode>rejected\u003c/code> 偏好对；且 DPO 命令要带 \u003ccode>--no_remove_unused_columns\u003c/code>，否则偏好列会被默认丢弃\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：TRL 默认从 HF Hub 拉模型权重与数据集——气隙/内网环境开跑就卡在下载，要先离线准备好模型与数据集再指向本地路径\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>环境锁死：\u003ccode>torch\u003c/code>/\u003ccode>transformers\u003c/code>/\u003ccode>trl\u003c/code> 三件套版本记录进交付文档（现场最常见的复现失败原因）\u003c/li>\u003cli>先 1 步 smoke run（小数据 + \u003ccode>--max_steps 1\u003c/code>）确认显存与数据管道，再跑全量\u003c/li>\u003cli>显存策略优先级：LoRA/QLoRA → 降 seq len → 梯度累积 → 才是加卡\u003c/li>\u003cli>训练数据必须来自 \u003ccode>fde_scope.corpus\u003c/code> 的导出格式，别手搓 jsonl（会绕过质量门禁与去重）\u003c/li>\u003cli>评估不能省：训练后用 \u003ca href=\"#/zone-b-build/phoenix-evals\">phoenix-evals\u003c/a> / \u003ccode>fde_scope.eval\u003c/code> 对比新旧模型，没有对比结论就不上线\u003c/li>\u003cli>现场注意：TRL 会拉 HF 权重，气隙环境要先离线准备模型与数据集\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone B \u003ccode>validate\u003c/code>：私有化微调实验主路径\u003c/li>\u003cli>Zone C \u003ccode>flywheel\u003c/code>：把 \u003ccode>retrain_scheduler\u003c/code> stub 落到本地训练（数据不出厂场景的首选后端）\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-c-operationalization/huggingface-llm-trainer\">huggingface-llm-trainer\u003c/a> · \u003ca href=\"#/zone-b-build/train-sentence-transformers\">train-sentence-transformers\u003c/a> · \u003ca href=\"#/zone-b-build/bailian-train-deploy\">bailian-train-deploy\u003c/a>\u003c/p>"}, {"route": "zone-c-operationalization/web-perf", "zone": "Zone C · Operationalization", "zoneId": "zone-c-operationalization", "status": "✅", "html": "\u003ch1>web-perf\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（cloudflare 插件 v1.0.0；chrome-devtools-mcp 插件亦有同名能力）· 类型：性能分析 · FDE 位点：Zone C operate（交付面板性能）\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>用 Chrome DevTools MCP 分析 Web 性能：Core Web Vitals（LCP / INP / CLS）+ 补充指标（FCP、TBT、Speed Index），定位阻塞渲染资源、网络依赖链、布局偏移、缓存问题与可访问性缺口。\u003cstrong>偏向实时检索最新文档\u003c/strong>而不是凭记忆给阈值。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>客户抱怨&quot;面板打开很慢&quot;&quot;车间平板上卡&quot;\u003c/li>\u003cli>交付前给出可量化的性能基线（数字比形容词有说服力）\u003c/li>\u003cli>上线后 CWV 漂移监测\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：Python 后端接口慢（→ 看服务端 profile / \u003ca href=\"#/zone-c-operationalization/starops\">starops\u003c/a>）；只要 LCP 单点深挖（→ \u003ca href=\"#/zone-c-operationalization/debug-optimize-lcp\">debug-optimize-lcp\u003c/a>）；内存增长问题（→ \u003ca href=\"#/zone-c-operationalization/memory-leak-debugging\">memory-leak-debugging\u003c/a>）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说「体检一下这个页面的性能」「为什么 Lighthouse 分数这么低」「面板打开很慢」——audit / profile / optimize page load 都算\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：先确认 chrome-devtools MCP 可用（调一次 \u003ccode>navigate_page\u003c/code> 或 \u003ccode>performance_start_trace\u003c/code>，没有就先在 MCP 配置加 \u003ccode>&quot;chrome-devtools&quot;: {&quot;command&quot;: [&quot;npx&quot;, &quot;-y&quot;, &quot;chrome-devtools-mcp@latest&quot;]}\u003c/code>），然后 \u003ccode>navigate_page\u003c/code> → \u003ccode>performance_start_trace(autoStop: true, reload: true)\u003c/code> 录冷加载 trace\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：insight 名称跨 Chrome 版本会变——\u003ccode>LCPBreakdown\u003c/code>/\u003ccode>CLSCulprits\u003c/code> 调不通时，先看 trace 返回里的 \u003ccode>insightSetId\u003c/code> 列出可用 insight，别硬猜名字\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：只推荐有预估收益的动作——estimated savings 为 0ms 的渲染阻塞资源标记但不处理；给客户的建议要具体到资源（&quot;compress hero.png (450KB) to WebP&quot;，不是&quot;优化图片&quot;）\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>测量环境要固定：同一设备/网络/是否登录态，否则数字不可比；现场最好用客户真实设备测一次\u003c/li>\u003cli>先测后改：任何优化前先取基线，优化后复测并在交付文档里留下前后对比\u003c/li>\u003cli>阈值按客户 SLA 谈，不要拿 Google 推荐值直接当合同指标\u003c/li>\u003cli>常见收益顺序：图片/字体与阻塞资源 → 缓存与 CDN → JS 体积与初始化 → 布局稳定\u003c/li>\u003cli>报告输出：截图 + 指标表 + 三条以内可执行建议（客户看不完长报告）\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone C：交付 Web 面板的持续性能门禁\u003c/li>\u003cli>Zone D：验收材料中的性能证据\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-c-operationalization/debug-optimize-lcp\">debug-optimize-lcp\u003c/a> · \u003ca href=\"#/zone-c-operationalization/chrome-devtools\">chrome-devtools\u003c/a> · \u003ca href=\"#/zone-c-operationalization/memory-leak-debugging\">memory-leak-debugging\u003c/a>\u003c/p>"}, {"route": "zone-c-operationalization/debug-optimize-lcp", "zone": "Zone C · Operationalization", "zoneId": "zone-c-operationalization", "status": "✅", "html": "\u003ch1>debug-optimize-lcp\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（chrome-devtools-mcp 插件 v1.2.0）· 类型：性能专项 · FDE 位点：Zone C operate\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>LCP（最大内容绘制）专项：用 DevTools MCP 工具找出拖慢首屏主内容出现的原因——资源加载链、字体阻塞、图片尺寸与优先级、渲染阻塞 CSS/JS、服务端 TTFB，并给出针对性修复与复测路径。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>用户明确说&quot;首屏慢&quot;/&quot;表格第一屏要等好几秒&quot;\u003c/li>\u003cli>CWV 报告里 LCP 是唯一超标项\u003c/li>\u003cli>Hero 图 / 大表格首屏渲染优化\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：全面性能体检（→ \u003ca href=\"#/zone-c-operationalization/web-perf\">web-perf\u003c/a>）；交互延迟 INP 问题（→ web-perf）；后端接口本身慢（先看服务端）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：用户提「largest contentful paint」「首屏慢」「hero 图渲染太慢」这类词（SKILL.md 触发词还包括 page load speed / CWV）——只要 LCP 单点深挖就用它，全面体检走 \u003ca href=\"#/zone-c-operationalization/web-perf\">web-perf\u003c/a>\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：\u003ccode>navigate_page\u003c/code> 打开目标页 → \u003ccode>performance_start_trace(reload: true, autoStop: true)\u003c/code> 录 trace → 用 \u003ccode>performance_analyze_insight(insightSetId, insightName: &quot;LCPBreakdown&quot;)\u003c/code> 看 TTFB / 资源加载延迟 / 加载时长 / 渲染延迟四段哪段超标\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：别只压图不看其他段——SKILL.md 点名常见错误是只优化一个 subpart；若渲染延迟才是瓶颈，图片再小也没用（省下的时间只是挪到 render delay）\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：LCP 图\u003cstrong>永远不要\u003c/strong> \u003ccode>loading=&quot;lazy&quot;\u003c/code>——这是 resource load delay 最常见根因；正确做法是标准 \u003ccode>&lt;img src&gt;\u003c/code> + \u003ccode>fetchpriority=&quot;high&quot;\u003c/code>，不在 HTML 里的再加 \u003ccode>&lt;link rel=&quot;preload&quot;&gt;\u003c/code>\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>先确认 LCP 元素是谁（DevTools 里高亮），不同元素对应完全不同的修法，别猜\u003c/li>\u003cli>高频有效手段排序：预加载/优先级设置 LCP 资源 → 图片格式与尺寸 → 消除同步阻塞脚本 → 字体 \u003ccode>display: swap\u003c/code> + 预加载\u003c/li>\u003cli>现场带宽受限（车间 Wi-Fi/内网）时，收益最大的是\u003cstrong>减少资源数量与体积\u003c/strong>，而不是花哨的加载策略\u003c/li>\u003cli>每次只改一项并复测，LCP 波动 ±10% 属噪声，不要为了噪声改代码\u003c/li>\u003cli>把 LCP 数值与截图记入验收材料，避免上线后扯皮\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone C：交付面板首屏性能整改\u003c/li>\u003cli>Zone B：demo 阶段的加载体验（客户第一眼）\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-c-operationalization/web-perf\">web-perf\u003c/a> · \u003ca href=\"#/zone-c-operationalization/chrome-devtools\">chrome-devtools\u003c/a> · \u003ca href=\"#/zone-c-operationalization/memory-leak-debugging\">memory-leak-debugging\u003c/a>\u003c/p>"}, {"route": "zone-c-operationalization/memory-leak-debugging", "zone": "Zone C · Operationalization", "zoneId": "zone-c-operationalization", "status": "✅", "html": "\u003ch1>memory-leak-debugging\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（chrome-devtools-mcp 插件 v1.2.0）· 类型：内存专项 · FDE 位点：Zone C operate\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>诊断并解决 \u003cstrong>JavaScript/Node.js\u003c/strong> 内存泄漏：高内存占用与 OOM 的定位、heapsnapshot 对比分析、\u003ccode>memlab\u003c/code> 等检测工具的使用，以及常见泄漏模式（事件监听未解绑、闭包持有、缓存无上限、DOM 引用）的修复。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>交付面板长时间开着就越来越卡/崩（车间大屏、值班终端常年不刷新）\u003c/li>\u003cli>Node 侧服务（pawapp 前端构建、脚本工具）RSS 持续上涨\u003c/li>\u003cli>客户运维抱怨&quot;每天要重启一次&quot;\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：Python 侧内存问题（fde-scope 主体是 Python，用 \u003ccode>tracemalloc\u003c/code>/\u003ccode>objgraph\u003c/code>/\u003ccode>memray\u003c/code>，此 skill 不适用）；单纯页面慢（→ \u003ca href=\"#/zone-c-operationalization/web-perf\">web-perf\u003c/a>）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说「这个面板开一天就越来越卡」「Node 进程 OOM 了」「帮我分析 heapsnapshot」——高内存/OOM/泄漏检测都算（仅 JS/Node 侧，Python 侧不适用）\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：用 chrome-devtools MCP 在三个状态各存一份 \u003ccode>take_heapsnapshot\u003c/code>（基线 → 把可疑交互重复 10 次 → 还原页面），然后跑 \u003ccode>memlab\u003c/code> 自动找泄漏 trace，看 retained size 增长的对象类型\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：\u003cstrong>绝对不要\u003c/strong>直接 \u003ccode>read_file\u003c/code>/\u003ccode>cat\u003c/code> 原始 \u003ccode>.heapsnapshot\u003c/code>——文件极大，会瞬间撑爆上下文；SKILL.md 强制走 \u003ccode>memlab\u003c/code>，没有 memlab 时用 fallback 脚本 \u003ccode>node references/compare_snapshots.js &lt;baseline.heapsnapshot&gt; &lt;target.heapsnapshot&gt;\u003c/code>\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：先区分泄漏和高占用——增长后趋平不是泄漏，别急着改代码；detached DOM 节点有时是有意缓存，null 掉之前先问用户\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>判定前先区分&quot;泄漏&quot;和&quot;高占用&quot;：增长后趋平不是泄漏，别急着改代码\u003c/li>\u003cli>采集两次 heapsnapshot（操作前/重复 N 次操作后）做 diff，看\u003cstrong> retained size 增长的对象类型\u003c/strong>\u003c/li>\u003cli>用 memlab 的 repeatable flow 固化复现步骤，修完能回归\u003c/li>\u003cli>前端长驻场景的常见解法：列表虚拟化、事件/定时器随组件卸载清理、给缓存加 LRU 上限\u003c/li>\u003cli>与运维配合：设置内存告警阈值与自动 dump，现场问题才有证据\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone C：长驻 Web 控制台/值班终端稳定性\u003c/li>\u003cli>注意：\u003ccode>fde_scope\u003c/code> 是 Python，本 skill 只覆盖交付面（前端/Node 工具链）\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-c-operationalization/web-perf\">web-perf\u003c/a> · \u003ca href=\"#/zone-c-operationalization/chrome-devtools\">chrome-devtools\u003c/a> · \u003ca href=\"#/zone-c-operationalization/investigate\">investigate\u003c/a>\u003c/p>"}, {"route": "zone-d-handoff/document-generate", "zone": "Zone D · Handoff", "zoneId": "zone-d-handoff", "status": "✅", "html": "\u003ch1>document-generate\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（gstack 插件 v1.58.5）· 类型：文档生成 · FDE 位点：Zone D handoff\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>从零补齐缺失文档：针对一个 feature、模块或整个项目，读取代码/测试/配置生成结构化文档（README、API、架构、使用指南），避免&quot;文档靠脑补&quot;。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>接手客户遗留系统后需要先补一份能读的现状文档（配合 \u003ca href=\"#/zone-a-pre-engagement/zread\">zread\u003c/a>）\u003c/li>\u003cli>fde-scope 新模块落地但文档为空（例：\u003ccode>docs/\u003c/code> 里某些主题只有骨架）\u003c/li>\u003cli>交接前发现&quot;只有代码没有说明&quot;，需要一次性补齐\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：发布后的增量文档同步（→ \u003ca href=\"#/zone-d-handoff/document-release\">document-release\u003c/a>）；把文档排版成 PDF 交付物（→ \u003ca href=\"#/zone-d-handoff/make-pdf\">make-pdf\u003c/a>）；面向高管的架构讲法（→ \u003ca href=\"#/zone-a-pre-engagement/architecture-communicator\">architecture-communicator\u003c/a>）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说 &quot;document this feature&quot; / &quot;generate documentation&quot; / &quot;explain this module&quot;（SKILL.md triggers 原词），或中文&quot;给这个模块补文档&quot;\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：指定范围开跑，例如：&quot;给 \u003ccode>fde_scope/deploy/\u003c/code> 生成文档，输出到 \u003ccode>deploy/README\u003c/code>&quot;——它会先做代码考古（读代码 + 读测试 + 读现有文档）再动笔，并先问你文档落点（写进现有文件 / 独立 \u003ccode>docs/\u003c/code> / 两者都要，推荐&quot;两者都要&quot;）\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：\u003c/li>\u003cli>别让它一次生成整仓文档：它按 Diataxis 四象限出文档计划，超过 5 份才会再次向你确认，整仓直跑极易留下已废弃签名的 API 说明——分模块跑，交付前逐条回代码核对引用\u003c/li>\u003cli>自动生成的数字与清单（路由数、gate 数、连接器数）必须来自可复跑命令，不要接受&quot;约 10 个&quot;这类模糊写法，否则验收时对不上数\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>先定读者再定内容：客户运维手册 ≠ 开发者文档 ≠ 验收报告，一份文档只服务一类读者\u003c/li>\u003cli>生成后\u003cstrong>逐条核对代码引用\u003c/strong>：自动生成的 API 说明最容易留下已废弃签名（本仓库刚做过同类校验，见 \u003ccode>docs/architecture-model/architecture-health-report.md\u003c/code>）\u003c/li>\u003cli>数字与清单要来自可复跑的命令（路由数、gate 数、连接器数），不要写&quot;约 10 个&quot;\u003c/li>\u003cli>与本项目约定一致：文档落 \u003ccode>docs/\u003c/code>，图走 \u003ccode>docs/architecture-model/\u003c/code>，每个声明可回溯到文件\u003c/li>\u003cli>别一次生成整站文档——按模块分批，每批都人工过一遍再提交\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone D \u003ccode>handoff\u003c/code>：客户侧文档补齐的主力\u003c/li>\u003cli>现状缺口示例：\u003ccode>docs/runbooks/\u003c/code>、\u003ccode>deploy/README\u003c/code>（配合 \u003ca href=\"#/zone-b-build/docker-build-deploy\">docker-build-deploy\u003c/a>）\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-d-handoff/document-release\">document-release\u003c/a> · \u003ca href=\"#/zone-d-handoff/make-pdf\">make-pdf\u003c/a> · \u003ca href=\"#/zone-a-pre-engagement/zread\">zread\u003c/a>\u003c/p>"}, {"route": "zone-d-handoff/document-release", "zone": "Zone D · Handoff", "zoneId": "zone-d-handoff", "status": "✅", "html": "\u003ch1>document-release\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（gstack 插件 v1.58.5）· 类型：文档同步 · FDE 位点：Zone D handoff + 每次发布\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>&quot;Ship 之后&quot;的文档更新：把本次变更同步进 changelog、版本说明、受影响页面的文档，防止文档与实现漂移。与 \u003ccode>ship\u003c/code>（版本/CHANGELOG/PR 流程）配套。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>每次功能合并后，同步版本说明与受影响文档段落（本仓库当前\u003cstrong>没有\u003c/strong> \u003ccode>CHANGELOG.md\u003c/code>，属待建项）\u003c/li>\u003cli>交接前最后一个冲刺：把散在对话/PR 描述里的说明收敛成正式文档\u003c/li>\u003cli>修完 bug 后确认文档里的行为描述还成立（尤其 gate 与指标口径）\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：从零补缺失文档（→ \u003ca href=\"#/zone-d-handoff/document-generate\">document-generate\u003c/a>）；代码评审（→ gstack \u003ccode>review\u003c/code> 或 \u003ca href=\"#/cross-cutting/code-review\">code-review\u003c/a>）；架构性变更的模型更新（→ \u003ca href=\"#/cross-cutting/architecture-visualization-suite\">architecture-health\u003c/a>）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说 &quot;post-ship docs&quot; / &quot;update docs after ship&quot; / &quot;document what changed&quot;（SKILL.md triggers 原词），或中文&quot;同步一下本次改动涉及的文档&quot;\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：先切到 feature 分支再让它跑——在基线分支上它会直接中止（&quot;Run from a feature branch&quot;）；随后它拉 \u003ccode>git diff &lt;base&gt;...HEAD\u003c/code> 建 Diataxis 覆盖表，逐文件审计并直接修正明显的事实性漂移\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：\u003c/li>\u003cli>CHANGELOG 只润色不重写：它对 \u003ccode>CHANGELOG.md\u003c/code> 只做精确匹配的局部编辑、保留全部历史条目，别指望它重排或重新生成 changelog；本仓库还没有 \u003ccode>CHANGELOG.md\u003c/code>，首次需新建并全项目统一一种格式（如 Keep a Changelog）\u003c/li>\u003cli>VERSION 不会被悄悄 bump：它一定会先问你；文档覆盖缺口只标记进 PR 描述并建议跑 document-generate，不会自动补写缺失页面\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>把&quot;文档同步&quot;当作 Definition of Done 的一条，而不是&quot;有空再做&quot;——交付项目里文档滞后就是验收阻滞\u003c/li>\u003cli>与 \u003ca href=\"#/cross-cutting/architecture-visualization-suite\">architecture-health\u003c/a> 协作：改了架构事实（模块/路由/连接器/gate）必须同时更新 \u003ccode>docs/architecture.md\u003c/code> 与 \u003ccode>docs/architecture-model/\u003c/code>\u003c/li>\u003cli>CHANGELOG 按&quot;客户能感知的变化&quot;分组，内部重构单独一类或省略\u003c/li>\u003cli>版本号与发布物一致：若要新建 changelog，采用 Keep a Changelog 格式并全项目统一，不要混用多种格式\u003c/li>\u003cli>每次同步顺手做一次&quot;数字复跑&quot;（路由数、测试数），避免像 \u003ccode>26 vs 27 routes\u003c/code> 这类陈旧声明再次出现\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone D \u003ccode>handoff\u003c/code>：交付包文档一致性维护\u003c/li>\u003cli>与 fde-scope 的 \u003ccode>docs/architecture.md\u003c/code> 同步：架构事实变更必须同时更新 \u003ccode>docs/architecture.md\u003c/code> 与 \u003ccode>docs/architecture-model/\u003c/code>（注意：仓库当前无 AGENTS.md / \u003ccode>docs/evidence-templates.md\u003c/code>，文档落点靠本 catalog 与 README 约定）\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-d-handoff/document-generate\">document-generate\u003c/a> · \u003ca href=\"#/zone-d-handoff/make-pdf\">make-pdf\u003c/a> · \u003ca href=\"#/cross-cutting/architecture-visualization-suite\">architecture-health\u003c/a>\u003c/p>"}, {"route": "zone-d-handoff/make-pdf", "zone": "Zone D · Handoff", "zoneId": "zone-d-handoff", "status": "✅", "html": "\u003ch1>make-pdf\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（gstack 插件 v1.58.5）· 类型：交付排版 · FDE 位点：Zone D handoff\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>把任意 Markdown 转成\u003cstrong>出版级 PDF\u003c/strong>（排版、目录、页眉页脚、代码块与表格样式），用于正式交付物与打印材料。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>客户验收要&quot;盖章的纸质/PDF 版&quot;：方案书、验收报告、运维手册\u003c/li>\u003cli>把 \u003ccode>docs/\u003c/code> 下的模型说明 + 架构图打包成一份可分发文档\u003c/li>\u003cli>会议材料需要 A4 固定版式（而不是让人自己打开 Markdown）\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：需要复杂图文混排与精确页位的设计稿（用专业排版/设计工具）；PowerPoint 类演示（→ \u003ca href=\"#/zone-d-handoff/pptx\">pptx\u003c/a> / \u003ca href=\"#/zone-d-handoff/slidev\">slidev\u003c/a>）；只做 Markdown 解析（→ \u003ca href=\"#/zone-a-pre-engagement/pdf\">pdf\u003c/a> 的读取能力）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说 &quot;make a pdf&quot; / &quot;export to pdf&quot; / &quot;turn this markdown into a pdf&quot;（SKILL.md 触发原句）\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：对 agent 说&quot;把 \u003ccode>docs/architecture.md\u003c/code> 转成 PDF，加封面和目录&quot;——对应命令 \u003ccode>pdf generate docs/architecture.md out.pdf --cover --toc\u003c/code>（二进制在 \u003ccode>~/.claude/skills/gstack/make-pdf/dist/pdf\u003c/code>）；初稿可加 \u003ccode>--watermark DRAFT\u003c/code>\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：\u003c/li>\u003cli>二进制未构建时会报 \u003ccode>MAKE_PDF_NOT_AVAILABLE\u003c/code>：先在 gstack 仓库根目录跑 \u003ccode>./setup\u003c/code> 构建出 \u003ccode>make-pdf/dist/pdf\u003c/code> 再重试\u003c/li>\u003cli>远程图片（http/https）默认被拦截、渲染成 &quot;[remote image blocked]&quot; 占位块：把图下载到 Markdown 同目录用相对路径，或显式加 \u003ccode>--allow-network\u003c/code>；中文交付前打印一页实测字体，缺中文字体会整页豆腐块\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>先内容后排版：Markdown 结构（标题层级/表格/图）干净，PDF 才不会到处断裂\u003c/li>\u003cli>图片必须本地路径且分辨率足够（现场打印机 300dpi 起）；Mermaid/DOT 图先导出 SVG/PNG 再嵌入\u003c/li>\u003cli>中文字体是最大坑：确认 PDF 引擎已装中文字体，否则中文变豆腐块——正式交付前打印一页实测\u003c/li>\u003cli>交付命名规范：\u003ccode>&lt;项目&gt;_&lt;文档类型&gt;_v&lt;版本&gt;_&lt;日期&gt;.pdf\u003c/code>，并在扉页写版本与生成日期\u003c/li>\u003cli>与 \u003ca href=\"#/zone-d-handoff/document-release\">document-release\u003c/a> 配合：源 Markdown 更新后重新生成 PDF，不要手改 PDF（会造成双版本）\u003c/li>\u003cli>体积：含大量截图的 PDF 要压缩，客户邮件常有大小限制\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone D：交付包 PDF 定稿（方案 / 验收 / 运维手册三件套）\u003c/li>\u003cli>与 \u003ccode>docs/architecture-model/\u003c/code> 的图配套输出\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-d-handoff/document-generate\">document-generate\u003c/a> · \u003ca href=\"#/zone-d-handoff/pptx\">pptx\u003c/a> · \u003ca href=\"#/zone-a-pre-engagement/pdf\">pdf\u003c/a>\u003c/p>"}, {"route": "zone-d-handoff/anthropic-documentation", "zone": "Zone D · Handoff", "zoneId": "zone-d-handoff", "status": "📦", "html": "\u003ch1>anthropic-documentation 📦\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：📦 可安装（未装）· 类型：写作规范 · FDE 位点：Zone D handoff\u003cbr>真实条目：\u003ccode>anthropics/knowledge-work-plugins@documentation\u003c/code>（官方 org）· 热度：8.8K installs · https://skills.sh/anthropics/knowledge-work-plugins/documentation\u003cbr>安装：\u003ccode>npx skills add anthropics/knowledge-work-plugins@documentation --directory ~/.qoder/skills -y\u003c/code>\u003cbr>说明：早期建档记作 \u003ccode>anthropic-documentation\u003c/code>，registry 无该名；已更正为官方 \u003ccode>documentation\u003c/code>。\u003cbr>取证（2026-08-27）：源文件 \u003ccode>engineering/skills/documentation/SKILL.md\u003c/code>（49 行，\u003cstrong>单文件\u003c/strong>，无 \u003ccode>scripts/\u003c/code>、无 \u003ccode>references/\u003c/code>）· https://github.com/anthropics/knowledge-work-plugins/blob/main/engineering/skills/documentation/SKILL.md\u003cbr>安全：同仓库其他条目一样受上游\u003cstrong>强制 Claude policy scan\u003c/strong>（\u003ccode>scan-plugins.yml\u003c/code>）保护。风险面极小。\u003cbr>⚠️ 命名陷阱：它的触发词里包含 \u003ccode>&quot;write a runbook&quot;\u003c/code> —— 与 \u003ca href=\"#/zone-c-operationalization/sre-runbooks\">runbook\u003c/a> \u003cstrong>抢触发\u003c/strong>。两个都装时必须先定分工（见最佳实践）。\u003cbr>同类备选：\u003ccode>sammcj/agentic-coding@writing-documentation-with-diataxis\u003c/code>（573，Diátaxis 四象限写作法）\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>按官方写作规范产出工程文档（已读源文件确认其真实结构，\u003cstrong>不是\u003c/strong> Diátaxis 四象限）：五类文档模板 —— README（是什么/为什么 + &lt;5 分钟 quick start + 配置与用法 + 贡献指南）、API Documentation（端点 + 请求/响应例 + 鉴权与错误码 + 限流与分页 + SDK 例）、Runbook（何时用 + 前置权限 + 逐步操作 + 回滚 + 升级路径）、Architecture Doc（背景与目标 + 高层设计与图 + 关键决策与 trade-off + 数据流与集成点）、Onboarding Guide（环境搭建 + 系统如何连接 + 常见任务走查 + 该问谁）；配五条原则：为读者写 / 最有用的信息放前面 / 用代码与截图而不是干说 / 保持新鲜（过期文档比没有更糟）/ 链接而非复制。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>交付文档要成体系（README + API 参考 + 架构说明 + runbook + onboarding）而不是散装 README\u003c/li>\u003cli>客户方要接手维护，需要他们能持续沿用同一写作标准\u003c/li>\u003cli>本仓库文档风格需要统一（现有 \u003ccode>docs/\u003c/code> 文件风格并不完全一致）\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：文档内容的技术正确性校验（→ \u003ca href=\"#/cross-cutting/architecture-visualization-suite\">architecture-health\u003c/a>）；PPT/演示（→ \u003ca href=\"#/zone-d-handoff/visual-deck-builder\">visual-deck-builder\u003c/a>）；一次性内部备忘。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：未安装时这些话不生效——先装（见下一步）；装后可用 &quot;write a runbook&quot; / &quot;write API documentation&quot; 这类触发句（其触发词含 \u003ccode>&quot;write a runbook&quot;\u003c/code>）\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：先执行安装命令 \u003ccode>npx skills add anthropics/knowledge-work-plugins@documentation --directory ~/.qoder/skills -y\u003c/code>（本页头部给出的命令），装完再对 agent 说&quot;用 documentation 模板给本项目补一份 onboarding/架构文档&quot;\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：\u003c/li>\u003cli>命名陷阱：registry 真名是 \u003ccode>documentation\u003c/code>（\u003ccode>anthropics/knowledge-work-plugins@documentation\u003c/code>），按旧名 \u003ccode>anthropic-documentation\u003c/code> 执行 \u003ccode>npx skills add\u003c/code> 会找不到条目\u003c/li>\u003cli>抢触发：它和 \u003ca href=\"#/zone-c-operationalization/sre-runbooks\">runbook\u003c/a> 都响应 &quot;write a runbook&quot;——两个都装时必须先定分工（documentation 管整套交付文档体系、runbook 管单份运维手册），否则路由抖动\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>它不是 Diátaxis\u003c/strong>：本 skill 是“按文档类型给骨架 + 五条原则”。真要四象限约束，用备选 \u003ccode>sammcj/agentic-coding@writing-documentation-with-diataxis\u003c/code>（573），\u003cstrong>两者只选一个\u003c/strong>\u003c/li>\u003cli>\u003cstrong>与 runbook 的抢触发如何共处\u003c/strong>：\u003ccode>documentation\u003c/code> 管“整套交付文档体系”，\u003ca href=\"#/zone-c-operationalization/sre-runbooks\">runbook\u003c/a> 管“单份运维手册”；只装一个的话选 \u003ccode>runbook\u003c/code>（它的模板更深：逐步 Expected result / If it fails）\u003c/li>\u003cli>它的 Architecture Doc 模板与架构可视化插件的 \u003ccode>architecture-communicator\u003c/code> 重叠：后者带受众分层与证据链，\u003cstrong>架构部分优先用后者\u003c/strong>\u003c/li>\u003cli>与客户确认术语表（工单/缺陷/告警/停机 等中文术语），避免同物不同名\u003c/li>\u003cli>规范落地为仓库内 checklist（\u003ccode>docs/writing-style.md\u003c/code>），比装第三个写作 skill 更有效\u003c/li>\u003cli>判断是否值得安装：若 \u003ca href=\"#/zone-d-handoff/document-generate\">document-generate\u003c/a> + 项目自身规范已够用，\u003cstrong>可以长期不装\u003c/strong>——避免 skill 功能重叠导致路由抖动\u003c/li>\u003cli>装后回填本页：安装日期、实际用法、与 document-generate 的分工\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone D：交付文档体系标准\u003c/li>\u003cli>与本仓库既有文档骨架（\u003ccode>docs/fde_playbook.md\u003c/code>、\u003ccode>docs/skills.md\u003c/code>、\u003ccode>docs/code_review_checklist.md\u003c/code>）对齐风格，形成写作 + 落位双约束\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-d-handoff/document-generate\">document-generate\u003c/a> · \u003ca href=\"#/zone-d-handoff/document-release\">document-release\u003c/a> · \u003ca href=\"#/zone-d-handoff/make-pdf\">make-pdf\u003c/a>\u003c/p>"}, {"route": "zone-d-handoff/shifu", "zone": "Zone D · Handoff", "zoneId": "zone-d-handoff", "status": "✅", "html": "\u003ch1>shifu\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（\u003ccode>~/.qoder/skills/shifu\u003c/code>）· 类型：教学/培训 · FDE 位点：Zone D enable\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>把 Markdown 知识库 / llm-wiki 语料库变成\u003cstrong>交互式教学\u003c/strong>：诊断已有水平 → 产出学习路径 → 逐课精讲 + 检查点测验 → 间隔重复复习题 → 结课检验，并把学习状态与掌握度写回记忆文件。触发词：教我/系统学习/复习/考我/学习计划。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>交接前需要让客户方工程师&quot;真的会&quot;而不只是拿到文档（培训环节）\u003c/li>\u003cli>自己要在两周内变成某行业领域（如汽车焊装、半导体厂务）的可用专家\u003c/li>\u003cli>有一堆客户文档/wiki 语料但没人能读完整套\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：一次性事实查询；文档摘要（那是阅读任务）；排障（→ \u003ca href=\"#/zone-c-operationalization/investigate\">investigate\u003c/a>）；需要记忆卡片时（→ \u003ca href=\"#/zone-d-handoff/remember\">remember\u003c/a>）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说 &quot;教我&quot; / &quot;我想学 XX&quot; / &quot;复习&quot; / &quot;考我&quot;，或直接喊 &quot;shifu/师傅&quot;（SKILL.md trigger_keywords 原词）\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：指定语料范围开课，例如：&quot;教我 \u003ccode>05-网络/\u003c/code> 里的 K8s 网络概念&quot;——文件夹/全库会先出 30 秒学习计划等你确认；想跳过摸底二问就说&quot;直接开讲&quot;\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：\u003c/li>\u003cli>不给语料范围就开课，教学深度不稳定——先给目录（单文件走快速通道：不排计划、点题即讲第一课）\u003c/li>\u003cli>学习进度写在 \u003ccode>&lt;语料库根&gt;/.shifu/progress.md\u003c/code>（含已学课程与复习队列），要纳入版本管理或归档进项目目录，否则交接后没人能续学\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>先给语料范围（指定目录），否则教学深度不稳定\u003c/li>\u003cli>让客户方也用同一套：培训效果可量化（掌握度记录就是验收证据）\u003c/li>\u003cli>学习状态文件纳入版本管理或至少归档到项目目录，交接后才有人能续上\u003c/li>\u003cli>与 \u003ca href=\"#/zone-a-pre-engagement/qmind-knowledge\">qmind-knowledge\u003c/a> 组合：qmind 管知识沉淀，shifu 管知识传递\u003c/li>\u003cli>注意：课程质量上限 = 语料质量；语料缺口要在结课前作为风险列出，别当作已教会\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone D \u003ccode>enable\u003c/code>：客户培训与能力转移\u003c/li>\u003cli>\u003ccode>.fde_scope/skills/\u003c/code> 现场经验沉淀后的对内/对外教学通道\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-d-handoff/remember\">remember\u003c/a> · \u003ca href=\"#/zone-a-pre-engagement/qmind-knowledge\">qmind-knowledge\u003c/a> · \u003ca href=\"#/zone-d-handoff/visual-deck-builder\">visual-deck-builder\u003c/a>\u003c/p>"}, {"route": "zone-d-handoff/remember", "zone": "Zone D · Handoff", "zoneId": "zone-d-handoff", "status": "✅", "html": "\u003ch1>remember\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（\u003ccode>~/.qoder/skills/remember\u003c/code>）· 类型：记忆/复习 · FDE 位点：Zone D enable\u003cbr>⚠️ 范围提醒：该 skill \u003cstrong>不是通用闪卡工具\u003c/strong>，其定位是 Kubernetes 网络概念（Service / Ingress / CNI / DNS / NetworkPolicy / Gateway API）的混淆对比记忆卡。README 索引里的一句话已按实际范围修正。\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>生成/复习闪卡，用间隔重复对抗&quot;相似概念记混&quot;：Service 与 Ingress 的边界、CNI 与 NetworkPolicy 的关系、Gateway API 与 Ingress 的取舍等。触发词：记卡片/生成闪卡/复习/考我/混淆对比。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>现场 K8s 网络问题需要快速判断层次（客户集群排障最常见卡点）\u003c/li>\u003cli>面试/认证/上岗前的知识点固化\u003c/li>\u003cli>培训后巩固：与 \u003ca href=\"#/zone-d-handoff/shifu\">shifu\u003c/a> 衔接（shifu 教、remember 记）\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：端到端学习新领域（→ \u003ca href=\"#/zone-d-handoff/shifu\">shifu\u003c/a>）；一次性事实查询；非 K8s 网络的自定义闪卡（当前 skill 语料聚焦 K8s 网络，其他领域要自行扩卡片或改副本）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说 &quot;记忆闪卡&quot; / &quot;生成闪卡&quot; / &quot;复习卡片&quot;，或 &quot;我老是混淆 Service 和 Ingress&quot;（SKILL.md 触发词与 intent_queries 原句）\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：对 agent 说&quot;生成 service 主题的卡片&quot;或&quot;混淆 Service Ingress&quot;——它先读语料源文件（默认 \u003ccode>05-网络/01-K8s网络核心/\u003c/code>），按布鲁姆分层出卡并展示预览，你删改确认后才写入卡池\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：\u003c/li>\u003cli>语料只覆盖 K8s 网络（Service/Ingress/CNI/DNS/NetworkPolicy/Gateway API）：其他领域要复制 skill 到 \u003ccode>~/.qoder/skills/&lt;name&gt;-domain/\u003c/code> 改语料，直接改上游安装版会被 \u003ccode>npx skills update\u003c/code> 覆盖\u003c/li>\u003cli>复习必须先闭卷作答再翻面（答案要自己产出，不许&quot;看完答案说会了&quot;）；一次生成 ≤8 张、单场复习默认 ≤10 张，进度存 \u003ccode>&lt;语料库根&gt;/.remember/\u003c/code>（\u003ccode>deck.md\u003c/code> + \u003ccode>progress.md\u003c/code>）\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>卡片要写成&quot;易混对比&quot;而不是&quot;名词解释&quot;——交付现场需要的是区分能力\u003c/li>\u003cli>复习节奏固定（如每天 5 分钟），间隔重复的价值来自频率而非单次时长\u003c/li>\u003cli>客户现场遇到的真实混淆点回写成新卡片，卡片库才会持续增值\u003c/li>\u003cli>若要推广到其他领域：复制该 skill 到 \u003ccode>~/.qoder/skills/&lt;name&gt;-domain/\u003c/code> 改语料，\u003cstrong>不要直接改上游安装版本\u003c/strong>（否则 \u003ccode>npx skills update\u003c/code> 会覆盖）\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone D \u003ccode>enable\u003c/code>：培训后巩固环节\u003c/li>\u003cli>K8s 客户环境排障前的知识准备（配合 \u003ca href=\"#/zone-b-build/kubernetes-specialist\">kubernetes-specialist\u003c/a>）\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-d-handoff/shifu\">shifu\u003c/a> · \u003ca href=\"#/zone-b-build/kubernetes-specialist\">kubernetes-specialist\u003c/a> · \u003ca href=\"#/zone-d-handoff/podcast\">podcast\u003c/a>\u003c/p>"}, {"route": "zone-d-handoff/visual-deck-builder", "zone": "Zone D · Handoff", "zoneId": "zone-d-handoff", "status": "✅", "html": "\u003ch1>visual-deck-builder\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（research-copilot 插件 v1.0.0）· 类型：演示生成 · FDE 位点：Zone D present\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>\u003cstrong>图像模型驱动\u003c/strong>的 PPT 生产：从主题/材料/论文/报告/既有幻灯片出发，每页先由图像模型生成高质量整页幻灯片图，再打包成 PPTX，并产出 manifest、预览与证据化 QA 报告；需要时可选&quot;分层可编辑重建&quot;。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>给客户的汇报 deck 要\u003cstrong>视觉冲击力\u003c/strong>（方案汇报、成果展示、现场复盘会）\u003c/li>\u003cli>有大量素材（文档、数据、截图）需要在半天内变成一份成型的 deck\u003c/li>\u003cli>需要可追溯的 deck 质量检查（它自带 QA 与证据链，比手搓 PPT 更可审计）\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：需要逐字精确可编辑的正式商务模板（客户有固定 PPT 模板时 → \u003ca href=\"#/zone-d-handoff/pptx\">pptx\u003c/a>）；代码讲解型技术分享（→ \u003ca href=\"#/zone-d-handoff/slidev\">slidev\u003c/a>）；学术答辩专用流程（research-copilot 内有更窄的学术 skill）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说&quot;把这份材料做成一套 PPT&quot; / &quot;为 XX 主题生成汇报 deck&quot;（description：create / redesign / package / QA a PowerPoint deck）\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：给结构化输入并让它先出样张——提供大纲 + 关键数据表 + 源材料，说&quot;先出 3 页确认风格再全量&quot;；流程是 spec（大纲 + 逐页描述）→ 风格契约 → 逐页整图 → 打包 PPTX + QA 报告\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：\u003c/li>\u003cli>成品是 image-only PPTX（每页一张整页图，无可编辑文本框）：客户给固定模板要逐字可改时改走 \u003ca href=\"#/zone-d-handoff/pptx\">pptx\u003c/a>；风格契约必须用 \u003ccode>scripts/build_style_contract.py --preset &lt;key&gt;\u003c/code> 生成，手写&quot;干净现代蓝白&quot;一句形容词会导致逐页风格漂移\u003c/li>\u003cli>图像模型会把数字画得&quot;看起来对&quot;：交付前逐个数字回源核对；页面宽高比不符 16:9 时该页标 failed 重生成，不要拉伸凑合\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>输入材料质量决定上限：先给结构化大纲 + 关键数据表，再让它出图，否则页面会很&quot;好看但空洞&quot;\u003c/li>\u003cli>数字与结论必须回源核对：图像模型可能把图表画得&quot;看起来对&quot;，交付前逐个数字比对（这类错误在客户现场代价极高）\u003c/li>\u003cli>客户品牌模板场景不要用它硬套——改走 \u003ca href=\"#/zone-d-handoff/pptx\">pptx\u003c/a> 在模板上填内容\u003c/li>\u003cli>QA 报告与预览留档，作为&quot;这版 deck 已经检查过&quot;的记录\u003c/li>\u003cli>生成成本高（图像模型逐页出图），先出 3 页样张确认风格再全量\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone D \u003ccode>handoff\u003c/code>：结项汇报 deck\u003c/li>\u003cli>Zone A：售前方案 deck（配合 \u003ca href=\"#/zone-a-pre-engagement/firecrawl-search\">firecrawl-search\u003c/a> 的行业素材）\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-d-handoff/pptx\">pptx\u003c/a> · \u003ca href=\"#/zone-d-handoff/slidev\">slidev\u003c/a> · \u003ca href=\"#/zone-d-handoff/notion-infographic\">notion-infographic\u003c/a>\u003c/p>"}, {"route": "zone-d-handoff/pptx", "zone": "Zone D · Handoff", "zoneId": "zone-d-handoff", "status": "✅", "html": "\u003ch1>pptx\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（\u003ccode>~/.qoder/skills/pptx\u003c/code>，文档四件套之一）· 类型：文件操作 · FDE 位点：Zone D present\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>PowerPoint 文件级操作：从零建 deck、改现有内容、管理版式与模板、插入备注与批注、解析既有演示文稿（提取文本/结构）。是&quot;精确可控可编辑&quot;的那条路。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>客户给定了 \u003cstrong>PPT 模板/VI 规范\u003c/strong>，必须在模板上填内容\u003c/li>\u003cli>需要修改别人给的 deck（补数据、改结论、加附录）\u003c/li>\u003cli>需要读取客户既有 PPT 做现状分析（培训材料、方案历史版本）\u003c/li>\u003cli>交付物要客户后续自己改（必须是真幻灯片，不是整页图片）\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：追求视觉冲击且无模板约束（→ \u003ca href=\"#/zone-d-handoff/visual-deck-builder\">visual-deck-builder\u003c/a>）；开发者技术分享（→ \u003ca href=\"#/zone-d-handoff/slidev\">slidev\u003c/a>）；只需打印分发（→ \u003ca href=\"#/zone-d-handoff/make-pdf\">make-pdf\u003c/a>）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说&quot;帮我改这份 PPT&quot; / &quot;读取这个 pptx 的内容&quot; / &quot;在客户模板上建 deck&quot;（SKILL.md：generate、modify 或 analyze .pptx）\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：先解析再动手——只提文本用 \u003ccode>python -m markitdown 客户文件.pptx\u003c/code>；要看备注、批注、母版版式就用 \u003ccode>python openxml/scripts/extract.py 客户文件.pptx out/\u003c/code> 解包看 XML\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：\u003c/li>\u003cli>\u003ccode>extract.py\u003c/code> 不在预期路径时先 \u003ccode>find . -name &quot;extract.py&quot;\u003c/code> 定位；markitdown 只能拿到幻灯文本，备注（\u003ccode>ppt/notesSlides/\u003c/code>）、母版（\u003ccode>ppt/slideMasters/\u003c/code>）、版式（\u003ccode>ppt/slideLayouts/\u003c/code>）都在 XML 层\u003c/li>\u003cli>从零建 deck 走 slideConverter（HTML → PPTX），字体限通用字体（Arial/Helvetica/Times New Roman/Georgia 等）：客户模板带品牌字体时先确认客户机可用，否则导出丢字形\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>图表优先用\u003cstrong>数据驱动\u003c/strong>（从 xlsx/CSV 生成后插入），避免手工贴截图数字（无法随数据更新）\u003c/li>\u003cli>中文字体与客户机版本要检查；导出前用&quot;兼容性检查&quot;避免字体丢失\u003c/li>\u003cli>每页一个结论，标题写&quot;结论句&quot;而不是&quot;话题词&quot;——汇报效率差别极大\u003c/li>\u003cli>版本命名 + 附录页放数据来源，防止会后扯皮（&quot;这页的数字哪来的&quot;）\u003c/li>\u003cli>与 \u003ca href=\"#/zone-a-pre-engagement/xlsx\">xlsx\u003c/a> 组合：指标数据出表 → 图表进 deck，保持同一份来源\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone D：结项/验收/培训 deck（客户模板场景）\u003c/li>\u003cli>Zone A：售前提案（复用既有 deck 改造）\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-d-handoff/visual-deck-builder\">visual-deck-builder\u003c/a> · \u003ca href=\"#/zone-d-handoff/slidev\">slidev\u003c/a> · \u003ca href=\"#/zone-a-pre-engagement/xlsx\">xlsx\u003c/a>\u003c/p>"}, {"route": "zone-d-handoff/slidev", "zone": "Zone D · Handoff", "zoneId": "zone-d-handoff", "status": "✅", "html": "\u003ch1>slidev\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（slidev 插件 v1.0.0）· 类型：演示/开发者工具 · FDE 位点：Zone D present + 对内分享\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>用 Markdown + Vue 组件写\u003cstrong>面向开发者的 web 幻灯\u003c/strong>：代码高亮与可运行代码块、动画、演讲者模式、组件嵌入、导出 PDF/PPTX/图片、可托管为站点。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>技术型分享：架构讲解、代码走查、培训 workshop（内容以代码/命令为主）\u003c/li>\u003cli>希望 deck 进版本库、和文档同源（Markdown 可 diff、可 review）\u003c/li>\u003cli>需要把同一份材料既当演示又当文档站点\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：客户方用 PowerPoint 流程且要交 .pptx 源件（→ \u003ca href=\"#/zone-d-handoff/pptx\">pptx\u003c/a>，Slidev 导出的 pptx 可编辑性有限）；视觉冲击型汇报（→ \u003ca href=\"#/zone-d-handoff/visual-deck-builder\">visual-deck-builder\u003c/a>）；无技术背景的听众为主的场合（交互与代码块反而是干扰）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说&quot;用 Slidev 做一份代码讲解 slides&quot; / &quot;把这次架构走查做成 web 幻灯&quot;（description：technical presentations、code walkthroughs、developer decks）\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：\u003ccode>pnpm create slidev\u003c/code> 建项目 → \u003ccode>pnpm run dev\u003c/code> 起预览并确认 \u003ccode>http://localhost:3030\u003c/code> 能打开；幻灯片用 \u003ccode>---\u003c/code> 分隔，演讲者备注写在 HTML 注释里\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：\u003c/li>\u003cli>导出 PDF 用 \u003ccode>pnpm run export\u003c/code>，依赖 \u003ccode>playwright-chromium\u003c/code>——内网/客户机提前 \u003ccode>npm i\u003c/code> 装好，别在现场装包\u003c/li>\u003cli>投影前实测字体与渲染（Slidev 跑在浏览器里，客户机可能缺字体、不能联网取资源）；代码块只放关键几行，用 \u003ccode>{2,3}\u003c/code> 行高亮配合 \u003ccode>lineNumbers: true\u003c/code>，整屏代码投影上不可读\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>代码块只放\u003cstrong>关键几行\u003c/strong>（\u003ccode>line-numbers\u003c/code>、\u003ccode>highlight\u003c/code> 配合），整屏代码在投影上不可读\u003c/li>\u003cli>现场投影前验证字体与终端渲染（Slidev 依赖浏览器，客户机上可能缺字体/不能联网取资源）\u003c/li>\u003cli>离线/内网：提前 \u003ccode>npm i\u003c/code> 与资源本地化，别在现场装包\u003c/li>\u003cli>导出留双份：演示用网页版 + 归档用 PDF（\u003ccode>export\u003c/code>）\u003c/li>\u003cli>与 \u003ca href=\"#/zone-d-handoff/document-release\">document-release\u003c/a> 协作：deck 里的架构数字要与文档同源，改一处就要同步\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone D：技术交接与培训 deck（客户工程师受众）\u003c/li>\u003cli>对内：架构评审材料（配合 \u003ccode>docs/architecture-model/\u003c/code> 的图）\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-d-handoff/pptx\">pptx\u003c/a> · \u003ca href=\"#/zone-d-handoff/visual-deck-builder\">visual-deck-builder\u003c/a> · \u003ca href=\"#/zone-d-handoff/make-pdf\">make-pdf\u003c/a>\u003c/p>"}, {"route": "zone-d-handoff/notion-infographic", "zone": "Zone D · Handoff", "zoneId": "zone-d-handoff", "status": "✅", "html": "\u003ch1>notion-infographic\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（\u003ccode>~/.qoder/skills/notion-infographic\u003c/code>）· 类型：视觉化 · FDE 位点：Zone D present / 传播\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>读参考文稿，批量生成 \u003cstrong>Notion 风格松弛感手绘信息图组图\u003c/strong>，适合社交媒体/内部传播的分发单元（一张一个要点）。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>把方案/成果/流程变成一组易传播的图（内部宣导、客户高层&quot;看图 30 秒&quot;场景）\u003c/li>\u003cli>公众号/内网帖子需要统一视觉的系列配图\u003c/li>\u003cli>长文档需要&quot;图解摘要&quot;降低阅读门槛\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：需要精确数据与坐标的正式图表（用 \u003ca href=\"#/zone-b-build/frontend-design\">data-visualization 类工具\u003c/a> 或 matplotlib）；工程图纸/架构图（→ \u003ca href=\"#/zone-a-pre-engagement/drawio\">drawio\u003c/a> / \u003ca href=\"#/zone-a-pre-engagement/architecture-communicator\">architecture-communicator\u003c/a>）；正式验收材料（风格过于随意）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说&quot;阅读 docs/xx.md，生成一组信息图&quot; / &quot;把这篇文稿做成 Notion 风格组图&quot;（description_zh：根据参考文稿批量生成信息图组图）\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：对 agent 说&quot;读 \u003ccode>docs/成果.md\u003c/code>，生成 5 张信息图&quot;——可指定张数；不指定则按文章意图自动定（每图一个观点，硬上限 12 张），逐张调用 imageGen 出 16:9 中文标注图\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：\u003c/li>\u003cli>风格前缀/后缀是硬性约束：每张图提示词必须完整保留同一段风格描述（纯黄主色、马克笔松弛笔触、禁止渐变/3D/阴影/密集文字），省略任何细节整组图风格就散了\u003c/li>\u003cli>单张图只放 1 个信息点，堆多个观点是明确禁止项；产物按 \u003ccode>infographic-01.png\u003c/code> 起顺序编号，便于整组分发\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>输入文稿先分点（每点一张图），否则组图信息密度失衡\u003c/li>\u003cli>风格一次定锚：先出 2~3 张确认风格，再批量，避免整批返工\u003c/li>\u003cli>严格禁止&quot;编造数据&quot;：图上所有数字必须来自源文稿，逐张核对\u003c/li>\u003cli>中英混排的手绘字体容易失真，专有名词保留原文并检查字形\u003c/li>\u003cli>版权与品牌：客户 logo/受版权字体不要进传播素材\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone D：交付成果的可视化传播（内部知识库/客户宣导）\u003c/li>\u003cli>与 \u003ca href=\"#/zone-d-handoff/podcast\">podcast\u003c/a> 组成&quot;同一份文档 → 多种传播形态&quot;\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-d-handoff/shifu\">shifu\u003c/a> · \u003ca href=\"#/zone-d-handoff/visual-deck-builder\">visual-deck-builder\u003c/a> · \u003ca href=\"#/zone-a-pre-engagement/drawio\">drawio\u003c/a>\u003c/p>"}, {"route": "zone-d-handoff/podcast", "zone": "Zone D · Handoff", "zoneId": "zone-d-handoff", "status": "✅", "html": "\u003ch1>podcast\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（\u003ccode>~/.qoder/skills/podcast\u003c/code>）· 类型：音频生成 · FDE 位点：Zone D enable / 传播\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>把知识库目录下的 Markdown 文档提炼成\u003cstrong>双人对话播客稿\u003c/strong>并合成 MP3：指定知识域目录（如 \u003ccode>05-网络/\u003c/code>）即可产出一期节目，适合碎片时间吸收。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>交接后让客户工程师在通勤路上把系统背景&quot;听会&quot;\u003c/li>\u003cli>长文档（SOP、行业背景、故障复盘）转化为可口头传播的形态\u003c/li>\u003cli>团队内部知识广播（每周一条 10 分钟）\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：需要精确数字与图形材料的学习（听觉不擅长，走 \u003ca href=\"#/zone-d-handoff/shifu\">shifu\u003c/a> 或图表）；对外正式发布（未审校的口播稿有风险）；把 PPT 变音频（先转成文稿）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说&quot;生成播客&quot; / &quot;把 \u003ccode>05-网络/\u003c/code> 做成一期播客&quot; / &quot;把文档变成音频&quot;（SKILL.md trigger_keywords 与 description 原词）\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：先过环境检查——脚本会跑 \u003ccode>which ffmpeg\u003c/code> 和 \u003ccode>python3 -c &quot;import edge_tts&quot;\u003c/code>（ffmpeg 缺失直接停）；然后对 agent 说&quot;把 \u003ccode>05-网络/\u003c/code> 做成一期播客&quot;，未指定目录时默认 \u003ccode>05-网络/\u003c/code>、产物落 \u003ccode>38-消化/&lt;目录名&gt;-播客/\u003c/code>\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：\u003c/li>\u003cli>播客稿解析契约：每个回合独立一行、以 \u003ccode>小K：\u003c/code>/\u003ccode>小云：\u003c/code> 开头，稿内不得出现表格、代码块、Markdown 链接——破坏契约 TTS 脚本就解析失败\u003c/li>\u003cli>\u003ccode>edge-tts\u003c/code> 装不上（PEP 668 限制）时用 \u003ccode>pip3 install --user --break-system-packages edge-tts\u003c/code>；MP3 体积大不进 git，放对象存储/网盘，仓库只留播客稿 Markdown\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>生成前确认文稿的&quot;可朗读性&quot;：表格、代码、URL 要在稿子里改写为口语，否则听感灾难\u003c/li>\u003cli>\u003cstrong>术语与数字必须人工审校\u003c/strong>：TTS 读错专有名词/单位（如 &quot;k8s&quot;、&quot;ms&quot;、&quot;OPC UA&quot;）会直接误导学习者\u003c/li>\u003cli>敏感信息过滤：客户名、实例 ID、内网地址一律不得进音频（音频容易被转发，泄漏面比文档大）\u003c/li>\u003cli>存档管理：MP3 体积大，不要提交进 git；放对象存储/网盘，仓库里只留播客稿 Markdown\u003c/li>\u003cli>组合用法：同一份文档 → \u003ca href=\"#/zone-d-handoff/podcast\">podcast\u003c/a>（听）+ \u003ca href=\"#/zone-d-handoff/notion-infographic\">notion-infographic\u003c/a>（看）+ \u003ca href=\"#/zone-d-handoff/remember\">remember\u003c/a>（记），三种通道覆盖不同学习习惯\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>Zone D \u003ccode>enable\u003c/code>：培训材料的多形态输出\u003c/li>\u003cli>\u003ccode>.fde_scope/skills/\u003c/code> 沉淀经验的对内广播\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-d-handoff/shifu\">shifu\u003c/a> · \u003ca href=\"#/zone-d-handoff/notion-infographic\">notion-infographic\u003c/a> · \u003ca href=\"#/zone-a-pre-engagement/qmind-knowledge\">qmind-knowledge\u003c/a>\u003c/p>"}, {"route": "cross-cutting/skill-discovery", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "✅", "html": "\u003ch1>find-skills\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（\u003ccode>~/.qoder/skills/find-skills\u003c/code>）· 类型：元能力/skill 发现 · FDE 位点：横切\u003cbr>本 catalog 的 📦 条目全部经由它检索（\u003ccode>npx skills find\u003c/code>），registry 站点：https://skills.sh/\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>把&quot;我需要一个能力&quot;变成&quot;找到并安装对的 skill&quot;：\u003ccode>npx skills find &lt;query&gt;\u003c/code> 检索开放 skill 生态、\u003ccode>npx skills add &lt;owner/repo@skill&gt; --directory ~/.qoder/skills -y\u003c/code> 安装、\u003ccode>npx skills check\u003c/code> / \u003ccode>update\u003c/code> 做版本巡检；无结果时提示用 \u003ccode>npx skills init\u003c/code> 自建。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>遇到&quot;这件事我该怎么做&quot;且明显属于通用重复任务（测试、部署、评审、文档、设计）\u003c/li>\u003cli>每次季度巡检：确认已装项是否有更新、是否有更优替代\u003c/li>\u003cli>建/维护本手册库时：核实 registry 真实条目名与热度（本 catalog 已用它更正过 4 处失真条目名）\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：已经知道要装什么（直接 \u003ccode>add\u003c/code>）；评估质量与安全（→ \u003ca href=\"#/cross-cutting/skill-criticagent\">skill-criticagent\u003c/a> / \u003ca href=\"#/cross-cutting/mcp-criticagent\">mcp-criticagent\u003c/a>）；生态内没有时（→ \u003ca href=\"#/cross-cutting/create-skill\">create-skill\u003c/a> 自建）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说「find a skill for X」「is there a skill that can…」或「怎么实现 X」——SKILL.md 的 description 就是靠这三类问句路由的\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：\u003ccode>npx skills find &lt;query&gt;\u003c/code>（检索词要具体，如 \u003ccode>npx skills find pr review\u003c/code>），结果自带安装命令 \u003ccode>npx skills add &lt;owner/repo@skill&gt; --directory ~/.qoder/skills -y\u003c/code>；registry 站点：https://skills.sh/\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：\u003ccode>--directory ~/.qoder/skills\u003c/code> 不能省——装到默认目录 Qoder 看不到，或多处安装造成同名 skill 路由冲突\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：检索无结果先换词再试（&quot;deploy&quot; 换 &quot;docker deploy&quot;，同义词 evaluation / evals / benchmark 多试几组），确认生态真没有再走 \u003ccode>npx skills init\u003c/code> 自建\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>检索词要具体：&quot;docker deploy&quot; 优于 &quot;deploy&quot;；同义词多试几组（evaluation / evals / benchmark）\u003c/li>\u003cli>\u003cstrong>以热度 + 官方 org + 安全审计三项做初筛\u003c/strong>，再进 critic 门禁：热度高不代表适合本项目\u003c/li>\u003cli>安装目录固定在 \u003ccode>~/.qoder/skills\u003c/code>，避免多处安装导致同名 skill 路由冲突\u003c/li>\u003cli>装完立刻在本 catalog 建档（六段模板）+ 更新 README 索引——否则一个月后没人记得为什么装它\u003c/li>\u003cli>同名条目要甄别来源（例：\u003ccode>evaluating-llms-harness\u003c/code> 有 firecrawl 与第三方两个同名版本）\u003c/li>\u003cli>巡检节奏：季度一次 \u003ccode>npx skills check\u003c/code>，只处理真正在用的 skill，不追求&quot;全部最新&quot;\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>横切：本手册库的维护入口；Zone B/C/D 每个阶段的能力补齐都从它开始\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/cross-cutting/skill-criticagent\">skill-criticagent\u003c/a> · \u003ca href=\"#/cross-cutting/create-skill\">create-skill\u003c/a> · \u003ca href=\"#/cross-cutting/create-plugin\">create-plugin\u003c/a>\u003c/p>"}, {"route": "cross-cutting/create-skill", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "✅", "html": "\u003ch1>create-skill\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（Qoder 内置 skill）· 类型：元能力/skill 工程 · FDE 位点：横切\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>在当前工作区创建新的 Agent Skill：生成标准 \u003ccode>SKILL.md\u003c/code> 骨架（name/description/触发词/工作流/质量门），并放到正确的 skills 目录，使新流程能被后续会话自动检索与复用。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>同一类现场任务做了三次以上，值得固化成 skill（例：客户环境体检、OPC UA 连通性检查、交付验收 checklist）\u003c/li>\u003cli>想把个人经验从&quot;对话记忆&quot;升级为&quot;仓库资产&quot;\u003c/li>\u003cli>团队要统一某个流程的执行方式\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：写一次性脚本（直接写代码）；知识性内容整理（走 \u003ccode>.fde_scope/skills/\u003c/code> 文件库或 \u003ca href=\"#/zone-a-pre-engagement/qmind-knowledge\">qmind-knowledge\u003c/a>）；把 skill 打包分发（→ \u003ca href=\"#/cross-cutting/create-plugin\">create-plugin\u003c/a>）；写作规范与部署校验（→ \u003ca href=\"#/cross-cutting/writing-skills\">writing-skills\u003c/a>）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说「把这个流程固化成一个 skill」「帮我创建一个 skill」——同一类现场任务做过三次以上就该这样说\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：直接对 agent 描述&quot;这个 skill 解决什么问题、何时该被触发&quot;，让它生成标准 \u003ccode>SKILL.md\u003c/code> 骨架（name / description / 触发词 / 工作流 / 质量门）并放对目录：通用流程 → \u003ccode>~/.qoder/skills/\u003c/code>，项目专属 → 仓库内项目级 skills\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：description 只写&quot;做什么&quot;不写&quot;何时用 + 触发词&quot;——agent 只靠它路由，路由不到就等于没装\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：写完必须真跑一次同类任务验证触发与产出再提交，装前先过 skill-criticagent 门禁——未验证的 skill 是负资产\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>description 决定生死\u003c/strong>：写清&quot;做什么 + 何时用 + 触发词&quot;，agent 只靠它路由；模糊描述等于没装\u003c/li>\u003cli>一个 skill 只解决一类问题；宽泛的&quot;万能交付 skill&quot;不会被触发也不可维护\u003c/li>\u003cli>正文控制在几百行内，细节放 \u003ccode>references/\u003c/code> 按需加载（ progressive disclosure）\u003c/li>\u003cli>写完必须真跑一次同类任务验证触发与产出，再提交（未验证的 skill 是负资产）\u003c/li>\u003cli>装自己的 skill 前先过 \u003ca href=\"#/cross-cutting/skill-criticagent\">skill-criticagent\u003c/a>——用同一把尺子量自己\u003c/li>\u003cli>归属规则：通用工程流程 → \u003ccode>~/.qoder/skills/\u003c/code>；项目专属 → 仓库内项目级 skills，避免污染其他项目路由\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>横切：把 FDE 现场 SOP 片段沉淀为可复用 skill\u003c/li>\u003cli>与 \u003ca href=\"#/cross-cutting/skill-discovery\">find-skills\u003c/a> 形成&quot;找 → 评 → 装 → 造&quot;闭环\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/cross-cutting/writing-skills\">writing-skills\u003c/a> · \u003ca href=\"#/cross-cutting/create-plugin\">create-plugin\u003c/a> · \u003ca href=\"#/cross-cutting/skill-criticagent\">skill-criticagent\u003c/a>\u003c/p>"}, {"route": "cross-cutting/writing-skills", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "✅", "html": "\u003ch1>writing-skills\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（superpowers 插件 v5.1.0）· 类型：元能力/skill 质量 · FDE 位点：横切\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>按 skill 工程规范\u003cstrong>编写与改进 skill 并验证部署\u003c/strong>：结构（frontmatter 触发描述、渐进披露、反模式清单）、写作纪律（先写失败案例再写指令）、部署后校验（新装的 skill 是否真的被路由到）。与 \u003ca href=\"#/cross-cutting/create-skill\">create-skill\u003c/a> 的区别：create-skill 负责&quot;建骨架&quot;，writing-skills 负责&quot;写得好且真的生效&quot;。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>自己写/改 skill，特别是发现&quot;装了却没被触发&quot;\u003c/li>\u003cli>把现场 SOP 转成 agent 可执行指令时，需要写作方法约束\u003c/li>\u003cli>评审别人（含 AI）生成的 skill 是否只是漂亮废话\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：评估\u003cstrong>外部\u003c/strong>待装 skill 的质量与安全（→ \u003ca href=\"#/cross-cutting/skill-criticagent\">skill-criticagent\u003c/a>）；创建插件包（→ \u003ca href=\"#/cross-cutting/create-plugin\">create-plugin\u003c/a>）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说「帮我写一个 skill」「改进这个 skill」或「装了却没被触发」——SKILL.md 触发描述覆盖 creating / editing / verifying skills before deployment\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：先别写指令——按 RED-GREEN-REFACTOR 先跑基线：用子 agent 在&quot;没有该 skill&quot;的场景下执行同类任务，记录它怎么失败、找什么借口（RED），再针对这些失败写最小 SKILL.md（GREEN）\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：Iron Law「NO SKILL WITHOUT A FAILING TEST FIRST」对改 skill 同样生效——没看过 agent 没有它时怎么失败，就不知道它教的对不对；未测试就部署等于部署未测试的代码\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：description 只写触发条件（&quot;Use when…&quot;），绝不概括工作流——实测 agent 会照 description 抄近路跳过正文（description 写 &quot;code review between tasks&quot; 导致只评审一次，实际流程要求两次）\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>description 要包含&quot;不使用边界&quot;——本 catalog 每页的 \u003cstrong>不用于\u003c/strong> 段就是这个思路的来源\u003c/li>\u003cli>指令写成可验证的动作（&quot;跑 X 命令并检查输出含 Y&quot;），不写成愿望（&quot;确保质量&quot;）\u003c/li>\u003cli>用真实任务回归：写完后拿一个历史任务重跑，对比有无 skill 的产出差异\u003c/li>\u003cli>一个 skill 内的引用文件按需加载，别把所有参考塞进主文件（上下文成本）\u003c/li>\u003cli>与 \u003ca href=\"#/cross-cutting/skill-criticagent\">skill-criticagent\u003c/a> 配合：先自评（writing）→ 再外评（critic）→ 才安装/分发\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>横切：fde-scope 现场沉淀 skill 的写作标准\u003c/li>\u003cli>\u003ccode>.fde_scope/skills/\u003c/code> 文件库与外部 skill 的格式对齐参考\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/cross-cutting/create-skill\">create-skill\u003c/a> · \u003ca href=\"#/cross-cutting/skill-criticagent\">skill-criticagent\u003c/a> · \u003ca href=\"#/cross-cutting/create-plugin\">create-plugin\u003c/a>\u003c/p>"}, {"route": "cross-cutting/create-plugin", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "✅", "html": "\u003ch1>create-plugin\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（qoder-create-plugin，Qoder 内置插件包）· 类型：元能力/分发 · FDE 位点：横切\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>把外部或本地来源转成\u003cstrong>可分发的 Qoder 原生插件\u003c/strong>：GitHub 上的 SKILL.md、本地 skill 目录、Qoder Marketplace URL、skills.sh 条目、粘贴的 skill 内容、已有类插件目录 → 生成规范的插件结构（skills/ + 元数据），供团队安装。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>团队要统一使用某套流程：把自建 skills 打包成一个插件，一条命令装齐\u003c/li>\u003cli>想把生态里的单个 skill 整理成受控版本分发（而不是各自 \u003ccode>npx skills add\u003c/code>）\u003c/li>\u003cli>交付结束时把现场沉淀（连接器配置、SOP checklist）打包给客户复用\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：只给自己用（放 \u003ccode>~/.qoder/skills/\u003c/code> 就够）；写 skill 内容本身（→ \u003ca href=\"#/cross-cutting/writing-skills\">writing-skills\u003c/a>）；评估外部插件（→ \u003ca href=\"#/cross-cutting/skill-criticagent\">skill-criticagent\u003c/a>）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：把 GitHub SKILL.md 链接 / 本地 skill 目录 / Qoder Marketplace URL / skills.sh 条目 / 粘贴的 skill 内容丢给 agent，说「打包成 Qoder 插件」——这七类来源就是它的合法 ARGUMENTS\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：对 agent 说清来源与目标插件名；产出必须含 \u003ccode>.qoder-plugin/plugin.json\u003c/code> + \u003ccode>README.md\u003c/code> + \u003ccode>skills/\u003c/code>，交付前跑离线校验：\u003ccode>python3 scripts/validate_qoder_plugin.py &lt;plugin-root-or-zip&gt;\u003c/code>\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：插件根目录名与 \u003ccode>plugin.json.name\u003c/code> 必须是同一个 kebab-case 名；manifest 只能声明真实存在的组件——写了 \u003ccode>hooks\u003c/code> / \u003ccode>mcpServers\u003c/code> / \u003ccode>commands\u003c/code> 却没建对应文件会被校验打回\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：不硬编码私有凭据（用占位符或 \u003ccode>CONNECTORS.md\u003c/code> 写 setup 说明）；\u003ccode>.DS_Store\u003c/code>、\u003ccode>__MACOSX/\u003c/code>、临时缓存、smoke-test settings 不许进包\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>打包前先逐个确认来源 skill 的 LICENSE 与再分发条款（生态里既有 MIT 也有 proprietary，例：本地 \u003ccode>pptx\u003c/code> skill 标的是 Proprietary）；不确定就不要打进插件\u003c/li>\u003cli>一个插件一个主题（如 &quot;fde-delivery-toolkit&quot;），不要把无关 skill 塞一起，否则触发互相污染\u003c/li>\u003cli>版本与变更说明要写：插件一旦发给团队，升级成本远高于新建\u003c/li>\u003cli>打包后必须做\u003cstrong>安装冒烟\u003c/strong>：新机器安装 → 触发一次代表性任务 → 确认路由正确（架构可视化插件的 \u003ccode>architecture-health\u003c/code> 里也有同类 skill 激活冒烟要求）\u003c/li>\u003cli>客户交付物里的插件要脱敏：清掉客户名、内网地址、真实凭据样例\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>横切：把 FDE 交付工具箱沉淀为团队插件\u003c/li>\u003cli>Zone D：客户交接时可交付&quot;能力包&quot;而不只是文档\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/cross-cutting/create-skill\">create-skill\u003c/a> · \u003ca href=\"#/cross-cutting/writing-skills\">writing-skills\u003c/a> · \u003ca href=\"#/cross-cutting/skill-criticagent\">skill-criticagent\u003c/a>\u003c/p>"}, {"route": "cross-cutting/skill-criticagent", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "✅", "html": "\u003ch1>skill-criticagent\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（research-copilot 插件 v1.0.0）· 类型：元能力/门禁 · FDE 位点：横切（所有 📦 安装前置）\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>评估一个 Agent Skill（SKILL.md 目录）到底&quot;好不好、能不能装&quot;：\u003cstrong>规范合规 + 安全扫描\u003c/strong>、带/不带该 skill 的行为对比、description 触发测试，最后给出 \u003cstrong>安装 / 先修 / 拒绝\u003c/strong> 的明确结论。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>本 catalog 的强制门禁：任何 📦 项安装前跑一次，结论回填该页&quot;最佳实践&quot;段\u003c/li>\u003cli>收到别人推荐的 skill（GitHub 链接、marketplace URL）想快速判断值不值得装\u003c/li>\u003cli>自查自写 skill 的触发质量（和 \u003ca href=\"#/cross-cutting/writing-skills\">writing-skills\u003c/a> 互补：writing 管写作，critic 管判定）\u003c/li>\u003cli>判断 skill 是否真的带来增益（with/without 对比是唯一可信证据）\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：评估 MCP server（→ \u003ca href=\"#/cross-cutting/mcp-criticagent\">mcp-criticagent\u003c/a>）；代码评审（→ \u003ca href=\"#/cross-cutting/code-review\">code-review\u003c/a>）；架构评估（→ \u003ca href=\"#/cross-cutting/architecture-visualization-suite\">risk-quality-reviewer\u003c/a>）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：把 skill 目录丢给 agent 问「这个 skill 能不能装 / is this skill any good」——SKILL.md 写明哪怕只问这一句也触发\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：在仓库根目录零提问默认评估，先跑合规 + 安全扫描：\u003ccode>uv run python -m src.main eval-skill &lt;skill_dir&gt; --strict --json\u003c/code>（依赖 \u003ccode>uv sync\u003c/code>，无需 API key）——报错即不可安装，直接给「先修复」结论并跳过后续\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：\u003ccode>evals/evals.json\u003c/code> 里的自由句式断言会退化成字面子串匹配、with/without 两轮都无意义失败——要先在工作副本上把每句改写成可验证断言（具体字符串 / 正则）\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：without-skill 基线必须用没读过 skill 的全新子 agent 跑，否则对比被污染；最终结论只有三种——建议安装 / 先修复 / 不建议安装，每种都要带证据\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>评估三件套留档：verdict + 触发测试结果 + with/without 差异，写在对应 catalog 页面里，不要只留在对话\u003c/li>\u003cli>安全扫描不通过直接拒（不要&quot;先用着看&quot;）；注意 skills.sh 页面的三项审计（Agent Trust Hub / Socket / Snyk）与本 skill 的结论互相印证\u003c/li>\u003cli>触发测试要覆盖\u003cstrong>误触发\u003c/strong>：用一个语义相近但不应触发的任务验证边界\u003c/li>\u003cli>with/without 对比要用真实交付任务（本仓库场景：连接器接入、评估报告），玩具任务测不出价值\u003c/li>\u003cli>同一功能的多个候选（如 runbook 类）要横向比一次，选一个装，避免重叠路由\u003c/li>\u003cli>社区个人源 + 低热度 + 审计缺失 = 默认拒绝，除非有明确不可替代收益\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>横切：catalog 维护规约第 3 条的执行工具\u003c/li>\u003cli>当前待评估清单：所有 📦 项（\u003ccode>mqtt-development\u003c/code>、\u003ccode>kubernetes-specialist\u003c/code>、\u003ccode>docker-build-deploy\u003c/code>、\u003ccode>vllm-ascend\u003c/code>、\u003ccode>sre-runbooks\u003c/code>、\u003ccode>rag-agent-builder\u003c/code> 等）\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/cross-cutting/mcp-criticagent\">mcp-criticagent\u003c/a> · \u003ca href=\"#/cross-cutting/skill-discovery\">find-skills\u003c/a> · \u003ca href=\"#/cross-cutting/writing-skills\">writing-skills\u003c/a>\u003c/p>"}, {"route": "cross-cutting/mcp-criticagent", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "✅", "html": "\u003ch1>mcp-criticagent\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（research-copilot 插件 v1.0.0）· 类型：元能力/门禁 · FDE 位点：横切（MCP 安装前置）\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>端到端评估 \u003cstrong>MCP server / tool\u003c/strong>：从 GitHub URL 或 npm 包部署、测协议通信与工具调用、跑 AI 生成的智能测试、并给出仓库可持续性与热度评分。回答&quot;这个 MCP 到底能不能用、值不值得接&quot;。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>客户/团队要接一个新 MCP server（数据库、监控、内部平台）前的验收\u003c/li>\u003cli>MCP 在本地起不来、工具调用失败，需要区分是 server 问题还是客户端配置\u003c/li>\u003cli>对比同类 MCP（例如两种 Sentry/两种数据库接入）选一个长期依赖\u003c/li>\u003cli>本项目相关：评估 QwenPaw 宿主可选 MCP 扩展（见 \u003ca href=\"#/zone-a-pre-engagement/qmind-knowledge\">qmind-mcp\u003c/a> 的 MCP Server 模式）\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：评估 skill（→ \u003ca href=\"#/cross-cutting/skill-criticagent\">skill-criticagent\u003c/a>）；MCP 的线上故障排障（→ \u003ca href=\"#/zone-c-operationalization/troubleshooting\">troubleshooting\u003c/a>）；写 MCP server（用 SDK 直接开发）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：贴一个 GitHub URL 或 npm 包名问 agent「这个 MCP 能不能接 / does this MCP work」——SKILL.md 声明只贴链接也触发\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：仓库根目录先 \u003ccode>uv sync\u003c/code>（另需 Node 18+ 供 npx 部署），再跑三层评估：\u003ccode>uv run python -m src.main test-url &quot;https://github.com/OWNER/REPO&quot; --no-db-export\u003c/code>，报告落在 \u003ccode>data/test_results/\u003c/code>（JSON + HTML）\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：没配 \u003ccode>DASHSCOPE_API_KEY\u003c/code> 时第 2 层智能测试会退化为基础协议测试——报告必须说清哪层跑了、哪层跳过，不许把部分结果当完整评估\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：部署会在本机执行第三方 npm 包，不受信的包放沙箱/容器里跑；\u003ccode>final_score\u003c/code> 只评仓库可持续性（星标/提交活跃），第 1 层部署或调用失败照样判&quot;不可用&quot;，别被高分迷惑\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>先在\u003cstrong>隔离环境\u003c/strong>部署评估，再进个人/团队配置：MCP server 会拿到工具调用权限，等于给 agent 手\u003c/li>\u003cli>重点看三件事：凭据处理方式（是否明文/env）、工具副作用（有没有写操作）、错误语义是否可诊断\u003c/li>\u003cli>智能测试要人工补一轮&quot;危险用例&quot;：让它删/改数据的工具必须在评估阶段就发现\u003c/li>\u003cli>评估结论进 catalog：为将来要用的 MCP 建页（本手册库目前以 skill 为主，MCP 只在 architecture-visualization 等插件里出现过）\u003c/li>\u003cli>版本锁定：MCP 协议与 server 版本演进快，评估通过的版本要记进页面头部\u003c/li>\u003cli>与交付场景对齐：现场气隙环境通常禁止外连 MCP，评估通过也要确认网络策略可行性\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>横切：MCP 接入的唯一入口评估\u003c/li>\u003cli>Zone B deploy：客户平台 MCP（数据库/监控）接入前的把关\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/cross-cutting/skill-criticagent\">skill-criticagent\u003c/a> · \u003ca href=\"#/zone-c-operationalization/troubleshooting\">troubleshooting\u003c/a> · \u003ca href=\"#/zone-a-pre-engagement/qmind-knowledge\">qmind-knowledge\u003c/a>\u003c/p>"}, {"route": "cross-cutting/architecture-visualization-suite", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "✅", "html": "\u003ch1>architecture-visualization 套件（架构可视化 13 件套）\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（Quest Marketplace 插件 v0.1.0，无 MCP / 无 commands / 无 agents）· 类型：套件档案 · FDE 位点：横切（Zone A~D 全用）\u003cbr>本地路径：\u003ccode>~/.qoder/plugins/cache/qoder-marketplace/architecture-visualization/0.1.0\u003c/code>\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>证据优先的架构理解/建模/评审/演进工具箱。\u003cstrong>三层 MECE 结构\u003c/strong>：\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>层\u003c/th>\u003cth>Skill\u003c/th>\u003cth>回答的问题\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>路由\u003c/td>\u003ctd>\u003ccode>explore\u003c/code>\u003c/td>\u003ctd>宽泛架构请求 → 选最小技能集\u003c/td>\u003c/tr>\u003ctr>\u003ctd>场景\u003c/td>\u003ctd>\u003ccode>system-modeler\u003c/code>\u003c/td>\u003ctd>系统现在长什么样（结构/边界）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>场景\u003c/td>\u003ctd>\u003ccode>flow-visualizer\u003c/code>\u003c/td>\u003ctd>业务/调用/数据/事件怎么流动\u003c/td>\u003c/tr>\u003ctr>\u003ctd>场景\u003c/td>\u003ctd>\u003ccode>dependency-impact-analyzer\u003c/code>\u003c/td>\u003ctd>谁依赖谁、改动影响什么（blast radius）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>场景\u003c/td>\u003ctd>\u003ccode>deployment-topology-analyzer\u003c/code>\u003c/td>\u003ctd>在哪运行、如何发布运维\u003c/td>\u003c/tr>\u003ctr>\u003ctd>场景\u003c/td>\u003ctd>\u003ccode>evolution-planner\u003c/code>\u003c/td>\u003ctd>该怎么演进、为什么（ADR + 迁移切片）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>场景\u003c/td>\u003ctd>\u003ccode>risk-quality-reviewer\u003c/code>\u003c/td>\u003ctd>风险够不够低、质量够不够（含业务适配度）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>场景\u003c/td>\u003ctd>\u003ccode>legacy-system-visualizer\u003c/code>\u003c/td>\u003ctd>低证据老系统如何理解与安全迁移切片\u003c/td>\u003c/tr>\u003ctr>\u003ctd>场景\u003c/td>\u003ctd>\u003ccode>architecture-communicator\u003c/code>\u003c/td>\u003ctd>向这个受众怎么讲（客户高管 vs 车间）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>场景\u003c/td>\u003ctd>\u003ccode>architecture-health\u003c/code>\u003c/td>\u003ctd>图/文档是否新鲜、可追溯（含 skill 激活冒烟）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>基础\u003c/td>\u003ctd>\u003ccode>c4model\u003c/code>\u003c/td>\u003ctd>Structurizr DSL / C4 视图\u003c/td>\u003c/tr>\u003ctr>\u003ctd>基础\u003c/td>\u003ctd>\u003ccode>graphviz\u003c/code>\u003c/td>\u003ctd>密集关系 DOT（依赖/血缘/风险/影响）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>基础\u003c/td>\u003ctd>\u003ccode>drawio\u003c/code>\u003c/td>\u003ctd>可编辑交付格式（仅显式请求时）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch2>何时使用（按 FDE 阶段）\u003c/h2>\n\u003cul>\u003cli>Zone A 现场调研 → \u003ccode>system-modeler\u003c/code>（客户系统摸底）+ \u003ccode>architecture-communicator\u003c/code>（对客户讲）\u003c/li>\u003cli>Zone B 实施 → \u003ccode>dependency-impact-analyzer\u003c/code>（改动前评估）+ \u003ccode>flow-visualizer\u003c/code>（数据链路）\u003c/li>\u003cli>Zone C 运维 → \u003ccode>deployment-topology-analyzer\u003c/code>（拓扑/发布）+ \u003ccode>risk-quality-reviewer\u003c/code>（上线风险）\u003c/li>\u003cli>Zone D 交接 → \u003ccode>architecture-health\u003c/code>（文档与代码一致性）+ \u003ccode>drawio\u003c/code>（客户可编辑交付图）\u003c/li>\u003cli>遗留系统接手 → \u003ccode>legacy-system-visualizer\u003c/code> + \u003ccode>evolution-planner\u003c/code>\u003c/li>\u003c/ul>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：宽泛架构请求直接说「帮我理解这个系统的架构」「画出这个 repo 的架构图」「这次改动会影响什么」——入口是 \u003ccode>explore\u003c/code> 路由（13 件套的 router，&quot;Use this skill first&quot;），由它按场景选最小技能集\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：对 agent 说「用 explore 帮我建模 fde-scope 的当前架构」；路由器先读共享门禁 references（\u003ccode>architecture-contract.md\u003c/code> / \u003ccode>architecture-evidence-model.md\u003c/code> / \u003ccode>diagram-output-formats.md\u003c/code>），再按场景表路由到 \u003ccode>system-modeler\u003c/code>、\u003ccode>flow-visualizer\u003c/code> 等具体 skill\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：绕过 \u003ccode>explore\u003c/code> 直接点某个场景 skill，容易产出与问题不匹配的视图——路由原则是&quot;先定架构任务、再定图格式&quot;，不按产物类型选 skill\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：每个节点/边必须有 \u003ccode>sourceRefs\u003c/code> 指向代码/配置/文档等证据，低置信度必须显式标注——这是插件的硬门禁，无证据的图过不了 \u003ccode>architecture-health\u003c/code> 校验\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>**先 \u003ccode>explore\u003c/code> 再选场景**：直接点某个场景 skill 容易产出不匹配问题的视图\u003c/li>\u003cli>视图分级不要越界：L1 上下文 / L2 容器 / L3 代码 / L4 运行时 / L5 演进；问错层就是噪声\u003c/li>\u003cli>每个节点/边要有 \u003ccode>sourceRefs\u003c/code>，低置信度必须显式标注（该插件的硬门禁，也是它最有价值的纪律）\u003c/li>\u003cli>按需加载 references（\u003ccode>architecture-contract.md\u003c/code>、\u003ccode>architecture-evidence-model.md\u003c/code>、\u003ccode>diagram-output-formats.md\u003c/code>、\u003ccode>structurizr-canvas-pipeline.md\u003c/code>），别一次读全部\u003c/li>\u003cli>边界纪律：本套件的 skill 会互相路由——风险发现交 \u003ccode>risk-quality-reviewer\u003c/code>，修复方案交 \u003ccode>evolution-planner\u003c/code>，新鲜度交 \u003ccode>architecture-health\u003c/code>，不要指望一张图解决所有问题\u003c/li>\u003cli>格式选择：C4 用 DSL、密集关系用 DOT、轻量内联用 Mermaid（适合直接写在 Markdown 里的小图）\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点（已发生）\u003c/h2>\n\u003cul>\u003cli>\u003ccode>docs/architecture-model/\u003c/code>：\u003ccode>fde-scope.structurizr.dsl\u003c/code>（L1/L2）、\u003ccode>module-dependency.dot\u003c/code>（L3 模块依赖）、\u003ccode>system-model.evidence.md\u003c/code>、\u003ccode>system-model.summary.md\u003c/code>\u003c/li>\u003cli>\u003ccode>docs/architecture-model/architecture-health-report.md\u003c/code>：校验 \u003ccode>docs/architecture.md\u003c/code>，发现 1 处陈旧声明（flywheel 不导入 agentscope）+ 1 处拼写错误，已修正\u003c/li>\u003cli>待办：\u003ccode>docs/architecture.md\u003c/code> 只描述到 \u003ccode>web/app.py\u003c/code>，未包含 \u003ccode>pawapp/\u003c/code>（文档缺口）\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/zone-a-pre-engagement/zread\">system-modeler 用法示例\u003c/a> · \u003ca href=\"#/zone-a-pre-engagement/drawio\">drawio\u003c/a> · \u003ca href=\"#/zone-d-handoff/document-release\">document-release\u003c/a>\u003c/p>"}, {"route": "cross-cutting/code-review", "zone": "横切 · 元能力", "zoneId": "cross-cutting", "status": "✅", "html": "\u003ch1>code-review\u003c/h1>\n\u003cdiv class=\"page-meta\">状态：✅ 已安装（coderabbit 插件 v1.1.1，含 \u003ccode>code-review\u003c/code> + \u003ccode>autofix\u003c/code>；另有 superpowers 的 \u003ccode>requesting-code-review\u003c/code> / \u003ccode>receiving-code-review\u003c/code>）· 类型：质量门禁 · FDE 位点：横切（每次合并前）\u003c/div>\n\u003ch2>能做什么\u003c/h2>\n\u003cp>用 CodeRabbit 做 AI 代码评审（显式请求或 agent 自主触发均可），覆盖正确性、安全、质量与规范；\u003ccode>autofix\u003c/code> 可把评审意见落成修改。本项目另有 \u003ccode>docs/code_review_checklist.md\u003c/code> 作为人工清单。\u003c/p>\n\u003ch2>何时使用\u003c/h2>\n\u003cul>\u003cli>每次 PR / 合并前，尤其涉及连接器、gate 逻辑、凭据处理、部署配置\u003c/li>\u003cli>交付前最后一道质量门（客户会看代码的项目尤其重要）\u003c/li>\u003cli>agent 自主认为需要评审时（该 skill 是默认评审入口）\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>不用于\u003c/strong>：架构层面的取舍判断（→ \u003ca href=\"#/cross-cutting/architecture-visualization-suite\">risk-quality-reviewer\u003c/a>）；文档一致性（→ \u003ca href=\"#/cross-cutting/architecture-visualization-suite\">architecture-health\u003c/a>）；纯格式化（用 ruff/black，别浪费评审额度）。\u003c/p>\n\u003ch2>新人上手\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>触发\u003c/strong>：对 agent 说「review my code」「看看这次改动有什么问题」或直接点名 coderabbit——它是默认评审入口，显式请求与 agent 自主触发都走它\u003c/li>\u003cli>\u003cstrong>第一步\u003c/strong>：先确认 CLI 就绪：\u003ccode>coderabbit --version\u003c/code>、\u003ccode>coderabbit auth status\u003c/code>（未装从 https://www.coderabbit.ai/cli 安装，未登录跑 \u003ccode>coderabbit auth login\u003c/code>），然后 \u003ccode>coderabbit review --agent\u003c/code> 拿 agent 可读的评审与修复指引\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：\u003ccode>--agent\u003c/code> 需要 CodeRabbit CLI v0.4.0+，旧版本直接不支持；\u003ccode>--dir &lt;path&gt;\u003c/code> 指定的目录必须已初始化 Git 仓库\u003c/li>\u003cli>\u003cstrong>常见坑\u003c/strong>：CLI 会把代码 diff 发送到 CodeRabbit API 分析——跑评审前先确认暂存区无凭据/密钥；客户气隙环境这条要走线下评审路径，别默认直连\u003c/li>\u003c/ul>\n\u003ch2>最佳实践\u003c/h2>\n\u003cul>\u003cli>三层不重复：lint/typecheck 机械层 → AI 评审模型推理层 → 人工业务与安全判断（\u003ccode>docs/code_review_checklist.md\u003c/code> 就是人工层）\u003c/li>\u003cli>小 diff 才有好评审：大改动先拆 PR，评审质量与 diff 大小反比\u003c/li>\u003cli>提供上下文：让评审知道业务约束（工业场景的安全边界、气隙限制），否则会收到大量不适用建议\u003c/li>\u003cli>\u003ccode>autofix\u003c/code> 只用于低风险项（命名、类型、简单修复）；涉及 gate 语义、凭据、连接器的建议必须人工确认\u003c/li>\u003cli>反馈要具体可操作，禁止&quot;建议优化&quot;式空话；不认可的规则要在配置里关掉而不是每次忽略\u003c/li>\u003cli>与 superpowers 的 \u003ccode>receiving-code-review\u003c/code> 配合：收到意见先验证再改，避免&quot;评审说啥改啥&quot;\u003c/li>\u003c/ul>\n\u003ch2>项目应用位点\u003c/h2>\n\u003cul>\u003cli>横切：AGENTS 级流程（本仓库为 \u003ccode>docs/code_review_checklist.md\u003c/code>）\u003c/li>\u003cli>每次交付前：Zone B → Zone C 的门禁之一\u003c/li>\u003c/ul>\n\u003ch2>相关\u003c/h2>\n\u003cp>\u003ca href=\"#/cross-cutting/security-scan\">security-scan\u003c/a> · \u003ca href=\"#/cross-cutting/gstack-suite\">gstack-suite\u003c/a> · \u003ca href=\"#/cross-cutting/using-superpowers-family\">using-superpowers-family\u003c/a>\u003c/p>"},
